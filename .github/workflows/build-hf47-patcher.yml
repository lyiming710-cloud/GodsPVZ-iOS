name: Build HF47 EnemyManager wave progression core patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF47Patch/**'
      - '.github/workflows/build-hf47-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF47 patcher
        run: dotnet publish Tools/HF47Patch/HF47Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf47
      - name: Smoke test
        run: |
          chmod +x out/hf47/GodsPVZ.HF47Patch
          set +e
          out/hf47/GodsPVZ.HF47Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf47/GodsPVZ.HF47Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF47Patch-linux-x64
          path: out/hf47
          if-no-files-found: error
