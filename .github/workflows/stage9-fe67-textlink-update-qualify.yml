name: Stage9.1 fe67 TextLink Update qualify
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-fe67-textlink-update-qualify.yml','Tools/Stage9TextLinkUpdateQualify/**','Tools/Stage9TextLinkUpdatePatch/**','Tools/Stage9NativeProbe/TextLink.Update.native-evidence.md']
permissions: {contents: read, actions: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34989089927, name: Stage9.1-FE67-LEVELITEM-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/promotion'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34988830454, name: Stage9.1-76C1-LEVELITEM-CTOR-QUALIFIED, path: '${{ runner.temp }}/input'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34804463514, name: Stage9.1-UNITY-MANAGED-REFS-2022.3.44f1c1, path: '${{ runner.temp }}/refs'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34173085137, pattern: GodsPVZ-ILSpyCmd-linux-x64, merge-multiple: true, path: '${{ runner.temp }}/ilspy'}
      - name: Qualify TextLink Update
        shell: bash
        run: bash Tools/Stage9TextLinkUpdateQualify/run.sh "$RUNNER_TEMP/promotion" "$RUNNER_TEMP/input" "$RUNNER_TEMP/refs" "$RUNNER_TEMP/ilspy" "$RUNNER_TEMP/textlink-update-recovery"
      - uses: actions/upload-artifact@v4
        with: {name: Stage9.1-FE67-TEXTLINK-UPDATE-QUALIFIED, path: '${{ runner.temp }}/textlink-update-recovery/evidence/', retention-days: 90}
