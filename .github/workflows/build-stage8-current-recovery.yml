name: Build current Stage 8 recovery
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-stage8-current-recovery.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Assemble current Stage 8 source
        run: cat Tools/Stage8Patch/Program.cs.part1 Tools/Stage8Patch/Program.cs.part2 Tools/Stage8Patch/Program.cs.part3 > Tools/Stage8Patch/Program.cs
      - name: Publish
        run: dotnet publish Tools/Stage8Patch/Stage8Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o out
      - name: Smoke test
        run: ./out/Stage8Patch || test $? -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-Stage8CurrentRecovery-linux-x64
          path: out/Stage8Patch
          if-no-files-found: error
