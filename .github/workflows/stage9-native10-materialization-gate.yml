name: Stage9.5 native10 WarpText materialization gate

on:
  push:
    branches: [takeover/stage9-native6-repro-2026-09-27]
    paths:
      - '.github/workflows/stage9-native10-materialization-gate.yml'
      - 'scripts/takeover/materialize_native10.sh'
      - 'scripts/takeover/PatcherNative10/**'
      - 'Tools/Stage9Native4Recovery/evidence/native10-native-audit/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage9-native10-materialization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NATIVE9_SOURCE_RUN_ID: '36309302621'
      NATIVE9_SOURCE_ARTIFACT_ID: '10928079680'
      NATIVE9_SOURCE_ARTIFACT_NAME: 'Stage9.4-native9-polejump-experimental'
      NATIVE9_SOURCE_ARTIFACT_DIGEST: 'sha256:8a153caf29ac649e9bd19f7471721c162e98747648c46bb2ea7d26e788fcead3'
      NATIVE9_SHA256: '6e3d3fe4283ce4079f22727e9e6a13c290cb2944b8b0eedd1c705a0815b3906f'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Download exact native9 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.NATIVE9_SOURCE_RUN_ID }}
          name: ${{ env.NATIVE9_SOURCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/native9
      - name: Recover exact native9 input
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t H < <(find "$RUNNER_TEMP/native9" -type f -name 'Assembly-CSharp-native9-polejump.dll' | sort)
          [ "${#H[@]}" = 1 ]
          GOT="$(sha256sum "${H[0]}"|awk '{print $1}')"
          [ "$GOT" = "$NATIVE9_SHA256" ] || { echo "native9 SHA mismatch: $GOT" >&2; exit 1; }
          mkdir -p Tools/Stage9Native4Recovery/candidate
          cp "${H[0]}" Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native9-polejump.dll
      - name: Fetch pinned Cecil
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 Tools/Stage9Native4Recovery/prepare_ci_inputs.py
      - name: Materialize native10 twice
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/takeover/materialize_native10.sh
          scripts/takeover/materialize_native10.sh \
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native9-polejump.dll \
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native10-warptext.dll \
            | tee "$RUNNER_TEMP/native10-materialize.log"
          grep -qx NATIVE10_MATERIALIZATION_PASS "$RUNNER_TEMP/native10-materialize.log"
      - name: Record native10 provenance
        shell: bash
        run: |
          set -euo pipefail
          E=Tools/Stage9Native4Recovery/evidence/native10-materialization
          mkdir -p "$E"
          cp "$RUNNER_TEMP/native10-materialize.log" "$E/materialize.log"
          cp Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native10-warptext.dll.run1.log "$E/patcher-run1.log"
          cp Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native10-warptext.dll.run2.log "$E/patcher-run2.log"
          N10="$(sha256sum Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native10-warptext.dll|awk '{print $1}')"
          cat > "$E/PROVENANCE.txt" <<EOF
          status=EXPERIMENTAL_TAKEOVER_MATERIALIZATION
          workflow_head=$GITHUB_SHA
          source_native9_run=$NATIVE9_SOURCE_RUN_ID
          source_native9_artifact_id=$NATIVE9_SOURCE_ARTIFACT_ID
          source_native9_artifact_digest=$NATIVE9_SOURCE_ARTIFACT_DIGEST
          source_native9_dll_sha256=$NATIVE9_SHA256
          native10_dll_sha256=$N10
          target=TMPro.Examples.WarpTextExample/<WarpText>d__8::MoveNext
          target_methoddef=0x0600081C
          pc_native_va=0x1803CD3F0
          pc_native_sha256=55d77a157aa8dca15d1d8dd95267ba4f5b7a12ef4849d1cfa1ca97c8cab75daf
          deterministic_run_pair=PASS
          direct_il2cpp_canary=NOT_RUN
          full_unity_rebuild=NO
          production_promotion=NO
          EOF
          cat "$E/PROVENANCE.txt"
      - name: Upload native10 candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.5-native10-warptext-experimental
          path: |
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native10-warptext.dll
            Tools/Stage9Native4Recovery/evidence/native10-native-audit/
            Tools/Stage9Native4Recovery/evidence/native10-materialization/
          if-no-files-found: error
          retention-days: 30
