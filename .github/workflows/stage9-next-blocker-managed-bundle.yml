name: Stage9.1 next-blocker managed evidence bundle

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - 'Tools/Stage9MethodProbe/**'
      - '.github/workflows/stage9-next-blocker-managed-bundle.yml'

permissions:
  contents: read
  actions: read

jobs:
  evidence-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download fixed dc39 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34795946769
          name: Stage9.1-BATCH1-PLANT-CTOR-NATIVE
          path: ${{ runner.temp }}/candidate

      - name: Download fixed dc39 runtime evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34797212292
          name: Stage9.1-DC39-PLANT-CTOR-MAINMENU-SAVE-BOARD-RUNTIME
          path: ${{ runner.temp }}/runtime

      - name: Build reusable MethodDef probe
        run: dotnet build Tools/Stage9MethodProbe/Stage9MethodProbe.csproj -c Release

      - name: Fingerprint current and prefetched gameplay blockers
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evidence"
          mkdir -p "$OUT"
          DLL=$(find "$RUNNER_TEMP/candidate" -type f -name 'GodsPVZRuntime1-plant-ctor.dll' -print -quit)
          test -n "$DLL"
          SHA=$(sha256sum "$DLL" | awk '{print $1}')
          echo "CANDIDATE_SHA256 $SHA" | tee "$OUT/candidate.txt"
          test "$SHA" = "dc39b8bcbfcd61f04acf2c18c42e24583e9a6e75248bb24b6aae9e381b19f173"
          dotnet Tools/Stage9MethodProbe/bin/Release/net10.0/Stage9MethodProbe.dll \
            "$DLL" \
            'Projectile::.ctor' \
            'Projectile::ResetData' \
            'Projectile::BindTrack' \
            'ProjectileManager::Start' \
            'ResourceManager::Start' \
            'Plant_DetaiPage::Initialize' \
            'Plant_DetaiPage::Update' \
            'Board::Awake' \
            > "$OUT/managed-fingerprint.txt"
          cat "$OUT/managed-fingerprint.txt"

      - name: Extract causal runtime chains
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evidence"
          LOG=$(find "$RUNNER_TEMP/runtime" -type f -name 'playmode.log' -print -quit)
          test -n "$LOG"
          python3 - "$LOG" > "$OUT/runtime-first-causal.txt" <<'PY'
          import re, sys
          lines=open(sys.argv[1],encoding='utf-8',errors='replace').read().splitlines()
          patterns=[
              ('PROJECTILE_CTOR',r'InvalidProgramException: Invalid IL code in Projectile:\.ctor'),
              ('PLANT_DETAIL_INIT',r"FieldAccessException: Field `Plant:isOnField' is inaccessible from method `Plant_DetaiPage:Initialize \(Plant\)'")
          ]
          for label,pat in patterns:
              rx=re.compile(pat); hits=[i for i,x in enumerate(lines) if rx.search(x)]
              print(f'{label}_COUNT {len(hits)}')
              if hits:
                  i=hits[0]; print(f'=== FIRST {label} line={i+1} ===')
                  for n in range(max(0,i-3),min(len(lines),i+18)): print(f'{n+1}: {lines[n]}')
          markers=[(i+1,x) for i,x in enumerate(lines) if x.startswith('STAGE9_STRICT_')]
          print('=== STRICT MARKERS ===')
          for n,x in markers: print(n,x)
          PY
          cat "$OUT/runtime-first-causal.txt"

      - name: Summarize triage order
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evidence"
          {
            echo 'BASE_DLL dc39b8bcbfcd61f04acf2c18c42e24583e9a6e75248bb24b6aae9e381b19f173'
            echo 'CURRENT ResourceManager.Start -> InternalResourceLoader.Load<Projectile> -> Projectile::.ctor'
            echo 'CURRENT_TARGET Projectile::.ctor token=0x060003FD rid=1021'
            echo 'PREFETCH Board.Awake -> Plant_DetaiPage.Initialize(Plant) -> private Plant.isOnField FieldAccessException'
            echo 'RULE Prefetch is read-only. Do not mutate prefetched target unless the b192 runtime reproduces it after Projectile::.ctor is removed.'
          } > "$OUT/triage.txt"
          cat "$OUT/triage.txt"

      - name: Upload reusable evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-NEXT-BLOCKER-MANAGED-BUNDLE
          path: ${{ runner.temp }}/evidence/
          retention-days: 90
