name: Stage9.1 next-blocker managed evidence bundle

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - 'Tools/Stage9MethodProbe/**'
      - '.github/workflows/stage9-next-blocker-managed-bundle.yml'

permissions:
  contents: read
  actions: read

jobs:
  evidence-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download fixed dc39 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34795946769
          name: Stage9.1-BATCH1-PLANT-CTOR-NATIVE
          path: ${{ runner.temp }}/candidate

      - name: Download fixed dc39 runtime evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34797212292
          name: Stage9.1-DC39-PLANT-CTOR-MAINMENU-SAVE-BOARD-RUNTIME
          path: ${{ runner.temp }}/runtime

      - name: Build reusable MethodDef probe
        run: dotnet build Tools/Stage9MethodProbe/Stage9MethodProbe.csproj -c Release

      - name: Fingerprint adjacent projectile constructors
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evidence"
          mkdir -p "$OUT"
          DLL=$(find "$RUNNER_TEMP/candidate" -type f -name 'GodsPVZRuntime1-plant-ctor.dll' -print -quit)
          test -n "$DLL"
          SHA=$(sha256sum "$DLL" | awk '{print $1}')
          echo "CANDIDATE_SHA256 $SHA" | tee "$OUT/candidate.txt"
          test "$SHA" = "dc39b8bcbfcd61f04acf2c18c42e24583e9a6e75248bb24b6aae9e381b19f173"
          dotnet Tools/Stage9MethodProbe/bin/Release/net10.0/Stage9MethodProbe.dll \
            "$DLL" \
            'Projectile::.ctor' \
            'SupperBullet::.ctor' \
            'SquashBullet::.ctor' \
            'ResourceManager::Start' \
            > "$OUT/managed-fingerprint.txt"
          cat "$OUT/managed-fingerprint.txt"

      - name: Extract first-causal runtime chain
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evidence"
          LOG=$(find "$RUNNER_TEMP/runtime" -type f -name 'playmode.log' -print -quit)
          test -n "$LOG"
          python3 - "$LOG" > "$OUT/runtime-first-causal.txt" <<'PY'
          import re, sys
          p=sys.argv[1]
          lines=open(p,encoding='utf-8',errors='replace').read().splitlines()
          pats=[
              r'InvalidProgramException: Invalid IL code in Projectile:\.ctor',
              r'InvalidProgramException: Invalid IL code in SupperBullet:\.ctor',
              r'InvalidProgramException: Invalid IL code in SquashBullet:\.ctor',
          ]
          for pat in pats:
              rx=re.compile(pat)
              for i,line in enumerate(lines):
                  if rx.search(line):
                      lo=max(0,i-3); hi=min(len(lines),i+18)
                      print(f'=== FIRST {pat} line={i+1} ===')
                      for n in range(lo,hi): print(f'{n+1}: {lines[n]}')
                      break
          markers=[x for x in lines if x.startswith('STAGE9_STRICT_')]
          print('=== STRICT MARKERS ===')
          for x in markers: print(x)
          PY
          cat "$OUT/runtime-first-causal.txt"

      - name: Summarize triage order
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evidence"
          {
            echo 'BASE_DLL dc39b8bcbfcd61f04acf2c18c42e24583e9a6e75248bb24b6aae9e381b19f173'
            echo 'RUNTIME_RUN 34797212292'
            echo 'PRIMARY_CAUSAL_PATH ResourceManager.Start -> Resources.Load<T> -> projectile-family constructor'
            echo 'RULE Native-attribution required before mutation; adjacent constructors may be batched only after independent evidence.'
          } > "$OUT/triage.txt"
          cat "$OUT/triage.txt"

      - name: Upload reusable evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-NEXT-BLOCKER-MANAGED-BUNDLE
          path: ${{ runner.temp }}/evidence/
          retention-days: 90
