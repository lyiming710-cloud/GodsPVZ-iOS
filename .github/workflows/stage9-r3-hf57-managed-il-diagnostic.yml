name: Stage9.1 R3 HF57 managed IL diagnostic

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-r3-hf57-managed-il-diagnostic.yml'

permissions:
  contents: read
  actions: read

jobs:
  managed-il-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare formal R3
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-hf57-managed"; E="$OUT/evidence"
          mkdir -p "$OUT/parts" "$OUT/r3" "$E"
          python3 -m pip install --disable-pip-version-check -q gdown==5.2.0
          cat > "$OUT/parts.tsv" <<'EOF'
          00	111hFaHbkXIkSyRoAEdushS_qZ5sPFqUI	e024b6d534a6eace43694a506ce8636c56ed17e8c21bde3bba61caab3d3bdf7a
          01	1nYIm3Bk9yxckfbwVlk6ijSUcaid6aorm	1c10d0d87be6b65c3dfd0424e38515b53a8dd1158c5734b4397f2072e5004bb2
          02	1Y9pMN1FvEpXTFzoKWAx3frra-1-O4s-y	4943615fc153ff8539ab44818dde6981a16758a2c53184a858867d4932edd9c2
          03	1I3yfH8qb4nrAvEErO-KaZLX4Ds77x_5C	f8573c2ef3db3d65de3cb3b98f0892e633cdf89d499bde2d509b36f88306331f
          04	1QUYoGuNGP83hTo6_hoeKlosAonRJCJ-n	3dc6a03ebb4a7bbd48f652b0c468911d6985f76f48c6ded991d40d1c9b7593bc
          05	1Dp8BsTeRmJ9K2yni834KMrxN_Zp18Pe2	13284c2cd74583ccdd63cf6b736dcca443acbf6bda4c25d4b65193fc08c09263
          06	1pfqVCotdu3GMYp8Vl1Bbxp7ls8SPGLsW	d35ba0e632125749f581ad57cf950d8c6b264f9f4882a08adb9ca227f6b6e23c
          07	1fgUDh-crdy3oNjYAwGr50kdAY7BTwF2J	0c9443797e24ddca500a54a21955e27fd2cb995ec7924147e7f5c244859c07ec
          08	1mhL4lliMszPy7ITjfAlSkKQEh19UjhAu	30c9a5330cdece142938150311e8acb87d00d48ab057aa39a2128a3fffdcece8
          09	12sojmPtnZPiWmnyfW-c5MhQjvR2DZMJg	46bca3df6cbfc11f155038470a39b705bb028fa7a0e9f9eb3ba4810c06d5058a
          10	1P-vcBUiPmSH3gR3l_zkgjA63J8UnsVpG	3c8e312e65a72ac3072233f558b4d43970b3a4e521139d03328e9c27ec41d994
          11	1EGPUP5nBjKqvIMft0TAQXvgqpxSVpsyI	dc3d7aa732a19f237e5e72aa6f1e768c10bd360bc6fc832d29b9afc7489da325
          EOF
          while IFS=$'\t' read -r idx fid sha; do
            f="$OUT/parts/r3.$idx.part"
            python3 -m gdown --id "$fid" --output "$f" --quiet
            [ "$(sha256sum "$f" | awk '{print $1}')" = "$sha" ] || exit 62
          done < "$OUT/parts.tsv"
          cat "$OUT/parts"/*.part > "$OUT/r3.tar.zst"
          [ "$(stat -c%s "$OUT/r3.tar.zst")" = 786765618 ] || exit 63
          [ "$(sha256sum "$OUT/r3.tar.zst" | awk '{print $1}')" = 'd4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc' ] || exit 64
          zstd -t "$OUT/r3.tar.zst"
          zstd -dc "$OUT/r3.tar.zst" | tar -xf - -C "$OUT/r3"
          rm -rf "$OUT/parts" "$OUT/r3.tar.zst"
          PROJECT="$OUT/r3/UnityProject-AssetRipper-2.0.0/ExportedProject"
          DLL="$PROJECT/Assets/Plugins/Assembly-CSharp.dll"
          [ "$(sha256sum "$DLL" | awk '{print $1}')" = 'dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655' ] || exit 65
          echo "$PROJECT" > "$OUT/project.txt"
          echo "$DLL" > "$OUT/hf55.txt"

      - name: Download HF56 patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34689491315
          pattern: GodsPVZ-HF56Patch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-hf57-managed/hf56-patcher

      - name: Download HF57 patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34690940527
          pattern: GodsPVZ-HF57Patch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-hf57-managed/hf57-patcher

      - name: Build exact HF55 HF56 HF57 and integrated variants
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-hf57-managed"; E="$OUT/evidence"; PROJECT="$(cat "$OUT/project.txt")"
          HF55="$(cat "$OUT/hf55.txt")"; HF56="$OUT/Assembly-CSharp-HF56.dll"; HF57="$OUT/Assembly-CSharp-HF57.dll"; INT="$OUT/GodsPVZRuntime1-integrated.dll"
          P56="$(find "$OUT/hf56-patcher" -type f -name 'GodsPVZ.HF56Patch' | head -1)"
          P57="$(find "$OUT/hf57-patcher" -type f -name 'GodsPVZ.HF57Patch' | head -1)"
          chmod +x "$P56" "$P57"
          "$P56" "$HF55" "$HF56" > "$E/hf56-patcher.log"
          [ "$(sha256sum "$HF56" | awk '{print $1}')" = '2308c08296cfb83a72321325fd28362d59c25d6bb1a9cc6635a7b4624af202b0' ] || exit 71
          "$P57" "$HF56" "$HF57" > "$E/hf57-patcher.log"
          [ "$(sha256sum "$HF57" | awk '{print $1}')" = 'a699e0f3e812ae1dcd7e1f7d60b7757f958e498626c6a39e43f9984ebe55e38b' ] || exit 72
          cp "$HF57" "$INT"
          python3 - "$INT" <<'PY'
          import hashlib,sys
          from pathlib import Path
          p=Path(sys.argv[1]); b=bytearray(p.read_bytes())
          assert hashlib.sha256(b).hexdigest()=='a699e0f3e812ae1dcd7e1f7d60b7757f958e498626c6a39e43f9984ebe55e38b'
          for o in [0x9f3d6,0x9f3e3,0x9f3f1,0x9f3ff,0x9f412,0x9f41c,0x9f446]:
              assert bytes(b[o:o+4])==bytes.fromhex('fe0c0000'); b[o+1]=0x0d
          for o,old,new in [(0xde448,b'Assembly-CSharp.dll',b'GodsPVZRuntime1.dll'),(0xe0137,b'Assembly-CSharp',b'GodsPVZRuntime1')]:
              assert bytes(b[o:o+len(old)])==old; b[o:o+len(old)]=new
          p.write_bytes(b)
          assert hashlib.sha256(b).hexdigest()=='e49557eeb620c2d3be38aaf9c399a10978740e0a26dd8d0b0f8a190b12b8b568'
          PY
          printf 'HF55=%s\nHF56=%s\nHF57=%s\nINTEGRATED=%s\n' "$HF55" "$HF56" "$HF57" "$INT" > "$OUT/variants.env"

      - name: Create Cecil diagnostic
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-hf57-managed"; D="$OUT/diag"
          mkdir -p "$D"
          cat > "$D/Diag.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup><PackageReference Include="Mono.Cecil" Version="0.11.6" /></ItemGroup>
          </Project>
          EOF
          cat > "$D/Program.cs" <<'EOF'
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          using System.Globalization;

          static IEnumerable<TypeDefinition> AllTypes(IEnumerable<TypeDefinition> xs) {
            foreach (var t in xs) { yield return t; foreach (var n in AllTypes(t.NestedTypes)) yield return n; }
          }
          static string Tok(IMetadataTokenProvider? x) => x==null ? "<null>" : $"0x{x.MetadataToken.ToUInt32():X8}";
          static string Op(object? o) => o switch {
            null => "",
            Instruction i => $"IL_{i.Offset:X4}",
            Instruction[] a => string.Join(",", a.Select(x=>$"IL_{x.Offset:X4}")),
            MethodReference m => $"{m.FullName} [{Tok(m)}]",
            FieldReference f => $"{f.FullName} [{Tok(f)}]",
            TypeReference t => $"{t.FullName} [{Tok(t)}]",
            ParameterDefinition p => $"param#{p.Index} {p.Name}:{p.ParameterType.FullName}",
            VariableDefinition v => $"V_{v.Index}:{v.VariableType.FullName}",
            string s => $"\"{s.Replace("\n","\\n")}\"",
            _ => Convert.ToString(o, CultureInfo.InvariantCulture) ?? ""
          };
          static void DumpMethod(TextWriter w, MethodDefinition m) {
            w.WriteLine($"METHOD {m.DeclaringType.FullName}::{m.Name} TOKEN={Tok(m)} RVA=0x{m.RVA:X} STATIC={m.IsStatic} BODY={m.HasBody}");
            w.WriteLine($"  SIG {m.FullName}");
            if (!m.HasBody) { w.WriteLine(); return; }
            w.WriteLine($"  MAXSTACK={m.Body.MaxStackSize} INITLOCALS={m.Body.InitLocals} CODESIZE={m.Body.CodeSize}");
            foreach (var v in m.Body.Variables) w.WriteLine($"  LOCAL V_{v.Index} {v.VariableType.FullName}");
            foreach (var i in m.Body.Instructions) w.WriteLine($"  IL_{i.Offset:X4}: {i.OpCode,-12} {Op(i.Operand)}");
            foreach (var h in m.Body.ExceptionHandlers) w.WriteLine($"  EH {h.HandlerType} try=IL_{h.TryStart?.Offset:X4}-IL_{h.TryEnd?.Offset:X4} handler=IL_{h.HandlerStart?.Offset:X4}-IL_{h.HandlerEnd?.Offset:X4} catch={h.CatchType?.FullName}");
            w.WriteLine();
          }
          static void Main(string[] args) {
            if(args.Length!=2) throw new ArgumentException("usage: diag <dll> <out>");
            using var a=AssemblyDefinition.ReadAssembly(args[0], new ReaderParameters{ReadingMode=ReadingMode.Immediate,InMemory=true});
            var m=a.MainModule; using var w=new StreamWriter(args[1],false,System.Text.Encoding.UTF8);
            w.WriteLine($"FILE={args[0]}"); w.WriteLine($"ASSEMBLY={a.Name.FullName}");
            w.WriteLine($"MVID={m.Mvid}"); w.WriteLine($"METHODDEF_COUNT={AllTypes(m.Types).Sum(t=>t.Methods.Count)}"); w.WriteLine();
            string[] targets={"BoardManager::.ctor","BoardManager::Awake","Button_z::Awake","PropChooseSystem::.ctor","Prop_Choose::.ctor","BoardStart::Awake"};
            foreach(var key in targets){
              var p=key.Split("::"); var found=AllTypes(m.Types).SelectMany(t=>t.Methods).Where(x=>x.DeclaringType.Name==p[0] && x.Name==p[1]).ToList();
              w.WriteLine($"TARGET {key} COUNT={found.Count}"); foreach(var x in found) DumpMethod(w,x);
            }
            w.WriteLine("=== TOKEN RESOLUTION ===");
            uint[] toks={0x040001af,0x0400089e,0x0400058c,0x0a0001d3};
            foreach(var raw in toks){
              try { var x=m.LookupToken(new MetadataToken(raw)); w.WriteLine($"0x{raw:X8} => {x?.GetType().Name} {x}"); }
              catch(Exception e){ w.WriteLine($"0x{raw:X8} => ERROR {e.GetType().Name}: {e.Message}"); }
            }
            w.WriteLine(); w.WriteLine("=== CPP2IL TYPE REFERENCES ===");
            foreach(var t in m.GetTypeReferences().Where(x=>x.FullName.Contains("Cpp2IL",StringComparison.OrdinalIgnoreCase)).OrderBy(x=>x.FullName)) w.WriteLine($"{Tok(t)} {t.FullName} scope={t.Scope}");
            w.WriteLine(); w.WriteLine("=== CPP2IL MEMBER REFERENCES ===");
            foreach(var r in m.GetMemberReferences().Where(x=>x.FullName.Contains("Cpp2IL",StringComparison.OrdinalIgnoreCase) || x.DeclaringType.FullName.Contains("Cpp2IL",StringComparison.OrdinalIgnoreCase)).OrderBy(x=>x.FullName)) w.WriteLine($"{Tok(r)} {r.GetType().Name} {r.FullName}");
            w.WriteLine(); w.WriteLine("=== DICTIONARY ADD REFERENCES ===");
            foreach(var r in m.GetMemberReferences().OfType<MethodReference>().Where(x=>x.Name=="Add" && x.DeclaringType.FullName.Contains("Dictionary",StringComparison.Ordinal)).OrderBy(x=>x.FullName)) w.WriteLine($"{Tok(r)} {r.FullName}");
            w.WriteLine(); w.WriteLine("=== METHODS USING CPP2IL OPERANDS ===");
            foreach(var md in AllTypes(m.Types).SelectMany(t=>t.Methods).Where(x=>x.HasBody)){
              var hits=md.Body.Instructions.Where(i=>Op(i.Operand).Contains("Cpp2IL",StringComparison.OrdinalIgnoreCase)).ToList();
              if(hits.Count==0) continue;
              w.WriteLine($"{Tok(md)} {md.FullName}"); foreach(var i in hits) w.WriteLine($"  IL_{i.Offset:X4}: {i.OpCode} {Op(i.Operand)}");
            }
          }
          EOF
          dotnet build "$D/Diag.csproj" -c Release -o "$D/bin" --nologo

      - name: Run diagnostics across formal and integration variants
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-hf57-managed"; E="$OUT/evidence"; D="$OUT/diag/bin/Diag.dll"
          source "$OUT/variants.env"
          dotnet "$D" "$HF55" "$E/hf55-managed-il.txt"
          dotnet "$D" "$HF56" "$E/hf56-managed-il.txt"
          dotnet "$D" "$HF57" "$E/hf57-managed-il.txt"
          dotnet "$D" "$INTEGRATED" "$E/integrated-managed-il.txt"
          sha256sum "$HF55" "$HF56" "$HF57" "$INTEGRATED" > "$E/variant-sha256.txt"
          echo '=== integrated target summary ==='
          grep -E '^TARGET |^METHOD |^0x040001AF|^0x0400089E|^0x0400058C|^0x0A0001D3|Cpp2ILHelpers|Dictionary.*Add' "$E/integrated-managed-il.txt" | head -300 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-R3-HF57-MANAGED-IL-DIAGNOSTIC
          path: ${{ runner.temp }}/stage9-hf57-managed/evidence/
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
