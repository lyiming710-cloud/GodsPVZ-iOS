name: Build boot path patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/BootPathPatch/**'
      - '.github/workflows/build-boot-path-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Assemble source
        shell: bash
        run: cat Tools/BootPathPatch/Program.cs.part* > Tools/BootPathPatch/Program.cs
      - name: Publish
        run: dotnet publish Tools/BootPathPatch/BootPathPatch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/boot-path
      - name: Smoke test
        shell: bash
        run: |
          chmod +x publish/boot-path/GodsPVZ.BootPathPatch
          set +e
          publish/boot-path/GodsPVZ.BootPathPatch
          code=$?
          set -e
          test "$code" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-BootPathPatch-linux-x64
          path: publish/boot-path/GodsPVZ.BootPathPatch
          if-no-files-found: error
