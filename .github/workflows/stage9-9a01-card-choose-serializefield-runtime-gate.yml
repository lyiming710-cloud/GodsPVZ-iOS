name: Stage9.1 9a01 Card_Choose SerializeField MainMenu save Board runtime gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-9a01-card-choose-serializefield-runtime-gate.yml'
permissions:
  contents: read
  actions: read
jobs:
  mainmenu-save-board:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
      - name: Download exact cached R3 archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34747460206
          pattern: Stage9.1-r3-exact-archive
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-9a01/r3-cache
      - name: Download validated Card_Choose SerializeField candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34763592918
          pattern: Stage9.1-D255-CARD-CHOOSE-SERIALIZEFIELD
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-9a01/candidate
      - name: Download exact Unity editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-9a01/editor-parts
      - name: Run exact R3 strict Board gate
        shell: bash
        run: |
          set -euo pipefail
          bash Tools/Stage9RuntimeGate/run-strict-board.sh \
            "$RUNNER_TEMP/stage9-9a01" \
            "$RUNNER_TEMP/stage9-9a01/candidate/GodsPVZRuntime1-card-choose-serializefield.dll" \
            "9a01f9e44a056373ab230d121a8838e472cdd11a7b0d0d8ae662bb4ddb2148df"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-9A01-CARD-CHOOSE-SERIALIZEFIELD-MAINMENU-SAVE-BOARD-RUNTIME
          path: ${{ runner.temp }}/stage9-9a01/evidence/
          if-no-files-found: warn
          retention-days: 90
