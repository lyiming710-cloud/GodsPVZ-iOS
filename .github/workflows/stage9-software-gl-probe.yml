name: Stage9.1 software GL probe

on:
  push:
    branches: [stage9-admin-start-static]
    paths:
      - '.github/workflows/stage9-software-gl-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Xvfb Mesa software renderer
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v glxinfo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb mesa-utils libgl1-mesa-dri
          fi
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x720x24' glxinfo -B
          LIMITS="$(mktemp)"
          xvfb-run -a -s '-screen 0 1280x720x24' glxinfo -l > "$LIMITS"
          MAX="$(sed -n 's/.*GL_MAX_TEXTURE_SIZE[^0-9]*\([0-9][0-9]*\).*/\1/p' "$LIMITS" | head -n1)"
          echo "GL_MAX_TEXTURE_SIZE=$MAX"
          test -n "$MAX"
          test "$MAX" -ge 8192
