name: Stage9.1 8905 next-blocker managed prefetch
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-8905-next-blocker-managed-prefetch.yml'
permissions:
  contents: read
  actions: read
jobs:
  prefetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Grid Copy V2 static candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34845237000
          name: Stage9.1-D65C-GRID-COPY-V2-STATIC
          path: ${{ runner.temp }}/candidate
      - name: Build MethodDef probe
        run: dotnet build Tools/Stage9MethodProbe/Stage9MethodProbe.csproj -c Release --nologo
      - name: Prefetch likely post-Grid gameplay blockers
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/prefetch"; mkdir -p "$O"
          DLL=$(find "$RUNNER_TEMP/candidate" -type f -name 'GodsPVZRuntime1-grid-copy-v2.dll' -print -quit)
          test -n "$DLL"
          test "$(sha256sum "$DLL"|awk '{print $1}')" = '8905a8866d0d148f4c681e9128417fd927a968521a5afb35c78b4bfa8d4f5e4b'
          dotnet Tools/Stage9MethodProbe/bin/Release/net10.0/Stage9MethodProbe.dll \
            "$DLL" \
            'DialogueManager_OnBoard::Start' \
            'DialogueManager_OnBoard::Update' \
            'Plant_DetaiPage::Update' \
            'Board_PlantDetail_PlantData::Update' \
            'ZombieManager::Update_Ladder' \
            'Map::Copy' \
            > "$O/managed-prefetch.txt"
          cat "$O/managed-prefetch.txt"
          {
            echo 'BASE_CANDIDATE 8905a8866d0d148f4c681e9128417fd927a968521a5afb35c78b4bfa8d4f5e4b'
            echo 'RULE read-only prefetch; mutate only the first causal blocker promoted by exact-R3 runtime'
          } > "$O/prefetch-policy.txt"
      - name: Upload managed prefetch
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-8905-NEXT-BLOCKER-MANAGED-PREFETCH
          path: ${{ runner.temp }}/prefetch/
          retention-days: 90
