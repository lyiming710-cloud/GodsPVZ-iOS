name: Repair HF22 MethodBody ambiguity

on:
  push:
    branches: [ high-fidelity ]
    paths:
      - '.github/workflows/repair-hf22-methodbody.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: high-fidelity
      - name: Qualify Cecil MethodBody and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Tools/HF22Patch/Program.cs')
          s=p.read_text()
          old='var db = new MethodBody(dst) { InitLocals = sb.InitLocals, MaxStackSize = Math.Max(sb.MaxStackSize, 8) };'
          new='var db = new Mono.Cecil.Cil.MethodBody(dst) { InitLocals = sb.InitLocals, MaxStackSize = Math.Max(sb.MaxStackSize, 8) };'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one MethodBody line, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          grep -F 'new Mono.Cecil.Cil.MethodBody(dst)' Tools/HF22Patch/Program.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tools/HF22Patch/Program.cs
          git commit -m 'Fix HF22 Cecil MethodBody qualification'
          git push origin HEAD:high-fidelity
