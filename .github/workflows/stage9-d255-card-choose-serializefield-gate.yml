name: Stage9.1 d255 Card_Choose SerializeField metadata gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-d255-card-choose-serializefield-gate.yml'
      - 'Tools/Stage9CardChooseSerializeFieldPatch/**'
permissions:
  contents: read
  actions: read
jobs:
  card-choose-serialization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download exact d255 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34760293134
          pattern: Stage9.1-4A2E-CARD-CHOOSE-INITIALIZE
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-cardserial/input

      - name: Download fixed ILSpy
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34173085137
          pattern: GodsPVZ-ILSpyCmd-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-cardserial/ilspy

      - name: Apply evidence-backed Card_Choose field metadata repair
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-cardserial"; E="$OUT/evidence"; mkdir -p "$E"
          IN="$OUT/input/GodsPVZRuntime1-card-choose-initialize.dll"
          DLL="$OUT/GodsPVZRuntime1-card-choose-serializefield.dll"
          [ "$(sha256sum "$IN" | awk '{print $1}')" = 'd255aec78c28b6269934c73f8581ce16cdc4209533172baa965977f0d63b7d89' ] || exit 61
          dotnet build Tools/Stage9CardChooseSerializeFieldPatch/Stage9CardChooseSerializeFieldPatch.csproj -c Release --nologo
          dotnet run --project Tools/Stage9CardChooseSerializeFieldPatch/Stage9CardChooseSerializeFieldPatch.csproj -c Release --no-build -- "$IN" "$DLL" | tee "$E/patch.log"
          grep -q '^INPUT_SHA256 d255aec78c28b6269934c73f8581ce16cdc4209533172baa965977f0d63b7d89$' "$E/patch.log"
          [ "$(grep -c '^TARGET_FIELD ' "$E/patch.log")" -eq 17 ]
          grep -q '^ASSET_AUTHORITY r3_sha256=d4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc .*private_serialized_fields=17 ordersImage_refs=4 starsImage_refs=6$' "$E/patch.log"
          grep -q '^NATIVE_AUTHORITY token=0x060002F2 address=0x0000000180343BE0 ' "$E/patch.log"
          grep -q '^PATCH_CARD_CHOOSE_SERIALIZEFIELD add=UnityEngine.SerializeField fields=17 method_body_changes=0 field_type_changes=0 visibility_changes=0$' "$E/patch.log"
          grep -q '^METHOD_SEMANTIC_ISOLATION_PASS unchanged_methods=2317$' "$E/patch.log"
          [ "$(grep -c '^REOPEN_SERIALIZEFIELD_PASS ' "$E/patch.log")" -eq 17 ]
          grep -q '^FIELD_METADATA_ISOLATION_PASS unchanged_fields=.* changed_fields=17 target_type=Card_Choose$' "$E/patch.log"
          sha256sum "$DLL" | tee "$E/output-candidate.sha256"
          cp "$DLL" "$E/"
          cp Tools/Stage9CardChooseSerializeFieldPatch/Evidence.md "$E/asset-native-evidence.md"

      - name: Independent fixed ILSpy validation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-cardserial"; E="$OUT/evidence"; DLL="$OUT/GodsPVZRuntime1-card-choose-serializefield.dll"
          ILSPY="$(find "$OUT/ilspy" -type f -name ilspycmd | head -1)"
          DOTNET_BIN="$(find "$OUT/ilspy" -type f -path '*/ilspy-runtime/dotnet' | head -1)"
          chmod +x "$ILSPY" "$DOTNET_BIN"; export DOTNET_ROOT="$(dirname "$DOTNET_BIN")"; export PATH="$DOTNET_ROOT:$PATH"
          "$ILSPY" -t 'Card_Choose' "$DLL" > "$E/Card_Choose.cs" 2> "$E/Card_Choose.stderr"; test ! -s "$E/Card_Choose.stderr"
          "$ILSPY" -il -t 'Card_Choose' "$DLL" > "$E/Card_Choose.il" 2> "$E/Card_Choose-il.stderr"; test ! -s "$E/Card_Choose-il.stderr"
          python3 - "$E/Card_Choose.cs" "$E/Card_Choose.il" <<'PY'
          from pathlib import Path
          import re,sys
          cs=Path(sys.argv[1]).read_text()
          il=Path(sys.argv[2]).read_text()
          fields=[
              'lockLogo','chain','chosen','Lv','background','foreground','orderArabesques',
              'ordersImage','starsImage','plantPortrait','hormonLogo','dataBackground','skillLogo',
              'cliqueLogo','sunPriceText','levelText','serialNumBeChosenText'
          ]
          for name in fields:
              pat=rf'\[SerializeField\]\s*private\s+[^;\n]+\s+{re.escape(name)};'
              assert re.search(pat,cs), f'ILSpy C# missing [SerializeField] on {name}'
          assert len(re.findall(r'\[SerializeField\]',cs)) == 17, 'unexpected SerializeField count in Card_Choose C# output'
          start=il.index('.class public auto ansi beforefieldinit Card_Choose')
          stop=il.index('// Methods',start)
          fb=il[start:stop]
          assert fb.count('UnityEngine.SerializeField::.ctor()') == 17, 'unexpected SerializeField count in Card_Choose IL field block'
          for name in fields:
              m=re.search(rf'(?m)^\s*\.field private .*\b{re.escape(name)}\s*$',fb)
              assert m, f'ILSpy IL missing private field {name}'
              nxt=fb.find('\n\t.field ',m.end())
              if nxt < 0: nxt=len(fb)
              block=fb[m.start():nxt]
              assert 'UnityEngine.SerializeField::.ctor()' in block, f'ILSpy IL missing SerializeField custom attr on {name}'
          print('ILSPY_CARD_CHOOSE_SERIALIZEFIELD_PASS fields=17 private=17 custom_attr=UnityEngine.SerializeField')
          PY

      - name: Upload evidence and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-D255-CARD-CHOOSE-SERIALIZEFIELD
          path: ${{ runner.temp }}/stage9-cardserial/evidence/
          if-no-files-found: warn
          retention-days: 90
