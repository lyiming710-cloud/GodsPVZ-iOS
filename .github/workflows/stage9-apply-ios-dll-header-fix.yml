name: Stage9.1 apply iOS DLL header fix

on:
  push:
    branches: [stage9-admin-start-static]
    paths:
      - .github/workflows/stage9-apply-ios-dll-header-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage9-admin-start-static

      - name: Patch formal export workflow deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/stage9-current-baseline-ios-xcode-export.yml')
          s=p.read_text()
          marker='          cp "$DLL" "$PROJECT/Assets/Plugins/Assembly-CSharp.dll"'
          if s.count(marker) != 1:
              raise SystemExit(f'copy marker count={s.count(marker)}')
          I='          '
          lines=[
              I+'TARGET_DLL="$PROJECT/Assets/Plugins/Assembly-CSharp.dll"',
              I+'cp "$DLL" "$TARGET_DLL"',
              '',
              I+'# The runtime-qualified assembly has no CLI entrypoint but its PE COFF',
              I+'# header is incorrectly marked Console. UnityLinker therefore sends it',
              I+'# through ProcessExecutable. Repair only IMAGE_FILE_DLL (0x2000) in the',
              I+'# project copy. Proof run 35363174000 changed exactly one byte and kept',
              I+'# all 2317 MethodDefs unchanged.',
              I+'python3 - "$TARGET_DLL" "$E/ios-dll-header-repair.txt" <<\'PYDLL\'',
              I+'import hashlib,struct,sys',
              I+'path,report=sys.argv[1:]',
              I+'b=bytearray(open(path,\'rb\').read())',
              I+'before=bytes(b)',
              I+'def u16(o): return struct.unpack_from(\'<H\',b,o)[0]',
              I+'def u32(o): return struct.unpack_from(\'<I\',b,o)[0]',
              I+'pe=u32(0x3c)',
              I+'assert b[pe:pe+4]==b\'PE\\\\0\\\\0\'',
              I+'coff=pe+4',
              I+'chars_off=coff+18',
              I+'chars=u16(chars_off)',
              I+'assert chars==0x0122, hex(chars)',
              I+'nsec=u16(coff+2)',
              I+'optsz=u16(coff+16)',
              I+'opt=coff+20',
              I+'magic=u16(opt)',
              I+'dd=opt+(96 if magic==0x10b else 112)',
              I+'cli_rva=u32(dd+14*8)',
              I+'sec=opt+optsz',
              I+'def rva_to_off(rva):',
              I+'    for i in range(nsec):',
              I+'        q=sec+i*40',
              I+'        vsize=u32(q+8); va=u32(q+12); rawsz=u32(q+16); raw=u32(q+20)',
              I+'        if va <= rva < va+max(vsize,rawsz): return raw+(rva-va)',
              I+'    raise ValueError(hex(rva))',
              I+'cli=rva_to_off(cli_rva)',
              I+'cli_flags=u32(cli+16); ep=u32(cli+20)',
              I+'assert cli_flags==1, hex(cli_flags)',
              I+'assert ep==0, hex(ep)',
              I+'struct.pack_into(\'<H\',b,chars_off,chars|0x2000)',
              I+'diffs=[(i,before[i],b[i]) for i in range(len(b)) if before[i]!=b[i]]',
              I+'assert len(diffs)==1 and diffs[0][0]==chars_off+1, diffs',
              I+'sha=hashlib.sha256(b).hexdigest()',
              I+'assert sha==\'9295bcb90857502af5ab802839b5c560f9e4d956b99dfaeae4350bd5fa5754a3\', sha',
              I+'open(path,\'wb\').write(b)',
              I+'open(report,\'w\').write(f\'original_sha256={hashlib.sha256(before).hexdigest()}\\npatched_sha256={sha}\\ncoff_characteristics_before=0x{chars:04x}\\ncoff_characteristics_after=0x{chars|0x2000:04x}\\ncli_entrypoint_token_or_rva=0x{ep:08x}\\nbyte_diff_count={len(diffs)}\\nbyte_diff_offset=0x{diffs[0][0]:x} {diffs[0][1]:02x}->{diffs[0][2]:02x}\\n\')',
              I+'PYDLL',
              I+'[ "$(sha256sum "$TARGET_DLL" | awk \'{print $1}\')" = \'9295bcb90857502af5ab802839b5c560f9e4d956b99dfaeae4350bd5fa5754a3\' ] || exit 56',
              I+'cat "$E/ios-dll-header-repair.txt"',
          ]
          block='\n'.join(lines)
          p.write_text(s.replace(marker,block,1))
          PY

          git diff --check
          grep -n -A58 -B4 'TARGET_DLL=' .github/workflows/stage9-current-baseline-ios-xcode-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/stage9-current-baseline-ios-xcode-export.yml
          git commit -m 'ci: repair recovered DLL PE kind before iOS import'
          git push origin HEAD:stage9-admin-start-static
