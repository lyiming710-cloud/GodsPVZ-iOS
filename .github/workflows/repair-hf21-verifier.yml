name: Repair HF21 verifier threshold

on:
  push:
    branches: [ high-fidelity ]
    paths:
      - '.github/workflows/repair-hf21-verifier.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: high-fidelity
      - name: Lower CrateNewProjectile verifier floor only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Tools/HF21Patch/Program.cs')
          s=p.read_text()
          old='("ProjectileManager.CrateNewProjectile", VM("ProjectileManager","CrateNewProjectile",1), 45, 1),'
          new='("ProjectileManager.CrateNewProjectile", VM("ProjectileManager","CrateNewProjectile",1), 35, 1),'
          if old not in s: raise SystemExit('expected verifier tuple missing')
          p.write_text(s.replace(old,new,1))
          PY
          echo '17d80801b3932a52016695abb365952068c8f36d4fb4d4e141367abea1c9e35c  Tools/HF21Patch/Program.cs' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tools/HF21Patch/Program.cs
          git commit -m 'Adjust HF21 CrateNewProjectile verifier floor'
          git push origin HEAD:high-fidelity
