name: Stage9.3 native8 SkewText materialization gate

on:
  push:
    branches: [takeover/stage9-native6-repro-2026-09-27]
    paths:
      - '.github/workflows/stage9-native8-materialization-gate.yml'
      - 'scripts/takeover/materialize_native8.sh'
      - 'scripts/takeover/PatcherNative8/**'
      - 'Tools/Stage9Native4Recovery/evidence/native8-native-audit/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage9-native8-materialization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NATIVE7_SOURCE_RUN_ID: '36291412130'
      NATIVE7_SOURCE_ARTIFACT_ID: '10922591252'
      NATIVE7_SOURCE_ARTIFACT_NAME: 'Stage9.2-native7-ladder-closure-experimental'
      NATIVE7_SOURCE_ARTIFACT_DIGEST: 'sha256:f0f712160e1606a49eb08662da05f65c413278cb936df30193d3d56879957320'
      NATIVE7_SHA256: 'b9dadd905244ccfddfa86f87c2edc1e60d883441632b5bb359ffccab4d2faa29'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download exact native7 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.NATIVE7_SOURCE_RUN_ID }}
          name: ${{ env.NATIVE7_SOURCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/native7

      - name: Recover exact native7 input
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t HITS < <(find "$RUNNER_TEMP/native7" -type f -name 'Assembly-CSharp-native7-ladder-closure.dll' | sort)
          [ "${#HITS[@]}" = 1 ] || { echo "Expected exactly one native7 DLL" >&2; exit 1; }
          GOT="$(sha256sum "${HITS[0]}" | awk '{print $1}')"
          [ "$GOT" = "$NATIVE7_SHA256" ] || { echo "native7 SHA mismatch: $GOT" >&2; exit 1; }
          mkdir -p Tools/Stage9Native4Recovery/candidate
          cp "${HITS[0]}" Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native7-ladder-closure.dll
          echo NATIVE7_INPUT_PASS

      - name: Fetch pinned Cecil inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 Tools/Stage9Native4Recovery/prepare_ci_inputs.py
          test -f Tools/Stage9Native4Recovery/tools/lib/netstandard2.0/Mono.Cecil.dll

      - name: Materialize native8 twice
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/takeover/materialize_native8.sh
          scripts/takeover/materialize_native8.sh \
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native7-ladder-closure.dll \
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native8-skewtext.dll \
            | tee "$RUNNER_TEMP/native8-materialize.log"
          grep -qx NATIVE8_MATERIALIZATION_PASS "$RUNNER_TEMP/native8-materialize.log"

      - name: Record native8 provenance
        shell: bash
        run: |
          set -euo pipefail
          E=Tools/Stage9Native4Recovery/evidence/native8-materialization
          mkdir -p "$E"
          cp "$RUNNER_TEMP/native8-materialize.log" "$E/materialize.log"
          cp Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native8-skewtext.dll.run1.log "$E/patcher-run1.log"
          cp Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native8-skewtext.dll.run2.log "$E/patcher-run2.log"
          N8="$(sha256sum Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native8-skewtext.dll | awk '{print $1}')"
          cat > "$E/PROVENANCE.txt" <<EOF
          status=EXPERIMENTAL_TAKEOVER_MATERIALIZATION
          workflow_head=$GITHUB_SHA
          source_native7_run=$NATIVE7_SOURCE_RUN_ID
          source_native7_artifact_id=$NATIVE7_SOURCE_ARTIFACT_ID
          source_native7_artifact_name=$NATIVE7_SOURCE_ARTIFACT_NAME
          source_native7_artifact_digest=$NATIVE7_SOURCE_ARTIFACT_DIGEST
          source_native7_dll_sha256=$NATIVE7_SHA256
          native8_dll_sha256=$N8
          target=TMPro.Examples.SkewTextExample/<WarpText>d__7::MoveNext
          target_original_methoddef=0x06000776
          pc_native_va=0x1803C2450
          pc_native_sha256=984d165d8221b695bfe0783ed72aa2ca32112923a41d00223b32859d902137af
          deterministic_run_pair=PASS
          direct_il2cpp_canary=NOT_RUN
          real_unity_ios_gate=NOT_RUN
          production_promotion=NO
          EOF
          cat "$E/PROVENANCE.txt"

      - name: Upload native8 candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.3-native8-skewtext-experimental
          path: |
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native8-skewtext.dll
            Tools/Stage9Native4Recovery/evidence/native8-native-audit/
            Tools/Stage9Native4Recovery/evidence/native8-materialization/
          if-no-files-found: error
          retention-days: 30
