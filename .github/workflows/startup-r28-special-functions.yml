name: Startup R28 plant and zombie special functions - scoped real Unity
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: startup-r20-real-ios-test-build
  cancel-in-progress: false
jobs:
  special_functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      R3_SHA256: d4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc
      R3_ARCHIVE_RUN_ID: '34747460206'
      R3_ARCHIVE_ARTIFACT_ID: '10314333890'
      R3_ARCHIVE_ARTIFACT_ZIP_SHA256: 1c2183569b5d2273cdbf209992223d9f6a5d3cc0090bdbb8f68c8bf4ad448a78
      BASE_RUNTIME_SHA256: 047054e0db594b6e3385fe4d2555c5932dcd4c28e4b2cb6fb39acbc4336d43ee
      BASE_RUNTIME_RUN_ID: '35236211080'
      B001_SHA256: f144dd624d2b0c05b5ff01fc12ff455ac394c87852a4fc3c87e8c3611582a433
      PARENT_DLL_SHA256: 6de4db6c94b80a43876aea060b573ed60c1fa7170cff485103d2c808b94762ae
      TEST_DLL_SHA256: 9081408a2226a79e23991355108540a0260a3966a500cecf4524f3cba9dfb364
      GODSPVZ_ORIGINAL_AUDIO_PLAN: ${{ github.workspace }}/Recovery/Startup-R21-Actual-UI-2026-10-27/ORIGINAL-ZOMBIE-MANAGER-AUDIO-PLAN.json
      GODSPVZ_ORIGINAL_ZOMBIE_PLAN: ${{ github.workspace }}/Recovery/Startup-R21-Zombie-Serialization-2026-10-27/ORIGINAL-ZOMBIE-BINDING-PLAN.json
      PACKAGE_GUID_RUN_ID: '35238895838'
      PACKAGE_CLOSURE_RUN_ID: '35239319822'
      PACKAGE_BUNDLE_RUN_ID: '35239547918'
      EDITOR_RUN_ID: '34668863583'
      EDITOR_SHA256: 0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14
      IOS_MODULE_RUN_ID: '35339261693'
      IOS_MODULE_SHA256: 2c2e259415ab0f940889b6b5bf55c56bc2710bbd823ddc05c5ab67ebc137a16e
      UNITY_VERSION: 2022.3.44f1c1
      UNITY_CHANGESET: c3ae09b9f03c
    steps:
    - uses: actions/checkout@v4
    - name: Prepare software graphics for original 8192 TMP atlas
      shell: bash
      run: "set -euo pipefail\nOUT=\"$RUNNER_TEMP/stage9-startup-r2\"\nE=\"$OUT/evidence\"\nmkdir -p \"$E\"\nif ! command\
        \ -v xvfb-run >/dev/null 2>&1 || ! command -v glxinfo >/dev/null 2>&1; then\n  sudo apt-get update -qq\n  sudo apt-get\
        \ install -y --no-install-recommends xvfb mesa-utils libgl1-mesa-dri\nfi\nif [ '${{ false }}' = true ]; then\n  sudo\
        \ apt-get update -qq\n  sudo apt-get install -y --no-install-recommends xdotool openbox imagemagick dbus-x11\nfi\n\
        export LIBGL_ALWAYS_SOFTWARE=1\nxvfb-run -a -s '-screen 0 1280x720x24' glxinfo -B > \"$E/software-gl-renderer.txt\"\
        \ 2>&1\nxvfb-run -a -s '-screen 0 1280x720x24' glxinfo -l > \"$E/software-gl-limits.txt\" 2>&1\nMAX_TEXTURE_SIZE=\"\
        $(sed -n 's/.*GL_MAX_TEXTURE_SIZE[^0-9]*\\([0-9][0-9]*\\).*/\\1/p' \"$E/software-gl-limits.txt\" | head -n1)\"\necho\
        \ \"GL_MAX_TEXTURE_SIZE=$MAX_TEXTURE_SIZE\" | tee \"$E/software-gl-max-texture.txt\"\n[ -n \"$MAX_TEXTURE_SIZE\" ]\
        \ || exit 66\n[ \"$MAX_TEXTURE_SIZE\" -ge 8192 ] || exit 67\n"
    - name: Reclaim runner disk
      shell: bash
      run: 'set -euo pipefail

        df -h

        sudo rm -rf /usr/local/lib/android || true

        sudo rm -rf /usr/share/dotnet || true

        sudo rm -rf /opt/ghc || true

        sudo rm -rf /usr/local/.ghcup || true

        docker system prune -af || true

        df -h

        '
    - name: Prepare workspace and lock inputs
      shell: bash
      run: "set -euo pipefail\nOUT=\"$RUNNER_TEMP/stage9-startup-r2\"\nmkdir -p \"$OUT/evidence\" \"$OUT/candidate\" \"$OUT/semantic-gate\"\
        \nif [ -z \"${UNITY_EMAIL:-}\" ] || [ -z \"${UNITY_PASSWORD:-}\" ]; then\n  echo 'UNITY_EMAIL or UNITY_PASSWORD secret\
        \ missing' >&2\n  exit 41\nfi\ncat > \"$OUT/evidence/input-locks.txt\" <<EOF\nworkflow_head=$GITHUB_SHA\nr3_sha256=$R3_SHA256\n\
        r3_archive_run=$R3_ARCHIVE_RUN_ID\nr3_archive_artifact_id=$R3_ARCHIVE_ARTIFACT_ID\nr3_archive_artifact_zip_sha256=$R3_ARCHIVE_ARTIFACT_ZIP_SHA256\n\
        base_runtime_sha256=$BASE_RUNTIME_SHA256\nbase_runtime_run=$BASE_RUNTIME_RUN_ID\nb001_sha256=$B001_SHA256\ntest_dll_sha256=$TEST_DLL_SHA256\n\
        bulk401_semantic_formalization=NO\neditor_run=$EDITOR_RUN_ID\neditor_sha256=$EDITOR_SHA256\nios_module_run=$IOS_MODULE_RUN_ID\n\
        ios_module_sha256=$IOS_MODULE_SHA256\nunity_version=$UNITY_VERSION\nunity_changeset=$UNITY_CHANGESET\nproduction_promotion=NO_ISOLATED_GATE_ONLY\n\
        EOF\n"
    - name: Stage existing R28 candidate for scoped special-function execution
      shell: bash
      run: "set -euo pipefail\npython3 - \"$RUNNER_TEMP/stage9-startup-r2\" <<'PY'\nfrom pathlib import Path\nimport hashlib,json,sys,zipfile\n\
        out=Path(sys.argv[1]);(out/'candidate').mkdir(exist_ok=True)\nwith zipfile.ZipFile('Recovery/Startup-R28-Attack115-2026-10-29/STARTUP-R28-ATTACK115-CANDIDATE.zip')as\
        \ z:\n    data=z.read('STARTUP-R28-ATTACK115.dll')\nsha=hashlib.sha256(data).hexdigest()\nassert sha=='9081408a2226a79e23991355108540a0260a3966a500cecf4524f3cba9dfb364'\n\
        (out/'candidate/Assembly-CSharp-bulk401.dll').write_bytes(data)\n(out/'evidence/SPECIAL-INPUT.json').write_text(json.dumps(dict(candidate_sha256=sha,scope='EXISTING_CANDIDATE_SPECIAL_TEST_ONLY',full_gates_repeated=False))+'\\\
        n')\nPY\n"
    - name: Download exact cached R3 archive
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: lyiming710-cloud/GodsPVZ-iOS
        run-id: ${{ env.R3_ARCHIVE_RUN_ID }}
        pattern: Stage9.1-r3-exact-archive
        merge-multiple: true
        path: ${{ runner.temp }}/stage9-startup-r2/r3-cache
    - name: Reconstruct exact R3 project
      shell: bash
      run: "set -euo pipefail\nOUT=\"$RUNNER_TEMP/stage9-startup-r2\"\nE=\"$OUT/evidence\"\nmapfile -t R3_ARCHIVES < <(find\
        \ \"$OUT/r3-cache\" -maxdepth 1 -type f -name '*.tar.zst' | sort)\n[ \"${#R3_ARCHIVES[@]}\" = '1' ] || exit 45\nARCHIVE=\"\
        ${R3_ARCHIVES[0]}\"\ncat > \"$OUT/r3-parts.tsv\" <<'EOF'\n00\te024b6d534a6eace43694a506ce8636c56ed17e8c21bde3bba61caab3d3bdf7a\t\
        67108864\n01\t1c10d0d87be6b65c3dfd0424e38515b53a8dd1158c5734b4397f2072e5004bb2\t67108864\n02\t4943615fc153ff8539ab44818dde6981a16758a2c53184a858867d4932edd9c2\t\
        67108864\n03\tf8573c2ef3db3d65de3cb3b98f0892e633cdf89d499bde2d509b36f88306331f\t67108864\n04\t3dc6a03ebb4a7bbd48f652b0c468911d6985f76f48c6ded991d40d1c9b7593bc\t\
        67108864\n05\t13284c2cd74583ccdd63cf6b736dcca443acbf6bda4c25d4b65193fc08c09263\t67108864\n06\td35ba0e632125749f581ad57cf950d8c6b264f9f4882a08adb9ca227f6b6e23c\t\
        67108864\n07\t0c9443797e24ddca500a54a21955e27fd2cb995ec7924147e7f5c244859c07ec\t67108864\n08\t30c9a5330cdece142938150311e8acb87d00d48ab057aa39a2128a3fffdcece8\t\
        67108864\n09\t46bca3df6cbfc11f155038470a39b705bb028fa7a0e9f9eb3ba4810c06d5058a\t67108864\n10\t3c8e312e65a72ac3072233f558b4d43970b3a4e521139d03328e9c27ec41d994\t\
        67108864\n11\tdc3d7aa732a19f237e5e72aa6f1e768c10bd360bc6fc832d29b9afc7489da325\t48568114\nEOF\npython3 - \"$ARCHIVE\"\
        \ \"$OUT/r3-parts.tsv\" \"$E/r3-download.tsv\" <<'PY'\nimport hashlib,sys\nfrom pathlib import Path\narchive=Path(sys.argv[1]);\
        \ spec=Path(sys.argv[2]); out=Path(sys.argv[3])\nrows=[]\nfor line in spec.read_text().splitlines():\n    idx,sha,size=line.strip().split('\\\
        t')\n    rows.append((idx,sha,int(size)))\nwith archive.open('rb') as f, out.open('w',encoding='utf-8') as w:\n  \
        \  for idx,expected_sha,expected_size in rows:\n        remain=expected_size; h=hashlib.sha256(); got_size=0\n   \
        \     while remain:\n            b=f.read(min(1024*1024,remain))\n            if not b: raise SystemExit(45)\n   \
        \         h.update(b); n=len(b); remain-=n; got_size+=n\n        got_sha=h.hexdigest()\n        w.write(f'{idx}\\\
        t{got_sha}\\t{got_size}\\n')\n        if got_sha!=expected_sha: raise SystemExit(45)\n        if got_size!=expected_size:\
        \ raise SystemExit(46)\n    if f.read(1): raise SystemExit(45)\nPY\nROOT=\"$OUT/r3\"\nmkdir -p \"$ROOT\"\nGOT=\"$(sha256sum\
        \ \"$ARCHIVE\" | awk '{print $1}')\"\necho \"$GOT\" > \"$E/r3-sha256.txt\"\n[ \"$GOT\" = \"$R3_SHA256\" ] || exit\
        \ 47\nzstd -t \"$ARCHIVE\" 2> \"$E/r3-zstd-test.txt\"\nzstd -dc \"$ARCHIVE\" | tar -xf - -C \"$ROOT\"\nPROJECT=\"\
        $ROOT/UnityProject-AssetRipper-2.0.0/ExportedProject\"\ntest -d \"$PROJECT\"\ngrep -qx 'm_EditorVersion: 2022.3.44f1c1'\
        \ \"$PROJECT/ProjectSettings/ProjectVersion.txt\"\ntest -f \"$PROJECT/Assets/Scenes/MainMenu.unity\"\ntest -f \"$PROJECT/Assets/Scenes/Board.unity\"\
        \n[ \"$(sha256sum \"$PROJECT/Assets/Plugins/Assembly-CSharp.dll\" | awk '{print $1}')\" = 'dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655'\
        \ ] || exit 48\nprintf '%s\\n' \"$PROJECT\" > \"$OUT/project-path.txt\"\npython3 scripts/actions/normalize_startup_r20_asset_case.py\
        \ --project \"$PROJECT\" --apply-plan \"$GITHUB_WORKSPACE/Recovery/Startup-R20-Asset-Case-2026-10-26/ASSET-CASE-PLAN.json\"\
        \ --output \"$E\"\npython3 scripts/actions/restore_startup_r21_zombie_bindings.py --inspect-only --project \"$PROJECT\"\
        \ --plan \"$GITHUB_WORKSPACE/Recovery/Startup-R21-Original-UI-Bindings-2026-10-27/ZOMBIE-WINDOW-BINDING-PLAN.json\"\
        \ --output \"$E\"\nrm -rf \"$OUT/r3-cache\" \"$ARCHIVE\"\ndf -h \"$RUNNER_TEMP\" > \"$E/disk-after-r3.txt\"\n"
    - name: Download base runtime-qualified DLL
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: lyiming710-cloud/GodsPVZ-iOS
        run-id: ${{ env.BASE_RUNTIME_RUN_ID }}
        name: Stage9.1-BGMVOLUME-STATIC-QUALIFIED
        path: ${{ runner.temp }}/stage9-startup-r2/base-runtime
    - name: Download package GUID evidence
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: lyiming710-cloud/GodsPVZ-iOS
        run-id: ${{ env.PACKAGE_GUID_RUN_ID }}
        name: HF46-package-reference-evidence
        path: ${{ runner.temp }}/stage9-startup-r2/package-guid-evidence
    - name: Download pinned package bundle
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: lyiming710-cloud/GodsPVZ-iOS
        run-id: ${{ env.PACKAGE_BUNDLE_RUN_ID }}
        name: Stage9.1-pinned-unity-packages
        path: ${{ runner.temp }}/stage9-startup-r2/package-bundle
    - name: Download package dependency closure
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: lyiming710-cloud/GodsPVZ-iOS
        run-id: ${{ env.PACKAGE_CLOSURE_RUN_ID }}
        name: Stage9.1-package-dependency-closure
        path: ${{ runner.temp }}/stage9-startup-r2/package-closure
    - name: Integrate baseline and embedded packages
      shell: bash
      run: "set -euo pipefail\nOUT=\"$RUNNER_TEMP/stage9-startup-r2\"\nE=\"$OUT/evidence\"\nPROJECT=\"$(cat \"$OUT/project-path.txt\"\
        )\"\nDLL=\"$OUT/base-runtime/GodsPVZRuntime1-bgmvolume.dll\"\ntest -f \"$DLL\"\n[ \"$(sha256sum \"$DLL\" | awk '{print\
        \ $1}')\" = \"$BASE_RUNTIME_SHA256\" ] || exit 49\ncp \"$DLL\" \"$PROJECT/Assets/Plugins/Assembly-CSharp.dll\"\nmkdir\
        \ -p \"$PROJECT/Assets/Editor\" \"$PROJECT/Recovery\"\ncp \"$GITHUB_WORKSPACE/Recovery/Bulk389-Qualification-2026-10-23/ios-support/Assets/Editor/GodsPVZPackageReferenceMigrator.cs\"\
        \ \"$PROJECT/Assets/Editor/\"\ncp \"$GITHUB_WORKSPACE/Recovery/Startup-R3-2026-10-24/ios-support/Assets/Editor/GodsPVZIOSBuild.cs\"\
        \ \"$PROJECT/Assets/Editor/\"\ncp \"$GITHUB_WORKSPACE/Recovery/Startup-R3-2026-10-24/ios-support/Assets/Editor/GodsPVZStartupAudit.cs\"\
        \ \"$PROJECT/Assets/Editor/\"\ncp \"$GITHUB_WORKSPACE/Recovery/Bulk389-Qualification-2026-10-23/ios-support/Recovery/package-script-map-editor.json\"\
        \ \"$PROJECT/Recovery/\"\npython3 - \"$OUT/package-bundle/Packages\" \"$OUT/package-closure/Packages\" \"$PROJECT/Packages\"\
        \ <<'PY'\nimport shutil,sys\nfrom pathlib import Path\ndst=Path(sys.argv[3]); dst.mkdir(parents=True,exist_ok=True)\n\
        for root in map(Path,sys.argv[1:3]):\n    if not root.is_dir(): raise SystemExit('missing package source: '+str(root))\n\
        \    for src in sorted(p for p in root.iterdir() if p.is_dir()):\n        target=dst/src.name\n        if target.exists():\
        \ shutil.rmtree(target)\n        shutil.copytree(src,target)\nPY\npython3 - \"$OUT/package-guid-evidence/package-guid-map.json\"\
        \ \"$PROJECT/Packages\" \"$E/package-guid-preflight.txt\" <<'PY'\nimport json,re,sys\nfrom pathlib import Path\nd=json.load(open(sys.argv[1]));\
        \ root=Path(sys.argv[2]); out=Path(sys.argv[3])\nassert d['resolved']==67 and d['expected']==67 and not d['failures']\n\
        bad=[]; n=0\nfor m in d['mapping']:\n    meta=root/m['package']/m['meta_path']\n    if not meta.is_file(): bad.append((m['fullName'],'missing'));\
        \ continue\n    mm=re.search(r'(?m)^guid:\\s*([0-9a-fA-F]{32})\\s*$',meta.read_text(errors='replace'))\n    got=mm.group(1).lower()\
        \ if mm else ''\n    n+=1\n    if got!=m['monoscript_guid'].lower(): bad.append((m['fullName'],got,m['monoscript_guid']))\n\
        out.write_text(f'resolved={n}/67\\nfailures={len(bad)}\\n'+repr(bad)+'\\n')\nif n!=67 or bad: raise SystemExit(50)\n\
        PY\nrm -f \"$PROJECT/Packages/packages-lock.json\"\nrm -rf \"$OUT/package-bundle\" \"$OUT/package-closure\" \"$OUT/package-guid-evidence\"\
        \ \"$OUT/base-runtime\"\n"
    - name: Download preserved exact Editor parts
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: lyiming710-cloud/GodsPVZ-iOS
        run-id: ${{ env.EDITOR_RUN_ID }}
        pattern: Stage9.1-unity-china-editor-part-*
        merge-multiple: true
        path: ${{ runner.temp }}/stage9-startup-r2/editor-parts
    - name: Reconstruct exact Unity China Editor
      shell: bash
      run: "set -euo pipefail\nOUT=\"$RUNNER_TEMP/stage9-startup-r2\"\nE=\"$OUT/evidence\"\nPARTS=\"$OUT/editor-parts\"\n\
        ROOT=\"$OUT/editor-root\"\nmkdir -p \"$ROOT\"\nmapfile -t FILES < <(find \"$PARTS\" -maxdepth 1 -type f -name 'Unity-China-2022.3.44f1c1.tar.xz.part-*'\
        \ | sort)\n[ \"${#FILES[@]}\" = '15' ] || exit 51\nSHA=\"$({ for part in \"${FILES[@]}\"; do cat \"$part\"; done;\
        \ } | sha256sum | awk '{print $1}')\"\necho \"$SHA\" > \"$E/editor-sha256.txt\"\n[ \"$SHA\" = \"$EDITOR_SHA256\" ]\
        \ || exit 52\n{\n  for part in \"${FILES[@]}\"; do cat \"$part\"; rm -f \"$part\"; done\n} | tar -xJf - -C \"$ROOT\"\
        \nrmdir \"$PARTS\" 2>/dev/null || true\nUNITY=\"$ROOT/Editor/Unity\"\nchmod +x \"$UNITY\"\nV=\"$($UNITY -version 2>&1\
        \ | grep -Eo '2022\\.3\\.44f1c1|2022\\.3\\.44f1' | head -n1 || true)\"\necho \"$V\" > \"$E/editor-version-before-ios-module.txt\"\
        \n[ \"$V\" = \"$UNITY_VERSION\" ] || exit 53\nprintf '%s\\n' \"$UNITY\" > \"$OUT/unity-path.txt\"\n"
    - name: Download validated China iOS module
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: lyiming710-cloud/GodsPVZ-iOS
        run-id: ${{ env.IOS_MODULE_RUN_ID }}
        name: Stage9.1-unity-china-ios-module-c3ae09b9f03c
        path: ${{ runner.temp }}/stage9-startup-r2/ios-module
    - name: Overlay validated iOS module
      shell: bash
      run: 'set -euo pipefail

        OUT="$RUNNER_TEMP/stage9-startup-r2"

        E="$OUT/evidence"

        ROOT="$OUT/editor-root"

        MOD="$OUT/ios-module/UnitySetup-iOS-Support-for-Editor-2022.3.44f1.tar.xz"

        test -f "$MOD"

        GOT="$(sha256sum "$MOD" | awk ''{print $1}'')"

        echo "$GOT" > "$E/ios-module-sha256.txt"

        [ "$GOT" = "$IOS_MODULE_SHA256" ] || exit 54

        xz -t "$MOD"

        tar -xJf "$MOD" -C "$ROOT"

        UNITY="$(cat "$OUT/unity-path.txt")"

        V="$($UNITY -version 2>&1 | grep -Eo ''2022\.3\.44f1c1|2022\.3\.44f1'' | head -n1 || true)"

        [ "$V" = "$UNITY_VERSION" ] || exit 55

        rm -rf "$OUT/ios-module"

        '
    - name: Acquire Personal seat
      shell: bash
      run: 'set -euo pipefail

        OUT="$RUNNER_TEMP/stage9-startup-r2"

        E="$OUT/evidence"

        UNITY="$(cat "$OUT/unity-path.txt")"

        CLIENT="$(dirname "$UNITY")/Data/Resources/Licensing/Client/Unity.Licensing.Client"

        touch "$OUT/seat-acquired.flag"

        set +e

        "$CLIENT" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > "$E/license-activate.log"
        2>&1

        RC=$?

        set -e

        echo "$RC" > "$E/license-activate-exit.txt"

        [ "$RC" -eq 0 ] || exit 56

        touch "$OUT/seat-acquired.flag"

        '
    - name: First baseline import
      shell: bash
      run: 'set -euo pipefail

        OUT="$RUNNER_TEMP/stage9-startup-r2"

        E="$OUT/evidence"

        UNITY="$(cat "$OUT/unity-path.txt")"

        PROJECT="$(cat "$OUT/project-path.txt")"

        set +e

        "$UNITY" -batchmode -nographics -quit -projectPath "$PROJECT" -logFile "$E/import-before-migration.log"

        RC=$?

        set -e

        echo "$RC" > "$E/import-before-migration-exit.txt"

        [ "$RC" -eq 0 ] || exit 57

        if grep -Eiq ''\berror CS[0-9]+\b|Scripts have compiler errors|Compilation failed'' "$E/import-before-migration.log";
        then exit 58; fi

        '
    - name: Complete 67 of 67 package migration and B001 gate
      shell: bash
      run: 'set -euo pipefail

        OUT="$RUNNER_TEMP/stage9-startup-r2"

        E="$OUT/evidence"

        UNITY="$(cat "$OUT/unity-path.txt")"

        PROJECT="$(cat "$OUT/project-path.txt")"

        "$UNITY" -batchmode -nographics -quit -projectPath "$PROJECT" -executeMethod GodsPVZPackageReferenceMigrator.RunBatch
        -logFile "$E/package-migration.log"

        MARKER="$PROJECT/Library/GodsPVZ.package-reference-migration.done"

        PLUGIN="$PROJECT/Assets/Plugins/Assembly-CSharp.dll"

        test -f "$MARKER"

        grep -q ''^resolved=67/67$'' "$MARKER"

        GOT="$(sha256sum "$PLUGIN" | awk ''{print $1}'')"

        echo "b001_workcopy_sha256=$GOT" | tee "$E/b001-workcopy.txt"

        [ "$GOT" = "$B001_SHA256" ] || exit 59

        '
    - name: Inject fixed candidate and retire legacy migrator without deleting its source path
      shell: bash
      run: 'set -euo pipefail

        OUT="$RUNNER_TEMP/stage9-startup-r2"

        PROJECT="$(cat "$OUT/project-path.txt")"

        python3 scripts/actions/prepare_startup_r28_unity.py --project "$PROJECT" --candidate "$OUT/candidate/Assembly-CSharp-bulk401.dll"
        --evidence "$OUT/evidence"

        '
    - name: Align unchanged plugin filename with its assembly identity and preserve its GUID
      shell: bash
      run: 'set -euo pipefail

        OUT="$RUNNER_TEMP/stage9-startup-r2"

        PROJECT="$(cat "$OUT/project-path.txt")"

        python3 scripts/actions/prepare_startup_r28_plugin.py --project "$PROJECT" --evidence "$OUT/evidence"

        python3 scripts/actions/apply_startup_r28_sdk.py --project "$PROJECT" --evidence "$OUT/evidence"

        python3 scripts/actions/prepare_bulk401_startup_resources.py --project "$PROJECT" --evidence "$OUT/evidence"

        python3 scripts/actions/prepare_custom_shaders_r1.py --project "$PROJECT" --evidence "$OUT/evidence"

        cp "$GITHUB_WORKSPACE/Recovery/Startup-R3-2026-10-24/EMPTY-DYNAMIC-FONT-ATLAS-EVIDENCE.json" "$PROJECT/Recovery/empty-dynamic-font-atlas-evidence.json"

        cp "$GITHUB_WORKSPACE/Recovery/Startup-R3-2026-10-24/ORIGINAL-ATTRIBUTE-ROSTERS.json" "$PROJECT/Recovery/original-serialization-marker-proof.json"

        cp "$GITHUB_WORKSPACE/scripts/actions/GodsPVZSpecialAuditR28.cs" "$PROJECT/Assets/Editor/"

        '
    - name: Run one real Unity special-functions batch on original prefab clones
      shell: bash
      env:
