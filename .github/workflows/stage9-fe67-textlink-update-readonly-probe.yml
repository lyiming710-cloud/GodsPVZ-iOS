name: Stage9.1 fe67 TextLink Update read-only probe
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-fe67-textlink-update-readonly-probe.yml','Tools/Stage9TextLinkUpdateProbe/**','Tools/Stage9NativeProbe/TextLink.Update.native-evidence.md']
permissions: {contents: read, actions: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34988830454, name: Stage9.1-76C1-LEVELITEM-CTOR-QUALIFIED, path: '${{ runner.temp }}/candidate'}
      - name: Probe TextLink Update read-only
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find "$RUNNER_TEMP/candidate" -type f -name 'GodsPVZRuntime1-levelitem-ctor.dll' -print -quit)
          test -n "$DLL"
          dotnet run --project Tools/Stage9TextLinkUpdateProbe/Stage9TextLinkUpdateProbe.csproj -c Release -- "$DLL" 'fe67249cf3bdb30b94aa44045548c3de5ce6861e7686c7acebd4c97e4a3ead7b' | tee "$RUNNER_TEMP/textlink-update-probe.txt"
          grep -q '^READONLY_TEXTLINK_UPDATE_PROBE_PASS mutation=0 token=0x060006DE damaged_vector_arg=V_8_object_byref$' "$RUNNER_TEMP/textlink-update-probe.txt"
      - uses: actions/upload-artifact@v4
        with: {name: Stage9.1-FE67-TEXTLINK-UPDATE-READONLY-PROBE, path: '${{ runner.temp }}/textlink-update-probe.txt', retention-days: 90}
