name: Build HF20 Plant damage pipeline patcher
# source-repair-trigger: vector3-static-memberref-v2

on:
  push:
    branches: [ high-fidelity ]
    paths:
      - 'Tools/HF20Patch/**'
      - '.github/workflows/build-hf20-patcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF20 patcher
        run: dotnet publish Tools/HF20Patch/HF20Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - name: Smoke test usage
        run: |
          set +e
          ./out/GodsPVZ.HF20Patch >/tmp/hf20.out 2>/tmp/hf20.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'Usage: GodsPVZ.HF20Patch' /tmp/hf20.err
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF20Patch-linux-x64
          path: out/GodsPVZ.HF20Patch
          if-no-files-found: error
