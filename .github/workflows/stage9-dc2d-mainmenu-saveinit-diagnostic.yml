name: Stage9.1 dc2d MainMenu save-init diagnostic

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-dc2d-mainmenu-saveinit-diagnostic.yml'

permissions:
  contents: read
  actions: read

jobs:
  mainmenu-saveinit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Prepare exact R3 project
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-saveinit"; E="$OUT/evidence"
          mkdir -p "$OUT/parts" "$OUT/r3" "$E"
          [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ] || exit 61
          python3 -m pip install --disable-pip-version-check -q gdown==5.2.0
          cat > "$OUT/parts.tsv" <<'EOF'
          00	111hFaHbkXIkSyRoAEdushS_qZ5sPFqUI	e024b6d534a6eace43694a506ce8636c56ed17e8c21bde3bba61caab3d3bdf7a
          01	1nYIm3Bk9yxckfbwVlk6ijSUcaid6aorm	1c10d0d87be6b65c3dfd0424e38515b53a8dd1158c5734b4397f2072e5004bb2
          02	1Y9pMN1FvEpXTFzoKWAx3frra-1-O4s-y	4943615fc153ff8539ab44818dde6981a16758a2c53184a858867d4932edd9c2
          03	1I3yfH8qb4nrAvEErO-KaZLX4Ds77x_5C	f8573c2ef3db3d65de3cb3b98f0892e633cdf89d499bde2d509b36f88306331f
          04	1QUYoGuNGP83hTo6_hoeKlosAonRJCJ-n	3dc6a03ebb4a7bbd48f652b0c468911d6985f76f48c6ded991d40d1c9b7593bc
          05	1Dp8BsTeRmJ9K2yni834KMrxN_Zp18Pe2	13284c2cd74583ccdd63cf6b736dcca443acbf6bda4c25d4b65193fc08c09263
          06	1pfqVCotdu3GMYp8Vl1Bbxp7ls8SPGLsW	d35ba0e632125749f581ad57cf950d8c6b264f9f4882a08adb9ca227f6b6e23c
          07	1fgUDh-crdy3oNjYAwGr50kdAY7BTwF2J	0c9443797e24ddca500a54a21955e27fd2cb995ec7924147e7f5c244859c07ec
          08	1mhL4lliMszPy7ITjfAlSkKQEh19UjhAu	30c9a5330cdece142938150311e8acb87d00d48ab057aa39a2128a3fffdcece8
          09	12sojmPtnZPiWmnyfW-c5MhQjvR2DZMJg	46bca3df6cbfc11f155038470a39b705bb028fa7a0e9f9eb3ba4810c06d5058a
          10	1P-vcBUiPmSH3gR3l_zkgjA63J8UnsVpG	3c8e312e65a72ac3072233f558b4d43970b3a4e521139d03328e9c27ec41d994
          11	1EGPUP5nBjKqvIMft0TAQXvgqpxSVpsyI	dc3d7aa732a19f237e5e72aa6f1e768c10bd360bc6fc832d29b9afc7489da325
          EOF
          while IFS=$'\t' read -r idx fid sha; do
            f="$OUT/parts/r3.$idx.part"
            python3 -m gdown --id "$fid" --output "$f" --quiet
            [ "$(sha256sum "$f" | awk '{print $1}')" = "$sha" ] || exit 62
          done < "$OUT/parts.tsv"
          cat "$OUT/parts"/*.part > "$OUT/r3.tar.zst"
          [ "$(stat -c%s "$OUT/r3.tar.zst")" = 786765618 ] || exit 63
          [ "$(sha256sum "$OUT/r3.tar.zst" | awk '{print $1}')" = 'd4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc' ] || exit 64
          zstd -dc "$OUT/r3.tar.zst" | tar -xf - -C "$OUT/r3"
          rm -rf "$OUT/parts" "$OUT/r3.tar.zst"
          PROJECT="$OUT/r3/UnityProject-AssetRipper-2.0.0/ExportedProject"
          DLL="$PROJECT/Assets/Plugins/Assembly-CSharp.dll"; META="$DLL.meta"
          [ "$(sha256sum "$DLL" | awk '{print $1}')" = 'dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655' ] || exit 65
          grep -q '^guid: 60b84a767c46ced9aacc93f38da4d2f3$' "$META"
          grep -q '^  isExplicitlyReferenced: 1$' "$META"
          grep -q '^  isPreloaded: 0$' "$META"
          echo "$PROJECT" > "$OUT/project.txt"
          printf 'r3_sha256=%s\nhf55_sha256=%s\n' \
            'd4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc' \
            'dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655' > "$E/input-gate.txt"

      - name: Download exact dc2d generic-repaired candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34716405258
          pattern: Stage9.1-c8d0-GENERIC-MEMBERREF-REPAIR
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-saveinit/candidate

      - name: Integrate exact dc2d candidate into R3
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-saveinit"; E="$OUT/evidence"; PROJECT="$(cat "$OUT/project.txt")"
          SRC="$OUT/candidate/GodsPVZRuntime1-generic-repaired.dll"
          [ -f "$SRC" ] || exit 71
          [ "$(sha256sum "$SRC" | awk '{print $1}')" = 'dc2dccac079f4db46934283c380817d7b60e2a82ae71e8e18ba0b9f199bb6931' ] || exit 72
          OLD="$PROJECT/Assets/Plugins/Assembly-CSharp.dll"; OLDMETA="$OLD.meta"
          NEW="$PROJECT/Assets/Plugins/GodsPVZRuntime1.dll"; NEWMETA="$NEW.meta"
          sed -i 's/^  isPreloaded: 0$/  isPreloaded: 1/' "$OLDMETA"
          cp "$SRC" "$NEW"
          mv "$OLDMETA" "$NEWMETA"
          rm "$OLD"
          grep -q '^guid: 60b84a767c46ced9aacc93f38da4d2f3$' "$NEWMETA"
          grep -q '^  isPreloaded: 1$' "$NEWMETA"
          [ "$(sha256sum "$NEW" | awk '{print $1}')" = 'dc2dccac079f4db46934283c380817d7b60e2a82ae71e8e18ba0b9f199bb6931' ] || exit 73
          printf 'candidate_sha256=%s\nsource_run=%s\nsource_artifact=%s\ntest_scope=MainMenu_save_init_diagnostic_no_Board\n' \
            'dc2dccac079f4db46934283c380817d7b60e2a82ae71e8e18ba0b9f199bb6931' \
            '34716405258' '10304945416' >> "$E/input-gate.txt"
          cp "$OUT/candidate/generic-memberref-repair.log" "$E/input-generic-repair.log"
          rm -rf "$OUT/candidate"

      - name: Download exact Unity editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-saveinit/editor-parts

      - name: Reconstruct exact Unity editor and acquire Personal seat
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-saveinit"; E="$OUT/evidence"; P="$OUT/editor-parts"; D="$OUT/editor"
          mkdir -p "$D"
          [ "$(find "$P" -maxdepth 1 -type f -name 'Unity-China-2022.3.44f1c1.tar.xz.part-*' | wc -l)" = 15 ] || exit 81
          [ "$(cat "$P"/Unity-China-2022.3.44f1c1.tar.xz.part-* | sha256sum | awk '{print $1}')" = '0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14' ] || exit 82
          cat "$P"/Unity-China-2022.3.44f1c1.tar.xz.part-* | xz -dc | tar -xf - -C "$D"
          rm -rf "$P"
          U="$D/Editor/Unity"; chmod +x "$U"
          "$U" -version > "$E/unity-version.txt" 2>&1
          grep -q '2022.3.44f1c1' "$E/unity-version.txt" || exit 83
          echo "$U" > "$OUT/unity.txt"
          C="$D/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          set +e
          "$C" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > "$E/license-activate.log" 2>&1
          RC=$?
          set -e
          echo "$RC" > "$E/activation-exit.txt"
          [ "$RC" = 0 ] || exit 84
          echo ACQUIRED > "$OUT/seat.flag"

      - name: First import
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-saveinit"; E="$OUT/evidence"; U="$(cat "$OUT/unity.txt")"; PROJECT="$(cat "$OUT/project.txt")"
          "$U" -batchmode -nographics -quit -projectPath "$PROJECT" -logFile "$E/first-import.log"
          ! grep -qE '\berror CS[0-9]+\b|Scripts have compiler errors|Compilation failed' "$E/first-import.log"

      - name: Add MainMenu save-init diagnostic test and compile
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-saveinit"; E="$OUT/evidence"; U="$(cat "$OUT/unity.txt")"; PROJECT="$(cat "$OUT/project.txt")"; T="$PROJECT/Assets/Stage9MainMenuSaveInit"
          mkdir -p "$T"
          cat > "$T/Stage9.MainMenu.SaveInit.Diagnostics.asmdef" <<'EOF'
          {"name":"Stage9.MainMenu.SaveInit.Diagnostics","references":[],"overrideReferences":false,"autoReferenced":true,"optionalUnityReferences":["TestAssemblies"]}
          EOF
          cat > "$T/Stage9MainMenuSaveInit.cs" <<'EOF'
          using System;
          using System.Collections;
          using System.Linq;
          using System.Reflection;
          using NUnit.Framework;
          using UnityEngine;
          using UnityEngine.SceneManagement;
          using UnityEngine.TestTools;

          public class Stage9MainMenuSaveInit {
            static readonly BindingFlags F=BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance|BindingFlags.Static;
            static object ReadField(Type t,object obj,string n){var f=t.GetField(n,F);return f==null?null:f.GetValue(obj);}
            static int CountItems(object value){var c=value as ICollection;return c==null?-1:c.Count;}
            static int CountWindows(Type t,out int total){
              total=0;if(t==null)return 0;int active=0;
              foreach(var o in Resources.FindObjectsOfTypeAll(t)){
                total++;
                var c=o as Component;
                if(c!=null){
                  bool a=c.gameObject.scene.IsValid()&&c.gameObject.activeInHierarchy;
                  if(a)active++;
                  Debug.Log($"STAGE9_WINDOW_I name={c.gameObject.name} active={(a?1:0)} scene={c.gameObject.scene.name}");
                }
              }
              return active;
            }
            [UnityTest] public IEnumerator MainMenuSaveInitDiagnostic(){
              // Diagnostic-only: known unrelated MainMenu recovery debt is still being enumerated.
              LogAssert.ignoreFailingMessages=true;
              var warm=SceneManager.LoadSceneAsync("MainMenu",LoadSceneMode.Single);
              Assert.IsNotNull(warm,"MainMenu LoadSceneAsync returned null");
              while(!warm.isDone)yield return null;
              yield return new WaitForSecondsRealtime(2f);
              for(int i=0;i<30;i++)yield return null;

              var runtime=AppDomain.CurrentDomain.GetAssemblies().FirstOrDefault(a=>a.GetName().Name=="GodsPVZRuntime1");
              var globals=runtime==null?null:runtime.GetType("GlobalStaticVars");
              var lawn=globals==null?null:ReadField(globals,null,"gLawnApp");
              var saves=lawn==null?null:ReadField(lawn.GetType(),lawn,"savesManager");
              var player=saves==null?null:ReadField(saves.GetType(),saves,"playerSave");
              var saveList=saves==null?null:ReadField(saves.GetType(),saves,"saveList");
              var inner=saveList==null?null:ReadField(saveList.GetType(),saveList,"saveList");
              var defaultName=saveList==null?null:ReadField(saveList.GetType(),saveList,"defaultPlayerName");
              int totalWindows;
              var windowType=runtime==null?null:runtime.GetType("Window_I");
              int activeWindows=CountWindows(windowType,out totalWindows);
              int saveCount=CountItems(inner);
              Debug.Log($"STAGE9_MAINMENU_SAVEINIT scene={SceneManager.GetActiveScene().name} runtime={(runtime!=null?1:0)} lawn={(lawn!=null?1:0)} saves={(saves!=null?1:0)} saveList={(saveList!=null?1:0)} player={(player!=null?1:0)} saveCount={saveCount} defaultName={(defaultName==null?"<null>":defaultName.ToString())} windowI={totalWindows} activeWindowI={activeWindows} exceptionsIgnored=1");

              Assert.IsNotNull(runtime,"GodsPVZRuntime1 not loaded after MainMenu warmup");
              Assert.IsNotNull(lawn,"GlobalStaticVars.gLawnApp missing after MainMenu warmup");
              Assert.IsNotNull(saves,"gLawnApp.savesManager missing after MainMenu warmup");
              Assert.IsNotNull(saveList,"SavesManager.LoadPlayerSaves did not establish saveList; startup did not reach save initialization");
              if(player==null){
                Assert.Greater(activeWindows,0,"No player save exists, but original no-save create-window path was not active");
                Debug.Log("STAGE9_SAVEINIT_BRANCH no-save-popup");
              }else{
                Debug.Log("STAGE9_SAVEINIT_BRANCH existing-save");
              }
            }
          }
          EOF
          "$U" -batchmode -nographics -quit -projectPath "$PROJECT" -logFile "$E/test-compile.log"
          ! grep -qE '\berror CS[0-9]+\b|Scripts have compiler errors|Compilation failed' "$E/test-compile.log"

      - name: Run MainMenu save-init PlayMode diagnostic
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/stage9-saveinit"; E="$OUT/evidence"; U="$(cat "$OUT/unity.txt")"; PROJECT="$(cat "$OUT/project.txt")"
          set +e
          timeout 300 "$U" -batchmode -nographics -projectPath "$PROJECT" -runTests -testPlatform PlayMode \
            -assemblyNames Stage9.MainMenu.SaveInit.Diagnostics -testResults "$E/results.xml" -logFile "$E/playmode.log"
          RC=$?
          set -e
          echo "$RC" > "$E/playmode-exit.txt"
          grep -E 'STAGE9_MAINMENU_SAVEINIT|STAGE9_SAVEINIT_BRANCH|STAGE9_WINDOW_I' "$E/playmode.log" > "$E/markers.txt" || true
          grep -E 'Exception|AssertionException|NullReferenceException|InvalidProgramException|MissingMethodException|TypeLoadException|InvalidOperationException|ArgumentException' "$E/playmode.log" > "$E/exceptions.txt" || true
          grep -E 'MissingMethodException' "$E/playmode.log" > "$E/missing-methods.txt" || true
          grep -E 'MissingMethodException.*(System\.Collections\.Generic\.List|System\.Collections\.Generic\.Dictionary)|Method not found:.*System\.Collections\.Generic\.(List|Dictionary)' "$E/playmode.log" > "$E/generic-missing-methods.txt" || true
          cat "$E/markers.txt" || true
          echo '--- missing methods ---'; cat "$E/missing-methods.txt" || true
          if [ -f "$E/results.xml" ]; then
            python3 - "$E/results.xml" "$E/summary.txt" <<'PY'
          import sys,xml.etree.ElementTree as ET
          r=ET.parse(sys.argv[1]).getroot(); a={k:r.attrib.get(k,'') for k in ('total','passed','failed','skipped','inconclusive','result')}
          open(sys.argv[2],'w').write('\n'.join(f'{k}={v}' for k,v in a.items())+'\n'); print(a)
          PY
          fi
          [ "$RC" = 0 ] || exit "$RC"
          grep -q 'STAGE9_MAINMENU_SAVEINIT .*runtime=1 .*lawn=1 .*saves=1 .*saveList=1 ' "$E/markers.txt" || exit 101
          grep -q 'STAGE9_SAVEINIT_BRANCH ' "$E/markers.txt" || exit 102

      - name: Return Unity Personal seat
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/stage9-saveinit"; E="$OUT/evidence"
          if [ -f "$OUT/seat.flag" ] && [ -f "$OUT/unity.txt" ]; then
            C="$(dirname "$(cat "$OUT/unity.txt")")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
            set +e
            "$C" --deactivate-all > "$E/license-deactivate.log" 2>&1
            RC=$?; echo "$RC" > "$E/license-deactivate-exit.txt"
            set -e
          fi

      - name: Upload MainMenu save-init evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-dc2d-MAINMENU-SAVEINIT-evidence
          path: ${{ runner.temp }}/stage9-saveinit/evidence/
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
