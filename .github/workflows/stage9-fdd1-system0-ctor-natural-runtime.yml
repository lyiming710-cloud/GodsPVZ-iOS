name: Stage9.1 fdd1 System0 ctor natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-fdd1-system0-ctor-natural-runtime.yml','Tools/Stage9System0RuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34971335498, name: Stage9.1-BCB6-SYSTEM0-CTOR-QUALIFIED, path: '${{ runner.temp }}/stage9-system0/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-system0/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-system0/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-system0/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-system0-ctor.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = 'fdd1ded12e78abaa660f0c788c6fa4a3c80f8a37a84ae81808edd37ed269fde2'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "SYSTEM0_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "SYSTEM0_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-system0" "$SYSTEM0_CANDIDATE" "$SYSTEM0_SHA"
      - name: Audit System0 natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-system0/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9System0RuntimeAudit/audit.py "$LOG" "$SYSTEM0_SHA" | tee "$E/system0-ctor-natural-runtime-audit.txt"
          python3 Tools/Stage9RuntimeTriage/first-invalid.py "$LOG" | tee "$E/first-invalid-triage.txt"
      - name: Upload System0 natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-FDD1-SYSTEM0-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-system0/evidence/', retention-days: 90}
