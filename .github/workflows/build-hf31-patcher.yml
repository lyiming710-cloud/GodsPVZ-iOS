name: Build HF31 projectile rotating patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF31Patch/**'
      - '.github/workflows/build-hf31-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF31 patcher
        run: dotnet publish Tools/HF31Patch/HF31Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf31
      - name: Smoke test
        run: |
          chmod +x out/hf31/GodsPVZ.HF31Patch
          set +e
          out/hf31/GodsPVZ.HF31Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf31/GodsPVZ.HF31Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF31Patch-linux-x64
          path: out/hf31
          if-no-files-found: error
