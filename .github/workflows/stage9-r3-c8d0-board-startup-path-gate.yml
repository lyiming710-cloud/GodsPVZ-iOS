name: Stage9.1 c8d0 Board startup-path gate

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-r3-c8d0-board-startup-path-gate.yml'

permissions:
  contents: read
  actions: read

jobs:
  board-startup-path:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Prepare formal R3
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup"; E="$OUT/evidence"
          mkdir -p "$OUT/parts" "$OUT/r3" "$E"
          [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ] || exit 61
          python3 -m pip install --disable-pip-version-check -q gdown==5.2.0
          cat > "$OUT/parts.tsv" <<'EOF'
          00	111hFaHbkXIkSyRoAEdushS_qZ5sPFqUI	e024b6d534a6eace43694a506ce8636c56ed17e8c21bde3bba61caab3d3bdf7a
          01	1nYIm3Bk9yxckfbwVlk6ijSUcaid6aorm	1c10d0d87be6b65c3dfd0424e38515b53a8dd1158c5734b4397f2072e5004bb2
          02	1Y9pMN1FvEpXTFzoKWAx3frra-1-O4s-y	4943615fc153ff8539ab44818dde6981a16758a2c53184a858867d4932edd9c2
          03	1I3yfH8qb4nrAvEErO-KaZLX4Ds77x_5C	f8573c2ef3db3d65de3cb3b98f0892e633cdf89d499bde2d509b36f88306331f
          04	1QUYoGuNGP83hTo6_hoeKlosAonRJCJ-n	3dc6a03ebb4a7bbd48f652b0c468911d6985f76f48c6ded991d40d1c9b7593bc
          05	1Dp8BsTeRmJ9K2yni834KMrxN_Zp18Pe2	13284c2cd74583ccdd63cf6b736dcca443acbf6bda4c25d4b65193fc08c09263
          06	1pfqVCotdu3GMYp8Vl1Bbxp7ls8SPGLsW	d35ba0e632125749f581ad57cf950d8c6b264f9f4882a08adb9ca227f6b6e23c
          07	1fgUDh-crdy3oNjYAwGr50kdAY7BTwF2J	0c9443797e24ddca500a54a21955e27fd2cb995ec7924147e7f5c244859c07ec
          08	1mhL4lliMszPy7ITjfAlSkKQEh19UjhAu	30c9a5330cdece142938150311e8acb87d00d48ab057aa39a2128a3fffdcece8
          09	12sojmPtnZPiWmnyfW-c5MhQjvR2DZMJg	46bca3df6cbfc11f155038470a39b705bb028fa7a0e9f9eb3ba4810c06d5058a
          10	1P-vcBUiPmSH3gR3l_zkgjA63J8UnsVpG	3c8e312e65a72ac3072233f558b4d43970b3a4e521139d03328e9c27ec41d994
          11	1EGPUP5nBjKqvIMft0TAQXvgqpxSVpsyI	dc3d7aa732a19f237e5e72aa6f1e768c10bd360bc6fc832d29b9afc7489da325
          EOF
          while IFS=$'\t' read -r idx fid sha; do
            f="$OUT/parts/r3.$idx.part"
            python3 -m gdown --id "$fid" --output "$f" --quiet
            [ "$(sha256sum "$f" | awk '{print $1}')" = "$sha" ] || exit 62
          done < "$OUT/parts.tsv"
          cat "$OUT/parts"/*.part > "$OUT/r3.tar.zst"
          [ "$(stat -c%s "$OUT/r3.tar.zst")" = 786765618 ] || exit 63
          [ "$(sha256sum "$OUT/r3.tar.zst" | awk '{print $1}')" = 'd4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc' ] || exit 64
          zstd -dc "$OUT/r3.tar.zst" | tar -xf - -C "$OUT/r3"
          rm -rf "$OUT/parts" "$OUT/r3.tar.zst"
          PROJECT="$OUT/r3/UnityProject-AssetRipper-2.0.0/ExportedProject"
          DLL="$PROJECT/Assets/Plugins/Assembly-CSharp.dll"; META="$DLL.meta"
          [ "$(sha256sum "$DLL" | awk '{print $1}')" = 'dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655' ] || exit 65
          grep -q '^guid: 60b84a767c46ced9aacc93f38da4d2f3$' "$META"
          grep -q '^  isExplicitlyReferenced: 1$' "$META"
          grep -q '^  isPreloaded: 0$' "$META"
          echo "$PROJECT" > "$OUT/project.txt"
          printf 'r3_sha256=%s\nhf55_sha256=%s\n' \
            'd4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc' \
            'dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655' > "$E/input-gate.txt"

      - name: Download HF56 patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34689491315
          pattern: GodsPVZ-HF56Patch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-startup/p56

      - name: Download HF57 patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34690940527
          pattern: GodsPVZ-HF57Patch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-startup/p57

      - name: Download Board mechanical patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34699623218
          pattern: GodsPVZ-Stage9BoardMechanicalPatch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-startup/pb

      - name: Download managed cleanup patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34705278743
          pattern: GodsPVZ-Stage9ManagedCleanupPatch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-startup/pc

      - name: Download narrow Board ctor patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34710104085
          pattern: GodsPVZ-Stage9BoardCtorPatch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-startup/pctor

      - name: Download PlantDetail Awake patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34710657395
          pattern: GodsPVZ-Stage9PlantDetailAwakePatch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-startup/pdetail

      - name: Download PlantDetail generic ref fix v2
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34712392060
          pattern: GodsPVZ-Stage9PlantDetailGenericRefFixV2-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-startup/pgeneric

      - name: Download native Board ctor patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34712601618
          pattern: GodsPVZ-Stage9BoardCtorNativePatch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-startup/pnative

      - name: Build exact c8d0 candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup"; E="$OUT/evidence"; PROJECT="$(cat "$OUT/project.txt")"
          OLD="$PROJECT/Assets/Plugins/Assembly-CSharp.dll"; OLDMETA="$OLD.meta"
          P56="$(find "$OUT/p56" -type f -name GodsPVZ.HF56Patch | head -1)"
          P57="$(find "$OUT/p57" -type f -name GodsPVZ.HF57Patch | head -1)"
          PB="$(find "$OUT/pb" -type f -name GodsPVZ.Stage9BoardMechanicalPatch | head -1)"
          PC="$(find "$OUT/pc" -type f -name GodsPVZ.Stage9ManagedCleanupPatch | head -1)"
          PCTOR="$(find "$OUT/pctor" -type f -name GodsPVZ.Stage9BoardCtorPatch | head -1)"
          PDETAIL="$(find "$OUT/pdetail" -type f -name GodsPVZ.Stage9PlantDetailAwakePatch | head -1)"
          PGEN="$(find "$OUT/pgeneric" -type f -name GodsPVZ.Stage9PlantDetailGenericRefFixV2 | head -1)"
          PNATIVE="$(find "$OUT/pnative" -type f -name GodsPVZ.Stage9BoardCtorNativePatch | head -1)"
          chmod +x "$P56" "$P57" "$PB" "$PC" "$PCTOR" "$PDETAIL" "$PGEN" "$PNATIVE"
          "$P56" "$OLD" "$OUT/hf56.dll" > "$E/hf56.log"
          [ "$(sha256sum "$OUT/hf56.dll" | awk '{print $1}')" = '2308c08296cfb83a72321325fd28362d59c25d6bb1a9cc6635a7b4624af202b0' ]
          "$P57" "$OUT/hf56.dll" "$OUT/hf57.dll" > "$E/hf57.log"
          [ "$(sha256sum "$OUT/hf57.dll" | awk '{print $1}')" = 'a699e0f3e812ae1dcd7e1f7d60b7757f958e498626c6a39e43f9984ebe55e38b' ]
          cp "$OUT/hf57.dll" "$OUT/integrated.dll"
          python3 - "$OUT/integrated.dll" <<'PY'
          import hashlib,sys
          from pathlib import Path
          p=Path(sys.argv[1]); b=bytearray(p.read_bytes())
          assert hashlib.sha256(b).hexdigest()=='a699e0f3e812ae1dcd7e1f7d60b7757f958e498626c6a39e43f9984ebe55e38b'
          for o in [0x9f3d6,0x9f3e3,0x9f3f1,0x9f3ff,0x9f412,0x9f41c,0x9f446]:
              assert bytes(b[o:o+4])==bytes.fromhex('fe0c0000'); b[o+1]=0x0d
          for o,old,new in [(0xde448,b'Assembly-CSharp.dll',b'GodsPVZRuntime1.dll'),(0xe0137,b'Assembly-CSharp',b'GodsPVZRuntime1')]:
              assert bytes(b[o:o+len(old)])==old; b[o:o+len(old)]=new
          p.write_bytes(b); assert hashlib.sha256(b).hexdigest()=='e49557eeb620c2d3be38aaf9c399a10978740e0a26dd8d0b0f8a190b12b8b568'
          PY
          "$PB" "$OUT/integrated.dll" "$OUT/mech.dll" > "$E/mechanical.log"
          [ "$(sha256sum "$OUT/mech.dll" | awk '{print $1}')" = '00ba34c43e08c73c3cc8a39e0bf7f0d35fd280e360dd8a2907e9304d93343980' ]
          "$PC" "$OUT/mech.dll" "$OUT/cleanup.dll" > "$E/cleanup.log"
          [ "$(sha256sum "$OUT/cleanup.dll" | awk '{print $1}')" = 'd9e3da6a7ce72daf505aaa806c0c6a6a5b38ecac2308e70135f5245db4144c03' ]
          "$PCTOR" "$OUT/cleanup.dll" "$OUT/ctor-narrow.dll" > "$E/ctor-narrow.log"
          [ "$(sha256sum "$OUT/ctor-narrow.dll" | awk '{print $1}')" = '7bdddb8c5f86db6f87dd9b602a2b850af6999d7965aa09bbfced59ef62a815f3' ]
          "$PDETAIL" "$OUT/ctor-narrow.dll" "$OUT/plantdetail.dll" > "$E/plantdetail.log"
          [ "$(sha256sum "$OUT/plantdetail.dll" | awk '{print $1}')" = 'eaf77ffecc233fa612d0977d8867ab32a2a695fb88c2dd09d86a6920fd2e8995' ]
          "$PGEN" "$OUT/plantdetail.dll" "$OUT/generic.dll" > "$E/generic.log"
          [ "$(sha256sum "$OUT/generic.dll" | awk '{print $1}')" = '06be72c9a18079f6b0dea7e6026b1ad1f5cd6f083aedf2ea250e074330aef21d' ]
          "$PNATIVE" "$OUT/generic.dll" "$OUT/final.dll" > "$E/ctor-native.log"
          [ "$(sha256sum "$OUT/final.dll" | awk '{print $1}')" = 'c8d0fdf2c6c03188ebe8a123121c6ef8972d9541ed8f630e95ee4e17b268b425' ]
          sed -i 's/^  isPreloaded: 0$/  isPreloaded: 1/' "$OLDMETA"
          NEW="$PROJECT/Assets/Plugins/GodsPVZRuntime1.dll"; NEWMETA="$NEW.meta"
          cp "$OUT/final.dll" "$NEW"; mv "$OLDMETA" "$NEWMETA"; rm "$OLD"
          grep -q '^guid: 60b84a767c46ced9aacc93f38da4d2f3$' "$NEWMETA"
          grep -q '^  isPreloaded: 1$' "$NEWMETA"
          printf 'final_sha256=%s\nstartup_path=MainMenu_then_Board\n' 'c8d0fdf2c6c03188ebe8a123121c6ef8972d9541ed8f630e95ee4e17b268b425' >> "$E/input-gate.txt"
          rm -rf "$OUT/p56" "$OUT/p57" "$OUT/pb" "$OUT/pc" "$OUT/pctor" "$OUT/pdetail" "$OUT/pgeneric" "$OUT/pnative" "$OUT"/*.dll

      - name: Download preserved exact Editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-startup/editor-parts

      - name: Reconstruct exact Editor and activate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup"; E="$OUT/evidence"; P="$OUT/editor-parts"; D="$OUT/editor"
          mkdir -p "$D"
          [ "$(cat "$P"/Unity-China-2022.3.44f1c1.tar.xz.part-* | sha256sum | awk '{print $1}')" = '0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14' ] || exit 91
          (for p in "$P"/Unity-China-2022.3.44f1c1.tar.xz.part-*; do cat "$p"; done) | xz -dc | tar -xf - -C "$D"
          rm -rf "$P"
          U="$D/Editor/Unity"; chmod +x "$U"
          "$U" -version > "$E/unity-version.txt" 2>&1
          grep -q '2022.3.44f1c1' "$E/unity-version.txt"
          echo "$U" > "$OUT/unity.txt"
          C="$D/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          set +e
          "$C" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > "$E/license-activate.log" 2>&1
          RC=$?
          set -e
          echo "$RC" > "$E/activation-exit.txt"
          [ "$RC" = 0 ] || exit 93
          echo ACQUIRED > "$OUT/seat.flag"

      - name: First import c8d0 candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup"; E="$OUT/evidence"; U="$(cat "$OUT/unity.txt")"; PROJECT="$(cat "$OUT/project.txt")"
          "$U" -batchmode -nographics -quit -projectPath "$PROJECT" -logFile "$E/first-import.log"
          ! grep -qE '\berror CS[0-9]+\b|Scripts have compiler errors|Compilation failed' "$E/first-import.log"

      - name: Install startup-path Board PlayMode test
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup"; E="$OUT/evidence"; U="$(cat "$OUT/unity.txt")"; PROJECT="$(cat "$OUT/project.txt")"; T="$PROJECT/Assets/Stage9BoardStartupPath"
          mkdir -p "$T"
          cat > "$T/Stage9.Board.StartupPath.Tests.asmdef" <<'EOF'
          {"name":"Stage9.Board.StartupPath.Tests","references":[],"overrideReferences":false,"autoReferenced":true,"optionalUnityReferences":["TestAssemblies"]}
          EOF
          cat > "$T/Stage9BoardStartupPath.cs" <<'EOF'
          using System;
          using System.Collections;
          using System.Linq;
          using System.Reflection;
          using NUnit.Framework;
          using UnityEngine;
          using UnityEngine.SceneManagement;
          using UnityEngine.TestTools;
          public class Stage9BoardStartupPath {
            static readonly BindingFlags F=BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance|BindingFlags.Static;
            static object ReadField(Type t,object obj,string n){var f=t.GetField(n,F);return f==null?null:f.GetValue(obj);}
            static void Walk(GameObject g,ref int gos,ref int missing,ref int boardStart,ref int board){
              gos++;
              foreach(var c in g.GetComponents<Component>()){
                if(c==null){missing++;continue;}
                var n=c.GetType().Name;
                if(n=="BoardStart") boardStart++;
                if(n=="Board") board++;
              }
              foreach(Transform ch in g.transform) Walk(ch.gameObject,ref gos,ref missing,ref boardStart,ref board);
            }
            [UnityTest] public IEnumerator MainMenuThenBoard(){
              LogAssert.ignoreFailingMessages=true;
              var warm=SceneManager.LoadSceneAsync("MainMenu",LoadSceneMode.Single);
              Assert.IsNotNull(warm,"MainMenu LoadSceneAsync returned null");
              while(!warm.isDone) yield return null;
              yield return new WaitForSecondsRealtime(2f);
              for(int i=0;i<30;i++) yield return null;
              var runtime=AppDomain.CurrentDomain.GetAssemblies().FirstOrDefault(a=>a.GetName().Name=="GodsPVZRuntime1");
              var globals=runtime==null?null:runtime.GetType("GlobalStaticVars");
              var lawn=globals==null?null:ReadField(globals,null,"gLawnApp");
              var saves=lawn==null?null:ReadField(lawn.GetType(),lawn,"savesManager");
              var player=saves==null?null:ReadField(saves.GetType(),saves,"playerSave");
              Debug.Log($"STAGE9_MAINMENU_WARMUP scene={SceneManager.GetActiveScene().name} runtime={(runtime!=null?1:0)} lawn={(lawn!=null?1:0)} saves={(saves!=null?1:0)} player={(player!=null?1:0)}");
              LogAssert.ignoreFailingMessages=false;
              Assert.IsNotNull(runtime,"GodsPVZRuntime1 not loaded after MainMenu warmup");
              Assert.IsNotNull(lawn,"GlobalStaticVars.gLawnApp missing after MainMenu warmup");
              Assert.IsNotNull(saves,"gLawnApp.savesManager missing after MainMenu warmup");
              Assert.IsNotNull(player,"savesManager.playerSave missing after MainMenu warmup");
              var op=SceneManager.LoadSceneAsync("Board",LoadSceneMode.Single);
              Assert.IsNotNull(op,"Board LoadSceneAsync returned null");
              while(!op.isDone) yield return null;
              yield return new WaitForSecondsRealtime(2f);
              for(int i=0;i<30;i++) yield return null;
              var active=SceneManager.GetActiveScene();
              int gos=0,missing=0,boardStart=0,board=0;
              foreach(var r in active.GetRootGameObjects()) Walk(r,ref gos,ref missing,ref boardStart,ref board);
              Debug.Log($"STAGE9_BOARD_STARTUP_PATH_MARKER scene={active.name} gos={gos} missing={missing} boardStart={boardStart} board={board}");
              Assert.AreEqual("Board",active.name,"Board did not remain active");
              Assert.Greater(gos,3,"Board did not expand beyond bootstrap content");
              Assert.AreEqual(0,missing,"Board has missing component slots");
              Assert.Greater(boardStart,0,"BoardStart was not instantiated");
            }
          }
          EOF
          "$U" -batchmode -nographics -quit -projectPath "$PROJECT" -logFile "$E/test-compile.log"
          ! grep -qE '\berror CS[0-9]+\b|Scripts have compiler errors|Compilation failed' "$E/test-compile.log"

      - name: Run startup-path Board PlayMode
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/stage9-startup"; E="$OUT/evidence"; U="$(cat "$OUT/unity.txt")"; PROJECT="$(cat "$OUT/project.txt")"
          set +e
          timeout 300 "$U" -batchmode -nographics -projectPath "$PROJECT" -runTests -testPlatform PlayMode \
            -assemblyNames Stage9.Board.StartupPath.Tests -testResults "$E/results.xml" -logFile "$E/playmode.log"
          RC=$?
          set -e
          echo "$RC" > "$E/playmode-exit.txt"
          grep -E 'STAGE9_MAINMENU_WARMUP|STAGE9_BOARD_STARTUP_PATH_MARKER' "$E/playmode.log" > "$E/markers.txt" || true
          grep -E 'Exception|AssertionException|NullReferenceException|InvalidProgramException|MissingMethodException|TypeLoadException|InvalidOperationException|ArgumentException' "$E/playmode.log" > "$E/exceptions.txt" || true
          cat "$E/markers.txt" || true
          if [ -f "$E/results.xml" ]; then
            python3 - "$E/results.xml" "$E/summary.txt" <<'PY'
          import sys,xml.etree.ElementTree as ET
          r=ET.parse(sys.argv[1]).getroot(); a={k:r.attrib.get(k,'') for k in ('total','passed','failed','skipped','inconclusive','result')}
          open(sys.argv[2],'w').write('\n'.join(f'{k}={v}' for k,v in a.items())+'\n'); print(a)
          PY
          fi
          [ "$RC" = 0 ] || exit "$RC"
          grep -q 'STAGE9_MAINMENU_WARMUP .*saves=1 .*player=1' "$E/markers.txt" || exit 101
          grep -q 'STAGE9_BOARD_STARTUP_PATH_MARKER scene=Board .*missing=0 .*boardStart=' "$E/markers.txt" || exit 102

      - name: Return Personal seat
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/stage9-startup"; E="$OUT/evidence"
          if [ -f "$OUT/seat.flag" ] && [ -f "$OUT/unity.txt" ]; then
            C="$(dirname "$(cat "$OUT/unity.txt")")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
            set +e
            "$C" --deactivate-all > "$E/license-deactivate.log" 2>&1
            RC=$?; echo "$RC" > "$E/license-deactivate-exit.txt"
            set -e
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-c8d0-BOARD-STARTUP-PATH-evidence
          path: ${{ runner.temp }}/stage9-startup/evidence/
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
