name: Bulk250-R2 retest candidate and portable Linux verification
# Trigger run 1: Bulk250-R2 candidate preparation, 16-negative-control static gates, triple baseline comparisons (vs R1, original Bulk250 & Bulk200), and downstream verification

on:
  push:
    branches: [repair/bulk250-r2-actions-2026-10-22]
    paths: ['.github/workflows/bulk250-r2-candidate-verification.yml', 'scripts/actions/**', 'support/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bulk250-r2-candidate-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Record host and select Clang 18
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang++-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang-18 g++
          fi
          mkdir -p "$RUNNER_TEMP/bulk250-r2-bin"
          ln -s "$(command -v clang++-18)" "$RUNNER_TEMP/bulk250-r2-bin/clang++"
          echo "$RUNNER_TEMP/bulk250-r2-bin" >> "$GITHUB_PATH"
          uname -a
          dotnet --info
          clang++-18 --version
          g++ --version
      - name: Download frozen inputs, tools capsule, baselines and Bulk250-R2 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bulk250-r2-downloads"
          gh release download bulk152-actions-checkpoint-2026-10-20             --repo lyiming710-cloud/GodsPVZ-iOS             --pattern PORTABLE-BULK152-CHECKPOINT.tar.gz             --pattern PORTABLE-MANIFEST.json             --dir "$RUNNER_TEMP/bulk250-r2-downloads"
          gh release download native110-bulk162-r1-source-2026-10-20             --repo lyiming710-cloud/GodsPVZ-iOS             --pattern NATIVE110-BULK162-R1-SOURCE-AND-TOOLS.zip             --dir "$RUNNER_TEMP/bulk250-r2-downloads"
          # Download Bulk200 candidate (baseline 52 delta)
          mkdir -p "$RUNNER_TEMP/bulk200_dl"
          gh release download bulk200-actions-evidence-2026-10-22             --repo lyiming710-cloud/GodsPVZ-iOS             --pattern candidate1.dll             --dir "$RUNNER_TEMP/bulk200_dl"
          mv "$RUNNER_TEMP/bulk200_dl/candidate1.dll" "$RUNNER_TEMP/bulk250-r2-downloads/candidate_bulk200.dll"
          # Download original Bulk250 candidate (baseline 10 delta)
          mkdir -p "$RUNNER_TEMP/bulk250_orig_dl"
          gh release download bulk250-actions-evidence-2026-10-22             --repo lyiming710-cloud/GodsPVZ-iOS             --pattern candidate1.dll             --dir "$RUNNER_TEMP/bulk250_orig_dl"
          mv "$RUNNER_TEMP/bulk250_orig_dl/candidate1.dll" "$RUNNER_TEMP/bulk250-r2-downloads/candidate_bulk250_orig.dll"
          # Download Bulk250-R1 candidate (baseline 2 delta)
          mkdir -p "$RUNNER_TEMP/bulk250_r1_dl"
          gh release download bulk250-r1-candidate-2026-10-22             --repo lyiming710-cloud/GodsPVZ-iOS             --pattern candidate1.dll             --dir "$RUNNER_TEMP/bulk250_r1_dl"
          mv "$RUNNER_TEMP/bulk250_r1_dl/candidate1.dll" "$RUNNER_TEMP/bulk250-r2-downloads/candidate_bulk250_r1.dll"
          # Download Bulk250-R2 retest source
          gh release download bulk250-r2-source-bulk300-held-2026-10-22             --repo lyiming710-cloud/GodsPVZ-iOS             --pattern BULK250-R2-RETEST-SOURCE.zip             --dir "$RUNNER_TEMP/bulk250-r2-downloads"
      - name: Authenticate restored files and tools
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions/restore_bulk152_checkpoint.py             --downloads "$RUNNER_TEMP/bulk250-r2-downloads"             --destination "$RUNNER_TEMP/bulk250-r2-portable"             --receipt .validation/bulk250-r2-checkpoint-receipt.json
          python3 scripts/actions/restore_native110_source.py             --archive "$RUNNER_TEMP/bulk250-r2-downloads/NATIVE110-BULK162-R1-SOURCE-AND-TOOLS.zip"             --destination "$RUNNER_TEMP/native110-capsule"
          python3 scripts/actions/restore_bulk250_r2_source.py             --archive "$RUNNER_TEMP/bulk250-r2-downloads/BULK250-R2-RETEST-SOURCE.zip"             --destination "$RUNNER_TEMP/native250-r2-source"             --receipt .validation/bulk250-r2-restore-receipt.json
      - name: Apply authentic official iOS PlaybackEngine dependency profile
        shell: bash
        run: |
          set -euo pipefail
          support_target="$RUNNER_TEMP/bulk250-r2-portable/work/il2cpp_stage_coherent/Library/Bee/artifacts/iOS/ManagedStripped"
          official_mod="$GITHUB_WORKSPACE/support/official-unity-2022.3.44f1-ios/UnityEngine.AnimationModule.dll"
          if [ -f "$official_mod" ]; then
            echo "Overlaying official iOS PlaybackEngine UnityEngine.AnimationModule.dll (153088 B)..."
            cp "$official_mod" "$support_target/UnityEngine.AnimationModule.dll"
            sha256sum "$support_target/UnityEngine.AnimationModule.dll"
          else
            echo "ERROR: Official iOS PlaybackEngine assembly missing at $official_mod"
            exit 1
          fi
      - name: Construct twice, verify isolation and execute downstream gates
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/native110-capsule/deps"
          python3 scripts/actions/prepare_bulk250_r2_candidate.py             --source-dir "$RUNNER_TEMP/native250-r2-source/source250-r2"             --parent-dll "$RUNNER_TEMP/native110-capsule/inputs/parent_native93.dll"             --baseline-candidate-dll "$RUNNER_TEMP/bulk250-r2-downloads/candidate_bulk250_r1.dll"             --bulk200-baseline-dll "$RUNNER_TEMP/bulk250-r2-downloads/candidate_bulk200.dll"             --orig-bulk250-dll "$RUNNER_TEMP/bulk250-r2-downloads/candidate_bulk250_orig.dll"             --wrong-parent-dll "$RUNNER_TEMP/bulk250-r2-downloads/candidate_bulk250_r1.dll"             --deps-dir "$RUNNER_TEMP/native110-capsule/deps"             --tools-dir "$RUNNER_TEMP/native110-capsule/tools"             --support-dir "$RUNNER_TEMP/bulk250-r2-portable/work/il2cpp_stage_coherent/Library/Bee/artifacts/iOS/ManagedStripped"             --portable-root "$RUNNER_TEMP/bulk250-r2-portable"             --output-dir "$GITHUB_WORKSPACE/.validation/bulk250-r2-run"             --verifier-runner "$GITHUB_WORKSPACE/scripts/actions/verify_bulk152_portable.py"             --allow-blocked-dependency-profile
      - name: Preserve generated source on success or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage=.validation/bulk250-r2-run/verifier_output/il2cpp_stage
          if [ -d "$stage/il2cppOutput" ]; then
            tar -czf .validation/bulk250-r2-generated-sources.tar.gz               -C "$stage" il2cppOutput
          fi
      - name: Execute real Cecil / CLR DynamicMethod behavioral fixture (Bulk250-R2)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cand_dll="$GITHUB_WORKSPACE/.validation/bulk250-r2-run/candidates/candidate1.dll"
          report_json="$GITHUB_WORKSPACE/.validation/bulk250-r2-run/BULK250-R2-BEHAVIOR-QUALIFICATION-REPORT-v2.json"
          if [ -f "$cand_dll" ]; then
            echo "Executing C# Bulk250R2BehaviorFixture against candidate1.dll..."
            python3 scripts/actions/test_behavior_bulk250_r2.py --candidate-dll "$cand_dll" --output-json "$report_json"
          fi
      - name: Upload candidate and complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bulk250-R2-Linux-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
          path: |
            .validation/bulk250-r2-restore-receipt.json
            .validation/bulk250-r2-run/candidates/
            .validation/bulk250-r2-run/results/
            .validation/bulk250-r2-run/*.json
            .validation/bulk250-r2-run/tools_bin/
            .validation/bulk250-r2-run/verifier_output/results/
            .validation/bulk250-r2-run/verifier_output/oracle_run/
            .validation/bulk250-r2-run/verifier_output/fixture_run/*.json
            .validation/bulk250-r2-run/verifier_output/fixture_run/*.log
            .validation/bulk250-r2-run/verifier_output/fixture_run/*.txt
            .validation/bulk250-r2-run/verifier_output/*.json
            .validation/bulk250-r2-run/verifier_output/Archive-v1-*.zip
            .validation/bulk250-r2-generated-sources.tar.gz
