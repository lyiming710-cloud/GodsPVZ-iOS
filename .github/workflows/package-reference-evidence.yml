name: Package reference evidence

on:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/package-reference-evidence.yml'
      - 'Recovery/package-script-map-editor.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-guid-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact package versions and MonoScript GUIDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import tarfile
          import tempfile
          import urllib.request
          from pathlib import Path

          MAP = Path('Recovery/package-script-map-editor.json')
          OUT = Path('package-reference-evidence')
          OUT.mkdir(parents=True, exist_ok=True)

          package_for_dll = {
              'UnityEngine.UI.dll': ('com.unity.ugui', '1.0.0'),
              'Unity.TextMeshPro.dll': ('com.unity.textmeshpro', '3.0.6'),
              'Unity.RenderPipelines.Core.Runtime.dll': ('com.unity.render-pipelines.core', '14.0.11'),
              'Unity.RenderPipelines.Universal.Runtime.dll': ('com.unity.render-pipelines.universal', '14.0.11'),
              'Unity.2D.Animation.Runtime.dll': ('com.unity.2d.animation', '9.1.1'),
          }
          expected_counts = {
              'UnityEngine.UI.dll': 19,
              'Unity.TextMeshPro.dll': 9,
              'Unity.RenderPipelines.Core.Runtime.dll': 32,
              'Unity.RenderPipelines.Universal.Runtime.dll': 5,
              'Unity.2D.Animation.Runtime.dll': 2,
          }
          registry_packages = {
              ('com.unity.ugui', '1.0.0'),
              ('com.unity.textmeshpro', '3.0.6'),
              ('com.unity.2d.animation', '9.1.1'),
          }
          # Unity Registry no longer exposes 14.0.11 in its current metadata.
          # This pinned public project contains embedded copies of both exact 14.0.11 packages.
          rp_mirror_repo = 'https://github.com/SL0ANE/SloanePixelartURP.git'
          rp_mirror_commit = '1738732ad202a4d79d575005d9b85c2f12876d8f'

          root = json.loads(MAP.read_text(encoding='utf-8'))
          packages = root.get('packages') or []
          assert sum(len(p.get('mapping') or []) for p in packages) == 67
          assert {p['dll']: len(p.get('mapping') or []) for p in packages} == expected_counts

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'GodsPVZ-package-evidence/1.1'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def download(url, path):
              req = urllib.request.Request(url, headers={'User-Agent': 'GodsPVZ-package-evidence/1.1'})
              with urllib.request.urlopen(req, timeout=120) as r, open(path, 'wb') as w:
                  shutil.copyfileobj(r, w)

          def validate_package(root_path, package_name, version):
              pj = root_path / 'package.json'
              if not pj.exists():
                  raise RuntimeError(f'{package_name}@{version}: package.json missing at {root_path}')
              actual = json.loads(pj.read_text(encoding='utf-8'))
              if actual.get('name') != package_name or actual.get('version') != version:
                  raise RuntimeError(f'{package_name}@{version}: identity mismatch: {actual.get("name")}@{actual.get("version")}')

          package_roots = {}
          package_provenance = []
          work = Path(tempfile.mkdtemp(prefix='godspvz-upm-'))

          for package_name, version in sorted(registry_packages):
              meta_url = 'https://packages.unity.com/' + package_name
              metadata = get_json(meta_url)
              ver = (metadata.get('versions') or {}).get(version)
              if not ver:
                  raise RuntimeError(f'{package_name}@{version}: version missing from Unity Registry metadata')
              dist = ver.get('dist') or {}
              tarball_url = dist.get('tarball')
              if not tarball_url:
                  raise RuntimeError(f'{package_name}@{version}: dist.tarball missing')
              tgz = work / f'{package_name}-{version}.tgz'
              download(tarball_url, tgz)
              sha256 = hashlib.sha256(tgz.read_bytes()).hexdigest()
              extract = work / f'{package_name}@{version}'
              extract.mkdir()
              with tarfile.open(tgz, 'r:*') as tf:
                  tf.extractall(extract)
              found = list(extract.rglob('package.json'))
              exact = []
              for pj in found:
                  try:
                      j = json.loads(pj.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  if j.get('name') == package_name and j.get('version') == version:
                      exact.append(pj.parent)
              if len(exact) != 1:
                  raise RuntimeError(f'{package_name}@{version}: exact package roots={len(exact)}')
              package_root = exact[0]
              validate_package(package_root, package_name, version)
              package_roots[(package_name, version)] = package_root
              package_provenance.append({
                  'name': package_name,
                  'version': version,
                  'source_kind': 'unity-registry',
                  'registry_metadata_url': meta_url,
                  'tarball_url': tarball_url,
                  'tarball_sha256': sha256,
                  'dist_shasum': dist.get('shasum'),
                  'dist_integrity': dist.get('integrity'),
              })

          mirror = work / 'rp-mirror'
          subprocess.run(['git', 'init', str(mirror)], check=True, stdout=subprocess.DEVNULL)
          subprocess.run(['git', '-C', str(mirror), 'remote', 'add', 'origin', rp_mirror_repo], check=True)
          subprocess.run(['git', '-C', str(mirror), 'config', 'core.sparseCheckout', 'true'], check=True)
          info = mirror / '.git' / 'info' / 'sparse-checkout'
          info.write_text('Packages/com.unity.render-pipelines.core@14.0.11/\nPackages/com.unity.render-pipelines.universal@14.0.11/\n', encoding='utf-8')
          subprocess.run(['git', '-C', str(mirror), 'fetch', '--depth=1', 'origin', rp_mirror_commit], check=True)
          subprocess.run(['git', '-C', str(mirror), 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          resolved_commit = subprocess.check_output(['git', '-C', str(mirror), 'rev-parse', 'HEAD'], text=True).strip()
          if resolved_commit != rp_mirror_commit:
              raise RuntimeError(f'RP mirror commit mismatch: {resolved_commit}')

          for package_name in ('com.unity.render-pipelines.core', 'com.unity.render-pipelines.universal'):
              version = '14.0.11'
              package_root = mirror / 'Packages' / f'{package_name}@{version}'
              validate_package(package_root, package_name, version)
              tree_sha = subprocess.check_output(['git', '-C', str(mirror), 'rev-parse', f'HEAD:Packages/{package_name}@{version}'], text=True).strip()
              package_roots[(package_name, version)] = package_root
              package_provenance.append({
                  'name': package_name,
                  'version': version,
                  'source_kind': 'pinned-github-embedded-copy',
                  'repository': rp_mirror_repo,
                  'commit': rp_mirror_commit,
                  'package_tree_sha': tree_sha,
                  'note': 'Pinned exact-version embedded copy used because current Unity Registry metadata no longer exposes 14.0.11; final Unity Editor validation remains authoritative.',
              })

          rows = []
          bad = []
          for pkg in packages:
              dll = pkg['dll']
              package_name, version = package_for_dll[dll]
              package_root = package_roots[(package_name, version)]
              for m in pkg.get('mapping') or []:
                  full_name = m['fullName']
                  short = full_name.rsplit('.', 1)[-1]
                  candidates = []
                  for cs in package_root.rglob(short + '.cs'):
                      s = '/' + cs.relative_to(package_root).as_posix() + '/'
                      if any(part in s for part in ('/Editor/', '/Tests/', '/Samples~/', '/Documentation~/', '/TestProjects/')):
                          continue
                      if cs.with_suffix(cs.suffix + '.meta').exists():
                          candidates.append(cs)
                  if len(candidates) != 1:
                      bad.append({'dll': dll, 'fullName': full_name, 'candidate_paths': [c.relative_to(package_root).as_posix() for c in candidates]})
                      continue
                  cs = candidates[0]
                  meta = cs.with_suffix(cs.suffix + '.meta')
                  mm = re.search(r'(?m)^guid:\s*([0-9a-fA-F]{32})\s*$', meta.read_text(encoding='utf-8', errors='replace'))
                  if not mm:
                      bad.append({'dll': dll, 'fullName': full_name, 'candidate_paths': [cs.relative_to(package_root).as_posix()], 'error': 'guid missing from .meta'})
                      continue
                  rows.append({
                      'dll': dll,
                      'package': package_name,
                      'version': version,
                      'old_dll_guid': pkg['guid'],
                      'old_fileID': m['fileID'],
                      'fullName': full_name,
                      'source_path': cs.relative_to(package_root).as_posix(),
                      'meta_path': meta.relative_to(package_root).as_posix(),
                      'monoscript_guid': mm.group(1).lower(),
                      'new_fileID': 11500000,
                  })

          evidence = {
              'schema': 2,
              'source_map': str(MAP),
              'resolved': len(rows),
              'expected': 67,
              'packages': sorted(package_provenance, key=lambda p: p['name']),
              'mapping': sorted(rows, key=lambda r: (r['dll'], r['fullName'])),
              'failures': bad,
          }
          (OUT / 'package-guid-map.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          report = []
          report.append('GodsPVZ exact package GUID evidence')
          report.append(f'resolved={len(rows)}/67')
          report.append(f'failures={len(bad)}')
          report.append('')
          for p in sorted(package_provenance, key=lambda p: p['name']):
              if p['source_kind'] == 'unity-registry':
                  report.append(f"PACKAGE\t{p['name']}@{p['version']}\tunity-registry\tsha256={p['tarball_sha256']}\t{p['tarball_url']}")
              else:
                  report.append(f"PACKAGE\t{p['name']}@{p['version']}\tpinned-github-embedded-copy\tcommit={p['commit']}\ttree={p['package_tree_sha']}")
          report.append('')
          for r in sorted(rows, key=lambda r: (r['dll'], r['fullName'])):
              report.append(f"MAP\t{r['dll']}\t{r['fullName']}\toldFileID={r['old_fileID']}\tguid={r['monoscript_guid']}\t{r['source_path']}")
          if bad:
              report.append('')
              for x in bad:
                  report.append('FAIL\t' + json.dumps(x, sort_keys=True))
          (OUT / 'package-guid-map.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')

          sha_lines = []
          for name in ('package-guid-map.json', 'package-guid-map.txt'):
              path = OUT / name
              sha_lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}")
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          print('\n'.join(report))
          if bad or len(rows) != 67:
              raise SystemExit(23)
          PY

      - name: Upload exact package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HF46-package-reference-evidence
          path: package-reference-evidence/
          if-no-files-found: error
          retention-days: 90
