name: Package reference evidence

on:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/package-reference-evidence.yml'
      - 'Recovery/package-script-map-editor.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-guid-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact Unity Registry packages and MonoScript GUIDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import tarfile
          import tempfile
          import urllib.request
          from pathlib import Path

          MAP = Path('Recovery/package-script-map-editor.json')
          OUT = Path('package-reference-evidence')
          OUT.mkdir(parents=True, exist_ok=True)

          package_for_dll = {
              'UnityEngine.UI.dll': ('com.unity.ugui', '1.0.0'),
              'Unity.TextMeshPro.dll': ('com.unity.textmeshpro', '3.0.6'),
              'Unity.RenderPipelines.Core.Runtime.dll': ('com.unity.render-pipelines.core', '14.0.11'),
              'Unity.RenderPipelines.Universal.Runtime.dll': ('com.unity.render-pipelines.universal', '14.0.11'),
              'Unity.2D.Animation.Runtime.dll': ('com.unity.2d.animation', '9.1.1'),
          }
          expected_counts = {
              'UnityEngine.UI.dll': 19,
              'Unity.TextMeshPro.dll': 9,
              'Unity.RenderPipelines.Core.Runtime.dll': 32,
              'Unity.RenderPipelines.Universal.Runtime.dll': 5,
              'Unity.2D.Animation.Runtime.dll': 2,
          }

          root = json.loads(MAP.read_text(encoding='utf-8'))
          packages = root.get('packages') or []
          assert sum(len(p.get('mapping') or []) for p in packages) == 67
          assert {p['dll']: len(p.get('mapping') or []) for p in packages} == expected_counts

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'GodsPVZ-package-evidence/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def download(url, path):
              req = urllib.request.Request(url, headers={'User-Agent': 'GodsPVZ-package-evidence/1.0'})
              with urllib.request.urlopen(req, timeout=120) as r, open(path, 'wb') as w:
                  shutil.copyfileobj(r, w)

          package_roots = {}
          package_provenance = []
          work = Path(tempfile.mkdtemp(prefix='godspvz-upm-'))

          for package_name, version in sorted(set(package_for_dll.values())):
              meta_url = 'https://packages.unity.com/' + package_name
              metadata = get_json(meta_url)
              ver = (metadata.get('versions') or {}).get(version)
              if not ver:
                  raise RuntimeError(f'{package_name}@{version}: version missing from Unity Registry metadata')
              dist = ver.get('dist') or {}
              tarball_url = dist.get('tarball')
              if not tarball_url:
                  raise RuntimeError(f'{package_name}@{version}: dist.tarball missing')

              tgz = work / f'{package_name}-{version}.tgz'
              download(tarball_url, tgz)
              sha256 = hashlib.sha256(tgz.read_bytes()).hexdigest()
              extract = work / f'{package_name}@{version}'
              extract.mkdir()
              with tarfile.open(tgz, 'r:*') as tf:
                  tf.extractall(extract)

              roots = [p for p in extract.iterdir() if p.is_dir()]
              if len(roots) == 1 and roots[0].name in ('package', 'package~'):
                  package_root = roots[0]
              else:
                  package_root = extract
              pj = package_root / 'package.json'
              if not pj.exists():
                  found = list(extract.rglob('package.json'))
                  if len(found) != 1:
                      raise RuntimeError(f'{package_name}@{version}: package.json candidates={len(found)}')
                  package_root = found[0].parent
                  pj = found[0]
              actual = json.loads(pj.read_text(encoding='utf-8'))
              if actual.get('name') != package_name or actual.get('version') != version:
                  raise RuntimeError(f'{package_name}@{version}: extracted identity mismatch: {actual.get("name")}@{actual.get("version")}')
              package_roots[(package_name, version)] = package_root
              package_provenance.append({
                  'name': package_name,
                  'version': version,
                  'registry_metadata_url': meta_url,
                  'tarball_url': tarball_url,
                  'tarball_sha256': sha256,
                  'dist_shasum': dist.get('shasum'),
                  'dist_integrity': dist.get('integrity'),
              })

          rows = []
          bad = []
          for pkg in packages:
              dll = pkg['dll']
              package_name, version = package_for_dll[dll]
              package_root = package_roots[(package_name, version)]
              for m in pkg.get('mapping') or []:
                  full_name = m['fullName']
                  short = full_name.rsplit('.', 1)[-1]
                  candidates = []
                  for cs in package_root.rglob(short + '.cs'):
                      s = '/' + cs.relative_to(package_root).as_posix() + '/'
                      if any(part in s for part in ('/Editor/', '/Tests/', '/Samples~/', '/Documentation~/', '/TestProjects/')):
                          continue
                      if cs.with_suffix(cs.suffix + '.meta').exists():
                          candidates.append(cs)
                  if len(candidates) != 1:
                      bad.append({'dll': dll, 'fullName': full_name, 'candidate_paths': [c.relative_to(package_root).as_posix() for c in candidates]})
                      continue
                  cs = candidates[0]
                  meta = cs.with_suffix(cs.suffix + '.meta')
                  mm = re.search(r'(?m)^guid:\s*([0-9a-fA-F]{32})\s*$', meta.read_text(encoding='utf-8', errors='replace'))
                  if not mm:
                      bad.append({'dll': dll, 'fullName': full_name, 'candidate_paths': [cs.relative_to(package_root).as_posix()], 'error': 'guid missing from .meta'})
                      continue
                  rows.append({
                      'dll': dll,
                      'package': package_name,
                      'version': version,
                      'old_dll_guid': pkg['guid'],
                      'old_fileID': m['fileID'],
                      'fullName': full_name,
                      'source_path': cs.relative_to(package_root).as_posix(),
                      'meta_path': meta.relative_to(package_root).as_posix(),
                      'official_monoscript_guid': mm.group(1).lower(),
                      'new_fileID': 11500000,
                  })

          evidence = {
              'schema': 1,
              'source_map': str(MAP),
              'resolved': len(rows),
              'expected': 67,
              'packages': package_provenance,
              'mapping': sorted(rows, key=lambda r: (r['dll'], r['fullName'])),
              'failures': bad,
          }
          (OUT / 'package-guid-map.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          report = []
          report.append('GodsPVZ exact Unity Registry package GUID evidence')
          report.append(f'resolved={len(rows)}/67')
          report.append(f'failures={len(bad)}')
          report.append('')
          for p in package_provenance:
              report.append(f"PACKAGE\t{p['name']}@{p['version']}\tsha256={p['tarball_sha256']}\t{p['tarball_url']}")
          report.append('')
          for r in sorted(rows, key=lambda r: (r['dll'], r['fullName'])):
              report.append(f"MAP\t{r['dll']}\t{r['fullName']}\toldFileID={r['old_fileID']}\tguid={r['official_monoscript_guid']}\t{r['source_path']}")
          if bad:
              report.append('')
              for x in bad:
                  report.append('FAIL\t' + json.dumps(x, sort_keys=True))
          (OUT / 'package-guid-map.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')

          sha_lines = []
          for name in ('package-guid-map.json', 'package-guid-map.txt'):
              path = OUT / name
              sha_lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}")
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          print('\n'.join(report))
          if bad or len(rows) != 67:
              raise SystemExit(23)
          PY

      - name: Upload exact package evidence
        uses: actions/upload-artifact@v4
        with:
          name: HF46-package-reference-evidence
          path: package-reference-evidence/
          if-no-files-found: error
          retention-days: 90
