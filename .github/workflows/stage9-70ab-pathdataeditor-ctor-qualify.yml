name: Stage9.1 70ab PathDataEditor ctor qualify
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-70ab-pathdataeditor-ctor-qualify.yml','Tools/Stage9PathDataEditorCtorQualify/**','Tools/Stage9Int32MinusOnePatch/**','Tools/Stage9NativeProbe/PathDataEditor.ctor.native-evidence.md']
permissions: {contents: read, actions: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34965707073, name: Stage9.1-70AB-WINDOW-Q-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/promotion'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34965475052, name: Stage9.1-19DF-WINDOW-Q-CTOR-QUALIFIED, path: '${{ runner.temp }}/input'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34804463514, name: Stage9.1-UNITY-MANAGED-REFS-2022.3.44f1c1, path: '${{ runner.temp }}/refs'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34173085137, pattern: GodsPVZ-ILSpyCmd-linux-x64, merge-multiple: true, path: '${{ runner.temp }}/ilspy'}
      - name: Qualify PathDataEditor ctor
        shell: bash
        run: bash Tools/Stage9PathDataEditorCtorQualify/run.sh "$RUNNER_TEMP/promotion" "$RUNNER_TEMP/input" "$RUNNER_TEMP/refs" "$RUNNER_TEMP/ilspy" "$RUNNER_TEMP/pathdataeditor-recovery"
      - uses: actions/upload-artifact@v4
        with: {name: Stage9.1-70AB-PATHDATAEDITOR-CTOR-QUALIFIED, path: '${{ runner.temp }}/pathdataeditor-recovery/evidence/', retention-days: 90}
