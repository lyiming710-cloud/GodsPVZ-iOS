name: Stage9.1 fe67 LevelItem ctor natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-fe67-levelitem-ctor-natural-runtime.yml','Tools/Stage9LevelItemRuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34988830454, name: Stage9.1-76C1-LEVELITEM-CTOR-QUALIFIED, path: '${{ runner.temp }}/stage9-levelitem/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-levelitem/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-levelitem/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-levelitem/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-levelitem-ctor.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = 'fe67249cf3bdb30b94aa44045548c3de5ce6861e7686c7acebd4c97e4a3ead7b'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "LEVELITEM_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "LEVELITEM_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-levelitem" "$LEVELITEM_CANDIDATE" "$LEVELITEM_SHA"
      - name: Audit LevelItem natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-levelitem/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9LevelItemRuntimeAudit/audit.py "$LOG" "$LEVELITEM_SHA" | tee "$E/levelitem-ctor-natural-runtime-audit.txt"
          python3 Tools/Stage9RuntimeTriage/first-invalid.py "$LOG" | tee "$E/first-invalid-triage.txt"
      - name: Upload LevelItem natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-FE67-LEVELITEM-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-levelitem/evidence/', retention-days: 90}
