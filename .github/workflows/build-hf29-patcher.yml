name: Build HF29 projectile zombie collision patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF29Patch/**'
      - '.github/workflows/build-hf29-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF29 patcher
        run: dotnet publish Tools/HF29Patch/HF29Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf29
      - name: Smoke test
        run: |
          chmod +x out/hf29/GodsPVZ.HF29Patch
          set +e
          out/hf29/GodsPVZ.HF29Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf29/GodsPVZ.HF29Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF29Patch-linux-x64
          path: out/hf29
          if-no-files-found: error
