name: Stage9.1 5140 Row ctor PC-native repair gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-5140-rowctor-native-gate.yml'
      - 'Tools/Stage9RowCtorPatch/**'
permissions:
  contents: read
  actions: read
jobs:
  rowctor-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download exact 5140 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34746075356
          pattern: Stage9.1-d5f0-MAPCTOR
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-rowctor/input
      - name: Download fixed ILSpy
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34173085137
          pattern: GodsPVZ-ILSpyCmd-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-rowctor/ilspy
      - name: Apply exact PC-native-backed repair
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-rowctor"; E="$OUT/evidence"; mkdir -p "$E"
          IN="$OUT/input/GodsPVZRuntime1-mapctor.dll"; DLL="$OUT/GodsPVZRuntime1-rowctor.dll"
          [ "$(sha256sum "$IN"|awk '{print $1}')" = '51407d61b6850d73fe56cbe8f4bb3a264b5b05ac1211a7e60a712f34454988c4' ] || exit 61
          dotnet build Tools/Stage9RowCtorPatch/Stage9RowCtorPatch.csproj -c Release --nologo
          dotnet run --project Tools/Stage9RowCtorPatch/Stage9RowCtorPatch.csproj -c Release --no-build -- "$IN" "$DLL" | tee "$E/patch.log"
          grep -q '^TARGET_METHOD token=0x06000292 ' "$E/patch.log"
          grep -q '^NATIVE_AUTHORITY token=0x06000292 address=0x000000018033DEB0 function_end=0x000000018033E075 gameassembly_sha256=9ebd7ca996a5b03fb4a766f7a2502b660d581ddbbb36af4d7bf2f06a211da39d metadata_sha256=ad992341add498bd1018ac980f42171e0737b0793bf945c8714ad70a445b36b9$' "$E/patch.log"
          grep -Fq 'PATCH_ROW_CTOR gridY=arg; grids=new List<Grid>(); while(Count<mapX){idx=Count; Grid(0,idx); state=Null; plants=null; gridX=idx; gridY=arg; Add(!0);} EnemyType=0 private_list_fields=0' "$E/patch.log"
          grep -q '^REOPEN_ROW_CTOR_PASS locals=2 count_calls=2 add_signature=!0 grid_ctor=1 private_list_fields=0 token=0x06000292$' "$E/patch.log"
          grep -q '^SEMANTIC_ISOLATION_PASS untouched_methods=2316 changed_methods=1$' "$E/patch.log"
          sha256sum "$DLL" | tee "$E/output-candidate.sha256"
          cp "$DLL" "$E/"
          cp Tools/Stage9RowCtorPatch/Evidence.md "$E/PC-native-evidence.md"
      - name: Independent ILSpy validation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-rowctor"; E="$OUT/evidence"; DLL="$OUT/GodsPVZRuntime1-rowctor.dll"
          ILSPY="$(find "$OUT/ilspy" -type f -name ilspycmd | head -1)"; DOTNET_BIN="$(find "$OUT/ilspy" -type f -path '*/ilspy-runtime/dotnet' | head -1)"
          chmod +x "$ILSPY" "$DOTNET_BIN"; export DOTNET_ROOT="$(dirname "$DOTNET_BIN")"; export PATH="$DOTNET_ROOT:$PATH"
          "$ILSPY" -t Row "$DLL" > "$E/Row.cs" 2> "$E/Row.stderr"; test ! -s "$E/Row.stderr"
          "$ILSPY" -il -t Row "$DLL" > "$E/Row.il" 2> "$E/Row-il.stderr"; test ! -s "$E/Row-il.stderr"
          python3 - "$E/Row.cs" "$E/Row.il" "$E/RowCtor.cs" "$E/RowCtor.il" <<'PY'
          from pathlib import Path
          import sys
          cs=Path(sys.argv[1]).read_text(); il=Path(sys.argv[2]).read_text()
          cstart=cs.index('public Row(int mapX, int gridY)')
          b=cs.index('{',cstart); d=0; cend=None
          for i in range(b,len(cs)):
              if cs[i]=='{': d+=1
              elif cs[i]=='}':
                  d-=1
                  if d==0: cend=i+1; break
          assert cend
          cm=cs[cstart:cend]
          iend=il.index('} // end of method Row::.ctor')
          istart=il.rfind('.method',0,iend)
          assert istart >= 0
          im=il[istart:iend]
          Path(sys.argv[3]).write_text(cm); Path(sys.argv[4]).write_text(im)
          for bad in ('Invalid IL','Expected O, but got','._size','._version','._items','AddWithResize'):
              assert bad not in cm and bad not in im, bad
          assert 'new List<Grid>()' in cm
          assert 'System.Collections.Generic.List`1<class Grid>::Add(!0)' in im
          assert 'System.Collections.Generic.List`1<class Grid>::Add(class Grid)' not in im
          assert im.count('::get_Count()') == 2
          assert 'Grid::.ctor(int32, int32)' in im
          for field in ('Grid::gridState','Grid::plant_bottom','Grid::plant_common','Grid::plant_sheath','Grid::plant_top','Grid::gridX','Grid::gridY','Row::EnemyType'):
              assert field in im, field
          print('ILSPY_ROW_CTOR_PASS count_calls=2 add_signature=!0 grid_ctor=1 private_list_fields=0')
          PY
      - name: Upload evidence and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-5140-ROWCTOR
          path: ${{ runner.temp }}/stage9-rowctor/evidence/
          if-no-files-found: error
          retention-days: 90
