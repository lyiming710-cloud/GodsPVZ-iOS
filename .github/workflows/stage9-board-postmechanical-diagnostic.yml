name: Stage9.1 Board post-mechanical managed diagnostic

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-board-postmechanical-diagnostic.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare R3 and exact post-mechanical DLL
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/board-postdiag"; E="$OUT/evidence"; mkdir -p "$OUT/parts" "$OUT/r3" "$E"
          python3 -m pip install --disable-pip-version-check -q gdown==5.2.0
          cat > "$OUT/parts.tsv" <<'EOF'
          00	111hFaHbkXIkSyRoAEdushS_qZ5sPFqUI	e024b6d534a6eace43694a506ce8636c56ed17e8c21bde3bba61caab3d3bdf7a
          01	1nYIm3Bk9yxckfbwVlk6ijSUcaid6aorm	1c10d0d87be6b65c3dfd0424e38515b53a8dd1158c5734b4397f2072e5004bb2
          02	1Y9pMN1FvEpXTFzoKWAx3frra-1-O4s-y	4943615fc153ff8539ab44818dde6981a16758a2c53184a858867d4932edd9c2
          03	1I3yfH8qb4nrAvEErO-KaZLX4Ds77x_5C	f8573c2ef3db3d65de3cb3b98f0892e633cdf89d499bde2d509b36f88306331f
          04	1QUYoGuNGP83hTo6_hoeKlosAonRJCJ-n	3dc6a03ebb4a7bbd48f652b0c468911d6985f76f48c6ded991d40d1c9b7593bc
          05	1Dp8BsTeRmJ9K2yni834KMrxN_Zp18Pe2	13284c2cd74583ccdd63cf6b736dcca443acbf6bda4c25d4b65193fc08c09263
          06	1pfqVCotdu3GMYp8Vl1Bbxp7ls8SPGLsW	d35ba0e632125749f581ad57cf950d8c6b264f9f4882a08adb9ca227f6b6e23c
          07	1fgUDh-crdy3oNjYAwGr50kdAY7BTwF2J	0c9443797e24ddca500a54a21955e27fd2cb995ec7924147e7f5c244859c07ec
          08	1mhL4lliMszPy7ITjfAlSkKQEh19UjhAu	30c9a5330cdece142938150311e8acb87d00d48ab057aa39a2128a3fffdcece8
          09	12sojmPtnZPiWmnyfW-c5MhQjvR2DZMJg	46bca3df6cbfc11f155038470a39b705bb028fa7a0e9f9eb3ba4810c06d5058a
          10	1P-vcBUiPmSH3gR3l_zkgjA63J8UnsVpG	3c8e312e65a72ac3072233f558b4d43970b3a4e521139d03328e9c27ec41d994
          11	1EGPUP5nBjKqvIMft0TAQXvgqpxSVpsyI	dc3d7aa732a19f237e5e72aa6f1e768c10bd360bc6fc832d29b9afc7489da325
          EOF
          while IFS=$'\t' read -r idx fid sha; do f="$OUT/parts/r3.$idx.part"; python3 -m gdown --id "$fid" --output "$f" --quiet; [ "$(sha256sum "$f"|awk '{print $1}')" = "$sha" ]; done < "$OUT/parts.tsv"
          cat "$OUT/parts"/*.part > "$OUT/r3.tar.zst"; [ "$(sha256sum "$OUT/r3.tar.zst"|awk '{print $1}')" = d4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc ]
          zstd -dc "$OUT/r3.tar.zst" | tar -xf - -C "$OUT/r3"; rm -rf "$OUT/parts" "$OUT/r3.tar.zst"
          DLL="$OUT/r3/UnityProject-AssetRipper-2.0.0/ExportedProject/Assets/Plugins/Assembly-CSharp.dll"
          [ "$(sha256sum "$DLL"|awk '{print $1}')" = dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655 ]
          echo "$DLL" > "$OUT/base.txt"

      - name: Download patchers
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34689491315
          pattern: GodsPVZ-HF56Patch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/board-postdiag/p56
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34690940527
          pattern: GodsPVZ-HF57Patch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/board-postdiag/p57
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34699623218
          pattern: GodsPVZ-Stage9BoardMechanicalPatch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/board-postdiag/pb

      - name: Construct exact target
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/board-postdiag"; E="$OUT/evidence"; BASE="$(cat "$OUT/base.txt")"
          P56="$(find "$OUT/p56" -name GodsPVZ.HF56Patch -type f|head -1)"; P57="$(find "$OUT/p57" -name GodsPVZ.HF57Patch -type f|head -1)"; PB="$(find "$OUT/pb" -name GodsPVZ.Stage9BoardMechanicalPatch -type f|head -1)"; chmod +x "$P56" "$P57" "$PB"
          "$P56" "$BASE" "$OUT/hf56.dll" >/dev/null; "$P57" "$OUT/hf56.dll" "$OUT/hf57.dll" >/dev/null
          cp "$OUT/hf57.dll" "$OUT/integrated.dll"
          python3 - "$OUT/integrated.dll" <<'PY'
          import hashlib,sys
          from pathlib import Path
          p=Path(sys.argv[1]); b=bytearray(p.read_bytes()); assert hashlib.sha256(b).hexdigest()=='a699e0f3e812ae1dcd7e1f7d60b7757f958e498626c6a39e43f9984ebe55e38b'
          for o in [0x9f3d6,0x9f3e3,0x9f3f1,0x9f3ff,0x9f412,0x9f41c,0x9f446]: assert bytes(b[o:o+4])==bytes.fromhex('fe0c0000'); b[o+1]=0x0d
          for o,old,new in [(0xde448,b'Assembly-CSharp.dll',b'GodsPVZRuntime1.dll'),(0xe0137,b'Assembly-CSharp',b'GodsPVZRuntime1')]: assert bytes(b[o:o+len(old)])==old; b[o:o+len(old)]=new
          p.write_bytes(b); assert hashlib.sha256(b).hexdigest()=='e49557eeb620c2d3be38aaf9c399a10978740e0a26dd8d0b0f8a190b12b8b568'
          PY
          "$PB" "$OUT/integrated.dll" "$OUT/postmechanical.dll" > "$E/mechanical.log"
          [ "$(sha256sum "$OUT/postmechanical.dll"|awk '{print $1}')" = 00ba34c43e08c73c3cc8a39e0bf7f0d35fd280e360dd8a2907e9304d93343980 ]

      - name: Build and run Cecil analyzer
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/board-postdiag"; E="$OUT/evidence"; D="$OUT/diag"; mkdir -p "$D"
          cat > "$D/Diag.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup><ItemGroup><PackageReference Include="Mono.Cecil" Version="0.11.6" /></ItemGroup></Project>
          EOF
          cat > "$D/Program.cs" <<'EOF'
          using Mono.Cecil; using Mono.Cecil.Cil;
          class Program {
            static IEnumerable<TypeDefinition> All(IEnumerable<TypeDefinition> xs){foreach(var t in xs){yield return t;foreach(var n in All(t.NestedTypes))yield return n;}}
            static string O(object? o)=>o switch{null=>"",Instruction x=>$"IL_{x.Offset:X4}",Instruction[] a=>string.Join(",",a.Select(x=>$"IL_{x.Offset:X4}")),IMetadataTokenProvider x=>$"{x} [0x{x.MetadataToken.ToUInt32():X8}]",_=>o.ToString()??""};
            static void Dump(StreamWriter w,MethodDefinition m){w.WriteLine($"METHOD 0x{m.MetadataToken.ToUInt32():X8} {m.FullName} MAX={m.Body.MaxStackSize} SIZE={m.Body.CodeSize}");foreach(var v in m.Body.Variables)w.WriteLine($" LOCAL V_{v.Index} {v.VariableType.FullName}");foreach(var i in m.Body.Instructions)w.WriteLine($" IL_{i.Offset:X4}: {i.OpCode,-12} {O(i.Operand)}");w.WriteLine();}
            static void Main(string[] a){using var md=ModuleDefinition.ReadModule(a[0],new ReaderParameters{InMemory=true,ReadingMode=ReadingMode.Immediate});using var w=new StreamWriter(a[1]);var ms=All(md.Types).SelectMany(t=>t.Methods).ToList();w.WriteLine($"METHODS={ms.Count} MVID={md.Mvid}");
              var ht=All(md.Types).FirstOrDefault(t=>t.FullName=="Cpp2ILInjected.Cpp2ILHelpers");w.WriteLine($"HELPER_TYPE present={ht!=null} token={(ht==null?"":$"0x{ht.MetadataToken.ToUInt32():X8}")} base={ht?.BaseType?.FullName}");if(ht!=null)foreach(var hm in ht.Methods)w.WriteLine($" HELPER_METHOD 0x{hm.MetadataToken.ToUInt32():X8} {hm.FullName}");
              int hc=0,adj=0,unsafeTarget=0;var bad=new List<string>();
              foreach(var m in ms.Where(x=>x.HasBody)){var targets=new HashSet<Instruction>();foreach(var i in m.Body.Instructions){if(i.Operand is Instruction q)targets.Add(q);else if(i.Operand is Instruction[] aa)foreach(var q2 in aa)targets.Add(q2);}foreach(var eh in m.Body.ExceptionHandlers){foreach(var q in new[]{eh.TryStart,eh.TryEnd,eh.HandlerStart,eh.HandlerEnd,eh.FilterStart})if(q!=null)targets.Add(q);}for(int j=0;j<m.Body.Instructions.Count;j++){var i=m.Body.Instructions[j];if(i.Operand is MethodReference mr && mr.DeclaringType.FullName=="Cpp2ILInjected.Cpp2ILHelpers"){hc++;var p=j>0?m.Body.Instructions[j-1]:null;bool ok=p!=null&&p.OpCode.Code==Code.Ldstr&&mr.Name=="NoteDecompilerIssue"&&mr.Parameters.Count==1&&mr.Parameters[0].ParameterType.FullName=="System.String";if(ok)adj++;bool targeted=targets.Contains(i)||(p!=null&&targets.Contains(p));if(targeted)unsafeTarget++;if(!ok||targeted)bad.Add($"0x{m.MetadataToken.ToUInt32():X8} {m.FullName} IL_{i.Offset:X4} prev={(p==null?"NONE":p.OpCode.Code.ToString())} targeted={targeted}");}}
              }w.WriteLine($"HELPER_CALLS total={hc} adjacent_ldstr={adj} branch_or_eh_target={unsafeTarget}");foreach(var s in bad.Take(200))w.WriteLine(" HELPER_BAD "+s);
              w.WriteLine("=== GENERIC ADD REFS ===");foreach(var m in ms.Where(x=>x.HasBody)){foreach(var i in m.Body.Instructions){if(i.Operand is MethodReference mr && mr.Name=="Add" && mr.DeclaringType is GenericInstanceType gi){string resolved;try{resolved=mr.Resolve()?.FullName??"<null>";}catch(Exception e){resolved=$"ERR:{e.GetType().Name}:{e.Message}";}w.WriteLine($"0x{m.MetadataToken.ToUInt32():X8} {m.FullName} IL_{i.Offset:X4} REF=0x{mr.MetadataToken.ToUInt32():X8} DECL={gi.FullName} ARGS=[{string.Join(",",gi.GenericArguments.Select(x=>x.FullName))}] PARAMS=[{string.Join(",",mr.Parameters.Select(x=>x.ParameterType.FullName))}] RESOLVE={resolved}");}}}
              string[] types={"BoardManager","ResourceManager","InternalResourceLoader","SeedChooserScreen","PrepareUIController","Button_z"};string[] names={"Awake",".ctor","Ininitialize","Load_boardPrefabs","Load"};w.WriteLine("=== TARGET METHODS ===");foreach(var m in ms.Where(x=>x.HasBody&&types.Contains(x.DeclaringType.Name)&&names.Contains(x.Name)))Dump(w,m);
              w.WriteLine("=== METHODS USING ParticleState Dictionary.Add ===");foreach(var m in ms.Where(x=>x.HasBody)){if(m.Body.Instructions.Any(i=>i.Operand is MethodReference mr&&mr.Name=="Add"&&mr.DeclaringType.FullName.Contains("Dictionary`2<ParticleState,UnityEngine.GameObject>")))Dump(w,m);}
            }
          }
          EOF
          dotnet run --project "$D/Diag.csproj" -c Release -- "$OUT/postmechanical.dll" "$E/postmechanical-diagnostic.txt"
          grep -E '^HELPER_|^0x.*GENERIC|List`1<Board>|Dictionary`2<ParticleState|^METHOD 0x.*(BoardManager|ResourceManager|InternalResourceLoader|SeedChooserScreen|PrepareUIController|Button_z)' "$E/postmechanical-diagnostic.txt" | head -300 || true

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-Board-postmechanical-managed-diagnostic
          path: ${{ runner.temp }}/board-postdiag/evidence/
          if-no-files-found: error
          retention-days: 90
