name: Watch Stage9.1 run 35412031380 failure diagnostics

on:
  push:
    branches: [stage9-admin-start-static]
    paths:
      - .github/workflows/stage9-watch-run-35363783833-failure-diagnostics.yml

permissions:
  actions: read
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPORT_RUN_ID: '35412031380'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage9-admin-start-static

      - name: Wait and capture compact diagnostics only on failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 420); do
            STATUS="$(gh run view "$EXPORT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
            if [ "$STATUS" = completed ]; then
              CONCLUSION="$(gh run view "$EXPORT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
              echo "export_run_id=$EXPORT_RUN_ID conclusion=$CONCLUSION"
              if [ "$CONCLUSION" = success ]; then
                echo 'No failure diagnostics required.'
                exit 0
              fi
              break
            fi
            sleep 15
          done

          rm -rf evidence
          mkdir -p evidence diagnostics
          gh run download "$EXPORT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            -n Stage9.1-CURRENT-BASELINE-IOS-XCODE-EVIDENCE -D evidence

          python3 - <<'PY'
          from pathlib import Path
          import re
          run='35412031380'
          root=Path('evidence')
          out=Path('diagnostics/run-35412031380-fatal.txt')
          candidates=['package-migration.log','ios-export.log','ios-export.stdout','ios-export.stderr','ios-export-exit.txt']
          rx=re.compile(r'STAGE9_IOS_DLL_REPAIR|STAGE9_IOS_DLL_KIND|STAGE9_IOS_STRIPPING|Fatal error in Unity CIL Linker|ILLink: error|UnityLinker|IL2CPP|DataModel|ReferencesCollector|AddGenericParameter|NullReferenceException|AggregateException|UnityTypeReferenceStep|ResolveFromAssemblyStep|ProcessExecutable|UnresolvedStubMarking|ManagedStripped|Tundra build failed|BuildFailedException|Player build failed|MissingReferenceException|TMP_PreBuildProcessor|error CS|Exception:|iOS Unity build failed',re.I)
          with out.open('w',encoding='utf-8') as f:
              f.write(f'run_id={run}\n')
              for name in candidates:
                  p=root/name
                  f.write(f'\n=== {name} exists={p.exists()} ===\n')
                  if not p.exists(): continue
                  lines=p.read_text(errors='replace').splitlines()
                  hits=[i for i,l in enumerate(lines) if rx.search(l)]
                  f.write(f'lines={len(lines)} material_hits={len(hits)}\n')
                  keep=set()
                  for i in hits[-40:]:
                      for j in range(max(0,i-12),min(len(lines),i+45)): keep.add(j)
                  for j in range(max(0,len(lines)-100),len(lines)): keep.add(j)
                  last=-2
                  for i in sorted(keep):
                      if i>last+1: f.write(f'\n--- gap; resume {i+1} ---\n')
                      s=lines[i]
                      if len(s)>1000: s=s[:1000]+' ... [LONG LINE OMITTED]'
                      f.write(f'{i+1}: {s}\n')
                      last=i
          print(out)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/run-35412031380-fatal.txt
          git commit -m 'diagnostics: capture run 35412031380 failure' || exit 0
          git push origin HEAD:stage9-admin-start-static
