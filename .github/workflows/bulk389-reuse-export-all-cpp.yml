name: Bulk389 frozen export ALL generated C++ audit (no Unity)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  all_cpp:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select exact Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 39988665189
          name: GodsPVZ-Stage9-bulk389-unsigned-Xcode
          path: ${{ runner.temp }}/frozen-xcode-input
      - name: Restore hash-locked successful Unity export only
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/frozen-xcode-input/GodsPVZ-Stage9-bulk389-unsigned-Xcode.tar.zst"
          [ "$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')" = '93d32bb83a6d93b1c9d8a490bf057db7cfe2e35dad1219ab4924b6ec38538e04' ]
          command -v zstd >/dev/null || brew install zstd
          mkdir -p "$RUNNER_TEMP/frozen-export"
          zstd -dc "$ARCHIVE" | tar -xf - -C "$RUNNER_TEMP/frozen-export"
      - name: Check Xcode clean using products inside DerivedData (no build)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-evidence"
          xcodebuild -project "$RUNNER_TEMP/frozen-export/xcode/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/audit-derived" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/audit-derived/Build/Products/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean > "$RUNNER_TEMP/audit-evidence/xcode-clean.log" 2>&1
      - name: Audit every generated CPP, including all generic and framework shards
        if: always() && steps.restore.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions/audit_bulk389_all_generated_cpp.py \
            --xcode-dir "$RUNNER_TEMP/frozen-export/xcode" \
            --output-dir "$RUNNER_TEMP/all-cpp-audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bulk389-ALL-GENERATED-CPP-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/all-cpp-audit/
            ${{ runner.temp }}/audit-evidence/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
