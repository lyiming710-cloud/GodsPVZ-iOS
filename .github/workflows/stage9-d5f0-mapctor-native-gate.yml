name: Stage9.1 d5f0 Map ctor PC-native repair gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-d5f0-mapctor-native-gate.yml'
      - 'Tools/Stage9MapCtorPatch/**'
permissions:
  contents: read
  actions: read
jobs:
  mapctor-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download exact d5f0 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34743951753
          pattern: Stage9.1-d651-BOARDNUMBER
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-mapctor/input
      - name: Download fixed ILSpy
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34173085137
          pattern: GodsPVZ-ILSpyCmd-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-mapctor/ilspy
      - name: Apply exact PC-native-backed repair
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-mapctor"; E="$OUT/evidence"; mkdir -p "$E"
          IN="$OUT/input/GodsPVZRuntime1-boardnumber.dll"; DLL="$OUT/GodsPVZRuntime1-mapctor.dll"
          [ "$(sha256sum "$IN"|awk '{print $1}')" = 'd5f010f3eb617f03534d9b56394dc10f14bd5e2cbbdd17baef8afc59c0cdd63b' ] || exit 61
          dotnet build Tools/Stage9MapCtorPatch/Stage9MapCtorPatch.csproj -c Release --nologo
          dotnet run --project Tools/Stage9MapCtorPatch/Stage9MapCtorPatch.csproj -c Release --no-build -- "$IN" "$DLL" | tee "$E/patch.log"
          grep -q '^TARGET_METHOD token=0x06000281 ' "$E/patch.log"
          grep -q '^NATIVE_AUTHORITY token=0x06000281 address=0x000000018032D290 function_end=0x000000018032D3FB gameassembly_sha256=9ebd7ca996a5b03fb4a766f7a2502b660d581ddbbb36af4d7bf2f06a211da39d metadata_sha256=ad992341add498bd1018ac980f42171e0737b0793bf945c8714ad70a445b36b9$' "$E/patch.log"
          grep -Fq 'PATCH_MAP_CTOR rows=new List<Row>(); while(rows.Count<mapY) rows.Add(new Row(mapX,rows.Count)); private_list_fields=0' "$E/patch.log"
          grep -q '^REOPEN_MAP_CTOR_PASS locals=0 count_calls=2 add_calls=1 private_list_fields=0 token=0x06000281$' "$E/patch.log"
          grep -q '^SEMANTIC_ISOLATION_PASS untouched_methods=2316 changed_methods=1$' "$E/patch.log"
          sha256sum "$DLL" | tee "$E/output-candidate.sha256"
          cp "$DLL" "$E/"
          cp Tools/Stage9MapCtorPatch/Evidence.md "$E/PC-native-evidence.md"
      - name: Independent ILSpy validation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-mapctor"; E="$OUT/evidence"; DLL="$OUT/GodsPVZRuntime1-mapctor.dll"
          ILSPY="$(find "$OUT/ilspy" -type f -name ilspycmd | head -1)"; DOTNET_BIN="$(find "$OUT/ilspy" -type f -path '*/ilspy-runtime/dotnet' | head -1)"
          chmod +x "$ILSPY" "$DOTNET_BIN"; export DOTNET_ROOT="$(dirname "$DOTNET_BIN")"; export PATH="$DOTNET_ROOT:$PATH"
          "$ILSPY" -t Map "$DLL" > "$E/Map.cs" 2> "$E/Map.stderr"; test ! -s "$E/Map.stderr"
          "$ILSPY" -il -t Map "$DLL" > "$E/Map.il" 2> "$E/Map-il.stderr"; test ! -s "$E/Map-il.stderr"
          python3 - "$E/Map.cs" "$E/Map.il" "$E/MapCtor.cs" "$E/MapCtor.il" <<'PY'
          from pathlib import Path
          import sys
          cs=Path(sys.argv[1]).read_text(); il=Path(sys.argv[2]).read_text()
          cstart=cs.index('public Map(int mapX, int mapY)')
          b=cs.index('{',cstart); d=0; cend=None
          for i in range(b,len(cs)):
              if cs[i]=='{': d+=1
              elif cs[i]=='}':
                  d-=1
                  if d==0: cend=i+1; break
          assert cend
          cm=cs[cstart:cend]
          iend=il.index('} // end of method Map::.ctor')
          istart=il.rfind('.method',0,iend)
          assert istart >= 0
          im=il[istart:iend]
          Path(sys.argv[3]).write_text(cm); Path(sys.argv[4]).write_text(im)
          for bad in ('Invalid IL','Expected O, but got','Method not found @180302170','._size','._version','._items','AddWithResize'):
              assert bad not in cm and bad not in im, bad
          assert 'new List<Row>()' in cm
          assert 'rows.Count < mapY' in cm
          assert 'rows.Add(new Row(mapX, rows.Count))' in cm
          assert im.count('::get_Count()') == 2
          assert 'System.Collections.Generic.List`1<class Row>::Add(!0)' in im or 'System.Collections.Generic.List`1<class Row>::Add(class Row)' in im
          assert 'Row::.ctor(int32, int32)' in im
          assert 'System.Object::.ctor()' in im
          print('ILSPY_MAP_CTOR_PASS count_calls=2 add=1 row_ctor=1 private_list_fields=0')
          PY
      - name: Upload evidence and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-d5f0-MAPCTOR
          path: ${{ runner.temp }}/stage9-mapctor/evidence/
          if-no-files-found: error
          retention-days: 90
