name: Stage9.1 4110 Board plant detail LoadData static gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-4110-load-data-static-gate.yml'
      - 'Tools/Stage9BoardPlantDetailLoadDataPatch/**'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download runtime-qualified 4110 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34834962528
          name: Stage9.1-273D-PLANT-DETAIL-LOAD-SKILL-LOGO-STATIC
          path: ${{ runner.temp }}/input
      - name: Build and recover Board plant detail LoadData
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/load-data"; E="$O/evidence"; mkdir -p "$E"
          IN=$(find "$RUNNER_TEMP/input" -type f -name 'GodsPVZRuntime1-plant-detail-load-skill-logo.dll' -print -quit)
          test -n "$IN"
          test "$(sha256sum "$IN"|awk '{print $1}')" = '4110588321372dd0c388f69485bcbdca6f908136c377d65d8903fe657c1e5035'
          OUT="$O/GodsPVZRuntime1-board-plant-detail-load-data.dll"
          dotnet build Tools/Stage9BoardPlantDetailLoadDataPatch/Stage9BoardPlantDetailLoadDataPatch.csproj -c Release --nologo
          dotnet run --project Tools/Stage9BoardPlantDetailLoadDataPatch/Stage9BoardPlantDetailLoadDataPatch.csproj -c Release --no-build -- "$IN" "$OUT" | tee "$E/patch.log"
          grep -q '^NATIVE_AUTHORITY target_token=0x060005E1 rid=1505 method_pointer_entry=0x181B85C60 va=0x180398B90 next_method_va=0x1803992F0 span_bytes=1888 native_span_sha256=24d71c446fd08dfa73dc6551d29431b1fa4bb62af348e224e4adf60f7165a898$' "$E/patch.log"
          grep -Fq 'NATIVE_SEMANTICS level=plant.level hp_fill_clamp=1 hp_text_truncate=1 atk_arm_def=1 clique_logo=1 skill_logo_id=skill.ID+3*plant.ID skill_data=1 characteristic=1 talents_exact3=1 stars_active_i_lt_plant.stars=1' "$E/patch.log"
          grep -q '^CLR_ACCESS_ADAPTATION pc_native_List_size_read=1 managed_List_Count=1 field_metadata_changed=0 list_mutation=0$' "$E/patch.log"
          grep -q '^REOPEN_LOAD_DATA_PASS token=0x060005E1 .*object_locals=0 private_List_size_refs=0 Plant_level_refs=1 List_Count_calls=1 LoadSkillLogo_calls=1 LoadSkillData_calls=1 truncate_calls=2 SetText_calls=8 SetActive_calls=1$' "$E/patch.log"
          grep -q '^SEMANTIC_ISOLATION_PASS untouched_methods=2316 changed_methods=1 target=0x060005E1$' "$E/patch.log"
          grep -q '^FIELD_METADATA_ISOLATION_PASS unchanged_fields=2802 changed_fields=0$' "$E/patch.log"
          grep -q '^PRESERVATION_PASS batch1=4 plant_ctor=1 projectile_ctor=1 projectile_hf21=2 managers=2 plant_detail_initialize=1 load_skill_logo=1$' "$E/patch.log"
          grep -q '^PATCH_LOAD_DATA method_body_changes=1 pc_native_semantics=1 private_List_size_removed=1 object_arithmetic_removed=1 metadata_visibility_changes=0$' "$E/patch.log"
          sha256sum "$OUT" | tee "$E/output-candidate.sha256"
          cp "$OUT" "$E/"
          cp Tools/Stage9NativeProbe/Board_PlantDetail_PlantData.LoadData.native-evidence.md "$E/"
      - name: Upload static candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-4110-BOARD-PLANT-DETAIL-LOAD-DATA-STATIC
          path: ${{ runner.temp }}/load-data/evidence/
          if-no-files-found: warn
          retention-days: 90
