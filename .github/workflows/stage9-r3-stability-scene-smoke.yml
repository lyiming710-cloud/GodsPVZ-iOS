name: Stage9.1 R3 stability and scene smoke

on:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-r3-stability-scene-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r3-stability-scene-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-r3-smoke"
          EVIDENCE="$OUT/evidence"
          mkdir -p "$EVIDENCE"
          [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ] || exit 61

      - name: Download and verify formal R3
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-r3-smoke"
          EVIDENCE="$OUT/evidence"
          PARTS="$OUT/r3-parts"
          ROOT="$OUT/r3"
          mkdir -p "$PARTS" "$ROOT"
          python3 -m pip install --disable-pip-version-check -q gdown==5.2.0
          cat > "$OUT/r3-parts.tsv" <<'EOF'
          00	111hFaHbkXIkSyRoAEdushS_qZ5sPFqUI	e024b6d534a6eace43694a506ce8636c56ed17e8c21bde3bba61caab3d3bdf7a	67108864
          01	1nYIm3Bk9yxckfbwVlk6ijSUcaid6aorm	1c10d0d87be6b65c3dfd0424e38515b53a8dd1158c5734b4397f2072e5004bb2	67108864
          02	1Y9pMN1FvEpXTFzoKWAx3frra-1-O4s-y	4943615fc153ff8539ab44818dde6981a16758a2c53184a858867d4932edd9c2	67108864
          03	1I3yfH8qb4nrAvEErO-KaZLX4Ds77x_5C	f8573c2ef3db3d65de3cb3b98f0892e633cdf89d499bde2d509b36f88306331f	67108864
          04	1QUYoGuNGP83hTo6_hoeKlosAonRJCJ-n	3dc6a03ebb4a7bbd48f652b0c468911d6985f76f48c6ded991d40d1c9b7593bc	67108864
          05	1Dp8BsTeRmJ9K2yni834KMrxN_Zp18Pe2	13284c2cd74583ccdd63cf6b736dcca443acbf6bda4c25d4b65193fc08c09263	67108864
          06	1pfqVCotdu3GMYp8Vl1Bbxp7ls8SPGLsW	d35ba0e632125749f581ad57cf950d8c6b264f9f4882a08adb9ca227f6b6e23c	67108864
          07	1fgUDh-crdy3oNjYAwGr50kdAY7BTwF2J	0c9443797e24ddca500a54a21955e27fd2cb995ec7924147e7f5c244859c07ec	67108864
          08	1mhL4lliMszPy7ITjfAlSkKQEh19UjhAu	30c9a5330cdece142938150311e8acb87d00d48ab057aa39a2128a3fffdcece8	67108864
          09	12sojmPtnZPiWmnyfW-c5MhQjvR2DZMJg	46bca3df6cbfc11f155038470a39b705bb028fa7a0e9f9eb3ba4810c06d5058a	67108864
          10	1P-vcBUiPmSH3gR3l_zkgjA63J8UnsVpG	3c8e312e65a72ac3072233f558b4d43970b3a4e521139d03328e9c27ec41d994	67108864
          11	1EGPUP5nBjKqvIMft0TAQXvgqpxSVpsyI	dc3d7aa732a19f237e5e72aa6f1e768c10bd360bc6fc832d29b9afc7489da325	48568114
          EOF
          while IFS=$'\t' read -r idx fid sha size; do
            f="$PARTS/r3.${idx}.part"
            python3 -m gdown --id "$fid" --output "$f" --quiet
            [ "$(sha256sum "$f" | awk '{print $1}')" = "$sha" ] || exit 62
            [ "$(stat -c %s "$f")" = "$size" ] || exit 63
          done < "$OUT/r3-parts.tsv"
          ARCHIVE="$OUT/r3.tar.zst"
          cat "$PARTS"/*.part > "$ARCHIVE"
          [ "$(sha256sum "$ARCHIVE" | awk '{print $1}')" = 'd4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc' ] || exit 64
          [ "$(stat -c %s "$ARCHIVE")" = '786765618' ] || exit 65
          zstd -t "$ARCHIVE"
          zstd -dc "$ARCHIVE" | tar -xf - -C "$ROOT"
          rm -rf "$PARTS" "$ARCHIVE"
          PROJECT="$ROOT/UnityProject-AssetRipper-2.0.0/ExportedProject"
          [ -d "$PROJECT" ] || exit 66
          [ ! -d "$PROJECT/Library" ] || exit 67
          [ "$(sha256sum "$PROJECT/Assets/Plugins/Assembly-CSharp.dll" | awk '{print $1}')" = 'dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655' ] || exit 68
          grep -q '^  isExplicitlyReferenced: 1$' "$PROJECT/Assets/Plugins/Assembly-CSharp.dll.meta"
          printf '%s\n' "$PROJECT" > "$OUT/project-path.txt"
          echo R3_INPUT_PASS > "$EVIDENCE/r3-input-gate.txt"

      - name: Download preserved exact Editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-r3-smoke/editor-parts

      - name: Reconstruct exact Editor
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-r3-smoke"
          EVIDENCE="$OUT/evidence"
          PARTS="$OUT/editor-parts"
          EDITOR="$OUT/editor"
          mkdir -p "$EDITOR"
          cat > "$OUT/editor.sha256" <<'EOF'
          c2cb7252b28c99581fd1ebfa7bd0d63b82fbdfd66ed9323327560eab9f9c5b12  Unity-China-2022.3.44f1c1.tar.xz.part-00
          6f9af6d8bfae2d0dcb5482778fdb2ffee9bf8a4eb32b3030601d2d817eff5380  Unity-China-2022.3.44f1c1.tar.xz.part-01
          daf4e501efa59d388cec09fb1bb69fb71b074933c20389748fc1aaab5b4f1b6e  Unity-China-2022.3.44f1c1.tar.xz.part-02
          e8870b1b8ac3354302b3d4c7fa80a74249d3f2ca1d442a0fb978448ad2b7a586  Unity-China-2022.3.44f1c1.tar.xz.part-03
          115be82c7f103fd0888e28ee316c6cd1e877d4d14939388e3be40d877e8591d4  Unity-China-2022.3.44f1c1.tar.xz.part-04
          2efe6703f8a4b871275bde3c742c61d5b4a3322bb56fcbaf417cb9a80e90a97e  Unity-China-2022.3.44f1c1.tar.xz.part-05
          e7b300ff6e5639c0e5d6cbc065ec6918e4dc4d36ae8abab8f97c896af8b595f1  Unity-China-2022.3.44f1c1.tar.xz.part-06
          00f364a9e6619acd9ed466ae46055a9480d7c62a76914f713e69c3fa94abf151  Unity-China-2022.3.44f1c1.tar.xz.part-07
          0f7b8225b57960ba08b104f20869ce42707c17df290c143d4e3bd9dc3a26c0e2  Unity-China-2022.3.44f1c1.tar.xz.part-08
          6930abaf854320d200b069d135800fc310abcb0cb9a910e88ce68693e69a6d0a  Unity-China-2022.3.44f1c1.tar.xz.part-09
          47b0bb1451d33932ee9f56fea9f10d7ffbffd578b8105c212401119182c3d0f0  Unity-China-2022.3.44f1c1.tar.xz.part-10
          b5377382ceb94492a1c5288aee7c598f0495cfd108666ba2857059f6ecd92b7f  Unity-China-2022.3.44f1c1.tar.xz.part-11
          9d6c3a3e5c94104c783620c13095460638604f9ca92fb5017d1142970710e116  Unity-China-2022.3.44f1c1.tar.xz.part-12
          7541e40151f60c3882a82650595a4d9a97f2fdc2fe49469f440aef8f7996cc0a  Unity-China-2022.3.44f1c1.tar.xz.part-13
          c364240981c3a762bc3be6b61db0170bd7d168b3e7c3d14d48770e72e897e830  Unity-China-2022.3.44f1c1.tar.xz.part-14
          EOF
          (cd "$PARTS" && sha256sum -c "$OUT/editor.sha256") > "$EVIDENCE/editor-part-sha256-check.txt"
          [ "$(cat "$PARTS"/Unity-China-2022.3.44f1c1.tar.xz.part-* | sha256sum | awk '{print $1}')" = '0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14' ] || exit 70
          (for p in "$PARTS"/Unity-China-2022.3.44f1c1.tar.xz.part-*; do cat "$p"; rm -f "$p"; done) | xz -dc | tar -xf - -C "$EDITOR"
          UNITY="$EDITOR/Editor/Unity"
          chmod +x "$UNITY"
          VER="$("$UNITY" -version 2>&1)"
          printf '%s\n' "$VER" > "$EVIDENCE/unity-version.txt"
          printf '%s' "$VER" | grep -q '2022.3.44f1c1' || exit 71
          printf '%s\n' "$UNITY" > "$OUT/unity-path.txt"
          rm -rf "$PARTS"

      - name: Acquire Personal seat
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-r3-smoke"
          EVIDENCE="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          CLIENT="$(dirname "$UNITY")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          set +e
          "$CLIENT" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > "$OUT/activate.log" 2>&1
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$EVIDENCE/activation-exit.txt"
          [ "$RC" -eq 0 ] || exit 72
          echo ACQUIRED > "$OUT/seat-acquired.flag"

      - name: First import to populate Library
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-r3-smoke"
          EVIDENCE="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          PROJECT="$(cat "$OUT/project-path.txt")"
          set +e
          "$UNITY" -batchmode -nographics -quit -projectPath "$PROJECT" -logFile "$EVIDENCE/first-import.log"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$EVIDENCE/first-import-exit.txt"
          [ "$RC" -eq 0 ] || exit 73
          test -d "$PROJECT/Library"

      - name: Immediate second reopen stability gate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-r3-smoke"
          EVIDENCE="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          PROJECT="$(cat "$OUT/project-path.txt")"
          set +e
          "$UNITY" -batchmode -nographics -quit -projectPath "$PROJECT" -logFile "$EVIDENCE/second-reopen.log"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$EVIDENCE/second-reopen-exit.txt"
          [ "$RC" -eq 0 ] || exit 74
          python3 - "$EVIDENCE/first-import.log" "$EVIDENCE/second-reopen.log" "$EVIDENCE/import-stability.json" <<'PY'
          import json,re,sys
          def scan(path):
              lines=open(path,encoding='utf-8',errors='replace').read().splitlines()
              pats={
                'shader_not_found':re.compile(r"Shader '.*(?:fallback shader|dependency).*not found",re.I),
                'compile_errors':re.compile(r'\berror CS\d+\b|Scripts have compiler errors|Compilation failed',re.I),
                'missing_script':re.compile(r'referenced script .* is missing|The referenced script on this Behaviour',re.I),
                'exceptions':re.compile(r'\b(?:NullReferenceException|ArgumentException|InvalidOperationException)\b',re.I),
                'serialization_errors':re.compile(r'YAML parse error|SerializedFile.*error|PPtr.*failed',re.I),
              }
              return {k:sum(bool(p.search(x)) for x in lines) for k,p in pats.items()}
          a,b=scan(sys.argv[1]),scan(sys.argv[2])
          out={'first_import':a,'second_reopen':b,'shader_not_found_reduced_or_zero':b['shader_not_found']<=a['shader_not_found'],'second_blocking_zero':sum(v for k,v in b.items() if k!='shader_not_found')==0}
          open(sys.argv[3],'w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          if not out['second_blocking_zero']: raise SystemExit(75)
          PY

      - name: Install scene smoke harness into disposable copy
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-r3-smoke"
          EVIDENCE="$OUT/evidence"
          PROJECT="$(cat "$OUT/project-path.txt")"
          DIR="$PROJECT/Assets/__Stage9Validation/Editor"
          mkdir -p "$DIR"
          cat > "$DIR/Stage9SceneSmoke.cs" <<'CS'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using UnityEditor;
          using UnityEditor.SceneManagement;
          using UnityEngine;
          using UnityEngine.SceneManagement;

          [Serializable]
          public class Stage9SceneResult
          {
              public string path;
              public bool loaded;
              public int rootCount;
              public int gameObjectCount;
              public int componentSlots;
              public int missingScriptCount;
              public int rendererCount;
              public int rendererMaterialSlots;
              public int rendererNullMaterialSlots;
              public int rendererMissingShaderCount;
              public string error;
          }

          [Serializable]
          public class Stage9SceneReport
          {
              public bool pass;
              public string unityVersion;
              public List<Stage9SceneResult> scenes = new List<Stage9SceneResult>();
          }

          public static class Stage9SceneSmoke
          {
              static void Walk(GameObject go, Stage9SceneResult r)
              {
                  r.gameObjectCount++;
                  r.missingScriptCount += GameObjectUtility.GetMonoBehavioursWithMissingScriptCount(go);
                  var comps = go.GetComponents<Component>();
                  r.componentSlots += comps.Length;
                  var renderer = go.GetComponent<Renderer>();
                  if (renderer != null)
                  {
                      r.rendererCount++;
                      var mats = renderer.sharedMaterials;
                      r.rendererMaterialSlots += mats.Length;
                      foreach (var m in mats)
                      {
                          if (m == null) { r.rendererNullMaterialSlots++; continue; }
                          if (m.shader == null || m.shader.name == "Hidden/InternalErrorShader") r.rendererMissingShaderCount++;
                      }
                  }
                  foreach (Transform child in go.transform) Walk(child.gameObject, r);
              }

              public static void Run()
              {
                  var report = new Stage9SceneReport();
                  report.unityVersion = Application.unityVersion;
                  string[] paths = { "Assets/Scenes/MainMenu.unity", "Assets/Scenes/Board.unity" };
                  foreach (var path in paths)
                  {
                      var r = new Stage9SceneResult();
                      r.path = path;
                      try
                      {
                          Scene s = EditorSceneManager.OpenScene(path, OpenSceneMode.Single);
                          r.loaded = s.IsValid() && s.isLoaded;
                          var roots = s.GetRootGameObjects();
                          r.rootCount = roots.Length;
                          foreach (var go in roots) Walk(go, r);
                      }
                      catch (Exception ex)
                      {
                          r.error = ex.ToString();
                      }
                      report.scenes.Add(r);
                  }
                  report.pass = true;
                  foreach (var r in report.scenes)
                  {
                      if (!r.loaded || r.rootCount <= 0 || r.missingScriptCount != 0 || r.rendererMissingShaderCount != 0 || !string.IsNullOrEmpty(r.error)) report.pass = false;
                  }
                  string outPath = Environment.GetEnvironmentVariable("STAGE9_SCENE_SMOKE_OUT");
                  if (string.IsNullOrEmpty(outPath)) outPath = Path.Combine(Directory.GetCurrentDirectory(), "Stage9SceneSmoke.json");
                  File.WriteAllText(outPath, JsonUtility.ToJson(report, true));
                  if (!report.pass) throw new Exception("Stage9 scene smoke failed. See " + outPath);
              }
          }
          CS
          echo "$DIR/Stage9SceneSmoke.cs" > "$EVIDENCE/harness-path.txt"

      - name: Run scene-load smoke gate
        shell: bash
        env:
          STAGE9_SCENE_SMOKE_OUT: ${{ runner.temp }}/stage9-r3-smoke/evidence/scene-smoke.json
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-r3-smoke"
          EVIDENCE="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          PROJECT="$(cat "$OUT/project-path.txt")"
          set +e
          "$UNITY" -batchmode -nographics -quit -projectPath "$PROJECT" -executeMethod Stage9SceneSmoke.Run -logFile "$EVIDENCE/scene-smoke-editor.log"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$EVIDENCE/scene-smoke-exit.txt"
          [ "$RC" -eq 0 ] || exit 76
          test -s "$EVIDENCE/scene-smoke.json"
          python3 - "$EVIDENCE/scene-smoke.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); print(json.dumps(d,indent=2,sort_keys=True))
          if not d.get('pass'): raise SystemExit(77)
          if len(d.get('scenes',[]))!=2: raise SystemExit(78)
          for s in d['scenes']:
              if s.get('missingScriptCount')!=0 or s.get('rendererMissingShaderCount')!=0: raise SystemExit(79)
          PY

      - name: Verify generated package lock
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-r3-smoke"
          EVIDENCE="$OUT/evidence"
          PROJECT="$(cat "$OUT/project-path.txt")"
          python3 - "$PROJECT" "$EVIDENCE/package-lock-audit.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); lock=json.loads((p/'Packages/packages-lock.json').read_text())['dependencies']
          expected={
            'com.unity.2d.animation':'9.1.1','com.unity.2d.common':'8.0.2','com.unity.2d.sprite':'1.0.0','com.unity.burst':'1.8.9','com.unity.collections':'1.1.0','com.unity.ext.nunit':'1.0.6','com.unity.mathematics':'1.2.1','com.unity.render-pipelines.core':'14.0.11','com.unity.render-pipelines.universal':'14.0.11','com.unity.render-pipelines.universal-config':'14.0.10','com.unity.searcher':'4.9.2','com.unity.shadergraph':'14.0.11','com.unity.test-framework':'1.1.29','com.unity.textmeshpro':'3.0.6','com.unity.ugui':'1.0.0'}
          problems=[]; rows={}
          for name,version in expected.items():
              d=lock.get(name); pj=p/'Packages'/name/'package.json'
              pv=json.loads(pj.read_text()).get('version') if pj.exists() else None
              rows[name]={'lock_source':None if d is None else d.get('source'),'lock_depth':None if d is None else d.get('depth'),'package_json_version':pv}
              if d is None or d.get('source')!='embedded' or d.get('depth')!=0 or pv!=version: problems.append(name)
          result={'dependency_count':len(lock),'expected_embedded_count':len(expected),'packages':rows,'problems':problems,'pass':not problems}
          Path(sys.argv[2]).write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'dependency_count':len(lock),'problems':problems,'pass':not problems},indent=2))
          if problems: raise SystemExit(80)
          PY

      - name: Return Personal seat
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/stage9-r3-smoke"
          EVIDENCE="$OUT/evidence"
          if [ -f "$OUT/seat-acquired.flag" ] && [ -f "$OUT/unity-path.txt" ]; then
            UNITY="$(cat "$OUT/unity-path.txt")"
            CLIENT="$(dirname "$UNITY")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
            set +e
            "$CLIENT" --return-ulf > "$OUT/return.log" 2>&1
            RC=$?
            set -e
            printf '%s\n' "$RC" > "$EVIDENCE/license-return-exit.txt"
          fi

      - name: Upload stability and scene smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-R3-STABILITY-SCENE-SMOKE-evidence
          path: ${{ runner.temp }}/stage9-r3-smoke/evidence/
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
          compression-level: 6
