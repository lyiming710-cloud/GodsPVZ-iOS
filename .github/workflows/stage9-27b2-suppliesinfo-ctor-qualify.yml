name: Stage9.1 27b2 SuppliesInfo ctor qualify
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-27b2-suppliesinfo-ctor-qualify.yml','Tools/Stage9SuppliesInfoCtorQualify/**','Tools/Stage9SuppliesInfoCtorPatch/**','Tools/Stage9NativeProbe/SuppliesInfo.ctor.native-evidence.md']
permissions: {contents: read, actions: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34976200889, name: Stage9.1-27B2-SYSTEM3-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/promotion'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34976037423, name: Stage9.1-EF0E-SYSTEM3-CTOR-QUALIFIED, path: '${{ runner.temp }}/input'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34804463514, name: Stage9.1-UNITY-MANAGED-REFS-2022.3.44f1c1, path: '${{ runner.temp }}/refs'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34173085137, pattern: GodsPVZ-ILSpyCmd-linux-x64, merge-multiple: true, path: '${{ runner.temp }}/ilspy'}
      - name: Qualify SuppliesInfo ctor
        shell: bash
        run: bash Tools/Stage9SuppliesInfoCtorQualify/run.sh "$RUNNER_TEMP/promotion" "$RUNNER_TEMP/input" "$RUNNER_TEMP/refs" "$RUNNER_TEMP/ilspy" "$RUNNER_TEMP/suppliesinfo-recovery"
      - uses: actions/upload-artifact@v4
        with: {name: Stage9.1-27B2-SUPPLIESINFO-CTOR-QUALIFIED, path: '${{ runner.temp }}/suppliesinfo-recovery/evidence/', retention-days: 90}
