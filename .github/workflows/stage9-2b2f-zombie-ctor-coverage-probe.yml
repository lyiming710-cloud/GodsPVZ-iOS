name: Stage9.1 2b2f Zombie ctor coverage promotion probe

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-2b2f-zombie-ctor-coverage-probe.yml'
      - 'Tools/Stage9ZombieCtorRuntime/**'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24

      - name: Download runtime-qualified SkillProgress v2 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34922788006
          name: Stage9.1-4736-SKILLPROGRESS-V2-QUALIFIED
          path: ${{ runner.temp }}/stage9-zombie-ctor/candidate

      - name: Download exact cached R3 archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34747460206
          pattern: Stage9.1-r3-exact-archive
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-zombie-ctor/r3-cache

      - name: Download exact Unity editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-zombie-ctor/editor-parts

      - name: Resolve runtime-qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-zombie-ctor/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-skillprogress-v2.dll' -print -quit)
          test -n "$DLL"
          EXPECTED='2b2fdf165076ff9f48c577b84fb4c62346b78c925e46c6bff5f8ec6a79f67ce5'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$EXPECTED"
          echo "ZOMBIE_CTOR_INPUT=$DLL" >> "$GITHUB_ENV"
          echo "ZOMBIE_CTOR_INPUT_SHA=$EXPECTED" >> "$GITHUB_ENV"
          echo "COVERAGE_INPUT_SHA256 $EXPECTED"

      - name: Run one-launch Zombie ctor observation probe
        shell: bash
        run: |
          set -euo pipefail
          bash Tools/Stage9ZombieCtorRuntime/run-zombie-ctor-coverage.sh "$RUNNER_TEMP/stage9-zombie-ctor" "$ZOMBIE_CTOR_INPUT" "$ZOMBIE_CTOR_INPUT_SHA"

      - name: Audit target invocation and promote only observed ctor blocker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-zombie-ctor/evidence"; LOG="$E/playmode.log"
          test -f "$LOG"
          python3 - "$LOG" > "$E/zombie-ctor-coverage-audit.txt" <<'PY'
          from pathlib import Path
          import re,sys
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines(); text='\n'.join(lines)
          target=len(re.findall(r'InvalidProgramException: Invalid IL code in Zombie:\.ctor',text))
          corelib=text.count('System.Private.CoreLib')
          generic=sum('MissingMethodException' in x and 'System.Collections.Generic.List' in x for x in lines)
          markers=[x for x in lines if x.startswith('STAGE9_ZOMBIE_CTOR_')]
          print('ZOMBIE_CTOR_INVALID_IL_COUNT',target)
          print('CORELIB_TEXT_COUNT',corelib)
          print('GENERIC_LIST_MISSINGMETHOD_COUNT',generic)
          print('ZOMBIE_CTOR_MARKER_COUNT',len(markers)); [print(x) for x in markers]
          assert 'STAGE9_ZOMBIE_CTOR_INPUT runtime=1 zombieType=1' in markers,markers
          assert 'STAGE9_ZOMBIE_CTOR_METHOD ctor=1' in markers,markers
          assert any(x.startswith('STAGE9_ZOMBIE_CTOR_INVOKE ok=0') for x in markers),markers
          assert not any(x=='STAGE9_ZOMBIE_CTOR_INVOKE ok=1' for x in markers),markers
          assert target>0,target
          assert 'IL_0055: stfld' in text,text[-4000:]
          assert corelib==0,corelib
          assert generic==0,generic
          first=next(i for i,x in enumerate(lines) if 'InvalidProgramException: Invalid IL code in Zombie:.ctor' in x)
          print('=== ZOMBIE_CTOR_TARGET_EXCEPTION_CONTEXT ===')
          for j in range(max(0,first-6),min(len(lines),first+22)): print(f'{j+1}: {lines[j]}')
          print('ZOMBIE_CTOR_COVERAGE_PROMOTION_PASS target_invoked=1 direct_ctor_invoke=1 target_invalid_il_observed=1 expected_il_0055_stfld=1 runtime_base=2b2fdf165076ff9f48c577b84fb4c62346b78c925e46c6bff5f8ec6a79f67ce5')
          PY
          cat "$E/zombie-ctor-coverage-audit.txt"

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-ZOMBIE-CTOR-COVERAGE-PROMOTION
          path: ${{ runner.temp }}/stage9-zombie-ctor/evidence/
          retention-days: 90
