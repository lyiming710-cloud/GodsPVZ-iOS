name: Build HF23 zombie hurt patcher

on:
  push:
    branches: [ high-fidelity ]
    paths:
      - 'Tools/HF23Patch/**'
      - '.github/workflows/build-hf23-patcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF23 patcher
        run: dotnet publish Tools/HF23Patch/HF23Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out
      - name: Smoke test usage
        run: |
          set +e
          ./out/GodsPVZ.HF23Patch >/tmp/hf23.out 2>/tmp/hf23.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'Usage: GodsPVZ.HF23Patch' /tmp/hf23.err
          test -f out/GodsPVZ.HF23Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF23Patch-linux-x64
          path: out
          if-no-files-found: error
