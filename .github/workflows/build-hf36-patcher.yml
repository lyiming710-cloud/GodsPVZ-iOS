name: Build HF36 armored flag wake-up patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF36Patch/**'
      - '.github/workflows/build-hf36-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF36 patcher
        run: dotnet publish Tools/HF36Patch/HF36Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf36
      - name: Smoke test
        run: |
          chmod +x out/hf36/GodsPVZ.HF36Patch
          set +e
          out/hf36/GodsPVZ.HF36Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf36/GodsPVZ.HF36Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF36Patch-linux-x64
          path: out/hf36
          if-no-files-found: error
