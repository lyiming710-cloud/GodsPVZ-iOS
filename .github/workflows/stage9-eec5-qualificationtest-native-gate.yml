name: Stage9.1 eec5 QualificationTest PC-native repair gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-eec5-qualificationtest-native-gate.yml'
      - 'Tools/Stage9QualificationTestPatch/**'
permissions:
  contents: read
  actions: read
jobs:
  qualificationtest-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download exact eec5 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34738552282
          pattern: Stage9.1-1c8b-PLANTDATA-CLONEDATA
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-qualificationtest/input
      - name: Download fixed ILSpy
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34173085137
          pattern: GodsPVZ-ILSpyCmd-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-qualificationtest/ilspy
      - name: Apply exact PC-native-backed repair
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-qualificationtest"; E="$OUT/evidence"; mkdir -p "$E"
          IN="$OUT/input/GodsPVZRuntime1-plantdata-clonedata.dll"; DLL="$OUT/GodsPVZRuntime1-qualificationtest.dll"
          [ "$(sha256sum "$IN"|awk '{print $1}')" = 'eec540dd6c194fa9dc10d035c879c3e045476d873f39a4489f5006c28df77928' ] || exit 61
          dotnet build Tools/Stage9QualificationTestPatch/Stage9QualificationTestPatch.csproj -c Release --nologo
          dotnet run --project Tools/Stage9QualificationTestPatch/Stage9QualificationTestPatch.csproj -c Release --no-build -- "$IN" "$DLL" | tee "$E/patch.log"
          grep -q '^TARGET_METHOD token=0x06000148 ' "$E/patch.log"
          grep -q '^NATIVE_AUTHORITY token=0x06000148 address=0x000000018031BDD0 next=0x000000018031BF70 gameassembly_sha256=9ebd7ca996a5b03fb4a766f7a2502b660d581ddbbb36af4d7bf2f06a211da39d metadata_sha256=ad992341add498bd1018ac980f42171e0737b0793bf945c8714ad70a445b36b9$' "$E/patch.log"
          grep -q '^PATCH_QUALIFICATIONTEST flow=SHA256.Create>UTF8.GetBytes>ComputeHash>BitConverter.ToString>Replace>ToLower>storedHash-equality finally=IDisposable.Dispose$' "$E/patch.log"
          grep -q '^REOPEN_QUALIFICATIONTEST_PASS locals=6 finally=1 token=0x06000148$' "$E/patch.log"
          grep -q '^SEMANTIC_ISOLATION_PASS untouched_methods=2316 changed_methods=1$' "$E/patch.log"
          sha256sum "$DLL" | tee "$E/output-candidate.sha256"; cp "$DLL" "$E/"
          cp Tools/Stage9QualificationTestPatch/Evidence.md "$E/PC-native-evidence.md"
      - name: Independent ILSpy validation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-qualificationtest"; E="$OUT/evidence"; DLL="$OUT/GodsPVZRuntime1-qualificationtest.dll"
          ILSPY="$(find "$OUT/ilspy" -type f -name ilspycmd | head -1)"; DOTNET_BIN="$(find "$OUT/ilspy" -type f -path '*/ilspy-runtime/dotnet' | head -1)"; chmod +x "$ILSPY" "$DOTNET_BIN"; export DOTNET_ROOT="$(dirname "$DOTNET_BIN")"; export PATH="$DOTNET_ROOT:$PATH"
          "$ILSPY" -t GlobalStaticVars "$DLL" > "$E/GlobalStaticVars.cs" 2> "$E/GlobalStaticVars.stderr"; test ! -s "$E/GlobalStaticVars.stderr"
          "$ILSPY" -il -t GlobalStaticVars "$DLL" > "$E/GlobalStaticVars.il" 2> "$E/GlobalStaticVars-il.stderr"; test ! -s "$E/GlobalStaticVars-il.stderr"
          python3 - "$E/GlobalStaticVars.cs" "$E/GlobalStaticVars.il" "$E/QualificationTest.cs" "$E/QualificationTest.il" <<'PY'
          from pathlib import Path
          import sys
          cs=Path(sys.argv[1]).read_text(); il=Path(sys.argv[2]).read_text()
          cstart=cs.index('public static bool QualificationTest(string key)')
          cend=cs.index('\n\t}\n', cstart)+4
          cm=cs[cstart:cend]
          istart=il.index('bool QualificationTest (')
          iend=il.index('} // end of method GlobalStaticVars::QualificationTest', istart)
          im=il[istart:iend]
          Path(sys.argv[3]).write_text(cm)
          Path(sys.argv[4]).write_text(im)
          for bad in ('Invalid IL','Expected O, but got','Unknown result type','default(HashAlgorithm)','Method not found @180002D90'):
              assert bad not in cm, bad
          for req in ('SHA256.Create()','Encoding.UTF8','GetBytes(key)','ComputeHash','BitConverter.ToString','Replace("-", "")','ToLower()','Administrator.storedHash'):
              assert req in cm, req
          assert 'finally' in im
          assert 'System.IDisposable::Dispose()' in im
          assert 'Method not found @180002D90' not in im
          print('ILSPY_QUALIFICATIONTEST_PASS method=GlobalStaticVars.QualificationTest native_flow=preserved finally=Dispose')
          PY
      - name: Upload evidence and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-eec5-QUALIFICATIONTEST
          path: ${{ runner.temp }}/stage9-qualificationtest/evidence/
          if-no-files-found: error
          retention-days: 90
