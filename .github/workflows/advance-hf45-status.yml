name: Advance HF45 formal status

on:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/advance-hf45-status.yml'

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: high-fidelity
          fetch-depth: 0
      - name: Patch Recovery STATUS exactly
        run: python Tools/AdvanceHF45Status.py
      - name: Validate and push
        run: |
          git diff --check
          git diff -- Recovery/STATUS.md
          git config user.name 'lyiming710-cloud'
          git config user.email 'lyiming710@gmail.com'
          git add Recovery/STATUS.md
          git commit -m 'Advance formal chain through HF45'
          git push origin HEAD:high-fidelity
