name: Stage9.1 2b2f post-SkillProgress managed prefetch

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-2b2f-next-coverage-managed-prefetch.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download cheap-qualified SkillProgress v2 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34922788006
          name: Stage9.1-4736-SKILLPROGRESS-V2-QUALIFIED
          path: ${{ runner.temp }}/input

      - name: Batch managed MethodDef probe
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/post-skillprogress-prefetch"; mkdir -p "$O"
          DLL=$(find "$RUNNER_TEMP/input" -type f -name 'GodsPVZRuntime1-skillprogress-v2.dll' -print -quit)
          test -n "$DLL"
          test "$(sha256sum "$DLL"|awk '{print $1}')" = '2b2fdf165076ff9f48c577b84fb4c62346b78c925e46c6bff5f8ec6a79f67ce5'
          dotnet build Tools/Stage9MethodProbe/Stage9MethodProbe.csproj -c Release --nologo
          dotnet run --project Tools/Stage9MethodProbe/Stage9MethodProbe.csproj -c Release --no-build -- \
            "$DLL" \
            'Zombie::.ctor' \
            'ZombieInfo::.ctor' \
            'Device::.ctor' \
            'SuppliesInitialValue::.ctor' \
            'Administrator::Start' \
            'GlobalStaticVars::BGMVolume' | tee "$O/managed-probe.txt"
          grep -q '^INPUT_SHA256 2b2fdf165076ff9f48c577b84fb4c62346b78c925e46c6bff5f8ec6a79f67ce5$' "$O/managed-probe.txt"
          for s in 'Zombie::.ctor' 'ZombieInfo::.ctor' 'Device::.ctor' 'SuppliesInitialValue::.ctor' 'Administrator::Start' 'GlobalStaticVars::BGMVolume'; do
            grep -Fq "METHOD selector=$s" "$O/managed-probe.txt"
          done
          grep '^METHOD selector=' "$O/managed-probe.txt" | tee "$O/method-index.txt"
          grep '^METHOD_FINGERPRINT ' "$O/managed-probe.txt" | tee "$O/fingerprints.txt"

      - name: Upload read-only managed prefetch
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-2B2F-POST-SKILLPROGRESS-MANAGED-PREFETCH
          path: ${{ runner.temp }}/post-skillprogress-prefetch/
          retention-days: 90
