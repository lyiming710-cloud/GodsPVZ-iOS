name: Stage9 Administrator.Start static qualification

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_RUN_ID: '34990527235'
      SOURCE_ARTIFACT: Stage9.1-FE67-TEXTLINK-UPDATE-QUALIFIED
      EXPECTED_INPUT_SHA: 26064265fdba4e9b501f0c3312260503fdde43b9e111072c19dd39891e5ca022
    steps:
      - uses: actions/checkout@v4

      - name: Download exact qualified input candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT }}
          path: ${{ runner.temp }}/administrator-start/input

      - name: Lock exact input
        shell: bash
        run: |
          set -euo pipefail
          IN=$(find "$RUNNER_TEMP/administrator-start/input" -type f -name 'GodsPVZRuntime1-textlink-update.dll' -print -quit)
          test -n "$IN"
          ACTUAL=$(sha256sum "$IN" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_INPUT_SHA"
          mkdir -p "$RUNNER_TEMP/administrator-start/evidence"
          echo "ADMINISTRATOR_START_INPUT=$IN" >> "$GITHUB_ENV"
          echo "INPUT_SHA256 $ACTUAL" | tee "$RUNNER_TEMP/administrator-start/evidence/input.sha256.txt"
          printf 'source_run_id=%s\nsource_artifact=%s\nsource_candidate_sha256=%s\nworkflow_commit=%s\n' \
            "$SOURCE_RUN_ID" "$SOURCE_ARTIFACT" "$ACTUAL" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/administrator-start/evidence/provenance.txt"

      - name: Apply exact Cecil signature fix and reopen diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tools/Stage9AdministratorStartPatch/Program.cs')
          s = p.read_text()
          old = 'var getItem = M(ListGetItemRefToken, "System.Collections.Generic.List`1<UnityEngine.GameObject>", "get_Item", "UnityEngine.GameObject", "System.Int32");'
          new = 'var getItem = M(ListGetItemRefToken, "System.Collections.Generic.List`1<UnityEngine.GameObject>", "get_Item", "!0", "System.Int32");'
          if old in s:
              s = s.replace(old, new, 1)
              print('PATCHER_SIGNATURE_FIX applied=1 token=0x0A0001EC return=!0')
          elif new in s:
              print('PATCHER_SIGNATURE_FIX applied=0 already_fixed=1 token=0x0A0001EC return=!0')
          else:
              raise SystemExit('expected List<GameObject>.get_Item signature assertion not found')

          old_gate = '    if (MemberRefs(module) != beforeMemberRefs) throw new InvalidDataException("MemberRef metadata set changed");'
          new_gate = '''    var afterMemberRefs = MemberRefs(module);
    if (afterMemberRefs != beforeMemberRefs)
    {
        var beforeLines = beforeMemberRefs.Split('\\n', StringSplitOptions.RemoveEmptyEntries);
        var afterLines = afterMemberRefs.Split('\\n', StringSplitOptions.RemoveEmptyEntries);
        var removed = beforeLines.Except(afterLines, StringComparer.Ordinal).OrderBy(x => x, StringComparer.Ordinal).ToArray();
        var added = afterLines.Except(beforeLines, StringComparer.Ordinal).OrderBy(x => x, StringComparer.Ordinal).ToArray();
        Console.WriteLine($"MEMBERREF_DIFF removed={removed.Length} added={added.Length}");
        foreach (var x in removed) Console.WriteLine("MEMBERREF_REMOVED " + x);
        foreach (var x in added) Console.WriteLine("MEMBERREF_ADDED " + x);
        throw new InvalidDataException("MemberRef metadata set changed");
    }'''
          if old_gate in s:
              s = s.replace(old_gate, new_gate, 1)
              print('MEMBERREF_DIAGNOSTIC injected=1')
          elif 'MEMBERREF_DIFF removed=' in s:
              print('MEMBERREF_DIAGNOSTIC injected=0 already_present=1')
          else:
              raise SystemExit('expected MemberRef reopen gate not found')
          p.write_text(s)
          PY
          git diff --check
          git diff -- Tools/Stage9AdministratorStartPatch/Program.cs

      - name: Build dedicated Cecil patcher
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Tools/Stage9AdministratorStartPatch/Stage9AdministratorStartPatch.csproj
          dotnet build -c Release --no-restore Tools/Stage9AdministratorStartPatch/Stage9AdministratorStartPatch.csproj

      - name: Patch Administrator.Start and run embedded reopen/isolation gates
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/administrator-start/GodsPVZRuntime1-administrator-start.dll"
          dotnet run -c Release --no-build --project Tools/Stage9AdministratorStartPatch/Stage9AdministratorStartPatch.csproj -- \
            "$ADMINISTRATOR_START_INPUT" "$OUT" "$EXPECTED_INPUT_SHA" \
            | tee "$RUNNER_TEMP/administrator-start/evidence/patcher-audit.txt"
          test -s "$OUT"
          OUT_SHA=$(sha256sum "$OUT" | awk '{print $1}')
          echo "OUTPUT_SHA256 $OUT_SHA" | tee "$RUNNER_TEMP/administrator-start/evidence/output.sha256.txt"
          echo "ADMINISTRATOR_START_OUTPUT=$OUT" >> "$GITHUB_ENV"
          echo "ADMINISTRATOR_START_OUTPUT_SHA=$OUT_SHA" >> "$GITHUB_ENV"

      - name: Enforce qualification markers
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/administrator-start/evidence/patcher-audit.txt"
          grep -F 'ADMINISTRATOR_START_PREIMAGE_PASS' "$LOG"
          grep -F 'REOPEN_ADMINISTRATOR_START_PASS' "$LOG"
          grep -F 'SEMANTIC_ISOLATION_PASS unchanged_method_headers=2317 changed_method_bodies=1 target=0x06000004 unchanged_fields=2802' "$LOG"
          grep -F 'METADATA_REFERENCE_GATE_PASS assembly_refs_unchanged=1 member_refs_unchanged=1 type_refs_unchanged=1 system_private_corelib_refs=0' "$LOG"
          grep -F 'ADMINISTRATOR_START_STRUCTURE_GATE_PASS valid_range_gate=1 foreach_try_finally=1 SetGloveButtons_zero_arg=1 mode0_save_chain=1 mode3_private_board_field=0 mode4_order=load_then_start tail_gamepause=1' "$LOG"
          printf 'STATIC_QUALIFIED=1\ninput_sha256=%s\noutput_sha256=%s\ntarget=Administrator.Start\ntoken=0x06000004\n' \
            "$EXPECTED_INPUT_SHA" "$ADMINISTRATOR_START_OUTPUT_SHA" \
            | tee "$RUNNER_TEMP/administrator-start/evidence/static-qualified.txt"

      - name: Persist verified patcher fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Tools/Stage9AdministratorStartPatch/Program.cs')
          s=p.read_text()
          start=s.find('    var afterMemberRefs = MemberRefs(module);')
          if start >= 0:
              end=s.find('    if (TypeRefs(module) != beforeTypeRefs)', start)
              if end < 0: raise SystemExit('diagnostic block end not found')
              s=s[:start]+'    if (MemberRefs(module) != beforeMemberRefs) throw new InvalidDataException("MemberRef metadata set changed");\n'+s[end:]
              p.write_text(s)
          PY
          if ! git diff --quiet -- Tools/Stage9AdministratorStartPatch/Program.cs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Tools/Stage9AdministratorStartPatch/Program.cs
            git commit -m 'fix: match Cecil List<T>.get_Item generic return signature [skip ci]'
            git push origin HEAD:stage9-admin-start-static
          fi

      - name: Upload static-qualified Administrator.Start candidate
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-ADMINISTRATOR-START-STATIC-QUALIFIED
          path: |
            ${{ runner.temp }}/administrator-start/GodsPVZRuntime1-administrator-start.dll
            ${{ runner.temp }}/administrator-start/evidence/
          retention-days: 90
          if-no-files-found: error
