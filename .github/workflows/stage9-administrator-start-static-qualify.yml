name: Stage9 Administrator.Start static qualification

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_RUN_ID: '34990527235'
      SOURCE_ARTIFACT: Stage9.1-FE67-TEXTLINK-UPDATE-QUALIFIED
      EXPECTED_INPUT_SHA: 26064265fdba4e9b501f0c3312260503fdde43b9e111072c19dd39891e5ca022
    steps:
      - uses: actions/checkout@v4
      - name: Download exact qualified input candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT }}
          path: ${{ runner.temp }}/administrator-start/input
      - name: Lock exact input
        shell: bash
        run: |
          set -euo pipefail
          IN=$(find "$RUNNER_TEMP/administrator-start/input" -type f -name 'GodsPVZRuntime1-textlink-update.dll' -print -quit)
          test -n "$IN"
          ACTUAL=$(sha256sum "$IN" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_INPUT_SHA"
          mkdir -p "$RUNNER_TEMP/administrator-start/evidence"
          echo "ADMINISTRATOR_START_INPUT=$IN" >> "$GITHUB_ENV"
          echo "INPUT_SHA256 $ACTUAL" | tee "$RUNNER_TEMP/administrator-start/evidence/input.sha256.txt"
          printf 'source_run_id=%s\nsource_artifact=%s\nsource_candidate_sha256=%s\nworkflow_commit=%s\n' "$SOURCE_RUN_ID" "$SOURCE_ARTIFACT" "$ACTUAL" "$GITHUB_SHA" > "$RUNNER_TEMP/administrator-start/evidence/provenance.txt"
      - name: Apply Cecil semantic-audit corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Tools/Stage9AdministratorStartPatch/Program.cs')
          s=p.read_text()
          replacements=[
            ('var getItem = M(ListGetItemRefToken, "System.Collections.Generic.List`1<UnityEngine.GameObject>", "get_Item", "UnityEngine.GameObject", "System.Int32");','var getItem = M(ListGetItemRefToken, "System.Collections.Generic.List`1<UnityEngine.GameObject>", "get_Item", "!0", "System.Int32");'),
            ('if (o is MethodReference mr) return "M:" + MethodRefSig(mr);','if (o is MethodReference mr) return $"M:{mr.FullName}@{Scope(mr.DeclaringType.Scope)}";'),
            ('if (o is FieldReference fr) return $"F:{fr.FullName}@{Scope(fr.DeclaringType.Scope)}#0x{Raw(fr):X8}";','if (o is FieldReference fr) return $"F:{fr.FullName}@{Scope(fr.DeclaringType.Scope)}";'),
            ('if (o is TypeReference tr) return $"T:{TypeSig(tr)}#0x{Raw(tr):X8}";','if (o is TypeReference tr) return $"T:{TypeSig(tr)}";'),
            ('static string MemberRefs(ModuleDefinition m) => string.Join("\\n", m.GetMemberReferences().Select(r => $"0x{Raw(r):X8}|{r.FullName}|{Scope(r.DeclaringType.Scope)}").OrderBy(x => x, StringComparer.Ordinal));','static string MemberRefs(ModuleDefinition m) => string.Join("\\n", m.GetMemberReferences().Select(r => $"{r.FullName}|{Scope(r.DeclaringType.Scope)}").OrderBy(x => x, StringComparer.Ordinal));'),
            ('static string TypeRefs(ModuleDefinition m) => string.Join("\\n", m.GetTypeReferences().Select(r => $"0x{Raw(r):X8}|{r.FullName}|{Scope(r.Scope)}").OrderBy(x => x, StringComparer.Ordinal));','static string TypeRefs(ModuleDefinition m) => string.Join("\\n", m.GetTypeReferences().Select(r => $"{r.FullName}|{Scope(r.Scope)}").OrderBy(x => x, StringComparer.Ordinal));'),
            ('Console.WriteLine("METADATA_REFERENCE_GATE_PASS assembly_refs_unchanged=1 member_refs_unchanged=1 type_refs_unchanged=1 system_private_corelib_refs=0");','Console.WriteLine("METADATA_REFERENCE_GATE_PASS assembly_refs_unchanged=1 member_ref_semantics_unchanged=1 type_ref_semantics_unchanged=1 system_private_corelib_refs=0");'),
            ('    if (Calls(ListGetEnumeratorRefToken) != 1 || Calls(EnumeratorGetCurrentRefToken) != 1 || Calls(EnumeratorMoveNextRefToken) != 1 || Calls(EnumeratorDisposeRefToken) != 1 || Calls(ListGetItemRefToken) != 4)\n        throw new InvalidDataException("List<GameObject> API gate failed");',
             '    int CallsExternal(string declaringType, string name) => target.Body.Instructions.Count(i => i.Operand is MethodReference m && m.DeclaringType.FullName == declaringType && m.Name == name);\n    if (CallsExternal("System.Collections.Generic.List`1<UnityEngine.GameObject>", "GetEnumerator") != 1 || CallsExternal("System.Collections.Generic.List`1/Enumerator<UnityEngine.GameObject>", "get_Current") != 1 || CallsExternal("System.Collections.Generic.List`1/Enumerator<UnityEngine.GameObject>", "MoveNext") != 1 || CallsExternal("System.Collections.Generic.List`1/Enumerator<UnityEngine.GameObject>", "Dispose") != 1 || CallsExternal("System.Collections.Generic.List`1<UnityEngine.GameObject>", "get_Item") != 4)\n        throw new InvalidDataException("List<GameObject> API semantic gate failed");')
          ]
          for old,new in replacements:
              if old in s: s=s.replace(old,new,1)
              elif new not in s: raise SystemExit('expected source pattern missing: '+old[:100])
          needle='    if (target.Body.Instructions.Any(i => i.Operand is FieldReference f && f.DeclaringType.FullName.StartsWith("System.Collections.Generic.List`1", StringComparison.Ordinal) && f.Name is "_items" or "_size" or "_version"))\n        throw new InvalidDataException("List<T> private internals introduced");'
          extra=needle+'\n    if (target.Body.Instructions.Any(i => i.Operand is MemberReference r && r.FullName.Contains("UnityEngine.Vector3::zeroVector", StringComparison.Ordinal))) throw new InvalidDataException("zeroVector scaffolding introduced");\n    if (target.Body.Instructions.Any(i => i.OpCode.Code is Code.Calli or Code.Localloc or Code.Cpblk or Code.Initblk or Code.Ldind_I or Code.Ldind_I1 or Code.Ldind_I2 or Code.Ldind_I4 or Code.Ldind_I8 or Code.Ldind_R4 or Code.Ldind_R8 or Code.Ldind_Ref or Code.Ldind_U1 or Code.Ldind_U2 or Code.Ldind_U4 or Code.Stind_I or Code.Stind_I1 or Code.Stind_I2 or Code.Stind_I4 or Code.Stind_I8 or Code.Stind_R4 or Code.Stind_R8 or Code.Stind_Ref)) throw new InvalidDataException("unmanaged scaffolding introduced");'
          if needle in s and 'zeroVector scaffolding introduced' not in s: s=s.replace(needle,extra,1)
          p.write_text(s)
          print('SEMANTIC_AUDIT_PATCH token_independent_refs=1 token_independent_operands=1 list_api_semantic_gate=1 target_pollution_gates=1')
          PY
          git diff --check
          git diff -- Tools/Stage9AdministratorStartPatch/Program.cs | tee "$RUNNER_TEMP/administrator-start/evidence/audit-source-adjustment.patch"
      - name: Build dedicated Cecil patcher
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Tools/Stage9AdministratorStartPatch/Stage9AdministratorStartPatch.csproj
          dotnet build -c Release --no-restore Tools/Stage9AdministratorStartPatch/Stage9AdministratorStartPatch.csproj
      - name: Patch Administrator.Start and run embedded reopen isolation gates
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/administrator-start/GodsPVZRuntime1-administrator-start.dll"
          dotnet run -c Release --no-build --project Tools/Stage9AdministratorStartPatch/Stage9AdministratorStartPatch.csproj -- "$ADMINISTRATOR_START_INPUT" "$OUT" "$EXPECTED_INPUT_SHA" | tee "$RUNNER_TEMP/administrator-start/evidence/patcher-audit.txt"
          test -s "$OUT"
          OUT_SHA=$(sha256sum "$OUT" | awk '{print $1}')
          echo "OUTPUT_SHA256 $OUT_SHA" | tee "$RUNNER_TEMP/administrator-start/evidence/output.sha256.txt"
          echo "ADMINISTRATOR_START_OUTPUT=$OUT" >> "$GITHUB_ENV"
          echo "ADMINISTRATOR_START_OUTPUT_SHA=$OUT_SHA" >> "$GITHUB_ENV"
      - name: Enforce qualification markers
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/administrator-start/evidence/patcher-audit.txt"
          grep -F 'ADMINISTRATOR_START_PREIMAGE_PASS' "$LOG"
          grep -F 'REOPEN_ADMINISTRATOR_START_PASS' "$LOG"
          grep -F 'SEMANTIC_ISOLATION_PASS unchanged_method_headers=2317 changed_method_bodies=1 target=0x06000004 unchanged_fields=2802' "$LOG"
          grep -F 'METADATA_REFERENCE_GATE_PASS assembly_refs_unchanged=1 member_ref_semantics_unchanged=1 type_ref_semantics_unchanged=1 system_private_corelib_refs=0' "$LOG"
          grep -F 'ADMINISTRATOR_START_STRUCTURE_GATE_PASS valid_range_gate=1 foreach_try_finally=1 SetGloveButtons_zero_arg=1 mode0_save_chain=1 mode3_private_board_field=0 mode4_order=load_then_start tail_gamepause=1' "$LOG"
          printf 'STATIC_QUALIFIED=1\ninput_sha256=%s\noutput_sha256=%s\ntarget=Administrator.Start\ntoken=0x06000004\nmemberref_gate=semantic-set\ntyperef_gate=semantic-set\n' "$EXPECTED_INPUT_SHA" "$ADMINISTRATOR_START_OUTPUT_SHA" | tee "$RUNNER_TEMP/administrator-start/evidence/static-qualified.txt"
      - name: Upload static-qualified Administrator.Start candidate
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-ADMINISTRATOR-START-STATIC-QUALIFIED
          path: |
            ${{ runner.temp }}/administrator-start/GodsPVZRuntime1-administrator-start.dll
            ${{ runner.temp }}/administrator-start/evidence/
          retention-days: 90
          if-no-files-found: error
