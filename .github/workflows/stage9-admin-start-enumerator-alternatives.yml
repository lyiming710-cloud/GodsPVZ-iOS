name: Stage9 Administrator.Start enumerator alternatives

on:
  push:
    branches: [stage9-admin-start-static]
    paths:
      - '.github/workflows/stage9-admin-start-enumerator-alternatives.yml'
  workflow_dispatch:

permissions: {contents: read, actions: read}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STATIC_RUN_ID: '35190758891'
      STATIC_ARTIFACT: Stage9.1-ADMINISTRATOR-START-INPLACE-STATIC-QUALIFIED
      EXPECTED_SHA: f3d980abb6a7678bf3ac04587ec857f88d488a9c136d991323562beda943f3a2
    steps:
      - name: Download exact metadata-preserving candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.STATIC_RUN_ID }}
          name: ${{ env.STATIC_ARTIFACT }}
          path: ${{ runner.temp }}/probe/input
      - name: Inventory existing enumerator-related metadata refs
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find "$RUNNER_TEMP/probe/input" -type f -name 'GodsPVZRuntime1-administrator-start-inplace.dll' -print -quit)
          test -n "$DLL"
          test "$(sha256sum "$DLL" | awk '{print $1}')" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/probe/src" "$RUNNER_TEMP/probe/evidence"
          cat > "$RUNNER_TEMP/probe/src/probe.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup>
            <ItemGroup><PackageReference Include="Mono.Cecil" Version="0.11.6" /></ItemGroup>
          </Project>
          EOF
          cat > "$RUNNER_TEMP/probe/src/Program.cs" <<'EOF'
          using Mono.Cecil;
          static uint Raw(IMetadataTokenProvider p)=>p.MetadataToken.ToUInt32();
          using var mod=ModuleDefinition.ReadModule(args[0],new ReaderParameters{InMemory=true,ReadingMode=ReadingMode.Immediate});
          foreach(var mr in mod.GetMemberReferences().OfType<MethodReference>().OrderBy(Raw)){
            var s=mr.FullName;
            if(s.Contains("GetEnumerator",StringComparison.Ordinal)||s.Contains("get_Current",StringComparison.Ordinal)||s.Contains("MoveNext",StringComparison.Ordinal)||s.Contains("Dispose",StringComparison.Ordinal)||s.Contains("get_Count",StringComparison.Ordinal)||s.Contains("get_Item",StringComparison.Ordinal)){
              Console.WriteLine($"METHODREF token=0x{Raw(mr):X8} name={mr.Name} full={mr.FullName}");
              Console.WriteLine($"  declaring={mr.DeclaringType.FullName} declaring_kind={mr.DeclaringType.GetType().Name} declaring_scope={mr.DeclaringType.Scope}");
              Console.WriteLine($"  return={mr.ReturnType.FullName} return_kind={mr.ReturnType.GetType().Name} return_scope={mr.ReturnType.Scope}");
            }
          }
          Console.WriteLine("=== TYPE REFS ===");
          foreach(var tr in mod.GetTypeReferences().OrderBy(Raw)){
            var s=tr.FullName;
            if(s.Contains("IEnumerable",StringComparison.Ordinal)||s.Contains("IEnumerator",StringComparison.Ordinal)||s.Contains("IDisposable",StringComparison.Ordinal)||s.Contains("List`1",StringComparison.Ordinal))
              Console.WriteLine($"TYPEREF token=0x{Raw(tr):X8} full={tr.FullName} scope={tr.Scope}");
          }
          EOF
          dotnet run --project "$RUNNER_TEMP/probe/src/probe.csproj" -- "$DLL" | tee "$RUNNER_TEMP/probe/evidence/enumerator-alternatives.txt"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-ADMINISTRATOR-START-ENUMERATOR-ALTERNATIVES
          path: ${{ runner.temp }}/probe/evidence/
          retention-days: 30
# trigger-2
