name: Build HF18 Buff infrastructure patcher

on:
  push:
    branches: [ high-fidelity ]
    paths:
      - 'Tools/HF18Patch/**'
      - '.github/workflows/build-hf18-patcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF18 patcher
        run: dotnet publish Tools/HF18Patch/HF18Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - name: Smoke test usage
        run: |
          set +e
          ./out/GodsPVZ.HF18Patch >/tmp/hf18.out 2>/tmp/hf18.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'Usage: GodsPVZ.HF18Patch' /tmp/hf18.err
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF18Patch-linux-x64
          path: out/GodsPVZ.HF18Patch
