name: Build HF51 Project Generic EndPosition patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF51Patch/**'
      - '.github/workflows/build-hf51-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF51 patcher
        run: dotnet publish Tools/HF51Patch/HF51Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf51
      - name: Smoke test
        run: |
          chmod +x out/hf51/GodsPVZ.HF51Patch
          set +e
          out/hf51/GodsPVZ.HF51Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf51/GodsPVZ.HF51Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF51Patch-linux-x64
          path: out/hf51
          if-no-files-found: error
