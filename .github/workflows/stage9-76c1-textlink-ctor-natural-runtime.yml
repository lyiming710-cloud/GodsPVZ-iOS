name: Stage9.1 76c1 TextLink ctor natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-76c1-textlink-ctor-natural-runtime.yml','Tools/Stage9TextLinkRuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34984733215, name: Stage9.1-342C-TEXTLINK-CTOR-QUALIFIED, path: '${{ runner.temp }}/stage9-textlink/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-textlink/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-textlink/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-textlink/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-textlink-ctor.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = '76c1c48219af73c73e48fcfb3d0a53254b567c07db7450a80ed51b61a2f6ce19'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "TEXTLINK_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "TEXTLINK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-textlink" "$TEXTLINK_CANDIDATE" "$TEXTLINK_SHA"
      - name: Audit TextLink natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-textlink/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9TextLinkRuntimeAudit/audit.py "$LOG" "$TEXTLINK_SHA" | tee "$E/textlink-ctor-natural-runtime-audit.txt"
          python3 Tools/Stage9RuntimeTriage/first-invalid.py "$LOG" | tee "$E/first-invalid-triage.txt"
      - name: Upload TextLink natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-76C1-TEXTLINK-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-textlink/evidence/', retention-days: 90}
