name: Stage9.1 ef0e Administrator ctor natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-ef0e-administrator-ctor-natural-runtime.yml','Tools/Stage9AdministratorRuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34974706641, name: Stage9.1-FDD1-ADMINISTRATOR-CTOR-QUALIFIED, path: '${{ runner.temp }}/stage9-administrator/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-administrator/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-administrator/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-administrator/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-administrator-ctor.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = 'ef0e435d545429557c5cd260ee0d6b9348f3ab8de4197836741b993a1fe9a5a2'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "ADMINISTRATOR_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "ADMINISTRATOR_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-administrator" "$ADMINISTRATOR_CANDIDATE" "$ADMINISTRATOR_SHA"
      - name: Audit Administrator natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-administrator/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9AdministratorRuntimeAudit/audit.py "$LOG" "$ADMINISTRATOR_SHA" | tee "$E/administrator-ctor-natural-runtime-audit.txt"
          python3 Tools/Stage9RuntimeTriage/first-invalid.py "$LOG" | tee "$E/first-invalid-triage.txt"
      - name: Upload Administrator natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-EF0E-ADMINISTRATOR-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-administrator/evidence/', retention-days: 90}
