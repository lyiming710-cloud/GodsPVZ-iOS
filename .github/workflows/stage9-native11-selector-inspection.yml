name: Stage9.6 native11 TMP_TextSelector_A metadata inspection
on:
  push:
    branches: [takeover/stage9-native6-repro-2026-09-27]
    paths: ['.github/workflows/stage9-native11-selector-inspection.yml','scripts/takeover/InspectNative11/**']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NATIVE9_RUN_ID: '36309302621'
      NATIVE9_ARTIFACT_NAME: 'Stage9.4-native9-polejump-experimental'
      NATIVE9_SHA256: '6e3d3fe4283ce4079f22727e9e6a13c290cb2944b8b0eedd1c705a0815b3906f'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '9.0.x'}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.NATIVE9_RUN_ID }}
          name: ${{ env.NATIVE9_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/native9
      - name: Verify and inspect
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mapfile -t D < <(find "$RUNNER_TEMP/native9" -type f -name 'Assembly-CSharp-native9-polejump.dll' | sort)
          [ "${#D[@]}" = 1 ]
          [ "$(sha256sum "${D[0]}"|awk '{print $1}')" = "$NATIVE9_SHA256" ]
          python3 Tools/Stage9Native4Recovery/prepare_ci_inputs.py
          dotnet run --project scripts/takeover/InspectNative11/InspectNative11.csproj -- "${D[0]}" | tee "$RUNNER_TEMP/native11-inspect.txt"
          grep -qx INSPECT_NATIVE11_PASS "$RUNNER_TEMP/native11-inspect.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Stage9.6-native11-selector-inspection
          path: ${{ runner.temp }}/native11-inspect.txt
          retention-days: 30
