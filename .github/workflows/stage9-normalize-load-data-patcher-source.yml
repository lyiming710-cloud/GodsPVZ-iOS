name: Stage9.1 normalize LoadData patcher source
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-normalize-load-data-patcher-source.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize lexical variable name and commit
        shell: bash
        run: |
          set -euo pipefail
          P=Tools/Stage9BoardPlantDetailLoadDataPatch/Program.cs
          grep -Fq 'foreach (var f in fields) beforeF[Raw(f)] = FieldSemantic(f);' "$P"
          sed -i 's/foreach (var f in fields) beforeF\[Raw(f)\] = FieldSemantic(f);/foreach (var fld in fields) beforeF[Raw(fld)] = FieldSemantic(fld);/' "$P"
          grep -Fq 'foreach (var fld in fields) beforeF[Raw(fld)] = FieldSemantic(fld);' "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m 'stage9: normalize LoadData patcher source'
          git push origin HEAD:high-fidelity
