name: Dispatch current Stage9.1 iOS export

on:
  push:
    branches: [stage9-admin-start-static]
    paths:
      - .github/workflows/stage9-dispatch-current-ios-export.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current baseline iOS Xcode export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run stage9-current-baseline-ios-xcode-export.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref stage9-admin-start-static
