  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current baseline iOS Xcode export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'Dispatch reason: run 8 with formally proven nine-byte iOS work-copy repair: PE DLL bit, complete Damage Enumerator<Element> canonicalization, and Board.Start MVAR0->UnityEngine.Sprite local-signature repair; global Cecil audit orphan_hits=0.'
          gh workflow run stage9-current-baseline-ios-xcode-export.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref stage9-admin-start-static
