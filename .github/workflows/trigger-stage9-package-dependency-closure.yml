name: Trigger Stage9.1 package dependency closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/trigger-stage9-package-dependency-closure.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing Stage9.1 dependency closure workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stage9-package-dependency-closure.yml --repo "${{ github.repository }}" --ref high-fidelity
