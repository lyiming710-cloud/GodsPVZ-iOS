name: Stage9.9 native14 Element materialization gate

on:
  push:
    branches: [takeover/stage9-native6-repro-2026-09-27]
    paths:
      - '.github/workflows/stage9-native14-materialization-gate.yml'
      - 'scripts/takeover/materialize_native14.sh'
      - 'scripts/takeover/PatcherNative14/**'
      - 'Tools/Stage9Native4Recovery/evidence/native14-native-audit/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage9-native14-materialization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NATIVE13_SOURCE_RUN_ID: '36312388770'
      NATIVE13_SOURCE_ARTIFACT_ID: '10928998261'
      NATIVE13_SOURCE_ARTIFACT_NAME: 'Stage9.8-native13-selectorb-experimental'
      NATIVE13_SOURCE_ARTIFACT_DIGEST: 'sha256:5643737ef1300dfe7e7d11228d5dba895fe8b30dfe3119783b8c3153124953b2'
      NATIVE13_SHA256: 'fbc42f136d28916d155b1876139c0b3b19994bdb4bf24aca7eacd8c7556a62b4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Download exact native13 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.NATIVE13_SOURCE_RUN_ID }}
          name: ${{ env.NATIVE13_SOURCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/native13
      - name: Recover exact native13 input
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t H < <(find "$RUNNER_TEMP/native13" -type f -name 'Assembly-CSharp-native13-selectorb.dll' | sort)
          [ "${#H[@]}" = 1 ] || { echo "Expected exactly one native13 DLL, got ${#H[@]}" >&2; exit 1; }
          GOT="$(sha256sum "${H[0]}"|awk '{print $1}')"
          [ "$GOT" = "$NATIVE13_SHA256" ] || { echo "native13 SHA mismatch: $GOT" >&2; exit 1; }
          mkdir -p Tools/Stage9Native4Recovery/candidate
          cp "${H[0]}" Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native13-selectorb.dll
          echo NATIVE13_INPUT_PASS
      - name: Fetch pinned Cecil
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 Tools/Stage9Native4Recovery/prepare_ci_inputs.py
      - name: Materialize native14 twice
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/takeover/materialize_native14.sh
          scripts/takeover/materialize_native14.sh \
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native13-selectorb.dll \
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native14-elements.dll \
            | tee "$RUNNER_TEMP/native14-materialize.log"
          grep -qx NATIVE14_MATERIALIZATION_PASS "$RUNNER_TEMP/native14-materialize.log"
      - name: Record native14 provenance
        shell: bash
        run: |
          set -euo pipefail
          E=Tools/Stage9Native4Recovery/evidence/native14-materialization
          mkdir -p "$E"
          cp "$RUNNER_TEMP/native14-materialize.log" "$E/materialize.log"
          cp Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native14-elements.dll.run1.log "$E/patcher-run1.log"
          cp Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native14-elements.dll.run2.log "$E/patcher-run2.log"
          N14="$(sha256sum Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native14-elements.dll|awk '{print $1}')"
          cat > "$E/PROVENANCE.txt" <<EOF
          status=EXPERIMENTAL_TAKEOVER_MATERIALIZATION
          workflow_head=$GITHUB_SHA
          source_native13_run=$NATIVE13_SOURCE_RUN_ID
          source_native13_artifact_id=$NATIVE13_SOURCE_ARTIFACT_ID
          source_native13_artifact_digest=$NATIVE13_SOURCE_ARTIFACT_DIGEST
          source_native13_dll_sha256=$NATIVE13_SHA256
          native14_dll_sha256=$N14
          target=ElementManager::CreateNewElements<T>
          target_methoddef=0x06000126
          pc_refshare_va=0x180439680
          pc_refshare_sha256=191078e9a5434bd3f7d89c411ac132388ebef9799f154acf5889f9541291227e
          pc_valueshare_va=0x1804390C0
          pc_valueshare_sha256=64a719753c31e448656803a777561aeaf34e1197475ff6a4c5ce9b4c66627cb6
          deterministic_run_pair=PASS
          direct_il2cpp_canary=NOT_RUN
          full_unity_rebuild=NO
          production_promotion=NO
          EOF
          cat "$E/PROVENANCE.txt"
      - name: Upload native14 candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.9-native14-elements-experimental
          path: |
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native14-elements.dll
            Tools/Stage9Native4Recovery/evidence/native14-native-audit/
            Tools/Stage9Native4Recovery/evidence/native14-materialization/
          if-no-files-found: error
          retention-days: 30
