name: Advance HF46 formal status

on:
  push:
    paths:
      - '.github/workflows/advance-hf46-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: high-fidelity
          fetch-depth: 0
      - name: Update Recovery STATUS
        run: python Tools/StatusAdvance/advance_hf46.py
      - name: Commit STATUS advancement
        run: |
          if git diff --quiet -- Recovery/STATUS.md; then
            echo "STATUS already advanced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Recovery/STATUS.md
          git commit -m "Advance formal chain through HF46"
          git push origin HEAD:high-fidelity
