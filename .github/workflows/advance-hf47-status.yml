          if chain_hf47 not in s:
              if chain_anchor not in s:
                  raise SystemExit('HF46 chain anchor missing')
              s = s.replace(chain_anchor, chain_anchor + chain_hf47, 1)

          hf47 = '''### HF47 — EnemyManager Wave Progression Core

Restores exactly three original native-backed MethodDefs:

- `0x060001B5 EnemyManager.DispatcheWave(Wave)` / RID 437 / PC `0x1803175F0`;
