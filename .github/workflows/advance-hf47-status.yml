  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: high-fidelity
      - name: Advance STATUS to formally closed HF47
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Recovery/STATUS.md')
          s = p.read_text()

          chain_anchor = '- **HF46 EnemyManager Dependency Core — native-backed formal final — `900d3aabbf79b094a6b412f7d869cc5285ce206a2d17501b69fc3cd8651beefd`.**\n'
