name: Build high-fidelity patcher
on:
  push:
    branches: [ high-fidelity ]
    paths:
      - 'Tools/HighFidelityPatch/**'
      - '.github/workflows/build-high-fidelity-patcher.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: high-fidelity
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Inject native-backed HF2 methods
        run: python3 Tools/HighFidelityPatch/hf2_source_patch.py
      - name: Publish
        run: dotnet publish Tools/HighFidelityPatch/HighFidelityPatch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o out
      - name: Smoke test
        run: ./out/HighFidelityPatch || test $? -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HighFidelityPatch-linux-x64
          path: out/HighFidelityPatch
