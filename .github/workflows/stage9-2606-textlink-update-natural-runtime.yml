name: Stage9.1 2606 TextLink Update natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-2606-textlink-update-natural-runtime.yml','Tools/Stage9TextLinkUpdateRuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34990527235, name: Stage9.1-FE67-TEXTLINK-UPDATE-QUALIFIED, path: '${{ runner.temp }}/stage9-textlink-update/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-textlink-update/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-textlink-update/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-textlink-update/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-textlink-update.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = '26064265fdba4e9b501f0c3312260503fdde43b9e111072c19dd39891e5ca022'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "TEXTLINK_UPDATE_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "TEXTLINK_UPDATE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-textlink-update" "$TEXTLINK_UPDATE_CANDIDATE" "$TEXTLINK_UPDATE_SHA"
      - name: Audit TextLink Update natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-textlink-update/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9TextLinkUpdateRuntimeAudit/audit.py "$LOG" "$TEXTLINK_UPDATE_SHA" | tee "$E/textlink-update-natural-runtime-audit.txt"
          python3 Tools/Stage9RuntimeTriage/first-invalid.py "$LOG" | tee "$E/first-invalid-triage.txt"
      - name: Upload TextLink Update natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-2606-TEXTLINK-UPDATE-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-textlink-update/evidence/', retention-days: 90}
