name: Stage9.1 498b Card_Choose sprites native gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-498b-card-choose-sprites-native-gate.yml'
      - 'Tools/Stage9ResourceManagerCardChooseSpritesPatch/**'
permissions:
  contents: read
  actions: read
jobs:
  card-choose-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download exact 498b input
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34767150200
          pattern: Stage9.1-5001-RESOURCE-MANAGER-LOADSPRITES
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-ccsprites/input
      - name: Download fixed ILSpy
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34173085137
          pattern: GodsPVZ-ILSpyCmd-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-ccsprites/ilspy
      - name: Apply PC-native-backed Card_Choose sprite helper recovery
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-ccsprites"; E="$OUT/evidence"; mkdir -p "$E"
          IN="$OUT/input/GodsPVZRuntime1-resource-manager-loadsprites.dll"
          DLL="$OUT/GodsPVZRuntime1-card-choose-sprites.dll"
          [ "$(sha256sum "$IN" | awk '{print $1}')" = '498b34ca2db493d42676a3283edac8126180fd624d6664b3c39e855abfa905ba' ] || exit 61
          dotnet build Tools/Stage9ResourceManagerCardChooseSpritesPatch/Stage9ResourceManagerCardChooseSpritesPatch.csproj -c Release --nologo
          dotnet run --project Tools/Stage9ResourceManagerCardChooseSpritesPatch/Stage9ResourceManagerCardChooseSpritesPatch.csproj -c Release --no-build -- "$IN" "$DLL" | tee "$E/patch.log"
          grep -q '^INPUT_SHA256 498b34ca2db493d42676a3283edac8126180fd624d6664b3c39e855abfa905ba$' "$E/patch.log"
          grep -q '^TARGET_METHOD token=0x06000222 type=ResourceManager method=Load_card_Choose_Sprites code_size=636 locals=37 invalid_offset=0x018D$' "$E/patch.log"
          grep -q '^NATIVE_AUTHORITY token=0x06000222 address=0x0000000180338130 function_end=0x0000000180338500 load_sprite_sites=5 path_combine2_sites=6 int_tostring_sites=5 concat2_sites=5 array_store_sites=5 runtime_sprite_loads=33 runtime_path_combines=34 loops=7x4_plus_5x1$' "$E/patch.log"
          grep -q '^RUNTIME_CAUSAL_EVIDENCE strict_run=34767194659 candidate=498b34ca2db493d42676a3283edac8126180fd624d6664b3c39e855abfa905ba exception=InvalidProgramException method=ResourceManager.Load_card_Choose_Sprites il_offset=0x018D opcode=stloc_2$' "$E/patch.log"
          grep -q '^PATCH_RESOURCE_MANAGER_CARD_CHOOSE_SPRITES method_body_changes=1 field_metadata_changes=0 source=pc_native_exact_two_loop_reconstruction$' "$E/patch.log"
          grep -q '^REOPEN_RESOURCE_MANAGER_CARD_CHOOSE_SPRITES_PASS token=0x06000222 load_sprite_sites=5 path_combine2_sites=6 int_tostring_sites=5 concat2_sites=5 array_store_sites=5 locals=2 runtime_sprite_loads=33 runtime_path_combines=34$' "$E/patch.log"
          grep -q '^SEMANTIC_ISOLATION_PASS untouched_methods=2316 changed_methods=1 target_token=0x06000222$' "$E/patch.log"
          grep -q '^FIELD_METADATA_ISOLATION_PASS unchanged_fields=2802 changed_fields=0$' "$E/patch.log"
          grep -q '^LOADSPRITES_RECOVERY_PRESERVATION_PASS helper_calls=1$' "$E/patch.log"
          grep -q '^START_RECOVERY_PRESERVATION_PASS load_sprites_calls=1$' "$E/patch.log"
          grep -q '^CARD_CHOOSE_SERIALIZEFIELD_PRESERVATION_PASS fields=17$' "$E/patch.log"
          sha256sum "$DLL" | tee "$E/output-candidate.sha256"
          cp "$DLL" "$E/"
          cp Tools/Stage9ResourceManagerCardChooseSpritesPatch/Evidence.md "$E/native-runtime-evidence.md"
      - name: Independent fixed ILSpy validation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-ccsprites"; E="$OUT/evidence"; DLL="$OUT/GodsPVZRuntime1-card-choose-sprites.dll"
          ILSPY="$(find "$OUT/ilspy" -type f -name ilspycmd | head -1)"
          DOTNET_BIN="$(find "$OUT/ilspy" -type f -path '*/ilspy-runtime/dotnet' | head -1)"
          chmod +x "$ILSPY" "$DOTNET_BIN"; export DOTNET_ROOT="$(dirname "$DOTNET_BIN")"; export PATH="$DOTNET_ROOT:$PATH"
          "$ILSPY" -t 'ResourceManager' "$DLL" > "$E/ResourceManager.cs" 2> "$E/ResourceManager.stderr"; test ! -s "$E/ResourceManager.stderr"
          "$ILSPY" -il -t 'ResourceManager' "$DLL" > "$E/ResourceManager.il" 2> "$E/ResourceManager-il.stderr"; test ! -s "$E/ResourceManager-il.stderr"
          python3 - "$E/ResourceManager.cs" "$E/ResourceManager.il" <<'PY'
          from pathlib import Path
          import re,sys
          cs=Path(sys.argv[1]).read_text(); il=Path(sys.argv[2]).read_text()
          m=re.search(r'\bstatic\s+void\s+Load_card_Choose_Sprites\s*\(\s*\)',cs); assert m
          o=cs.index('{',m.end()); d=0; end=None
          for i in range(o,len(cs)):
              if cs[i]=='{': d+=1
              elif cs[i]=='}':
                  d-=1
                  if d==0: end=i+1; break
          assert end is not None
          b=cs[m.start():end]
          for bad in ['Expected I','Expected O','Unknown result type','Not implemented instruction']:
              assert bad not in b,bad
          assert b.count('InternalResourceLoader.Load<Sprite>')==5, b.count('InternalResourceLoader.Load<Sprite>')
          for x in ['data','lv','innerlining','outerlining','orderArabesques','card_Choose_Data','card_Choose_LvBackgrounds','card_Choose_Innerlining','card_Choose_Outerlining','card_Choose_OrderArabesques']:
              assert x in b,x
          marker='// end of method ResourceManager::Load_card_Choose_Sprites'; e=il.index(marker); s=il.rfind('.method',0,e); ib=il[s:e]
          load='InternalResourceLoader::Load<class [UnityEngine.CoreModule]UnityEngine.Sprite>(string)'
          assert ib.count(load)==5,ib.count(load)
          assert ib.count('System.IO.Path::Combine(string, string)')==6,ib.count('System.IO.Path::Combine(string, string)')
          assert ib.count('System.Int32::ToString()')==5,ib.count('System.Int32::ToString()')
          assert ib.count('System.String::Concat(string, string)')==5,ib.count('System.String::Concat(string, string)')
          assert ib.count('stelem.ref')==5,ib.count('stelem.ref')
          print('ILSPY_CARD_CHOOSE_SPRITES_PASS load_sprite_sites=5 path_combine2_sites=6 int_tostring_sites=5 concat2_sites=5 array_store_sites=5 runtime_sprite_loads=33 runtime_path_combines=34 invalid_il_diagnostics=0')
          PY
      - name: Upload evidence and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-498B-CARD-CHOOSE-SPRITES
          path: ${{ runner.temp }}/stage9-ccsprites/evidence/
          if-no-files-found: warn
          retention-days: 90
