name: Bulk162 overlaid baseline verification (equal-profile differential)
# Run Bulk162 candidate (089cddb1...) under the EXACT SAME official iOS PlaybackEngine overlaid profile to produce equal-profile 26-method attribution differential

on:
  push:
    branches: [repair/native113-bulk188-actions-2026-10-21]
    paths: ['.github/workflows/bulk162-overlaid-baseline-verification.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bulk162-overlaid-baseline-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Record host and select Clang 18
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang++-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang-18 g++
          fi
          mkdir -p "$RUNNER_TEMP/bulk162-bin"
          ln -s "$(command -v clang++-18)" "$RUNNER_TEMP/bulk162-bin/clang++"
          echo "$RUNNER_TEMP/bulk162-bin" >> "$GITHUB_PATH"
          uname -a
          dotnet --info
          clang++-18 --version
          g++ --version
      - name: Download frozen inputs, tools capsule, and Bulk162 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bulk162-downloads"
          gh release download bulk152-actions-checkpoint-2026-10-20             --repo lyiming710-cloud/GodsPVZ-iOS             --pattern PORTABLE-BULK152-CHECKPOINT.tar.gz             --pattern PORTABLE-MANIFEST.json             --dir "$RUNNER_TEMP/bulk162-downloads"
          gh release download bulk162-candidate-2026-10-20             --repo lyiming710-cloud/GodsPVZ-iOS             --pattern candidate1.dll             --dir "$RUNNER_TEMP/bulk162-downloads"
      - name: Authenticate restored files and tools
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions/restore_bulk152_checkpoint.py             --downloads "$RUNNER_TEMP/bulk162-downloads"             --destination "$RUNNER_TEMP/bulk162-portable"             --receipt .validation/bulk162-restore-receipt.json
      - name: Apply authentic official iOS PlaybackEngine dependency profile (exact match to Bulk188)
        shell: bash
        run: |
          set -euo pipefail
          support_target="$RUNNER_TEMP/bulk162-portable/work/il2cpp_stage_coherent/Library/Bee/artifacts/iOS/ManagedStripped"
          official_mod="$GITHUB_WORKSPACE/support/official-unity-2022.3.44f1-ios/UnityEngine.AnimationModule.dll"
          if [ -f "$official_mod" ]; then
            echo "Overlaying official iOS PlaybackEngine UnityEngine.AnimationModule.dll (153088 B)..."
            cp "$official_mod" "$support_target/UnityEngine.AnimationModule.dll"
            sha256sum "$support_target/UnityEngine.AnimationModule.dll"
          else
            echo "ERROR: Official iOS PlaybackEngine assembly missing at $official_mod"
            exit 1
          fi
      - name: Verify Bulk162 candidate hash
        shell: bash
        run: |
          set -euo pipefail
          cand="$RUNNER_TEMP/bulk162-downloads/candidate1.dll"
          echo "Verifying Bulk162 candidate: $cand"
          actual_sha=$(sha256sum "$cand" | awk '{print $1}')
          expected_sha="089cddb15cc5f2d543576c4935e5c861a082a5853118c15f65a4d36e40116da8"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "ERROR: Bulk162 candidate SHA mismatch: $actual_sha != $expected_sha"
            exit 1
          fi
          echo "Bulk162 Candidate SHA-256 confirmed: $actual_sha"
      - name: Execute portable conversion and game-TU verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.validation/bulk162-overlaid-run/verifier_output"
          # Run verify_bulk152_portable.py; note it returns exit code 1 due to remaining unrecovered game methods
          python3 scripts/actions/verify_bulk152_portable.py             --portable-root "$RUNNER_TEMP/bulk162-portable"             --candidate-dll "$RUNNER_TEMP/bulk162-downloads/candidate1.dll"             --output-dir "$GITHUB_WORKSPACE/.validation/bulk162-overlaid-run/verifier_output" || true
      - name: Upload Bulk162 overlaid baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bulk162-Overlaid-Linux-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
          path: |
            .validation/bulk162-restore-receipt.json
            .validation/bulk162-overlaid-run/verifier_output/results/
            .validation/bulk162-overlaid-run/verifier_output/oracle_run/
            .validation/bulk162-overlaid-run/verifier_output/fixture_run/*.json
            .validation/bulk162-overlaid-run/verifier_output/fixture_run/*.log
            .validation/bulk162-overlaid-run/verifier_output/fixture_run/*.txt
            .validation/bulk162-overlaid-run/verifier_output/*.json
            .validation/bulk162-overlaid-run/verifier_output/Archive-v1-*.zip
