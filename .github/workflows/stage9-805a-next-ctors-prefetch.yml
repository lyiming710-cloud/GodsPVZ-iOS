name: Stage9.1 805a next ctor metadata prefetch
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-805a-next-ctors-prefetch.yml','Tools/Stage9CtorPrefetchProbe/**']
permissions: {contents: read, actions: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34957957518, name: Stage9.1-2AD9-POPUP-CTOR-QUALIFIED, path: '${{ runner.temp }}/input'}
      - name: Probe next ctor identities
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/ctor-prefetch"; mkdir -p "$E"
          IN=$(find "$RUNNER_TEMP/input" -type f -name 'GodsPVZRuntime1-popup-ctor.dll' -print -quit); test -n "$IN"
          test "$(sha256sum "$IN"|awk '{print $1}')" = '805a177be099c923daf93a93d98d461312c76711f112c8f778800a69f5874253'
          dotnet run --project Tools/Stage9CtorPrefetchProbe/Stage9CtorPrefetchProbe.csproj -c Release -- "$IN" \
            Almanac_TalentSystem Window_T FlagMeter Almanac_DeviceWindow Window_Q PathDataEditor System0 Administrator System3 SuppliesInfo TextLink LevelItem | tee "$E/next-ctors.txt"
          grep -q '^READONLY_CTOR_PREFETCH_PASS mutation=0$' "$E/next-ctors.txt"
      - uses: actions/upload-artifact@v4
        with: {name: Stage9.1-805A-NEXT-CTORS-PREFETCH, path: '${{ runner.temp }}/ctor-prefetch/', retention-days: 90}
