name: Startup R25 Plant123 fresh IL2CPP and all generated C C++ compiler census

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startup-r25-generic-compiler
  cancel-in-progress: false

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact R25 finite qualification before compiler setup
        run: python3 scripts/actions/validate_startup_r25_checkpoint.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Select Clang18
        shell: bash
        run: |
          set -euo pipefail
          command -v clang++-18
          mkdir -p "$RUNNER_TEMP/compiler-bin"
          ln -s "$(command -v clang++-18)" "$RUNNER_TEMP/compiler-bin/clang++"
          ln -s "$(command -v clang-18)" "$RUNNER_TEMP/compiler-bin/clang"
          echo "$RUNNER_TEMP/compiler-bin" >> "$GITHUB_PATH"
      - name: Download compiler checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/downloads"
          gh release download bulk152-actions-checkpoint-2026-10-20 --repo "$GITHUB_REPOSITORY" --pattern PORTABLE-BULK152-CHECKPOINT.tar.gz --pattern PORTABLE-MANIFEST.json --dir "$RUNNER_TEMP/downloads"
          python3 -m zipfile -e Recovery/Startup-R25-Plant123-2026-10-28/STARTUP-R25-PLANT123-CANDIDATE.zip "$RUNNER_TEMP/downloads"
          echo '9490c1845298fa5afda04fc8dfba915ce2a939eaebe96be83e3311b39557bc4c  STARTUP-R25-PLANT123.dll' | (cd "$RUNNER_TEMP/downloads" && sha256sum -c -)
      - name: Authenticate and restore compiler-only inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions/restore_bulk152_checkpoint.py --downloads "$RUNNER_TEMP/downloads" --destination "$RUNNER_TEMP/portable" --receipt .validation/startup-r25-restore-receipt.json
          module=Recovery/Bulk389-Qualification-2026-10-23/ci/UnityEngine.AnimationModule.dll
          echo "324d1e5ceef2b6fa1d0e3473ce820b451e41f397458afc46708a27aae0aef5e2  $module" | sha256sum -c -
          cp "$module" "$RUNNER_TEMP/portable/work/il2cpp_stage_coherent/Library/Bee/artifacts/iOS/ManagedStripped/UnityEngine.AnimationModule.dll"
      - name: Fresh R4 negative control and exact R25 Plant123 all-source census
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions/check_startup_r25_compiler.py --portable-root "$RUNNER_TEMP/portable" --candidate-dll "$RUNNER_TEMP/downloads/STARTUP-R25-PLANT123.dll" --output-dir "$GITHUB_WORKSPACE/.validation/startup-r25"
      - name: Archive generated sources and raw logs
        if: always()
        shell: bash
        run: |
          if [ -d .validation/startup-r25/candidate/il2cpp_stage/il2cppOutput ]; then
            tar -czf .validation/startup-r25-generated.tar.gz -C .validation/startup-r25/candidate/il2cpp_stage il2cppOutput
          fi
          if [ -d .validation/startup-r25 ]; then
            find .validation/startup-r25 -name '*.json' -o -name '*.log' -o -path '*/il2cpp_conversion/*' | tar -czf .validation/startup-r25-evidence.tar.gz -T -
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Startup-R25-Plant123-compiler-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
          path: |
            .validation/startup-r25-restore-receipt.json
            .validation/startup-r25-evidence.tar.gz
            .validation/startup-r25-generated.tar.gz
            .validation/startup-r25/*.json
