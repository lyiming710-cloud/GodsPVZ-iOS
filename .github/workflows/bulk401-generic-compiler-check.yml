name: Bulk401 fresh generic repairs - all generated compiler census

on:
  push:
    branches: [verify/codex-bulk250-r2-takeover-2026-10-23]
    paths: ['.github/workflows/bulk401-generic-compiler-check.yml', 'scripts/actions/check_bulk401_generics.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bulk401-generic-compiler
  cancel-in-progress: false

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Select Clang18
        shell: bash
        run: |
          set -euo pipefail
          command -v clang++-18
          mkdir -p "$RUNNER_TEMP/compiler-bin"
          ln -s "$(command -v clang++-18)" "$RUNNER_TEMP/compiler-bin/clang++"
          ln -s "$(command -v clang-18)" "$RUNNER_TEMP/compiler-bin/clang"
          echo "$RUNNER_TEMP/compiler-bin" >> "$GITHUB_PATH"
      - name: Download compiler checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/downloads"
          gh release download bulk152-actions-checkpoint-2026-10-20 --repo "$GITHUB_REPOSITORY" --pattern PORTABLE-BULK152-CHECKPOINT.tar.gz --pattern PORTABLE-MANIFEST.json --dir "$RUNNER_TEMP/downloads"
          python3 -m zipfile -e Recovery/Bulk401-Generic-Repair-2026-10-24/BULK401-CANDIDATE.zip "$RUNNER_TEMP/downloads"
          echo '6de4db6c94b80a43876aea060b573ed60c1fa7170cff485103d2c808b94762ae  BULK401-CANDIDATE.dll' | (cd "$RUNNER_TEMP/downloads" && sha256sum -c -)
      - name: Authenticate and restore compiler-only inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions/restore_bulk152_checkpoint.py --downloads "$RUNNER_TEMP/downloads" --destination "$RUNNER_TEMP/portable" --receipt .validation/bulk401-restore-receipt.json
          module=Recovery/Bulk389-Qualification-2026-10-23/ci/UnityEngine.AnimationModule.dll
          echo "324d1e5ceef2b6fa1d0e3473ce820b451e41f397458afc46708a27aae0aef5e2  $module" | sha256sum -c -
          cp "$module" "$RUNNER_TEMP/portable/work/il2cpp_stage_coherent/Library/Bee/artifacts/iOS/ManagedStripped/UnityEngine.AnimationModule.dll"
      - name: Fresh R4 negative control and Bulk401 all-source census
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions/check_bulk401_generics.py --portable-root "$RUNNER_TEMP/portable" --candidate-dll "$RUNNER_TEMP/downloads/BULK401-CANDIDATE.dll" --output-dir "$GITHUB_WORKSPACE/.validation/bulk401"
      - name: Archive generated sources and raw logs
        if: always()
        shell: bash
        run: |
          if [ -d .validation/bulk401/candidate/il2cpp_stage/il2cppOutput ]; then
            tar -czf .validation/bulk401-generated.tar.gz -C .validation/bulk401/candidate/il2cpp_stage il2cppOutput
          fi
          if [ -d .validation/bulk401 ]; then
            find .validation/bulk401 -name '*.json' -o -name '*.log' -o -path '*/il2cpp_conversion/*' | tar -czf .validation/bulk401-evidence.tar.gz -T -
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bulk401-compiler-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
          path: |
            .validation/bulk401-restore-receipt.json
            .validation/bulk401-evidence.tar.gz
            .validation/bulk401-generated.tar.gz
            .validation/bulk401/*.json
