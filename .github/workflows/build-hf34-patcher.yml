name: Build HF34 projectile support patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF34Patch/**'
      - '.github/workflows/build-hf34-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF34 patcher
        run: dotnet publish Tools/HF34Patch/HF34Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf34
      - name: Smoke test
        run: |
          chmod +x out/hf34/GodsPVZ.HF34Patch
          set +e
          out/hf34/GodsPVZ.HF34Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf34/GodsPVZ.HF34Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF34Patch-linux-x64
          path: out/hf34
          if-no-files-found: error
