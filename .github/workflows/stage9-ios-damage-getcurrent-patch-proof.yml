name: Stage9.1 iOS Damage get_Current patch proof

on:
  push:
    branches: [stage9-admin-start-static]
    paths:
      - .github/workflows/stage9-ios-damage-getcurrent-patch-proof.yml

permissions:
  actions: read
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage9-admin-start-static

      - name: Download runtime-qualified DLL
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: '35236211080'
          name: Stage9.1-BGMVOLUME-STATIC-QUALIFIED
          path: dll

      - name: Apply and prove two-byte iOS-only metadata-header repair
        shell: bash
        run: |
          set -euo pipefail
          SRC=dll/GodsPVZRuntime1-bgmvolume.dll
          DST=dll/Assembly-CSharp-ios-linkerfix.dll
          cp "$SRC" "$DST"
          test "$(sha256sum "$SRC" | awk '{print $1}')" = '047054e0db594b6e3385fe4d2555c5932dcd4c28e4b2cb6fb39acbc4336d43ee'
          mkdir -p diagnostics
          python3 - "$SRC" "$DST" diagnostics/ios-damage-getcurrent-patch-proof.txt <<'PY'
          import hashlib,struct,sys
          src,dst,report=sys.argv[1:]
          orig=open(src,'rb').read(); b=bytearray(open(dst,'rb').read())
          def u16(o): return struct.unpack_from('<H',b,o)[0]
          def u32(o): return struct.unpack_from('<I',b,o)[0]
          pe=u32(0x3c); assert b[pe:pe+4]==b'PE\0\0'
          coff=pe+4; nsec=u16(coff+2); optsz=u16(coff+16); chars_off=coff+18
          assert u16(chars_off)==0x0122
          # Repair IMAGE_FILE_DLL: proven independently by run 35363174000.
          struct.pack_into('<H',b,chars_off,u16(chars_off)|0x2000)
          opt=coff+20; sec=opt+optsz
          def rva_to_off(rva):
              for i in range(nsec):
                  s=sec+i*40
                  vsize=u32(s+8); va=u32(s+12); rawsz=u32(s+16); raw=u32(s+20)
                  if va <= rva < va+max(vsize,rawsz): return raw+(rva-va)
              raise ValueError(hex(rva))
          # Mono.Cecil audit locked Damage.AddElement at MethodDef 0x010b, RVA 0x14e70.
          body=rva_to_off(0x14e70)
          fs=u16(body)
          if (fs & 3)==2: hsize=1
          elif (fs & 3)==3: hsize=((fs>>12)&0xF)*4
          else: raise AssertionError(f'bad method header 0x{fs:04x}')
          code=body+hsize
          assert b[code+0x19]==0x28, hex(b[code+0x19]) # call
          tok_off=code+0x1a
          before_tok=u32(tok_off)
          assert before_tok==0x0A0000C3, hex(before_tok)
          struct.pack_into('<I',b,tok_off,0x0A0000E7)
          after_tok=u32(tok_off)
          diffs=[(i,orig[i],b[i]) for i in range(len(b)) if orig[i]!=b[i]]
          assert len(diffs)==2, diffs
          assert diffs[0][0]==chars_off+1 and diffs[0][1:]==(0x01,0x21), diffs
          assert diffs[1][0]==tok_off and diffs[1][1:]==(0xC3,0xE7), diffs
          open(dst,'wb').write(b)
          sha=hashlib.sha256(b).hexdigest()
          with open(report,'w') as f:
              f.write(f'original_sha256={hashlib.sha256(orig).hexdigest()}\n')
              f.write(f'combined_sha256={sha}\n')
              f.write(f'pe_dll_byte_offset=0x{chars_off+1:x} 01->21\n')
              f.write(f'Damage.AddElement.rva=0x14e70\n')
              f.write(f'method_file_offset=0x{body:x}\n')
              f.write(f'method_header_size={hsize}\n')
              f.write(f'code_file_offset=0x{code:x}\n')
              f.write(f'IL_0019_opcode=0x{b[code+0x19]:02x}\n')
              f.write(f'IL_0019_operand_file_offset=0x{tok_off:x}\n')
              f.write(f'IL_0019_token_before=0x{before_tok:08x}\n')
              f.write(f'IL_0019_token_after=0x{after_tok:08x}\n')
              f.write(f'byte_diff_count={len(diffs)}\n')
              for i,x,y in diffs: f.write(f'diff=0x{i:x} {x:02x}->{y:02x}\n')
          print(open(report).read())
          PY

          TMP=$(mktemp -d); cd "$TMP"
          dotnet new console --framework net8.0 --force >/dev/null
          dotnet add package Mono.Cecil --version 0.11.5 >/dev/null
          cat > Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          class P {
            static IEnumerable<TypeDefinition> AT(TypeDefinition t){yield return t; foreach(var n in t.NestedTypes) foreach(var x in AT(n)) yield return x;}
            static IEnumerable<TypeDefinition> AT(ModuleDefinition m)=>m.Types.SelectMany(AT);
            static int CountMethods(TypeDefinition t)=>t.Methods.Count+t.NestedTypes.Sum(CountMethods);
            static void Main(string[] args){
              using var a=AssemblyDefinition.ReadAssembly(Path.GetFullPath(args[0]),new ReaderParameters{InMemory=true});
              var m=a.MainModule;
              var d=AT(m).Single(t=>t.FullName=="Damage");
              var md=d.Methods.Single(x=>x.Name=="AddElement" && x.Parameters.Count==1 && x.Parameters[0].ParameterType.FullName=="Element");
              var ins=md.Body.Instructions.Single(i=>i.Offset==0x19);
              if(ins.Operand is not MethodReference mr) throw new Exception("IL_0019 not MethodReference");
              Console.WriteLine("module_kind="+m.Kind);
              Console.WriteLine("methoddefs="+m.Types.Sum(CountMethods));
              Console.WriteLine("method_token="+md.MetadataToken);
              Console.WriteLine("il0019_operand_token="+mr.MetadataToken);
              Console.WriteLine("il0019_operand_full="+mr.FullName);
              Console.WriteLine("il0019_decl="+mr.DeclaringType.FullName);
              if(mr.DeclaringType is GenericInstanceType gi){
                Console.WriteLine("il0019_gargs="+string.Join(",",gi.GenericArguments.Select(x=>x.FullName)));
                Console.WriteLine("il0019_orphan_gp="+gi.GenericArguments.OfType<GenericParameter>().Any(g=>g.Owner==null));
              }
              if(m.Kind!=ModuleKind.Dll) throw new Exception("not DLL kind");
              if(m.Types.Sum(CountMethods)!=2317) throw new Exception("MethodDef count changed");
              if(mr.MetadataToken.ToUInt32()!=0x0A0000E7) throw new Exception("wrong MemberRef token");
              if(mr.DeclaringType.FullName!="System.Collections.Generic.List`1/Enumerator<Element>") throw new Exception("wrong declaring type");
            }
          }
          CS
          dotnet run --no-restore -- "$GITHUB_WORKSPACE/$DST" | tee -a "$GITHUB_WORKSPACE/diagnostics/ios-damage-getcurrent-patch-proof.txt"
          cd "$GITHUB_WORKSPACE"
          cat diagnostics/ios-damage-getcurrent-patch-proof.txt

      - name: Upload combined iOS linker-fix DLL candidate
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-IOS-DAMAGE-GETCURRENT-LINKERFIX
          path: dll/Assembly-CSharp-ios-linkerfix.dll
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Commit proof report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/ios-damage-getcurrent-patch-proof.txt
          git commit -m 'diagnostics: prove Damage.AddElement one-byte MemberRef repair' || exit 0
          git push origin HEAD:stage9-admin-start-static
