name: Stage9.1 dc39 Plant ctor strict runtime gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-dc39-plant-ctor-runtime-gate.yml'
permissions:
  contents: read
  actions: read
jobs:
  strict-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
      - name: Download exact cached R3 archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34747460206
          pattern: Stage9.1-r3-exact-archive
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-dc39/r3-cache
      - name: Download validated Plant ctor candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34795946769
          pattern: Stage9.1-BATCH1-PLANT-CTOR-NATIVE
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-dc39/candidate
      - name: Download exact Unity editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-dc39/editor-parts
      - name: Run exact R3 strict Board gate
        shell: bash
        run: |
          set -euo pipefail
          bash Tools/Stage9RuntimeGate/run-strict-board.sh \
            "$RUNNER_TEMP/stage9-dc39" \
            "$RUNNER_TEMP/stage9-dc39/candidate/GodsPVZRuntime1-plant-ctor.dll" \
            "dc39b8bcbfcd61f04acf2c18c42e24583e9a6e75248bb24b6aae9e381b19f173"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-DC39-PLANT-CTOR-MAINMENU-SAVE-BOARD-RUNTIME
          path: ${{ runner.temp }}/stage9-dc39/evidence/
          if-no-files-found: warn
          retention-days: 90
