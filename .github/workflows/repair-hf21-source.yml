name: Repair HF21 source

on:
  push:
    branches: [ high-fidelity ]
    paths:
      - '.github/workflows/repair-hf21-source.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: high-fidelity
      - name: Apply exact HF21 source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tools/HF21Patch/Program.cs')
          s = p.read_text()
          reps = [
              ('var getTransform = R("UnityEngine.Component", "get_transform");\n', 'var getTransform = R("UnityEngine.Component", "get_transform");\nvar gameGetTransform = R("UnityEngine.GameObject", "get_transform");\n'),
              ('E(il, OpCodes.Ldarg_0); E(il, OpCodes.Ldfld, pProjectileSprite); E(il, OpCodes.Call, getTransform); E(il, OpCodes.Ldloc, zero);', 'E(il, OpCodes.Ldarg_0); E(il, OpCodes.Ldfld, pProjectileSprite); E(il, OpCodes.Call, gameGetTransform); E(il, OpCodes.Ldloc, zero);'),
              ('E(il, OpCodes.Ldarg_0); E(il, OpCodes.Ldfld, pProjectileAnimation); E(il, OpCodes.Call, getTransform); E(il, OpCodes.Ldloc, zero);', 'E(il, OpCodes.Ldarg_0); E(il, OpCodes.Ldfld, pProjectileAnimation); E(il, OpCodes.Call, gameGetTransform); E(il, OpCodes.Ldloc, zero);'),
              ('E(il, OpCodes.Ldloc, go); E(il, OpCodes.Call, getTransform);\n    E(il, OpCodes.Ldarg_0); E(il, OpCodes.Ldfld, pProjectileSprite); E(il, OpCodes.Call, getTransform);', 'E(il, OpCodes.Ldloc, go); E(il, OpCodes.Call, gameGetTransform);\n    E(il, OpCodes.Ldarg_0); E(il, OpCodes.Ldfld, pProjectileSprite); E(il, OpCodes.Call, gameGetTransform);'),
              ('E(il, OpCodes.Ldloc, go); E(il, OpCodes.Call, getTransform);\n    E(il, OpCodes.Ldarg_0); E(il, OpCodes.Call, getTransform);', 'E(il, OpCodes.Ldloc, go); E(il, OpCodes.Call, gameGetTransform);\n    E(il, OpCodes.Ldarg_0); E(il, OpCodes.Call, getTransform);'),
              ('E(il, OpCodes.Ldloc, value); E(il, OpCodes.Ldnull); E(il, OpCodes.Call, objectInequality); E(il, OpCodes.Brtrue, found);', 'E(il, OpCodes.Ldloc, value); E(il, OpCodes.Call, objectImplicit); E(il, OpCodes.Brtrue, found);'),
          ]
          for old, new in reps:
              if old not in s:
                  raise SystemExit(f'expected repair pattern missing: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          echo '46089e922b0390c762c0368c8bdb57366bb7b88672dbc34ea461fc787a75761d  Tools/HF21Patch/Program.cs' | sha256sum -c -
          test "$(wc -c < Tools/HF21Patch/Program.cs)" -eq 35415
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tools/HF21Patch/Program.cs
          git commit -m 'Fix HF21 Unity method refs and prefab test'
          git push origin HEAD:high-fidelity
