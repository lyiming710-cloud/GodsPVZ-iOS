name: Stage9.1 exact-editor Personal license gate v3

on:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-unity-license-gate-preserved-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  personal-license-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Verify account secrets are present without exposing them
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${UNITY_EMAIL:-}" ] || { echo 'UNITY_EMAIL secret missing/empty' >&2; exit 71; }
          [ -n "${UNITY_PASSWORD:-}" ] || { echo 'UNITY_PASSWORD secret missing/empty' >&2; exit 72; }
          echo 'Required Unity account secrets are present.'

      - name: Download preserved exact Editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-editor-parts

      - name: Reconstruct and verify exact Unity China 2022.3.44f1c1
        shell: bash
        run: |
          set -euo pipefail
          PARTS="$RUNNER_TEMP/stage9-editor-parts"
          OUT="$RUNNER_TEMP/stage9-license-v3"
          EDITOR="$OUT/editor"
          EVIDENCE="$OUT/evidence"
          mkdir -p "$EDITOR" "$EVIDENCE"

          cat > "$OUT/expected.sha256" <<'EOF'
          c2cb7252b28c99581fd1ebfa7bd0d63b82fbdfd66ed9323327560eab9f9c5b12  Unity-China-2022.3.44f1c1.tar.xz.part-00
          6f9af6d8bfae2d0dcb5482778fdb2ffee9bf8a4eb32b3030601d2d817eff5380  Unity-China-2022.3.44f1c1.tar.xz.part-01
          daf4e501efa59d388cec09fb1bb69fb71b074933c20389748fc1aaab5b4f1b6e  Unity-China-2022.3.44f1c1.tar.xz.part-02
          e8870b1b8ac3354302b3d4c7fa80a74249d3f2ca1d442a0fb978448ad2b7a586  Unity-China-2022.3.44f1c1.tar.xz.part-03
          115be82c7f103fd0888e28ee316c6cd1e877d4d14939388e3be40d877e8591d4  Unity-China-2022.3.44f1c1.tar.xz.part-04
          2efe6703f8a4b871275bde3c742c61d5b4a3322bb56fcbaf417cb9a80e90a97e  Unity-China-2022.3.44f1c1.tar.xz.part-05
          e7b300ff6e5639c0e5d6cbc065ec6918e4dc4d36ae8abab8f97c896af8b595f1  Unity-China-2022.3.44f1c1.tar.xz.part-06
          00f364a9e6619acd9ed466ae46055a9480d7c62a76914f713e69c3fa94abf151  Unity-China-2022.3.44f1c1.tar.xz.part-07
          0f7b8225b57960ba08b104f20869ce42707c17df290c143d4e3bd9dc3a26c0e2  Unity-China-2022.3.44f1c1.tar.xz.part-08
          6930abaf854320d200b069d135800fc310abcb0cb9a910e88ce68693e69a6d0a  Unity-China-2022.3.44f1c1.tar.xz.part-09
          47b0bb1451d33932ee9f56fea9f10d7ffbffd578b8105c212401119182c3d0f0  Unity-China-2022.3.44f1c1.tar.xz.part-10
          b5377382ceb94492a1c5288aee7c598f0495cfd108666ba2857059f6ecd92b7f  Unity-China-2022.3.44f1c1.tar.xz.part-11
          9d6c3a3e5c94104c783620c13095460638604f9ca92fb5017d1142970710e116  Unity-China-2022.3.44f1c1.tar.xz.part-12
          7541e40151f60c3882a82650595a4d9a97f2fdc2fe49469f440aef8f7996cc0a  Unity-China-2022.3.44f1c1.tar.xz.part-13
          c364240981c3a762bc3be6b61db0170bd7d168b3e7c3d14d48770e72e897e830  Unity-China-2022.3.44f1c1.tar.xz.part-14
          EOF

          COUNT="$(find "$PARTS" -maxdepth 1 -type f -name 'Unity-China-2022.3.44f1c1.tar.xz.part-*' | wc -l)"
          [ "$COUNT" = 15 ] || { echo "Expected 15 parts, got $COUNT" >&2; exit 73; }
          (cd "$PARTS" && sha256sum -c "$OUT/expected.sha256") > "$EVIDENCE/part-sha256-check.txt"

          FULL_SHA="$(cat "$PARTS"/Unity-China-2022.3.44f1c1.tar.xz.part-* | sha256sum | awk '{print $1}')"
          FULL_SIZE="$(cat "$PARTS"/Unity-China-2022.3.44f1c1.tar.xz.part-* | wc -c)"
          printf '%s\n' "$FULL_SHA" > "$EVIDENCE/editor-sha256.txt"
          printf '%s\n' "$FULL_SIZE" > "$EVIDENCE/editor-size.txt"
          [ "$FULL_SHA" = '0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14' ] || exit 74
          [ "$FULL_SIZE" = '3906640940' ] || exit 75
          cat "$PARTS"/Unity-China-2022.3.44f1c1.tar.xz.part-* | xz -t

          (
            for p in "$PARTS"/Unity-China-2022.3.44f1c1.tar.xz.part-*; do
              cat "$p"
              rm -f "$p"
            done
          ) | xz -dc | tar -xf - -C "$EDITOR"

          UNITY="$EDITOR/Editor/Unity"
          CLIENT="$EDITOR/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          [ -x "$UNITY" ] || chmod +x "$UNITY"
          [ -x "$CLIENT" ] || chmod +x "$CLIENT"
          VERSION_OUT="$("$UNITY" -version 2>&1)"
          printf '%s\n' "$VERSION_OUT" > "$EVIDENCE/unity-version-raw.txt"
          printf '%s\n' "$VERSION_OUT" | grep -q '2022.3.44f1c1' || exit 76
          "$CLIENT" --help > "$EVIDENCE/licensing-client-help.txt" 2>&1 || true
          grep -q -- '--include-personal' "$EVIDENCE/licensing-client-help.txt" || { echo 'Licensing Client lacks --include-personal' >&2; exit 77; }
          printf '%s\n' "$UNITY" > "$OUT/unity-path.txt"
          printf '%s\n' "$CLIENT" > "$OUT/client-path.txt"
          echo 'Exact Editor reconstruction and Personal-capability gate PASS.'

      - name: Acquire Personal seat and verify exact Editor can launch licensed
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-license-v3"
          EVIDENCE="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          CLIENT="$(cat "$OUT/client-path.txt")"
          RAW_ACT="$OUT/account-activation-raw.log"
          RAW_PROBE="$OUT/editor-probe-raw.log"
          PROBE_PROJECT="$RUNNER_TEMP/stage9-license-probe-project"
          mkdir -p "$PROBE_PROJECT/Assets" "$PROBE_PROJECT/ProjectSettings"
          cat > "$PROBE_PROJECT/ProjectSettings/ProjectVersion.txt" <<'EOF'
          m_EditorVersion: 2022.3.44f1c1
          m_EditorVersionWithRevision: 2022.3.44f1c1 (3b7236a27678)
          EOF
          SEAT_ACQUIRED=0

          sanitize() {
            python3 - "$1" "$2" <<'PY'
          import re,sys
          src,dst=sys.argv[1:3]
          lines=open(src,'r',encoding='utf-8',errors='replace').read().splitlines() if __import__('os').path.exists(src) else ['<missing>']
          sensitive=re.compile(r'(access.?token|refresh.?token|password|e-?mail|username|user name|license key|serial number|serial:|machine id|session id|correlation id)',re.I)
          open(dst,'w',encoding='utf-8').write('\n'.join('[REDACTED POTENTIALLY SENSITIVE LICENSE LINE]' if sensitive.search(x) else x for x in lines)+'\n')
          PY
          }

          cleanup() {
            if [ "$SEAT_ACQUIRED" = 1 ]; then
              "$CLIENT" --return-ulf >/dev/null 2>&1 || true
            fi
            rm -f "$RAW_ACT" "$RAW_PROBE"
          }
          trap cleanup EXIT

          set +e
          "$CLIENT" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > "$RAW_ACT" 2>&1
          ACT_EXIT=$?
          set -e
          sanitize "$RAW_ACT" "$EVIDENCE/account-activation-sanitized.log"
          printf '%s\n' "$ACT_EXIT" > "$EVIDENCE/account-activation-exit.txt"

          if [ "$ACT_EXIT" -ne 0 ] || grep -qiE 'No seat available|No license activation found for this computer' "$RAW_ACT"; then
            echo 'Personal seat acquisition failed.' >&2
            exit 78
          fi
          if grep -qE 'ASSIGN_SEAT|Activation processed successfully|Successfully updated UnityEntitlementLicense.xml' "$RAW_ACT"; then
            SEAT_ACQUIRED=1
          else
            echo 'Activation returned zero but no positive seat-assignment evidence was observed.' >&2
            exit 79
          fi

          set +e
          "$UNITY" -batchmode -nographics -quit -projectPath "$PROBE_PROJECT" -logFile "$RAW_PROBE"
          PROBE_EXIT=$?
          set -e
          sanitize "$RAW_PROBE" "$EVIDENCE/editor-probe-sanitized.log"
          printf '%s\n' "$PROBE_EXIT" > "$EVIDENCE/editor-probe-exit.txt"

          FATAL=0
          grep -qiE 'No valid Unity Editor license found|License is not active' "$RAW_PROBE" && FATAL=1 || true
          ENTITLEMENT=0
          grep -q 'Successfully resolved entitlement details' "$RAW_PROBE" && ENTITLEMENT=1 || true

          python3 - "$EVIDENCE/RESULT.json" "$ACT_EXIT" "$PROBE_EXIT" "$FATAL" "$ENTITLEMENT" <<'PY'
          import json,sys
          p=sys.argv[1]
          act,probe,fatal,ent=map(int,sys.argv[2:])
          passed=(act==0 and probe==0 and fatal==0 and ent==1)
          d={
            'gate':'STAGE9_1_EXACT_EDITOR_PERSONAL_LICENSE_GATE_V3',
            'editor':'Unity China 2022.3.44f1c1',
            'editor_sha256':'0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14',
            'activation_method':'Unity.Licensing.Client --activate-all --include-personal',
            'account_activation_exit':act,
            'editor_probe_exit':probe,
            'fatal_license_signature':bool(fatal),
            'entitlement_resolution_observed':bool(ent),
            'license_gate_pass':passed,
            'formal_r2_import_attempted':False,
            'r2_touched':False,
            'hf56_authorized':False,
          }
          open(p,'w',encoding='utf-8').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps(d,indent=2,sort_keys=True))
          if not passed: raise SystemExit(80)
          PY

          echo 'STAGE9.1 exact-editor Personal license gate PASS.'

      - name: Upload sanitized v3 gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-exact-editor-personal-license-gate-v3-evidence
          path: ${{ runner.temp }}/stage9-license-v3/evidence/
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
          compression-level: 6
