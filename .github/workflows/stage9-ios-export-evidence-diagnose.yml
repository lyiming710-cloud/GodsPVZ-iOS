name: Stage9.1 iOS export evidence diagnose

on:
  workflow_dispatch:
  push:
    branches: [stage9-admin-start-static]
    paths:
      - .github/workflows/stage9-ios-export-evidence-diagnose.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download failed export evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: '35353200355'
          name: Stage9.1-CURRENT-BASELINE-IOS-XCODE-EVIDENCE
          path: evidence

      - name: Extract third-export fatal chain
        shell: bash
        run: |
          set -euo pipefail
          LOG=evidence/ios-export.log
          echo '=== EXIT / GRAPHICS / TARGET ==='
          cat evidence/ios-export-exit.txt || true
          cat evidence/software-gl-max-texture.txt || true
          grep -n -m 8 -E 'STAGE9_IOS_TARGET|activeBuildTarget|architecture=' "$LOG" || true
          echo '=== ERROR SUMMARY ==='
          grep -nE 'NullReferenceException|MissingReferenceException|BuildFailedException|UnityLinker|ManagedStripped|IL2CPP|Exception:|error CS|^Error|Build completed|Player build failed|BuildFailed|Failed' "$LOG" | tail -n 240 || true
          echo '=== CONTEXT AROUND LAST MATERIAL ERRORS ==='
          python3 - "$LOG" <<'PY'
          from pathlib import Path
          import re,sys
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          pat=re.compile(r'NullReferenceException|MissingReferenceException|BuildFailedException|UnityLinker|ManagedStripped|IL2CPP|Player build failed|BuildFailed|Exception:',re.I)
          hits=[i for i,l in enumerate(lines) if pat.search(l)]
          print('material_hits=',len(hits),'lines=',len(lines))
          for i in hits[-12:]:
              print(f'--- context line {i+1} ---')
              for j in range(max(0,i-18),min(len(lines),i+38)):
                  print(f'{j+1}: {lines[j]}')
          print('=== LOG TAIL 260 ===')
          for j in range(max(0,len(lines)-260),len(lines)):
              print(f'{j+1}: {lines[j]}')
          PY
