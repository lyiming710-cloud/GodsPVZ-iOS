name: Stage9.1 iOS export evidence diagnose

on:
  workflow_dispatch:
  push:
    branches: [stage9-admin-start-static]
    paths:
      - .github/workflows/stage9-ios-export-evidence-diagnose.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download failed export evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: '35342840940'
          name: Stage9.1-CURRENT-BASELINE-IOS-XCODE-EVIDENCE
          path: evidence

      - name: Extract UnityLinker null-reference stack
        shell: bash
        run: |
          set -euo pipefail
          LOG=evidence/ios-export.log
          echo '=== EXIT/TARGET ==='
          cat evidence/ios-export-exit.txt || true
          grep -n -m 3 -E 'STAGE9_IOS_TARGET|activeBuildTarget|architecture=' "$LOG" || true
          echo '=== UNITYLINKER NRE CONTEXT ==='
          python3 - "$LOG" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          hits=[i for i,l in enumerate(lines) if 'System.NullReferenceException' in l]
          print('nre_count=',len(hits))
          for k,i in enumerate(hits,1):
              print(f'--- NRE {k} line {i+1} ---')
              for j in range(max(0,i-20),min(len(lines),i+45)):
                  print(f'{j+1}: {lines[j]}')
          PY
          echo '=== UNITYLINKER COMMAND/RESULT WINDOW ==='
          sed -n '11960,12025p' "$LOG" || true
