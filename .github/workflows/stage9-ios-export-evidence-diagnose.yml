name: Stage9.1 iOS export evidence diagnose

on:
  workflow_dispatch:
  push:
    branches: [stage9-admin-start-static]
    paths:
      - .github/workflows/stage9-ios-export-evidence-diagnose.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download failed export evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: '35342840940'
          name: Stage9.1-CURRENT-BASELINE-IOS-XCODE-EVIDENCE
          path: evidence

      - name: Print concise deterministic diagnosis
        shell: bash
        run: |
          set -euo pipefail
          LOG=evidence/ios-export.log
          echo '=== EXIT ==='
          cat evidence/ios-export-exit.txt || true
          echo '=== TARGET ==='
          grep -n -m 3 -E 'STAGE9_IOS_TARGET|activeBuildTarget|architecture=' "$LOG" || true
          echo '=== ARMV7 ==='
          grep -n -m 5 -Ei 'ARMv7|armv7|32[- ]bit' "$LOG" || true
          echo '=== FIRST MATERIAL FAILURE AFTER TARGET ==='
          python3 - "$LOG" <<'PY'
          from pathlib import Path
          import re,sys
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          start=next((i for i,l in enumerate(lines) if 'STAGE9_IOS_TARGET' in l),0)
          pats=[
              re.compile(r'armv7|32[- ]bit',re.I),
              re.compile(r'BuildFailedException|Build failure|BuildPlayer.*failed|build.*failed',re.I),
              re.compile(r'Unhandled exception|Exception:',re.I),
              re.compile(r'IL2CPP.*(error|failed)|Bee.*(error|failed)|error CS\d+',re.I),
          ]
          hit=None
          for i in range(start,len(lines)):
              if any(p.search(lines[i]) for p in pats):
                  hit=i; break
          if hit is None:
              print('NO_MATERIAL_FAILURE_MATCH')
          else:
              print(f'FIRST_MATCH_LINE={hit+1}')
              a=max(start,hit-15); b=min(len(lines),hit+55)
              for j in range(a,b): print(f'{j+1}: {lines[j]}')
          PY
          echo '=== TAIL80 ==='
          tail -n 80 "$LOG" || true
