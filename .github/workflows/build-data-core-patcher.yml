name: Build data core patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/DataCorePatch/**'
      - '.github/workflows/build-data-core-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish Tools/DataCorePatch/DataCorePatch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/data-core
      - name: Smoke test
        run: |
          chmod +x publish/data-core/GodsPVZ.DataCorePatch
          set +e
          publish/data-core/GodsPVZ.DataCorePatch
          code=$?
          set -e
          test "$code" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-DataCorePatch-linux-x64
          path: publish/data-core/GodsPVZ.DataCorePatch
          if-no-files-found: error
