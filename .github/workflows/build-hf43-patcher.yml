name: Build HF43 Animation rate core patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF43Patch/**'
      - '.github/workflows/build-hf43-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF43 patcher
        run: dotnet publish Tools/HF43Patch/HF43Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf43
      - name: Smoke test
        run: |
          chmod +x out/hf43/GodsPVZ.HF43Patch
          set +e
          out/hf43/GodsPVZ.HF43Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf43/GodsPVZ.HF43Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF43Patch-linux-x64
          path: out/hf43
          if-no-files-found: error
