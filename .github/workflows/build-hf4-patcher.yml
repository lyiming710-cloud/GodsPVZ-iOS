name: Build HF4 Zombie Awake patcher

on:
  workflow_dispatch:
  push:
    branches: [ high-fidelity ]
    paths:
      - 'Tools/HF4Patch/**'
      - '.github/workflows/build-hf4-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF4 patcher
        run: dotnet publish Tools/HF4Patch/HF4Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o out/hf4
      - name: Smoke test usage
        shell: bash
        run: |
          chmod +x out/hf4/GodsPVZ.HF4Patch
          set +e
          out/hf4/GodsPVZ.HF4Patch
          code=$?
          set -e
          test "$code" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF4Patch-linux-x64
          path: out/hf4/GodsPVZ.HF4Patch
          if-no-files-found: error
