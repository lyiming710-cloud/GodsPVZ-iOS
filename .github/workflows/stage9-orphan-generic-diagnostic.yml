name: Stage9 Orphan Generic Diagnostic

on:
  push:
    branches:
      - stage9-local-audit-tools
    paths:
      - '.github/workflows/stage9-orphan-generic-diagnostic.yml'
      - 'Tools/Stage9OrphanGenericDiagnostic/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUN8_ARTIFACT_ID: '10574264630'
      RUN8_ARTIFACT_SHA256: '68469c45adb5470fd9c23e7a4dde536ae56f08d2a99d4a22c5092a06bec2ac7b'
      RUN8_DLL_SHA256: 'f47b1b37f1d4d3a1ddeb44bb6dbe399c58dc6dee3d4602618b2790f839d3e321'
      EXPECTED_ALL24: 'b07254d5c4077e013bbc934734f7b0949c0942a4e667d6d2b23d2af6c830f720'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin .NET 8
        shell: bash
        run: |
          set -euo pipefail
          SDK8="$(dotnet --list-sdks | awk '$1 ~ /^8\./ {v=$1} END{print v}')"
          test -n "$SDK8"
          printf '{"sdk":{"version":"%s","rollForward":"latestPatch"}}\n' "$SDK8" > global.json
          dotnet --version | grep -E '^8\.'

      - name: Rebuild locked all24 candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _diag/run8 _diag/out
          curl -fL --retry 4 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUN8_ARTIFACT_ID}/zip" \
            -o _diag/run8.zip
          test "$(sha256sum _diag/run8.zip | awk '{print $1}')" = "$RUN8_ARTIFACT_SHA256"
          unzip -qq _diag/run8.zip -d _diag/run8
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          exp='f47b1b37f1d4d3a1ddeb44bb6dbe399c58dc6dee3d4602618b2790f839d3e321'
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          hits=[p for p in Path('_diag/run8').rglob('*') if p.is_file() and sha(p)==exp]
          if len(hits)!=1: raise SystemExit(f'run8 matches={hits}')
          Path('_diag/run8-path.txt').write_text(str(hits[0].resolve())+'\n')
          PY
          python3 Tools/Stage9MemberRefAudit/build_all24_candidate.py \
            "$(cat _diag/run8-path.txt)" _diag/out/Assembly-CSharp-all24.dll \
            --manifest _diag/out/builder-manifest.json > _diag/out/builder.stdout.json
          test "$(sha256sum _diag/out/Assembly-CSharp-all24.dll | awk '{print $1}')" = "$EXPECTED_ALL24"

      - name: Dump orphan and Element Enumerator metadata context
        shell: bash
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="$PWD/_diag/nuget"
          dotnet restore Tools/Stage9OrphanGenericDiagnostic/Stage9OrphanGenericDiagnostic.csproj --packages "$NUGET_PACKAGES"
          dotnet run --project Tools/Stage9OrphanGenericDiagnostic/Stage9OrphanGenericDiagnostic.csproj --no-restore -- \
            _diag/out/Assembly-CSharp-all24.dll | tee _diag/out/orphan-diagnostic.log
          grep -q '^STAGE9_ORPHAN_DIAGNOSTIC_OK$' _diag/out/orphan-diagnostic.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-orphan-generic-diagnostic
          path: _diag/out
          if-no-files-found: warn
          retention-days: 30
