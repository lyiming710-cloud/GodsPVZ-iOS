name: Stage9 Administrator.Start MemberRef probe

on:
  push:
    branches: [stage9-admin-start-static]
    paths:
      - '.github/workflows/stage9-administrator-start-memberref-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_RUN_ID: '34990527235'
      SOURCE_ARTIFACT: Stage9.1-FE67-TEXTLINK-UPDATE-QUALIFIED
      EXPECTED_INPUT_SHA: 26064265fdba4e9b501f0c3312260503fdde43b9e111072c19dd39891e5ca022
    steps:
      - name: Download exact qualified baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT }}
          path: ${{ runner.temp }}/probe/input
      - name: Lock baseline and probe generic MemberRefs
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find "$RUNNER_TEMP/probe/input" -type f -name 'GodsPVZRuntime1-textlink-update.dll' -print -quit)
          test -n "$DLL"
          test "$(sha256sum "$DLL" | awk '{print $1}')" = "$EXPECTED_INPUT_SHA"
          mkdir -p "$RUNNER_TEMP/probe/src"
          cat > "$RUNNER_TEMP/probe/src/probe.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup>
            <ItemGroup><PackageReference Include="Mono.Cecil" Version="0.11.6" /></ItemGroup>
          </Project>
          EOF
          cat > "$RUNNER_TEMP/probe/src/Program.cs" <<'EOF'
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          static IEnumerable<TypeDefinition> AllTypes(IEnumerable<TypeDefinition> roots) { foreach (var t in roots) { yield return t; foreach (var n in AllTypes(t.NestedTypes)) yield return n; } }
          static uint Raw(IMetadataTokenProvider p) => p.MetadataToken.ToUInt32();
          static string Kind(TypeReference t) => t.GetType().Name;
          var path=args[0];
          using var m=ModuleDefinition.ReadModule(path, new ReaderParameters{InMemory=true,ReadingMode=ReadingMode.Immediate});
          var methods=AllTypes(m.Types).SelectMany(t=>t.Methods).Where(x=>x.HasBody).ToList();
          var wanted=new HashSet<string>{"GetEnumerator","get_Current","MoveNext","Dispose","get_Item"};
          Console.WriteLine("=== MEMBERREF TABLE ===");
          foreach(var r in m.GetMemberReferences().OfType<MethodReference>().Where(r=>wanted.Contains(r.Name) && r.DeclaringType.FullName.Contains("System.Collections.Generic.List`1",StringComparison.Ordinal)).OrderBy(r=>Raw(r))) {
            var gi=r.DeclaringType as GenericInstanceType;
            Console.WriteLine($"REF token=0x{Raw(r):X8} full={r.FullName} declKind={Kind(r.DeclaringType)} decl={r.DeclaringType.FullName} declElem={(gi?.ElementType.FullName??"-")} args={(gi is null?"-":string.Join(",",gi.GenericArguments.Select(a=>a.FullName)))} retKind={Kind(r.ReturnType)} ret={r.ReturnType.FullName}");
          }
          Console.WriteLine("=== ACTUAL USE SITES ===");
          foreach(var md in methods) foreach(var i in md.Body.Instructions) if(i.Operand is MethodReference r && wanted.Contains(r.Name) && r.DeclaringType.FullName.Contains("System.Collections.Generic.List`1",StringComparison.Ordinal))
            Console.WriteLine($"USE owner=0x{Raw(md):X8} {md.FullName} op={i.OpCode.Code} ref=0x{Raw(r):X8} {r.FullName}");
          Console.WriteLine("=== FOCUS TOKENS ===");
          foreach(uint tok in new uint[]{0x0A0000FB,0x0A0000FC,0x0A0000FD,0x0A000126,0x0A0001EC}) {
            var p=m.LookupToken(new MetadataToken(tok)); Console.WriteLine($"FOCUS 0x{tok:X8} type={p?.GetType().Name??"null"} value={p}");
            if(p is MethodReference r) {
              var gi=r.DeclaringType as GenericInstanceType;
              Console.WriteLine($"  full={r.FullName} declKind={Kind(r.DeclaringType)} elem={(gi?.ElementType.FullName??"-")} args={(gi is null?"-":string.Join(",",gi.GenericArguments.Select(a=>a.FullName)))} retKind={Kind(r.ReturnType)} ret={r.ReturnType.FullName}");
            }
          }
          EOF
          dotnet run --project "$RUNNER_TEMP/probe/src/probe.csproj" -- "$DLL" | tee "$RUNNER_TEMP/probe/memberref-probe.txt"
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-ADMINISTRATOR-START-MEMBERREF-PROBE
          path: ${{ runner.temp }}/probe/memberref-probe.txt
          retention-days: 30
          if-no-files-found: error
