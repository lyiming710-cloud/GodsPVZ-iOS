name: Stage9.1 Projectile ctor static candidate gate

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - 'Tools/Stage9ProjectileCtorPatch/**'
      - '.github/workflows/stage9-projectile-ctor-static-gate.yml'

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download fixed dc39 base
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34795946769
          name: Stage9.1-BATCH1-PLANT-CTOR-NATIVE
          path: ${{ runner.temp }}/projectile/input

      - name: Build and recover Projectile ctor
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/projectile"; E="$O/evidence"; mkdir -p "$E"
          IN="$O/input/GodsPVZRuntime1-plant-ctor.dll"
          OUT="$O/GodsPVZRuntime1-projectile-ctor.dll"
          test "$(sha256sum "$IN" | awk '{print $1}')" = 'dc39b8bcbfcd61f04acf2c18c42e24583e9a6e75248bb24b6aae9e381b19f173'
          dotnet build Tools/Stage9ProjectileCtorPatch/Stage9ProjectileCtorPatch.csproj -c Release --nologo
          dotnet run --project Tools/Stage9ProjectileCtorPatch/Stage9ProjectileCtorPatch.csproj -c Release --no-build -- "$IN" "$OUT" | tee "$E/patch.log"
          grep -q '^NATIVE_AUTHORITY target_token=0x060003FD rid=1021 method_pointer_entry=0x181B84D40 va=0x18037DF20 end=0x18037DF7F native_slice_sha256=e843a1237bfb1e0355a1efe9ce989a2a8b02dbc19c0eedf09fb9db0f00e5b7ff$' "$E/patch.log"
          grep -q '^NATIVE_SEMANTICS scale=1 updateRate=1 previousPosition=Vector3.zero tailcall=UnityEngine.MonoBehaviour::.ctor$' "$E/patch.log"
          grep -q '^PATCH_PROJECTILE_CTOR method_body_changes=1 zeroVector_private_ref_removed=1 lowering=Vector3.get_zero gameplay_semantics_changed=0$' "$E/patch.log"
          grep -q '^REOPEN_PROJECTILE_CTOR_PASS token=0x060003FD .*locals=0 zeroVector_private_refs=0 get_zero_calls=1$' "$E/patch.log"
          grep -q '^SEMANTIC_ISOLATION_PASS untouched_methods=2316 changed_methods=1 target_token=0x060003FD$' "$E/patch.log"
          grep -q '^FIELD_METADATA_ISOLATION_PASS unchanged_fields=2802 changed_fields=0$' "$E/patch.log"
          grep -q '^PRESERVATION_PASS batch1=4 plant_ctor=1 projectile_hf21=2 managers=2$' "$E/patch.log"
          sha256sum "$OUT" | tee "$E/output-candidate.sha256"
          cp "$OUT" "$E/"
          cp Tools/Stage9ProjectileCtorPatch/Evidence.md "$E/"

      - name: Upload static candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-DC39-PROJECTILE-CTOR-STATIC
          path: ${{ runner.temp }}/projectile/evidence/
          if-no-files-found: warn
          retention-days: 90
