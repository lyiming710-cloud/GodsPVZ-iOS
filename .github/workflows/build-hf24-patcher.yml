name: Build HF24 patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF24Patch/**'
      - '.github/workflows/build-hf24-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF24 patcher
        run: dotnet publish Tools/HF24Patch/HF24Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf24
      - name: Smoke test
        run: |
          chmod +x out/hf24/GodsPVZ.HF24Patch
          set +e
          out/hf24/GodsPVZ.HF24Patch
          code=$?
          set -e
          test "$code" = "2"
      - name: Verify template assembly is readable
        run: test -f out/hf24/GodsPVZ.HF24Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF24Patch-linux-x64
          path: out/hf24/
          include-hidden-files: true
          if-no-files-found: error
