name: Repair HF21 particle verifier threshold

on:
  push:
    branches: [ high-fidelity ]
    paths:
      - '.github/workflows/repair-hf21-verifier-particle.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: high-fidelity
      - name: Lower CreatNewParticle verifier floor only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Tools/HF21Patch/Program.cs')
          s=p.read_text()
          old='("ParticlesManager.CreatNewParticle", VM("ParticlesManager","CreatNewParticle",1), 25, 0),'
          new='("ParticlesManager.CreatNewParticle", VM("ParticlesManager","CreatNewParticle",1), 20, 0),'
          if old not in s: raise SystemExit('expected verifier tuple missing')
          p.write_text(s.replace(old,new,1))
          PY
          echo '131e288333a704d359b334bb8a3243b22535b00ce00372e5fa819f5e4edc759b  Tools/HF21Patch/Program.cs' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tools/HF21Patch/Program.cs
          git commit -m 'Adjust HF21 CreatNewParticle verifier floor'
          git push origin HEAD:high-fidelity
