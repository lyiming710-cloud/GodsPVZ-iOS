name: Startup R20 exact candidate - unsigned iOS test build

on:
  workflow_dispatch:
    inputs:
      audit_only:
        description: Run actual Editor diagnosis without exporting or linking an IPA
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: startup-r20-real-ios-test-build
  cancel-in-progress: false

jobs:
  editor_helper_preflight:
    needs: conversion_binding
    uses: ./.github/workflows/startup-r2-editor-preflight.yml

  conversion_binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject exact candidates with already proven compiler failures before setup
        run: python3 scripts/actions/reject_known_cpp_failures.py --candidate-zip Recovery/Startup-R20-Sites104-2026-10-26/STARTUP-R20-SITES104-CANDIDATE.zip
      - name: Require exact current candidate and actual Editor proof for test build
        run: python3 scripts/actions/validate_startup_r20_build_inputs.py > "$RUNNER_TEMP/R20-BUILD-INPUTS.json"
      - name: Validate current R20 byte and evidence binding before large setup
        run: python3 scripts/actions/bind_startup_r20_diagnostic.py --validate-only > "$RUNNER_TEMP/R20-EARLY-BINDING.json"
      - name: Run license-free pipeline regression controls
        run: python3 scripts/actions/check_bulk401_pipeline.py > "$RUNNER_TEMP/BULK401-PIPELINE-CONTROLS.json"
      - name: Bind immutable parent package separately from exact child compiler proofs
        run: |
          python3 scripts/actions/bind_bulk401_compiler_package.py --output "$RUNNER_TEMP/bulk401-package"
          cp "$RUNNER_TEMP/BULK401-PIPELINE-CONTROLS.json" "$RUNNER_TEMP/bulk401-package/"
      - uses: actions/upload-artifact@v4
        with:
          name: Startup-R2-PARENT-Bulk401-compiler-input
          path: ${{ runner.temp }}/bulk401-package/
          if-no-files-found: error
          retention-days: 90

  apple_preflight:
    needs: conversion_binding
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Verify actual Xcode, physical iOS SDK and packaging tools early
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          [ "$(xcrun --sdk iphoneos --show-sdk-version)" = '18.5' ]
          xcrun --sdk iphoneos --find clang
          command -v ditto
          command -v python3
          python3 -c 'import plistlib,struct,zipfile,hashlib'

  export:
    needs: [conversion_binding, editor_helper_preflight, apple_preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      R3_SHA256: 'd4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc'
      R3_ARCHIVE_RUN_ID: '34747460206'
      R3_ARCHIVE_ARTIFACT_ID: '10314333890'
      R3_ARCHIVE_ARTIFACT_ZIP_SHA256: '1c2183569b5d2273cdbf209992223d9f6a5d3cc0090bdbb8f68c8bf4ad448a78'
      BASE_RUNTIME_SHA256: '047054e0db594b6e3385fe4d2555c5932dcd4c28e4b2cb6fb39acbc4336d43ee'
      BASE_RUNTIME_RUN_ID: '35236211080'
      B001_SHA256: 'f144dd624d2b0c05b5ff01fc12ff455ac394c87852a4fc3c87e8c3611582a433'
      PARENT_DLL_SHA256: '6de4db6c94b80a43876aea060b573ed60c1fa7170cff485103d2c808b94762ae'
      TEST_DLL_SHA256: 'd887b370c95c2966dc40d80648d85c286bb42d85004c32d095f64f004e095b37'
      PACKAGE_GUID_RUN_ID: '35238895838'
      PACKAGE_CLOSURE_RUN_ID: '35239319822'
      PACKAGE_BUNDLE_RUN_ID: '35239547918'
      EDITOR_RUN_ID: '34668863583'
      EDITOR_SHA256: '0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14'
      IOS_MODULE_RUN_ID: '35339261693'
      IOS_MODULE_SHA256: '2c2e259415ab0f940889b6b5bf55c56bc2710bbd823ddc05c5ab67ebc137a16e'
      UNITY_VERSION: '2022.3.44f1c1'
      UNITY_CHANGESET: 'c3ae09b9f03c'

    steps:
      - uses: actions/checkout@v4

      - name: Prepare software graphics for original 8192 TMP atlas
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          mkdir -p "$E"
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v glxinfo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb mesa-utils libgl1-mesa-dri
          fi
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x720x24' glxinfo -B > "$E/software-gl-renderer.txt" 2>&1
          xvfb-run -a -s '-screen 0 1280x720x24' glxinfo -l > "$E/software-gl-limits.txt" 2>&1
          MAX_TEXTURE_SIZE="$(sed -n 's/.*GL_MAX_TEXTURE_SIZE[^0-9]*\([0-9][0-9]*\).*/\1/p' "$E/software-gl-limits.txt" | head -n1)"
          echo "GL_MAX_TEXTURE_SIZE=$MAX_TEXTURE_SIZE" | tee "$E/software-gl-max-texture.txt"
          [ -n "$MAX_TEXTURE_SIZE" ] || exit 66
          [ "$MAX_TEXTURE_SIZE" -ge 8192 ] || exit 67

      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          docker system prune -af || true
          df -h

      - name: Prepare workspace and lock inputs
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          mkdir -p "$OUT/evidence" "$OUT/candidate" "$OUT/semantic-gate"
          if [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; then
            echo 'UNITY_EMAIL or UNITY_PASSWORD secret missing' >&2
            exit 41
          fi
          cat > "$OUT/evidence/input-locks.txt" <<EOF
          workflow_head=$GITHUB_SHA
          r3_sha256=$R3_SHA256
          r3_archive_run=$R3_ARCHIVE_RUN_ID
          r3_archive_artifact_id=$R3_ARCHIVE_ARTIFACT_ID
          r3_archive_artifact_zip_sha256=$R3_ARCHIVE_ARTIFACT_ZIP_SHA256
          base_runtime_sha256=$BASE_RUNTIME_SHA256
          base_runtime_run=$BASE_RUNTIME_RUN_ID
          b001_sha256=$B001_SHA256
          test_dll_sha256=$TEST_DLL_SHA256
          bulk401_semantic_formalization=NO
          editor_run=$EDITOR_RUN_ID
          editor_sha256=$EDITOR_SHA256
          ios_module_run=$IOS_MODULE_RUN_ID
          ios_module_sha256=$IOS_MODULE_SHA256
          unity_version=$UNITY_VERSION
          unity_changeset=$UNITY_CHANGESET
          production_promotion=NO_ISOLATED_GATE_ONLY
          EOF

      - name: Download hash-qualified parent input; not child compiler qualification
        uses: actions/download-artifact@v4
        with:
          name: Startup-R2-PARENT-Bulk401-compiler-input
          path: ${{ runner.temp }}/stage9-startup-r2/bulk401-qualified

      - name: Verify Bulk401 parent provenance and exact hash
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          python3 - "$OUT" "$PARENT_DLL_SHA256" "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import sys,json,hashlib,shutil
          out=Path(sys.argv[1]);src=out/'bulk401-qualified'
          p=json.loads((src/'PROVENANCE.json').read_text())
          assert p['status']=='BULK401_LINUX_AND_APPLE_CPP_PRECHECK_PASS'
          assert p['linux_compiler']['exit']==0 and p['linux_compiler']['failed_game_tus']==0 and p['linux_compiler']['diagnostics']==0
          assert p['source_commit']==sys.argv[3]
          assert p['apple_compiler']['all_generated']==1030 and p['apple_compiler']['failed']==0
          dll=src/'Assembly-CSharp-bulk401.dll'
          assert hashlib.sha256(dll.read_bytes()).hexdigest()==sys.argv[2]
          assert p['outputs']['unlinked']['sha256']==sys.argv[2]
          name=(src/'candidate-assembly-name.txt').read_text().strip()
          assert name in ('Assembly-CSharp','GodsPVZRuntime1')
          shutil.copy2(dll,out/'candidate'/dll.name)
          for n in ('PROVENANCE.json','candidate-inspection.txt','candidate-assembly-name.txt'):
              shutil.copy2(src/n,out/'evidence'/n)
          PY
          echo 'BULK401_CONVERSION_QUALIFIED_INPUT_PASS'

      - name: Bind diagnostic child separately from parent compiler results
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions/bind_startup_r20_diagnostic.py --output "$RUNNER_TEMP/stage9-startup-r2" --source "$GITHUB_SHA"

      - name: Download exact cached R3 archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.R3_ARCHIVE_RUN_ID }}
          pattern: Stage9.1-r3-exact-archive
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-startup-r2/r3-cache

      - name: Reconstruct exact R3 project
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          mapfile -t R3_ARCHIVES < <(find "$OUT/r3-cache" -maxdepth 1 -type f -name '*.tar.zst' | sort)
          [ "${#R3_ARCHIVES[@]}" = '1' ] || exit 45
          ARCHIVE="${R3_ARCHIVES[0]}"
          cat > "$OUT/r3-parts.tsv" <<'EOF'
          00	e024b6d534a6eace43694a506ce8636c56ed17e8c21bde3bba61caab3d3bdf7a	67108864
          01	1c10d0d87be6b65c3dfd0424e38515b53a8dd1158c5734b4397f2072e5004bb2	67108864
          02	4943615fc153ff8539ab44818dde6981a16758a2c53184a858867d4932edd9c2	67108864
          03	f8573c2ef3db3d65de3cb3b98f0892e633cdf89d499bde2d509b36f88306331f	67108864
          04	3dc6a03ebb4a7bbd48f652b0c468911d6985f76f48c6ded991d40d1c9b7593bc	67108864
          05	13284c2cd74583ccdd63cf6b736dcca443acbf6bda4c25d4b65193fc08c09263	67108864
          06	d35ba0e632125749f581ad57cf950d8c6b264f9f4882a08adb9ca227f6b6e23c	67108864
          07	0c9443797e24ddca500a54a21955e27fd2cb995ec7924147e7f5c244859c07ec	67108864
          08	30c9a5330cdece142938150311e8acb87d00d48ab057aa39a2128a3fffdcece8	67108864
          09	46bca3df6cbfc11f155038470a39b705bb028fa7a0e9f9eb3ba4810c06d5058a	67108864
          10	3c8e312e65a72ac3072233f558b4d43970b3a4e521139d03328e9c27ec41d994	67108864
          11	dc3d7aa732a19f237e5e72aa6f1e768c10bd360bc6fc832d29b9afc7489da325	48568114
          EOF
          python3 - "$ARCHIVE" "$OUT/r3-parts.tsv" "$E/r3-download.tsv" <<'PY'
          import hashlib,sys
          from pathlib import Path
          archive=Path(sys.argv[1]); spec=Path(sys.argv[2]); out=Path(sys.argv[3])
          rows=[]
          for line in spec.read_text().splitlines():
              idx,sha,size=line.strip().split('\t')
              rows.append((idx,sha,int(size)))
          with archive.open('rb') as f, out.open('w',encoding='utf-8') as w:
              for idx,expected_sha,expected_size in rows:
                  remain=expected_size; h=hashlib.sha256(); got_size=0
                  while remain:
                      b=f.read(min(1024*1024,remain))
                      if not b: raise SystemExit(45)
                      h.update(b); n=len(b); remain-=n; got_size+=n
                  got_sha=h.hexdigest()
                  w.write(f'{idx}\t{got_sha}\t{got_size}\n')
                  if got_sha!=expected_sha: raise SystemExit(45)
                  if got_size!=expected_size: raise SystemExit(46)
              if f.read(1): raise SystemExit(45)
          PY
          ROOT="$OUT/r3"
          mkdir -p "$ROOT"
          GOT="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          echo "$GOT" > "$E/r3-sha256.txt"
          [ "$GOT" = "$R3_SHA256" ] || exit 47
          zstd -t "$ARCHIVE" 2> "$E/r3-zstd-test.txt"
          zstd -dc "$ARCHIVE" | tar -xf - -C "$ROOT"
          PROJECT="$ROOT/UnityProject-AssetRipper-2.0.0/ExportedProject"
          test -d "$PROJECT"
          grep -qx 'm_EditorVersion: 2022.3.44f1c1' "$PROJECT/ProjectSettings/ProjectVersion.txt"
          test -f "$PROJECT/Assets/Scenes/MainMenu.unity"
          test -f "$PROJECT/Assets/Scenes/Board.unity"
          [ "$(sha256sum "$PROJECT/Assets/Plugins/Assembly-CSharp.dll" | awk '{print $1}')" = 'dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655' ] || exit 48
          printf '%s\n' "$PROJECT" > "$OUT/project-path.txt"
          rm -rf "$OUT/r3-cache" "$ARCHIVE"
          df -h "$RUNNER_TEMP" > "$E/disk-after-r3.txt"

      - name: Download base runtime-qualified DLL
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.BASE_RUNTIME_RUN_ID }}
          name: Stage9.1-BGMVOLUME-STATIC-QUALIFIED
          path: ${{ runner.temp }}/stage9-startup-r2/base-runtime

      - name: Download package GUID evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.PACKAGE_GUID_RUN_ID }}
          name: HF46-package-reference-evidence
          path: ${{ runner.temp }}/stage9-startup-r2/package-guid-evidence

      - name: Download pinned package bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.PACKAGE_BUNDLE_RUN_ID }}
          name: Stage9.1-pinned-unity-packages
          path: ${{ runner.temp }}/stage9-startup-r2/package-bundle

      - name: Download package dependency closure
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.PACKAGE_CLOSURE_RUN_ID }}
          name: Stage9.1-package-dependency-closure
          path: ${{ runner.temp }}/stage9-startup-r2/package-closure

      - name: Integrate baseline and embedded packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          PROJECT="$(cat "$OUT/project-path.txt")"
          DLL="$OUT/base-runtime/GodsPVZRuntime1-bgmvolume.dll"
          test -f "$DLL"
          [ "$(sha256sum "$DLL" | awk '{print $1}')" = "$BASE_RUNTIME_SHA256" ] || exit 49
          cp "$DLL" "$PROJECT/Assets/Plugins/Assembly-CSharp.dll"
          mkdir -p "$PROJECT/Assets/Editor" "$PROJECT/Recovery"
          cp "$GITHUB_WORKSPACE/Recovery/Bulk389-Qualification-2026-10-23/ios-support/Assets/Editor/GodsPVZPackageReferenceMigrator.cs" "$PROJECT/Assets/Editor/"
          cp "$GITHUB_WORKSPACE/Recovery/Startup-R3-2026-10-24/ios-support/Assets/Editor/GodsPVZIOSBuild.cs" "$PROJECT/Assets/Editor/"
          cp "$GITHUB_WORKSPACE/Recovery/Startup-R3-2026-10-24/ios-support/Assets/Editor/GodsPVZStartupAudit.cs" "$PROJECT/Assets/Editor/"
          cp "$GITHUB_WORKSPACE/Recovery/Bulk389-Qualification-2026-10-23/ios-support/Recovery/package-script-map-editor.json" "$PROJECT/Recovery/"
          python3 - "$OUT/package-bundle/Packages" "$OUT/package-closure/Packages" "$PROJECT/Packages" <<'PY'
          import shutil,sys
          from pathlib import Path
          dst=Path(sys.argv[3]); dst.mkdir(parents=True,exist_ok=True)
          for root in map(Path,sys.argv[1:3]):
              if not root.is_dir(): raise SystemExit('missing package source: '+str(root))
              for src in sorted(p for p in root.iterdir() if p.is_dir()):
                  target=dst/src.name
                  if target.exists(): shutil.rmtree(target)
                  shutil.copytree(src,target)
          PY
          python3 - "$OUT/package-guid-evidence/package-guid-map.json" "$PROJECT/Packages" "$E/package-guid-preflight.txt" <<'PY'
          import json,re,sys
          from pathlib import Path
          d=json.load(open(sys.argv[1])); root=Path(sys.argv[2]); out=Path(sys.argv[3])
          assert d['resolved']==67 and d['expected']==67 and not d['failures']
          bad=[]; n=0
          for m in d['mapping']:
              meta=root/m['package']/m['meta_path']
              if not meta.is_file(): bad.append((m['fullName'],'missing')); continue
              mm=re.search(r'(?m)^guid:\s*([0-9a-fA-F]{32})\s*$',meta.read_text(errors='replace'))
              got=mm.group(1).lower() if mm else ''
              n+=1
              if got!=m['monoscript_guid'].lower(): bad.append((m['fullName'],got,m['monoscript_guid']))
          out.write_text(f'resolved={n}/67\nfailures={len(bad)}\n'+repr(bad)+'\n')
          if n!=67 or bad: raise SystemExit(50)
          PY
          rm -f "$PROJECT/Packages/packages-lock.json"
          rm -rf "$OUT/package-bundle" "$OUT/package-closure" "$OUT/package-guid-evidence" "$OUT/base-runtime"

      - name: Download preserved exact Editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.EDITOR_RUN_ID }}
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-startup-r2/editor-parts

      - name: Reconstruct exact Unity China Editor
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          PARTS="$OUT/editor-parts"
          ROOT="$OUT/editor-root"
          mkdir -p "$ROOT"
          mapfile -t FILES < <(find "$PARTS" -maxdepth 1 -type f -name 'Unity-China-2022.3.44f1c1.tar.xz.part-*' | sort)
          [ "${#FILES[@]}" = '15' ] || exit 51
          SHA="$({ for part in "${FILES[@]}"; do cat "$part"; done; } | sha256sum | awk '{print $1}')"
          echo "$SHA" > "$E/editor-sha256.txt"
          [ "$SHA" = "$EDITOR_SHA256" ] || exit 52
          {
            for part in "${FILES[@]}"; do cat "$part"; rm -f "$part"; done
          } | tar -xJf - -C "$ROOT"
          rmdir "$PARTS" 2>/dev/null || true
          UNITY="$ROOT/Editor/Unity"
          chmod +x "$UNITY"
          V="$($UNITY -version 2>&1 | grep -Eo '2022\.3\.44f1c1|2022\.3\.44f1' | head -n1 || true)"
          echo "$V" > "$E/editor-version-before-ios-module.txt"
          [ "$V" = "$UNITY_VERSION" ] || exit 53
          printf '%s\n' "$UNITY" > "$OUT/unity-path.txt"

      - name: Download validated China iOS module
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.IOS_MODULE_RUN_ID }}
          name: Stage9.1-unity-china-ios-module-c3ae09b9f03c
          path: ${{ runner.temp }}/stage9-startup-r2/ios-module

      - name: Overlay validated iOS module
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          ROOT="$OUT/editor-root"
          MOD="$OUT/ios-module/UnitySetup-iOS-Support-for-Editor-2022.3.44f1.tar.xz"
          test -f "$MOD"
          GOT="$(sha256sum "$MOD" | awk '{print $1}')"
          echo "$GOT" > "$E/ios-module-sha256.txt"
          [ "$GOT" = "$IOS_MODULE_SHA256" ] || exit 54
          xz -t "$MOD"
          tar -xJf "$MOD" -C "$ROOT"
          UNITY="$(cat "$OUT/unity-path.txt")"
          V="$($UNITY -version 2>&1 | grep -Eo '2022\.3\.44f1c1|2022\.3\.44f1' | head -n1 || true)"
          [ "$V" = "$UNITY_VERSION" ] || exit 55
          rm -rf "$OUT/ios-module"

      - name: Compile both helper states and verify licensing CLI before activation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          PROJECT="$(cat "$OUT/project-path.txt")"
          set +e
          python3 scripts/actions/preflight_bulk401_startup_editor.py --editor "$UNITY" --project "$PROJECT" --output "$OUT/helper-preflight"
          RC=$?
          set -e
          cp "$OUT/helper-preflight/"*.log "$OUT/helper-preflight/"*.json "$OUT/helper-preflight/"*.rsp "$E/"
          [ "$RC" -eq 0 ] || exit 70
          CLIENT="$(dirname "$UNITY")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          "$CLIENT" --help > "$E/licensing-client-help.txt" 2>&1
          grep -q -- '--activate-all' "$E/licensing-client-help.txt"
          grep -q -- '--deactivate-all' "$E/licensing-client-help.txt"

      - name: Acquire Personal seat
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          CLIENT="$(dirname "$UNITY")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          touch "$OUT/seat-acquired.flag"
          set +e
          "$CLIENT" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > "$E/license-activate.log" 2>&1
          RC=$?
          set -e
          echo "$RC" > "$E/license-activate-exit.txt"
          [ "$RC" -eq 0 ] || exit 56
          touch "$OUT/seat-acquired.flag"

      - name: First baseline import
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          PROJECT="$(cat "$OUT/project-path.txt")"
          set +e
          "$UNITY" -batchmode -nographics -quit -projectPath "$PROJECT" -logFile "$E/import-before-migration.log"
          RC=$?
          set -e
          echo "$RC" > "$E/import-before-migration-exit.txt"
          [ "$RC" -eq 0 ] || exit 57
          if grep -Eiq '\berror CS[0-9]+\b|Scripts have compiler errors|Compilation failed' "$E/import-before-migration.log"; then exit 58; fi

      - name: Complete 67 of 67 package migration and B001 gate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          PROJECT="$(cat "$OUT/project-path.txt")"
          "$UNITY" -batchmode -nographics -quit -projectPath "$PROJECT" -executeMethod GodsPVZPackageReferenceMigrator.RunBatch -logFile "$E/package-migration.log"
          MARKER="$PROJECT/Library/GodsPVZ.package-reference-migration.done"
          PLUGIN="$PROJECT/Assets/Plugins/Assembly-CSharp.dll"
          test -f "$MARKER"
          grep -q '^resolved=67/67$' "$MARKER"
          GOT="$(sha256sum "$PLUGIN" | awk '{print $1}')"
          echo "b001_workcopy_sha256=$GOT" | tee "$E/b001-workcopy.txt"
          [ "$GOT" = "$B001_SHA256" ] || exit 59

      - name: Inject fixed candidate and retire legacy migrator without deleting its source path
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          PROJECT="$(cat "$OUT/project-path.txt")"
          python3 scripts/actions/prepare_startup_r20_unity.py --project "$PROJECT" --candidate "$OUT/candidate/Assembly-CSharp-bulk401.dll" --evidence "$OUT/evidence"

      - name: Align unchanged plugin filename with its assembly identity and preserve its GUID
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          PROJECT="$(cat "$OUT/project-path.txt")"
          python3 scripts/actions/prepare_startup_r20_plugin.py --project "$PROJECT" --evidence "$OUT/evidence"
          python3 scripts/actions/prepare_bulk401_startup_resources.py --project "$PROJECT" --evidence "$OUT/evidence"
          python3 scripts/actions/prepare_custom_shaders_r1.py --project "$PROJECT" --evidence "$OUT/evidence"
          cp "$GITHUB_WORKSPACE/Recovery/Custom-Shaders-2026-10-24/ios-support/Assets/Editor/GodsPVZCustomShaderAudit.cs" "$PROJECT/Assets/Editor/"
          cp "$GITHUB_WORKSPACE/Recovery/Startup-R3-2026-10-24/EMPTY-DYNAMIC-FONT-ATLAS-EVIDENCE.json" "$PROJECT/Recovery/empty-dynamic-font-atlas-evidence.json"
          cp "$GITHUB_WORKSPACE/Recovery/Startup-R3-2026-10-24/ORIGINAL-ATTRIBUTE-ROSTERS.json" "$PROJECT/Recovery/original-serialization-marker-proof.json"

      - name: Reimport fixed candidate with inert migrator and rebuilt script caches
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          PROJECT="$(cat "$OUT/project-path.txt")"
          PLUGIN="$PROJECT/Assets/Plugins/GodsPVZRuntime1.dll"
          set +e
          "$UNITY" -batchmode -nographics -quit -projectPath "$PROJECT" -logFile "$E/import-after-bulk401.log"
          RC=$?
          set -e
          echo "$RC" > "$E/import-after-bulk401-exit.txt"
          [ "$RC" -eq 0 ] || exit 63
          if grep -Eiq '\berror CS[0-9]+\b|Scripts have compiler errors|Compilation failed' "$E/import-after-bulk401.log"; then exit 64; fi
          GOT="$(sha256sum "$PLUGIN" | awk '{print $1}')"
          echo "$GOT" > "$E/test-dll-after-reimport.sha256"
          [ "$GOT" = "$TEST_DLL_SHA256" ] || exit 65

      - name: Repair official shader bindings and audit all startup scenes and prefabs
        shell: bash
        env:
          GODSPVZ_STARTUP_EVIDENCE: ${{ runner.temp }}/stage9-startup-r2/evidence
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          UNITY="$(cat "$OUT/unity-path.txt")"
          PROJECT="$(cat "$OUT/project-path.txt")"
          set +e
          "$UNITY" -batchmode -nographics -quit -projectPath "$PROJECT" -executeMethod GodsPVZStartupAudit.Run -logFile "$OUT/evidence/startup-asset-audit.log"
          RC=$?
          set -e
          echo "$RC" > "$OUT/evidence/startup-asset-audit-exit.txt"
          [ "$RC" -eq 0 ]
          python3 - "$OUT/evidence/startup-asset-audit.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['pass'] and data['missing_components']==0
          assert data['game_start_component'] and data['game_start_prefab'] and data['board_start_component']
          assert data['core_blit_keyword']
          assert data['unresolved_custom_dummy_shaders']==[]
          PY

      - name: Compile all custom shader variants for Metal and OpenGL and read rendered pixels
        shell: bash
        env:
          GODSPVZ_STARTUP_EVIDENCE: ${{ runner.temp }}/stage9-startup-r2/evidence
          GODSPVZ_SHADER_BINARY_EVIDENCE: ${{ runner.temp }}/stage9-startup-r2/shader-output
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          UNITY="$(cat "$OUT/unity-path.txt")"
          PROJECT="$(cat "$OUT/project-path.txt")"
          set +e
          timeout --signal=TERM 600s xvfb-run -a -s '-screen 0 1280x720x24' "$UNITY" -batchmode -force-glcore -projectPath "$PROJECT" -executeMethod GodsPVZCustomShaderAudit.BeginAfterStartup -logFile "$OUT/evidence/custom-shader-audit.log"
          RC=$?
          set -e
          echo "$RC" > "$OUT/evidence/custom-shader-audit-exit.txt"
          [ "$RC" -eq 0 ]
          python3 - "$OUT/evidence/custom-shader-audit.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['pass'] and len(data['compilations'])==76 and all(r['success'] and r['bytes']>0 for r in data['compilations'])
          assert len(data['pixels'])==20 and all(r['pass'] for r in data['pixels']) and data['negative_compile_control']
          assert not data['metal_device_execution'] and not data['game_pixel_equivalence']
          PY

      - name: Run actual startup in Editor Play Mode before any new IPA export
        shell: bash
        env:
          GODSPVZ_STARTUP_EVIDENCE: ${{ runner.temp }}/stage9-startup-r2/evidence
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          UNITY="$(cat "$OUT/unity-path.txt")"
          PROJECT="$(cat "$OUT/project-path.txt")"
          set +e
          timeout --signal=TERM 180s xvfb-run -a -s '-screen 0 1280x720x24' "$UNITY" -batchmode -force-glcore -projectPath "$PROJECT" -executeMethod GodsPVZStartupAudit.BeginPlayProbe -logFile "$OUT/evidence/startup-play-probe.log"
          RC=$?
          set -e
          echo "$RC" > "$OUT/evidence/startup-play-probe-exit.txt"
          [ "$RC" -eq 0 ]
          python3 - "$OUT/evidence/startup-play-probe.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['pass'] and data['frames']>=3 and data['main_ui_components']>=1 and data['active_canvases']>=1
          PY

      - name: Export unsigned iOS Xcode project with exact R20 candidate
        if: github.event_name == 'workflow_dispatch' && !inputs.audit_only
        shell: bash
        env:
          GODSPVZ_IOS_BUILD_PATH: ${{ runner.temp }}/stage9-startup-r2/xcode
          GODSPVZ_BUILD_EVIDENCE_DIR: ${{ runner.temp }}/stage9-startup-r2/evidence
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          PROJECT="$(cat "$OUT/project-path.txt")"
          PLUGIN="$PROJECT/Assets/Plugins/GodsPVZRuntime1.dll"
          [ "$(sha256sum "$PLUGIN" | awk '{print $1}')" = "$TEST_DLL_SHA256" ] || exit 68
          python3 scripts/actions/instrument_startup_r20_build_helper.py --source "$GITHUB_WORKSPACE/Recovery/Startup-R3-2026-10-24/ios-support/Assets/Editor/GodsPVZIOSBuild.cs" --project "$PROJECT" --evidence "$E"
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24' "$UNITY" -batchmode -quit -force-glcore -buildTarget iOS -projectPath "$PROJECT" -executeMethod GodsPVZBuildReportCapture.ExportIOS -logFile "$E/ios-export.log" > "$E/ios-export.stdout" 2> "$E/ios-export.stderr"
          RC=$?
          set -e
          echo "$RC" > "$E/ios-export-exit.txt"
          [ "$RC" -eq 0 ] || exit 69
          test -d "$OUT/xcode"

      - name: Audit Xcode and IL2CPP export
        if: github.event_name == 'workflow_dispatch' && !inputs.audit_only
        id: xcode_audit
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          X="$OUT/xcode"
          PROJECT="$(cat "$OUT/project-path.txt")"
          python3 scripts/actions/startup_r20_export_binding.py --xcode-dir "$X" --plugin "$PROJECT/Assets/Plugins/GodsPVZRuntime1.dll"
          cp "$X/startup-r20-export-binding.json" "$E/"
          PBX="$X/Unity-iPhone.xcodeproj/project.pbxproj"
          test -f "$PBX"
          test -d "$X/Classes"
          test -d "$X/Libraries"
          test -d "$X/Data"
          test -d "$X/Il2CppOutputProject"
          ASSEMBLY="$(cat "$E/candidate-assembly-name.txt")"
          test -f "$X/Il2CppOutputProject/Source/il2cppOutput/$ASSEMBLY.cpp"
          test -f "$X/Data/Managed/Metadata/global-metadata.dat"
          grep -Eq 'PRODUCT_BUNDLE_IDENTIFIER[[:space:]]*=[[:space:]]*"?com\.tipsGodsStudio\.godsPVZ"?;' "$PBX"
          grep -Eq 'IPHONEOS_DEPLOYMENT_TARGET[[:space:]]*=[[:space:]]*12(\.0)?;' "$PBX"
          grep -q 'GodsPVZ iOS Xcode export succeeded' "$E/ios-export.log"
          CPP_COUNT="$(find "$X/Il2CppOutputProject/Source/il2cppOutput" -maxdepth 1 -type f -name '*.cpp' | wc -l | tr -d ' ')"
          FILE_COUNT="$(find "$X" -type f | wc -l | tr -d ' ')"
          SIZE="$(du -sb "$X" | awk '{print $1}')"
          {
            echo 'IOS_XCODE_EXPORT=PASS'
            echo "unity_version=$UNITY_VERSION"
            echo "test_dll_sha256=$TEST_DLL_SHA256"
            echo 'r20_full_game_qualification=NOT_YET_PERFORMED'
            echo 'r20_portable_il2cpp_conversion=PASS'
            echo 'bundle_id=com.tipsGodsStudio.godsPVZ'
            echo 'deployment_target=12.0'
            echo 'scenes=Assets/Scenes/MainMenu.unity,Assets/Scenes/Board.unity'
            echo "il2cpp_cpp_count=$CPP_COUNT"
            echo "xcode_file_count=$FILE_COUNT"
            echo "xcode_size_bytes=$SIZE"
            echo 'production_promotion=NO_ISOLATED_GATE_ONLY'
          } | tee "$E/RESULT.txt"
          sha256sum "$X/Data/Managed/Metadata/global-metadata.dat" > "$E/generated-global-metadata.sha256"
          sha256sum "$X/Il2CppOutputProject/Source/il2cppOutput/$ASSEMBLY.cpp" > "$E/generated-assembly-csharp-cpp.sha256"
          grep -E 'PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET' "$PBX" | sort -u > "$E/pbx-settings.txt"
          tar --zstd -cf "$OUT/GodsPVZ-Startup-R20-unsigned-Xcode.tar.zst" -C "$OUT" xcode
          sha256sum "$OUT/GodsPVZ-Startup-R20-unsigned-Xcode.tar.zst" > "$E/xcode-archive.sha256"

      - name: Return Personal seat
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          E="$OUT/evidence"
          if [ -f "$OUT/seat-acquired.flag" ] && [ -f "$OUT/unity-path.txt" ]; then
            UNITY="$(cat "$OUT/unity-path.txt")"
            CLIENT="$(dirname "$UNITY")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
            set +e
            "$CLIENT" --deactivate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > "$E/license-return.log" 2>&1
            RC=$?
            set -e
            echo "$RC" > "$E/license-return-exit.txt"
            [ "$RC" -eq 0 ] || exit 71
          fi

      - name: Preserve actual report and unqualified generated sources even if export is rejected
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.audit_only
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-startup-r2"
          if [ -f "$OUT/project-path.txt" ]; then
            python3 scripts/actions/capture_startup_r20_export_forensics.py --out "$OUT" --project "$(cat "$OUT/project-path.txt")"
          fi

      - name: Prepare sanitized Unity evidence
        if: always()
        shell: bash
        run: |
          python3 scripts/actions/sanitize_unity_evidence.py "$RUNNER_TEMP/stage9-startup-r2/evidence" "$RUNNER_TEMP/stage9-startup-r2/public-evidence"

      - name: Upload real Unity gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STARTUP-R20-EDITOR-DIAGNOSTIC-EVIDENCE
          path: ${{ runner.temp }}/stage9-startup-r2/public-evidence/
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
          compression-level: 6
      - name: Upload byte-preserved shader programs and controlled render images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STARTUP-R20-SHADERS-COMPILED-AND-RENDERED
          path: ${{ runner.temp }}/stage9-startup-r2/shader-output/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Upload unqualified source and report for diagnosis
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.audit_only
        uses: actions/upload-artifact@v4
        with:
          name: Startup-R20-UNQUALIFIED-EXPORT-FORENSICS
          path: ${{ runner.temp }}/stage9-startup-r2/unqualified-export-forensics/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Upload unsigned Xcode project archive
        if: always() && steps.xcode_audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-Startup-R20-unsigned-Xcode
          path: ${{ runner.temp }}/stage9-startup-r2/GodsPVZ-Startup-R20-unsigned-Xcode.tar.zst
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  build_ipa:
    if: github.event_name == 'workflow_dispatch' && !inputs.audit_only
    needs: export
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Download exported Xcode project archive
        uses: actions/download-artifact@v4
        with:
          name: GodsPVZ-Startup-R20-unsigned-Xcode
          path: ${{ runner.temp }}/xcode-input

      - name: Extract Xcode project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "${{ runner.temp }}/xcode-input" -name '*.tar.zst' -type f | head -n 1)"
          test -f "$ARCHIVE"
          command -v zstd >/dev/null || brew install zstd
          mkdir -p "${{ runner.temp }}/build"
          zstd -dc "$ARCHIVE" | tar -xf - -C "${{ runner.temp }}/build"
          python3 scripts/actions/startup_r20_export_binding.py --xcode-dir "$RUNNER_TEMP/build/xcode"

      - name: Check all actual-export generated C and CPP before Xcode build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions/audit_startup_r20_real_export.py --xcode-dir "$RUNNER_TEMP/build/xcode" --output-dir "$RUNNER_TEMP/actual-export-compiler"

      - name: Compile iOS ARM64 Binary via Xcode
        shell: bash
        run: |
          set -euo pipefail
          X="${{ runner.temp }}/build/xcode"
          LOG="${{ runner.temp }}/build/xcodebuild.log"
          echo "=== Building Xcode Project with Apple Clang (fixed R20 input) ==="
          xcodebuild \
            -project "$X/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ runner.temp }}/build/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CONFIGURATION_BUILD_DIR="${{ runner.temp }}/build/DerivedData/Build/Products/Release-iphoneos" \
            clean build 2>&1 | tee "$LOG"

      - name: Package and verify unsigned physical-iOS ARM64 IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_FOUND="$(find "$RUNNER_TEMP/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d | head -n1)"
          test -d "$APP_FOUND"
          python3 scripts/actions/package_startup_r20_ipa.py --app "$APP_FOUND" --xcode-dir "$RUNNER_TEMP/build/xcode" --output-dir "$RUNNER_TEMP/ipa-output"

      - name: Preserve Apple build logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Startup-R20-APPLE-BUILD-EVIDENCE
          path: |
            ${{ runner.temp }}/build/xcodebuild.log
            ${{ runner.temp }}/actual-export-compiler/
            ${{ runner.temp }}/ipa-output/IPA-VALIDATION.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ_1.0.2_startup_r20_unsigned_ipa
          path: ${{ runner.temp }}/ipa-output/*.ipa
          retention-days: 90
          if-no-files-found: error
