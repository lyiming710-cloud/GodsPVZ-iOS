name: Bulk168 candidate and portable Linux verification
# Trigger run 2: fix table 0x1B/0x2B stream size calculation (+688 bytes)

on:
  push:
    branches: [repair/native111-bulk168-actions-2026-10-20]
    paths: ['.github/workflows/bulk168-candidate-verification.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bulk168-candidate-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Record host and select Clang 18
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang++-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang-18 g++
          fi
          mkdir -p "$RUNNER_TEMP/bulk168-bin"
          ln -s "$(command -v clang++-18)" "$RUNNER_TEMP/bulk168-bin/clang++"
          echo "$RUNNER_TEMP/bulk168-bin" >> "$GITHUB_PATH"
          uname -a
          dotnet --info
          clang++-18 --version
          g++ --version
      - name: Download frozen inputs, tools capsule, baseline candidate and Bulk168 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bulk168-downloads"
          gh release download bulk152-actions-checkpoint-2026-10-20 \
            --repo lyiming710-cloud/GodsPVZ-iOS \
            --pattern PORTABLE-BULK152-CHECKPOINT.tar.gz \
            --pattern PORTABLE-MANIFEST.json \
            --dir "$RUNNER_TEMP/bulk168-downloads"
          gh release download native110-bulk162-r1-source-2026-10-20 \
            --repo lyiming710-cloud/GodsPVZ-iOS \
            --pattern NATIVE110-BULK162-R1-SOURCE-AND-TOOLS.zip \
            --dir "$RUNNER_TEMP/bulk168-downloads"
          gh release download bulk162-candidate-2026-10-20 \
            --repo lyiming710-cloud/GodsPVZ-iOS \
            --pattern candidate1.dll \
            --dir "$RUNNER_TEMP/bulk168-downloads"
          gh release download native111-bulk168-source-2026-10-20 \
            --repo lyiming710-cloud/GodsPVZ-iOS \
            --pattern NATIVE111-BULK168-SOURCE.zip \
            --dir "$RUNNER_TEMP/bulk168-downloads"
      - name: Authenticate restored files and tools
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions/restore_bulk152_checkpoint.py \
            --downloads "$RUNNER_TEMP/bulk168-downloads" \
            --destination "$RUNNER_TEMP/bulk168-portable" \
            --receipt .validation/bulk168-restore-receipt.json
          python3 scripts/actions/restore_native110_source.py \
            --archive "$RUNNER_TEMP/bulk168-downloads/NATIVE110-BULK162-R1-SOURCE-AND-TOOLS.zip" \
            --destination "$RUNNER_TEMP/native110-capsule"
          python3 scripts/actions/restore_native111_source.py \
            --archive "$RUNNER_TEMP/bulk168-downloads/NATIVE111-BULK168-SOURCE.zip" \
            --destination "$RUNNER_TEMP/native111-source"
      - name: Construct twice, verify isolation and execute downstream gates
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/native110-capsule/deps"
          python3 scripts/actions/prepare_bulk168_candidate.py \
            --source-dir "$RUNNER_TEMP/native111-source/src" \
            --parent-dll "$RUNNER_TEMP/native110-capsule/inputs/parent_native93.dll" \
            --baseline-candidate-dll "$RUNNER_TEMP/bulk168-downloads/candidate1.dll" \
            --wrong-parent-dll "$RUNNER_TEMP/bulk168-downloads/candidate1.dll" \
            --deps-dir "$RUNNER_TEMP/native110-capsule/deps" \
            --tools-dir "$RUNNER_TEMP/native110-capsule/tools" \
            --support-dir "$RUNNER_TEMP/bulk168-portable/work/il2cpp_stage_coherent/Library/Bee/artifacts/iOS/ManagedStripped" \
            --portable-root "$RUNNER_TEMP/bulk168-portable" \
            --output-dir "$GITHUB_WORKSPACE/.validation/bulk168-run" \
            --verifier-runner "$GITHUB_WORKSPACE/scripts/actions/verify_bulk152_portable.py"
      - name: Preserve generated source on success or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage=.validation/bulk168-run/verifier_output/il2cpp_stage
          if [ -d "$stage/il2cppOutput" ]; then
            tar -czf .validation/bulk168-generated-sources.tar.gz \
              -C "$stage" il2cppOutput
          fi
      - name: Upload candidate and complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bulk168-Linux-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
          path: |
            .validation/bulk168-restore-receipt.json
            .validation/bulk168-run/candidates/
            .validation/bulk168-run/results/
            .validation/bulk168-run/*.json
            .validation/bulk168-run/tools_bin/
            .validation/bulk168-run/verifier_output/results/
            .validation/bulk168-run/verifier_output/oracle_run/
            .validation/bulk168-run/verifier_output/fixture_run/*.json
            .validation/bulk168-run/verifier_output/fixture_run/*.log
            .validation/bulk168-run/verifier_output/fixture_run/*.txt
            .validation/bulk168-run/verifier_output/*.json
            .validation/bulk168-run/verifier_output/Archive-v1-*.zip
            .validation/bulk168-generated-sources.tar.gz

