        with: {name: Stage9.1-unity-china-editor-part-05, path: stage9-unity-editor-preserve/parts/Unity-China-2022.3.44f1c1.tar.xz.part-05, if-no-files-found: error, retention-days: 90, compression-level: 0}
      - name: Upload editor part 06
