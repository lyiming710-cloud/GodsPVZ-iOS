      - name: Upload editor part 12
        if: success()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-unity-china-editor-part-12, path: stage9-unity-editor-preserve/parts/Unity-China-2022.3.44f1c1.tar.xz.part-12, if-no-files-found: error, retention-days: 90, compression-level: 0}
      - name: Upload editor part 13
        if: success()
