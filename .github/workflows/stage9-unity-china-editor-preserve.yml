name: Verify and preserve exact Unity China Stage9.1 editor

on:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-unity-china-editor-preserve.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Download verify and split exact China Linux editor
        shell: bash
        run: |
          set -euo pipefail
          OUT='stage9-unity-editor-preserve'
          PARTS="$OUT/parts"
          mkdir -p "$OUT" "$PARTS" editor-min
          URL='https://download.unitychina.cn/download_unity/c3ae09b9f03c/LinuxEditorInstaller/Unity.tar.xz'
          EXPECTED_SIZE='3906640940'
          EXPECTED_VERSION='2022.3.44f1c1'
          ARCHIVE='Unity-China-2022.3.44f1c1.tar.xz'

          df -h . > "$OUT/disk-before.txt"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 -o "$ARCHIVE" "$URL"
          ACTUAL_SIZE="$(stat -c %s "$ARCHIVE")"
          ARCHIVE_SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            printf 'size mismatch: %s != %s\n' "$ACTUAL_SIZE" "$EXPECTED_SIZE" >&2
            exit 31
          fi
          xz -t "$ARCHIVE"
          df -h . > "$OUT/disk-after-download.txt"

          UNITY_MEMBER="$(tar -tJf "$ARCHIVE" | grep -E '(^|/)Editor/Unity$' | head -n 1 || true)"
          if [ -z "$UNITY_MEMBER" ]; then
            echo 'Editor/Unity member not found in archive' >&2
            exit 32
          fi
          tar -xJf "$ARCHIVE" -C editor-min "$UNITY_MEMBER"
          UNITY="editor-min/$UNITY_MEMBER"
          chmod +x "$UNITY"
          set +e
          VERSION_OUT="$("$UNITY" -version 2>&1)"
          VERSION_EXIT=$?
          set -e
          printf '%s\n' "$VERSION_OUT" > "$OUT/unity-version-raw.txt"
          VERSION="$(printf '%s\n' "$VERSION_OUT" | grep -Eo '2022\.3\.44f1c[0-9]+|2022\.3\.44f1' | head -n 1 || true)"

          python3 - <<PY
          import json
          from pathlib import Path
          result={
            'url': '$URL',
            'expected_size': int('$EXPECTED_SIZE'),
            'download_size': int('$ACTUAL_SIZE'),
            'download_sha256': '$ARCHIVE_SHA',
            'xz_test': 'PASS',
            'unity_archive_member': '$UNITY_MEMBER',
            'unity_executable': '$UNITY',
            'version_exit': int('$VERSION_EXIT'),
            'parsed_version': '$VERSION',
            'expected_version': '$EXPECTED_VERSION',
            'version_match': '$VERSION' == '$EXPECTED_VERSION',
            'changeset': 'c3ae09b9f03c',
            'source_variant': 'Unity China Linux Editor',
            'preserve_strategy': 'minimal executable extraction + streaming split/rejoin verification',
          }
          Path('$OUT/RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

          if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Exact editor gate failed: got '$VERSION'" >&2
            exit 33
          fi

          split -b 268435456 -d -a 2 "$ARCHIVE" "$PARTS/Unity-China-2022.3.44f1c1.tar.xz.part-"
          PART_COUNT="$(find "$PARTS" -maxdepth 1 -type f | wc -l)"
          if [ "$PART_COUNT" != '15' ]; then
            echo "Unexpected part count: $PART_COUNT" >&2
            exit 34
          fi
          df -h . > "$OUT/disk-after-split.txt"

          {
            printf 'FULL\t%s\t%s\t%s\n' "$ARCHIVE_SHA" "$ACTUAL_SIZE" "$ARCHIVE"
            for p in "$PARTS"/*; do
              printf 'PART\t%s\t%s\t%s\n' "$(sha256sum "$p" | awk '{print $1}')" "$(stat -c %s "$p")" "$(basename "$p")"
            done
          } > "$OUT/EDITOR-SHA256SUMS.tsv"

          REJOIN_SHA="$(cat "$PARTS"/* | sha256sum | awk '{print $1}')"
          REJOIN_SIZE="$(cat "$PARTS"/* | wc -c)"
          if [ "$REJOIN_SHA" != "$ARCHIVE_SHA" ] || [ "$REJOIN_SIZE" != "$ACTUAL_SIZE" ]; then
            echo 'Streaming split/rejoin verification failed' >&2
            exit 35
          fi
          cat "$PARTS"/* | xz -t

          python3 - <<PY
          import json
          from pathlib import Path
          p=Path('$OUT/RESULT.json')
          d=json.loads(p.read_text())
          d['part_count']=15
          d['part_size_bytes']=268435456
          d['split_rejoin_sha256']='$REJOIN_SHA'
          d['split_rejoin_size']=int('$REJOIN_SIZE')
          d['split_rejoin_match']=('$REJOIN_SHA'=='$ARCHIVE_SHA' and '$REJOIN_SIZE'=='$ACTUAL_SIZE')
          d['streaming_rejoined_xz_test']='PASS'
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Upload editor verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-unity-china-editor-evidence
          path: |
            stage9-unity-editor-preserve/RESULT.json
            stage9-unity-editor-preserve/unity-version-raw.txt
            stage9-unity-editor-preserve/EDITOR-SHA256SUMS.tsv
            stage9-unity-editor-preserve/disk-*.txt
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
          compression-level: 0

      - name: Upload editor part 00
        if: success()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-unity-china-editor-part-00, path: stage9-unity-editor-preserve/parts/Unity-China-2022.3.44f1c1.tar.xz.part-00, if-no-files-found: error, retention-days: 90, compression-level: 0}
      - name: Upload editor part 01
        if: success()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-unity-china-editor-part-01, path: stage9-unity-editor-preserve/parts/Unity-China-2022.3.44f1c1.tar.xz.part-01, if-no-files-found: error, retention-days: 90, compression-level: 0}
      - name: Upload editor part 02
        if: success()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-unity-china-editor-part-02, path: stage9-unity-editor-preserve/parts/Unity-China-2022.3.44f1c1.tar.xz.part-02, if-no-files-found: error, retention-days: 90, compression-level: 0}
      - name: Upload editor part 03
        if: success()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-unity-china-editor-part-03, path: stage9-unity-editor-preserve/parts/Unity-China-2022.3.44f1c1.tar.xz.part-03, if-no-files-found: error, retention-days: 90, compression-level: 0}
      - name: Upload editor part 04
        if: success()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-unity-china-editor-part-04, path: stage9-unity-editor-preserve/parts/Unity-China-2022.3.44f1c1.tar.xz.part-04, if-no-files-found: error, retention-days: 90, compression-level: 0}
      - name: Upload editor part 05
        if: success()
