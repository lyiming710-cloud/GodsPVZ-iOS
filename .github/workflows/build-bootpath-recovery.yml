name: Build BootPath recovery patcher

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-bootpath-recovery.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Assemble and normalize historical BootPath source
        shell: bash
        run: |
          cat Tools/BootPathPatch/Program.cs.part* > Tools/BootPathPatch/Program.cs
          python3 <<'PY'
          from pathlib import Path
          p=Path('Tools/BootPathPatch/Program.cs')
          s=p.read_text(encoding='utf-8')
          old='''MethodReference FindCall(MethodDefinition m, string declaring, string name, int pc) =>
              m.Body.Instructions.Select(i => i.Operand).OfType<MethodReference>().First(x => x.DeclaringType.FullName.Contains(declaring) && x.Name == name && x.Parameters.Count == pc);
          GenericInstanceMethod FindGenericCall(MethodDefinition m, string declaring, string name, string genericType) =>
              m.Body.Instructions.Select(i => i.Operand).OfType<GenericInstanceMethod>().First(x => x.DeclaringType.FullName.Contains(declaring) && x.Name == name && x.GenericArguments.Any(a => a.Name == genericType || a.FullName == genericType));'''.replace('\n          ','\n')
          new='''MethodReference FindCall(MethodDefinition m, string declaring, string name, int pc) {
              var local = m.Body.Instructions.Select(i => i.Operand).OfType<MethodReference>()
                  .FirstOrDefault(x => x.DeclaringType.FullName.Contains(declaring) && x.Name == name && x.Parameters.Count == pc);
              if (local is not null) return local;
              var global = AllTypes(module.Types).SelectMany(t => t.Methods).Where(x => x.HasBody)
                  .SelectMany(x => x.Body.Instructions).Select(i => i.Operand).OfType<MethodReference>()
                  .FirstOrDefault(x => x.DeclaringType.FullName.Contains(declaring) && x.Name == name && x.Parameters.Count == pc);
              if (global is null) throw new InvalidOperationException($"Call ref not found: {declaring}::{name}/{pc}");
              Console.WriteLine($"RECOVER call ref globally: {declaring}::{name}/{pc}");
              return global;
          }
          GenericInstanceMethod FindGenericCall(MethodDefinition m, string declaring, string name, string genericType) {
              var local = m.Body.Instructions.Select(i => i.Operand).OfType<GenericInstanceMethod>()
                  .FirstOrDefault(x => x.DeclaringType.FullName.Contains(declaring) && x.Name == name && x.GenericArguments.Any(a => a.Name == genericType || a.FullName == genericType));
              if (local is not null) return local;
              var global = AllTypes(module.Types).SelectMany(t => t.Methods).Where(x => x.HasBody)
                  .SelectMany(x => x.Body.Instructions).Select(i => i.Operand).OfType<GenericInstanceMethod>()
                  .FirstOrDefault(x => x.DeclaringType.FullName.Contains(declaring) && x.Name == name && x.GenericArguments.Any(a => a.Name == genericType || a.FullName == genericType));
              if (global is null) throw new InvalidOperationException($"Generic call ref not found: {declaring}::{name}<{genericType}>");
              Console.WriteLine($"RECOVER generic call ref globally: {declaring}::{name}<{genericType}>");
              return global;
          }'''.replace('\n          ','\n')
          if old not in s: raise SystemExit('expected FindCall/FindGenericCall block not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Publish
        run: dotnet publish Tools/BootPathPatch/BootPathPatch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/boot-path-recovery
      - name: Smoke test
        shell: bash
        run: |
          chmod +x publish/boot-path-recovery/GodsPVZ.BootPathPatch
          set +e
          publish/boot-path-recovery/GodsPVZ.BootPathPatch
          code=$?
          set -e
          test "$code" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-BootPathRecovery-linux-x64
          path: publish/boot-path-recovery/GodsPVZ.BootPathPatch
          if-no-files-found: error
