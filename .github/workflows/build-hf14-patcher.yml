name: Build HF14 StatsIncreased patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF14Patch/**'
      - '.github/workflows/build-hf14-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF14 patcher
        run: dotnet publish Tools/HF14Patch/HF14Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o out/hf14
      - name: Smoke test usage
        shell: bash
        run: |
          chmod +x out/hf14/GodsPVZ.HF14Patch
          set +e
          out/hf14/GodsPVZ.HF14Patch
          code=$?
          set -e
          test "$code" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF14Patch-linux-x64
          path: out/hf14/GodsPVZ.HF14Patch
          if-no-files-found: error
