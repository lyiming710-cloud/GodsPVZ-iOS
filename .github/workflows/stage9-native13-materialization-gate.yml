name: Stage9.8 native13 Selector_B materialization gate

on:
  push:
    branches: [takeover/stage9-native6-repro-2026-09-27]
    paths:
      - '.github/workflows/stage9-native13-materialization-gate.yml'
      - 'scripts/takeover/PatcherNative13/**'
      - 'scripts/takeover/native13_donor/**'
      - 'scripts/takeover/materialize_native13.sh'
      - 'Tools/Stage9Native4Recovery/evidence/native13-native-audit/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage9-native13-materialization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NATIVE12_SOURCE_RUN_ID: '36311519467'
      NATIVE12_SOURCE_ARTIFACT_NAME: 'Stage9.7-native12-damage-experimental'
      NATIVE12_SOURCE_ARTIFACT_ID: '10929516945'
      NATIVE12_SOURCE_ARTIFACT_DIGEST: 'sha256:2aeb169ba2062e6c6576fcc4ba42fe239d24f8e2c1fa90d5b38561de0fa94d5f'
      NATIVE12_SHA256: 'bca4c3cfdd0c54408d64a9155ce35f56182fee56bc75f5f6b1c8a48c625c8218'
      SEED_RUN_ID: '36298521805'
      SEED_ARTIFACT_NAME: 'Stage9.2-native7-postlink-il2cpp-canary'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download exact native12 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.NATIVE12_SOURCE_RUN_ID }}
          name: ${{ env.NATIVE12_SOURCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/native12

      - name: Download post-Linker reference assemblies only
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: ${{ env.SEED_RUN_ID }}
          name: ${{ env.SEED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/seed

      - name: Recover exact native12 input
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t H < <(find "$RUNNER_TEMP/native12" -type f -name 'Assembly-CSharp-native12-damage.dll' | sort)
          [ "${#H[@]}" = 1 ] || { echo "Expected exactly one native12 DLL, got ${#H[@]}" >&2; exit 1; }
          GOT="$(sha256sum "${H[0]}" | awk '{print $1}')"
          [ "$GOT" = "$NATIVE12_SHA256" ] || { echo "native12 SHA mismatch: $GOT" >&2; exit 1; }
          mkdir -p Tools/Stage9Native4Recovery/candidate
          cp "${H[0]}" Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native12-damage.dll
          echo NATIVE12_INPUT_PASS

      - name: Compile typed Selector_B donor against exact stripped Unity/TMP references
        shell: bash
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/seed/Library/Bee/artifacts/iOS/ManagedStripped"
          test -f "$M/mscorlib.dll"
          test -f "$M/Unity.TextMeshPro.dll"
          test -f "$M/UnityEngine.CoreModule.dll"
          test -f "$M/UnityEngine.InputLegacyModule.dll"
          test -f "$M/UnityEngine.UIModule.dll"
          CSC="$(find /usr/share/dotnet/sdk -path '*/Roslyn/bincore/csc.dll' | sort -V | tail -1)"
          test -f "$CSC"
          OUT="$RUNNER_TEMP/native13-donor.dll"
          dotnet "$CSC" /nologo /noconfig /nostdlib+ /target:library /optimize+ /debug- \
            /out:"$OUT" \
            /reference:"$M/mscorlib.dll" \
            /reference:"$M/System.dll" \
            /reference:"$M/System.Core.dll" \
            /reference:"$M/UnityEngine.CoreModule.dll" \
            /reference:"$M/UnityEngine.InputLegacyModule.dll" \
            /reference:"$M/UnityEngine.UIModule.dll" \
            /reference:"$M/UnityEngine.UI.dll" \
            /reference:"$M/UnityEngine.TextCoreFontEngineModule.dll" \
            /reference:"$M/UnityEngine.TextCoreTextEngineModule.dll" \
            /reference:"$M/UnityEngine.TextRenderingModule.dll" \
            /reference:"$M/Unity.TextMeshPro.dll" \
            scripts/takeover/native13_donor/TMP_TextSelector_B_Donor.cs
          test -f "$OUT"
          sha256sum "$OUT" | tee "$RUNNER_TEMP/native13-donor.sha256"
          echo NATIVE13_DONOR_COMPILE_PASS

      - name: Fetch pinned Cecil
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 Tools/Stage9Native4Recovery/prepare_ci_inputs.py
          test -f Tools/Stage9Native4Recovery/tools/lib/netstandard2.0/Mono.Cecil.dll

      - name: Materialize native13 twice
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/takeover/materialize_native13.sh
          scripts/takeover/materialize_native13.sh \
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native12-damage.dll \
            "$RUNNER_TEMP/native13-donor.dll" \
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native13-selectorb.dll \
            | tee "$RUNNER_TEMP/native13-materialize.log"
          grep -qx NATIVE13_MATERIALIZATION_PASS "$RUNNER_TEMP/native13-materialize.log"

      - name: Record native13 provenance
        shell: bash
        run: |
          set -euo pipefail
          E=Tools/Stage9Native4Recovery/evidence/native13-materialization
          mkdir -p "$E"
          cp "$RUNNER_TEMP/native13-materialize.log" "$E/materialize.log"
          cp "$RUNNER_TEMP/native13-donor.sha256" "$E/donor.sha256"
          cp Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native13-selectorb.dll.run1.log "$E/patcher-run1.log"
          cp Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native13-selectorb.dll.run2.log "$E/patcher-run2.log"
          N13="$(sha256sum Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native13-selectorb.dll | awk '{print $1}')"
          cat > "$E/PROVENANCE.txt" <<EOF
          status=EXPERIMENTAL_TAKEOVER_MATERIALIZATION
          workflow_head=$GITHUB_SHA
          source_native12_run=$NATIVE12_SOURCE_RUN_ID
          source_native12_artifact_id=$NATIVE12_SOURCE_ARTIFACT_ID
          source_native12_artifact_digest=$NATIVE12_SOURCE_ARTIFACT_DIGEST
          source_native12_dll_sha256=$NATIVE12_SHA256
          donor_reference_seed_run=$SEED_RUN_ID
          native13_dll_sha256=$N13
          target=TMPro.Examples.TMP_TextSelector_B::LateUpdate
          target_methoddef=0x060007C9
          pc_native_va=0x1803B8D90
          pc_native_sha256=254235dc30236ceabc03e652cf1165f043449f226c2f2dd7c52ec71a1389b246
          deterministic_run_pair=PASS
          direct_il2cpp_canary=NOT_RUN
          full_unity_rebuild=NO
          production_promotion=NO
          EOF
          cat "$E/PROVENANCE.txt"

      - name: Upload native13 candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.8-native13-selectorb-experimental
          path: |
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native13-selectorb.dll
            Tools/Stage9Native4Recovery/evidence/native13-native-audit/
            Tools/Stage9Native4Recovery/evidence/native13-materialization/
          if-no-files-found: error
          retention-days: 30
