name: Build HF50 Path Support Dependency patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF50Patch/**'
      - '.github/workflows/build-hf50-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF50 patcher
        run: dotnet publish Tools/HF50Patch/HF50Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf50
      - name: Smoke test
        run: |
          chmod +x out/hf50/GodsPVZ.HF50Patch
          set +e
          out/hf50/GodsPVZ.HF50Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf50/GodsPVZ.HF50Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF50Patch-linux-x64
          path: out/hf50
          if-no-files-found: error
