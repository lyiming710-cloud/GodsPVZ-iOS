name: Stage9.1 R3 MonoScript serialized binding diagnostic Fix8

on:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-r3-playmode-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r3-monoscript-binding-fix8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Prepare R3 plus Preloaded Fix6 and registry Fix3
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-fix8"; E="$OUT/evidence"; mkdir -p "$OUT/parts" "$OUT/r3" "$E"
          [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ] || exit 61
          python3 -m pip install --disable-pip-version-check -q gdown==5.2.0
          cat > "$OUT/parts.tsv" <<'EOF'
          00	111hFaHbkXIkSyRoAEdushS_qZ5sPFqUI	e024b6d534a6eace43694a506ce8636c56ed17e8c21bde3bba61caab3d3bdf7a
          01	1nYIm3Bk9yxckfbwVlk6ijSUcaid6aorm	1c10d0d87be6b65c3dfd0424e38515b53a8dd1158c5734b4397f2072e5004bb2
          02	1Y9pMN1FvEpXTFzoKWAx3frra-1-O4s-y	4943615fc153ff8539ab44818dde6981a16758a2c53184a858867d4932edd9c2
          03	1I3yfH8qb4nrAvEErO-KaZLX4Ds77x_5C	f8573c2ef3db3d65de3cb3b98f0892e633cdf89d499bde2d509b36f88306331f
          04	1QUYoGuNGP83hTo6_hoeKlosAonRJCJ-n	3dc6a03ebb4a7bbd48f652b0c468911d6985f76f48c6ded991d40d1c9b7593bc
          05	1Dp8BsTeRmJ9K2yni834KMrxN_Zp18Pe2	13284c2cd74583ccdd63cf6b736dcca443acbf6bda4c25d4b65193fc08c09263
          06	1pfqVCotdu3GMYp8Vl1Bbxp7ls8SPGLsW	d35ba0e632125749f581ad57cf950d8c6b264f9f4882a08adb9ca227f6b6e23c
          07	1fgUDh-crdy3oNjYAwGr50kdAY7BTwF2J	0c9443797e24ddca500a54a21955e27fd2cb995ec7924147e7f5c244859c07ec
          08	1mhL4lliMszPy7ITjfAlSkKQEh19UjhAu	30c9a5330cdece142938150311e8acb87d00d48ab057aa39a2128a3fffdcece8
          09	12sojmPtnZPiWmnyfW-c5MhQjvR2DZMJg	46bca3df6cbfc11f155038470a39b705bb028fa7a0e9f9eb3ba4810c06d5058a
          10	1P-vcBUiPmSH3gR3l_zkgjA63J8UnsVpG	3c8e312e65a72ac3072233f558b4d43970b3a4e521139d03328e9c27ec41d994
          11	1EGPUP5nBjKqvIMft0TAQXvgqpxSVpsyI	dc3d7aa732a19f237e5e72aa6f1e768c10bd360bc6fc832d29b9afc7489da325
          EOF
          while IFS=$'\t' read -r idx fid sha; do
            f="$OUT/parts/r3.$idx.part"; python3 -m gdown --id "$fid" --output "$f" --quiet
            [ "$(sha256sum "$f" | awk '{print $1}')" = "$sha" ] || exit 62
          done < "$OUT/parts.tsv"
          cat "$OUT/parts"/*.part > "$OUT/r3.tar.zst"
          [ "$(sha256sum "$OUT/r3.tar.zst" | awk '{print $1}')" = 'd4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc' ] || exit 63
          zstd -dc "$OUT/r3.tar.zst" | tar -xf - -C "$OUT/r3"; rm -rf "$OUT/parts" "$OUT/r3.tar.zst"
          PROJECT="$OUT/r3/UnityProject-AssetRipper-2.0.0/ExportedProject"; DLL="$PROJECT/Assets/Plugins/Assembly-CSharp.dll"; META="$DLL.meta"
          [ "$(sha256sum "$DLL" | awk '{print $1}')" = 'dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655' ] || exit 64
          grep -q '^  isExplicitlyReferenced: 1$' "$META" || exit 65
          grep -q '^  isPreloaded: 0$' "$META" || exit 66
          sed -i 's/^  isPreloaded: 0$/  isPreloaded: 1/' "$META"
          python3 - "$DLL" "$E/fix8-preconditions.txt" <<'PY'
          import hashlib,sys
          from pathlib import Path
          p=Path(sys.argv[1]); out=Path(sys.argv[2]); b=bytearray(p.read_bytes())
          assert hashlib.sha256(b).hexdigest()=='dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655'
          offsets=[0x9f3ee,0x9f3fb,0x9f409,0x9f417,0x9f42a,0x9f434,0x9f45e]
          for o in offsets:
              assert bytes(b[o:o+4])==bytes.fromhex('fe0c0000'); b[o+1]=0x0d
          p.write_bytes(b); got=hashlib.sha256(b).hexdigest()
          assert got=='15af4a08ea74e936a52685afca9cf5e80a6e0a3db616af0b55bdfbfa8eea83f6'
          out.write_text('isExplicitlyReferenced=1\nisPreloaded=1\nregistryFix3=7 bytes\npatched_sha256='+got+'\n')
          PY
          echo "$PROJECT" > "$OUT/project.txt"

      - name: Download preserved exact Editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-fix8/editor-parts

      - name: Reconstruct exact Editor and activate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-fix8"; E="$OUT/evidence"; P="$OUT/editor-parts"; D="$OUT/editor"; mkdir -p "$D"
          [ "$(cat "$P"/Unity-China-2022.3.44f1c1.tar.xz.part-* | sha256sum | awk '{print $1}')" = '0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14' ] || exit 68
          (for p in "$P"/Unity-China-2022.3.44f1c1.tar.xz.part-*; do cat "$p"; done) | xz -dc | tar -xf - -C "$D"
          U="$D/Editor/Unity"; chmod +x "$U"; "$U" -version > "$E/unity-version.txt" 2>&1
          grep -q '2022.3.44f1c1' "$E/unity-version.txt" || exit 69; echo "$U" > "$OUT/unity.txt"
          C="$D/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          set +e; "$C" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > "$OUT/activate.log" 2>&1; RC=$?; set -e
          echo "$RC" > "$E/activation-exit.txt"; [ "$RC" = 0 ] || exit 70; echo ACQUIRED > "$OUT/seat.flag"

      - name: First import with Fix8 preconditions
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-fix8"; E="$OUT/evidence"; U="$(cat "$OUT/unity.txt")"; PROJECT="$(cat "$OUT/project.txt")"
          "$U" -batchmode -nographics -quit -projectPath "$PROJECT" -logFile "$E/first-import.log"
          ! grep -q 'InvalidProgramException: Invalid IL code in UnitySourceGeneratedAssemblyMonoScriptTypes_v1:Get' "$E/first-import.log"
          ! grep -qE '\berror CS[0-9]+\b|Scripts have compiler errors|Compilation failed' "$E/first-import.log"

      - name: Dump MonoScript serialized binding keys
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-fix8"; E="$OUT/evidence"; U="$(cat "$OUT/unity.txt")"; PROJECT="$(cat "$OUT/project.txt")"
          D="$PROJECT/Assets/Stage9MonoScriptDiag/Editor"; mkdir -p "$D"
          cat > "$D/Stage9MonoScriptSerializedDiag.cs" <<'EOF'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using UnityEditor;
          using UnityEngine;
          public static class Stage9MonoScriptSerializedDiag {
            static string V(SerializedProperty p){
              switch(p.propertyType){
                case SerializedPropertyType.String:return p.stringValue;
                case SerializedPropertyType.Integer:return p.longValue.ToString();
                case SerializedPropertyType.Boolean:return p.boolValue.ToString();
                case SerializedPropertyType.Enum:return p.enumValueIndex+":"+(p.enumDisplayNames.Length>p.enumValueIndex?p.enumDisplayNames[p.enumValueIndex]:"");
                case SerializedPropertyType.ObjectReference:return p.objectReferenceValue? p.objectReferenceValue.name:"<null>";
                default:return "<"+p.propertyType+">";
              }
            }
            static void Dump(List<string> l,MonoScript ms){
              AssetDatabase.TryGetGUIDAndLocalFileIdentifier(ms,out string guid,out long id);
              l.Add("BEGIN "+ms.name+" guid="+guid+" fileID="+id+" getClass="+(ms.GetClass()==null?"<null>":ms.GetClass().AssemblyQualifiedName));
              var so=new SerializedObject(ms); var p=so.GetIterator(); bool enter=true;
              while(p.Next(enter)){enter=false;l.Add(ms.name+"\t"+p.propertyPath+"\t"+p.propertyType+"\t"+V(p));}
              l.Add("END "+ms.name);
            }
            public static void Run(){
              var l=new List<string>(); var assets=AssetDatabase.LoadAllAssetsAtPath("Assets/Plugins/Assembly-CSharp.dll");
              foreach(var ms in assets.OfType<MonoScript>().Where(x=>x.name=="GameStart"||x.name=="BoardStart")) Dump(l,ms);
              var a=AppDomain.CurrentDomain.GetAssemblies().FirstOrDefault(x=>x.GetName().Name=="Assembly-CSharp");
              if(a!=null){foreach(var n in new[]{"GameStart","BoardStart"}){var t=a.GetType(n,false);l.Add("REFLECT "+n+"="+(t==null?"<null>":t.AssemblyQualifiedName)+" isMono="+(t!=null&&typeof(MonoBehaviour).IsAssignableFrom(t)));}}
              File.WriteAllLines(Environment.GetEnvironmentVariable("STAGE9_DIAG_PATH"),l);
              Debug.Log("STAGE9_FIX8_SERIALIZED lines="+l.Count);
            }
          }
          EOF
          "$U" -batchmode -nographics -quit -projectPath "$PROJECT" -logFile "$E/diag-compile.log"
          STAGE9_DIAG_PATH="$E/monoscript-serialized.txt" "$U" -batchmode -nographics -quit -projectPath "$PROJECT" -executeMethod Stage9MonoScriptSerializedDiag.Run -logFile "$E/monoscript-serialized.log"
          grep 'STAGE9_FIX8_SERIALIZED' "$E/monoscript-serialized.log" > "$E/monoscript-serialized-summary.txt"
          cat "$E/monoscript-serialized.txt"

      - name: Return Personal seat
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/stage9-fix8"; E="$OUT/evidence"
          if [ -f "$OUT/seat.flag" ] && [ -f "$OUT/unity.txt" ]; then
            C="$(dirname "$(cat "$OUT/unity.txt")")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
            set +e; "$C" --return-ulf > "$E/license-return.log" 2>&1; echo $? > "$E/license-return-exit.txt"; set -e
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-R3-MONOSCRIPT-SERIALIZED-FIX8-evidence
          path: ${{ runner.temp }}/stage9-fix8/evidence/
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
