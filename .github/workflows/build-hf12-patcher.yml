name: Build HF12 Buff Update patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF12Patch/**'
      - '.github/workflows/build-hf12-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF12 patcher
        run: dotnet publish Tools/HF12Patch/HF12Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o out/hf12
      - name: Smoke test usage
        shell: bash
        run: |
          chmod +x out/hf12/GodsPVZ.HF12Patch
          set +e
          out/hf12/GodsPVZ.HF12Patch
          code=$?
          set -e
          test "$code" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF12Patch-linux-x64
          path: out/hf12/GodsPVZ.HF12Patch
          if-no-files-found: error
