name: Stage9.1 b192 Projectile ctor strict runtime gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-b192-projectile-ctor-runtime-gate.yml'
permissions:
  contents: read
  actions: read
jobs:
  strict-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
      - name: Download exact cached R3 archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34747460206
          pattern: Stage9.1-r3-exact-archive
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-b192/r3-cache
      - name: Download validated Projectile ctor candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34804560890
          pattern: Stage9.1-DC39-PROJECTILE-CTOR-STATIC
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-b192/candidate
      - name: Download exact Unity editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-b192/editor-parts
      - name: Resolve candidate DLL
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find "$RUNNER_TEMP/stage9-b192/candidate" -type f -name 'GodsPVZRuntime1-projectile-ctor.dll' -print -quit)
          test -n "$DLL"
          test "$(sha256sum "$DLL" | awk '{print $1}')" = 'b192a02950c52778008b612c5afb2795f5124edb25e7744c68e1293be8dc34c0'
          echo "PROJECTILE_CANDIDATE=$DLL" >> "$GITHUB_ENV"
      - name: Run exact R3 strict Board gate
        shell: bash
        run: |
          set -euo pipefail
          bash Tools/Stage9RuntimeGate/run-strict-board.sh \
            "$RUNNER_TEMP/stage9-b192" \
            "$PROJECTILE_CANDIDATE" \
            "b192a02950c52778008b612c5afb2795f5124edb25e7744c68e1293be8dc34c0"
      - name: Audit recovered blocker and next causal error
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-b192/evidence"
          mkdir -p "$E"
          LOG="$E/playmode.log"
          if [ ! -f "$LOG" ]; then
            echo 'RUNTIME_AUDIT no_playmode_log=1' | tee "$E/projectile-runtime-audit.txt"
            exit 1
          fi
          python3 - "$LOG" > "$E/projectile-runtime-audit.txt" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1])
          lines=p.read_text(errors='replace').splitlines()
          text='\n'.join(lines)
          projectile=re.findall(r'InvalidProgramException: Invalid IL code in Projectile:\.ctor',text)
          plant=re.findall(r'(?:InvalidProgramException|FieldAccessException).*Plant:\.ctor',text)
          zero=re.findall(r'zeroVector',text)
          markers=[x for x in lines if x.startswith('STAGE9_STRICT_')]
          expected=[
            'STAGE9_STRICT_MAINMENU ',
            'STAGE9_STRICT_CREATE_INVOKE ok=1',
            'STAGE9_STRICT_SAVE_READY ',
            'STAGE9_STRICT_BOARD_PRESTART ',
            'STAGE9_STRICT_GAMESTART_INVOKE ok=1',
            'STAGE9_STRICT_BOARD ',
          ]
          print('PROJECTILE_CTOR_INVALID_IL_COUNT',len(projectile))
          print('PLANT_CTOR_RUNTIME_ERROR_COUNT',len(plant))
          print('ZEROVECTOR_TEXT_COUNT',len(zero))
          print('STRICT_MARKER_COUNT',len(markers))
          for m in markers: print(m)
          # Extract first exception after removing the recovered Projectile ctor blocker.
          exc_rx=re.compile(r'^(?:[A-Za-z0-9_.+`]+Exception|Exception):|^[A-Za-z0-9_.+`]+Exception:')
          first=None
          for i,line in enumerate(lines):
              if 'InvalidProgramException: Invalid IL code in Projectile:.ctor' in line:
                  continue
              if 'Exception:' in line and not line.startswith('UnityEngine.'):
                  # Keep a bounded stack/context window for triage.
                  first=i; break
          if first is not None:
              print('=== FIRST_NON_PROJECTILE_EXCEPTION ===')
              for j in range(max(0,first-3),min(len(lines),first+18)):
                  print(f'{j+1}: {lines[j]}')
          else:
              print('FIRST_NON_PROJECTILE_EXCEPTION none')
          assert len(projectile)==0, f'Projectile ctor blocker remains: {len(projectile)}'
          # Plant ctor was previously cleared; do not permit regression.
          assert len(plant)==0, f'Plant ctor regression: {len(plant)}'
          assert any(x.startswith('STAGE9_STRICT_MAINMENU ') for x in markers)
          assert 'STAGE9_STRICT_CREATE_INVOKE ok=1' in markers
          assert any(x.startswith('STAGE9_STRICT_SAVE_READY ') for x in markers)
          pre=[x for x in markers if x.startswith('STAGE9_STRICT_BOARD_PRESTART ')]
          assert pre and 'boardStart=0' in pre[-1] and 'board=0' in pre[-1] and 'boardManager=1' in pre[-1] and 'prepare=1' in pre[-1] and 'seedChooser=1' in pre[-1], pre
          assert 'STAGE9_STRICT_GAMESTART_INVOKE ok=1' in markers
          board=[x for x in markers if x.startswith('STAGE9_STRICT_BOARD ')]
          assert board and 'board=1' in board[-1] and 'activeBoard=1' in board[-1], board
          print('PROJECTILE_RUNTIME_GATE_PASS blocker_removed=1 plant_regression=0 corrected_board_lifecycle=1')
          PY
          cat "$E/projectile-runtime-audit.txt"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-B192-PROJECTILE-CTOR-MAINMENU-SAVE-BOARD-RUNTIME
          path: ${{ runner.temp }}/stage9-b192/evidence/
          if-no-files-found: warn
          retention-days: 90
