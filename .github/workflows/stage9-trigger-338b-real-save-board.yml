name: Stage9.1 trigger 338b real-save Board diagnostic
on:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-trigger-338b-real-save-board.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch prepared 338b diagnostic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run stage9-338b-real-save-board-diagnostic.yml --repo "$GITHUB_REPOSITORY" --ref high-fidelity
