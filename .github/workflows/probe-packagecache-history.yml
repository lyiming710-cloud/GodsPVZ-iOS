name: Probe exact package cache history

on:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/probe-packagecache-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public Unity package-cache history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/packages
          repo=https://github.com/zapabob/liltoon-pcss-extension.git
          git clone --filter=blob:none --no-checkout "$repo" src
          cd src
          git fetch --all --tags --prune
          cd ..
          python3 - <<'PY'
          import json, pathlib, subprocess, hashlib, tarfile
          repo=pathlib.Path('src')
          out=pathlib.Path('out')
          targets=[
            ('com.unity.ugui','1.0.0'),
            ('com.unity.textmeshpro','3.0.6'),
            ('com.unity.2d.animation','9.1.1'),
          ]
          def exists(commit, rel):
              return subprocess.run(['git','-C',str(repo),'cat-file','-e',f'{commit}:{rel}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
          rows=[]
          for name,ver in targets:
              rel=f'Library/PackageCache/{name}@{ver}'
              p=subprocess.run(['git','-C',str(repo),'log','--all','--format=%H','--',rel],text=True,capture_output=True,check=True)
              history=[x.strip() for x in p.stdout.splitlines() if x.strip()]
              candidates=[]
              for c in history:
                  candidates.append(c)
                  pp=subprocess.run(['git','-C',str(repo),'rev-parse',f'{c}^'],text=True,capture_output=True)
                  if pp.returncode==0:
                      candidates.append(pp.stdout.strip())
              seen=[]
              chosen=None
              for c in candidates:
                  if not c or c in seen: continue
                  seen.append(c)
                  if exists(c,rel):
                      chosen=c; break
              row={'name':name,'version':ver,'path':rel,'history_commit_count':len(history),'tested_candidates':len(seen)}
              if chosen:
                  row['commit']=chosen
                  tree=subprocess.check_output(['git','-C',str(repo),'rev-parse',f'{chosen}:{rel}'],text=True).strip()
                  row['tree_sha']=tree
                  dst=out/'packages'/f'{name}@{ver}.tar'
                  with open(dst,'wb') as f:
                      subprocess.run(['git','-C',str(repo),'archive','--format=tar',f'{chosen}:{rel}'],stdout=f,check=True)
                  row['archive_sha256']=hashlib.sha256(dst.read_bytes()).hexdigest()
                  with tarfile.open(dst,'r') as tf:
                      names=tf.getnames()
                      row['file_count']=len(names)
                      row['meta_count']=sum(n.endswith('.meta') for n in names)
                      identities=[]
                      for n in [n for n in names if n.endswith('package.json')]:
                          try:
                              j=json.loads(tf.extractfile(n).read())
                          except Exception:
                              continue
                          if j.get('name')==name:
                              identities.append({'path':n,'name':j.get('name'),'version':j.get('version')})
                      row['identities']=identities
              rows.append(row)
          (out/'report.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          (out/'report.txt').write_text('\n'.join(json.dumps(r,sort_keys=True) for r in rows)+'\n')
          print((out/'report.txt').read_text())
          if not any(r.get('commit') for r in rows):
              raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-packagecache-history-probe
          path: out/
          if-no-files-found: error
          retention-days: 30
