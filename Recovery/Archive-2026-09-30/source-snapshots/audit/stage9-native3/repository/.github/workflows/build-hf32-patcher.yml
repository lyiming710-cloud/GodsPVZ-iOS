name: Build HF32 projectile tracking patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF32Patch/**'
      - '.github/workflows/build-hf32-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF32 patcher
        run: dotnet publish Tools/HF32Patch/HF32Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf32
      - name: Smoke test
        run: |
          chmod +x out/hf32/GodsPVZ.HF32Patch
          set +e
          out/hf32/GodsPVZ.HF32Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf32/GodsPVZ.HF32Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF32Patch-linux-x64
          path: out/hf32
          if-no-files-found: error
