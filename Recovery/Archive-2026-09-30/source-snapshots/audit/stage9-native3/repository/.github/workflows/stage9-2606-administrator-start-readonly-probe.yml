name: Stage9.1 2606 Administrator Start read-only probe
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-2606-administrator-start-readonly-probe.yml','Tools/Stage9AdministratorStartProbe/**','Tools/Stage9NativeProbe/Administrator.Start.native-evidence.md']
permissions: {contents: read, actions: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34990527235, name: Stage9.1-FE67-TEXTLINK-UPDATE-QUALIFIED, path: '${{ runner.temp }}/candidate'}
      - name: Probe Administrator Start read-only
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find "$RUNNER_TEMP/candidate" -type f -name 'GodsPVZRuntime1-textlink-update.dll' -print -quit)
          test -n "$DLL"
          dotnet run --project Tools/Stage9AdministratorStartProbe/Stage9AdministratorStartProbe.csproj -c Release -- "$DLL" '26064265fdba4e9b501f0c3312260503fdde43b9e111072c19dd39891e5ca022' | tee "$RUNNER_TEMP/administrator-start-probe.txt"
          grep -Eq '^READONLY_ADMINISTRATOR_START_PROBE_PASS mutation=0 token=0x06000004 rid=4 switch_damage=1 native_call_rids=11 admin_fields=[1-9][0-9]* admin_methods=[1-9][0-9]*$' "$RUNNER_TEMP/administrator-start-probe.txt"
          test "$(grep -c '^NATIVE_OWN_CALL_RID ' "$RUNNER_TEMP/administrator-start-probe.txt")" = 11
          test "$(grep -c '^ADMIN_FIELD ' "$RUNNER_TEMP/administrator-start-probe.txt")" -gt 0
          test "$(grep -c '^ADMIN_METHOD ' "$RUNNER_TEMP/administrator-start-probe.txt")" -gt 0
      - uses: actions/upload-artifact@v4
        with: {name: Stage9.1-2606-ADMINISTRATOR-START-READONLY-PROBE, path: '${{ runner.temp }}/administrator-start-probe.txt', retention-days: 90}
