name: Stage9.1 Unity managed reference cache

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-unity-managed-reference-cache.yml'

permissions:
  contents: read
  actions: read

jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true

      - name: Download exact Unity editor parts once
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/refs/editor-parts

      - name: Extract only reusable managed references
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/refs"
          P="$O/editor-parts"
          mkdir -p "$O/editor" "$O/cache"
          test "$(find "$P" -maxdepth 1 -type f -name 'Unity-China-2022.3.44f1c1.tar.xz.part-*' | wc -l)" = 15
          cat "$P"/Unity-China-2022.3.44f1c1.tar.xz.part-* > "$O/Unity-China-2022.3.44f1c1.tar.xz"
          test "$(sha256sum "$O/Unity-China-2022.3.44f1c1.tar.xz" | awk '{print $1}')" = '0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14'
          xz -dc "$O/Unity-China-2022.3.44f1c1.tar.xz" | tar -xf - -C "$O/editor"
          RDIR="$O/editor/Editor/Data/Managed"
          test -f "$RDIR/UnityEngine/UnityEngine.CoreModule.dll" -o -f "$RDIR/UnityEngine.CoreModule.dll"
          cp -a "$RDIR/." "$O/cache/"
          find "$O/cache" -type f -print0 | sort -z | xargs -0 sha256sum > "$O/cache/MANIFEST-SHA256.txt"
          {
            echo 'UNITY_VERSION Unity China 2022.3.44f1c1'
            echo 'SOURCE_EDITOR_ARCHIVE_SHA256 0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14'
            echo "REFERENCE_FILE_COUNT $(find "$O/cache" -type f | wc -l)"
            echo "REFERENCE_BYTES $(du -sb "$O/cache" | awk '{print $1}')"
          } | tee "$O/cache/REFERENCE-PROVENANCE.txt"

      - name: Upload compact managed reference cache
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-UNITY-MANAGED-REFS-2022.3.44f1c1
          path: ${{ runner.temp }}/refs/cache/
          retention-days: 90
          compression-level: 6
