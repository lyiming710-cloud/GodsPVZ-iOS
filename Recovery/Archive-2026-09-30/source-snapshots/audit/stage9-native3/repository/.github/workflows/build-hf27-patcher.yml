name: Build HF27 projectile collision resolution patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF27Patch/**'
      - '.github/workflows/build-hf27-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF27 patcher
        run: dotnet publish Tools/HF27Patch/HF27Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf27
      - name: Smoke test
        run: |
          chmod +x out/hf27/GodsPVZ.HF27Patch
          set +e
          out/hf27/GodsPVZ.HF27Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf27/GodsPVZ.HF27Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF27Patch-linux-x64
          path: out/hf27
          if-no-files-found: error
