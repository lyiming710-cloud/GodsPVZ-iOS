name: Build HF26 collision audio particle patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF26Patch/**'
      - '.github/workflows/build-hf26-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF26 patcher
        run: dotnet publish Tools/HF26Patch/HF26Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf26
      - name: Smoke test
        run: |
          chmod +x out/hf26/GodsPVZ.HF26Patch
          set +e
          out/hf26/GodsPVZ.HF26Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf26/GodsPVZ.HF26Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF26Patch-linux-x64
          path: out/hf26
          if-no-files-found: error
