name: Stage9.1 19df Almanac DeviceWindow ctor natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-19df-almanac-devicewindow-ctor-natural-runtime.yml','Tools/Stage9AlmanacDeviceWindowRuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34964363026, name: Stage9.1-EC06-ALMANAC-DEVICEWINDOW-CTOR-QUALIFIED, path: '${{ runner.temp }}/stage9-devicewindow/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-devicewindow/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-devicewindow/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-devicewindow/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-almanac-devicewindow-ctor.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = '19df62e48fbc2fddffb830346123803dd8d0fd45a8896d24c28e92c665cba9fa'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "DEVICEWINDOW_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "DEVICEWINDOW_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-devicewindow" "$DEVICEWINDOW_CANDIDATE" "$DEVICEWINDOW_SHA"
      - name: Audit Almanac DeviceWindow natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-devicewindow/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9AlmanacDeviceWindowRuntimeAudit/audit.py "$LOG" "$DEVICEWINDOW_SHA" | tee "$E/almanac-devicewindow-ctor-natural-runtime-audit.txt"
          python3 Tools/Stage9RuntimeTriage/first-invalid.py "$LOG" | tee "$E/first-invalid-triage.txt"
      - name: Upload Almanac DeviceWindow natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-19DF-ALMANAC-DEVICEWINDOW-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-devicewindow/evidence/', retention-days: 90}
