name: Build HF45 FlagMeter runtime core patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF45Patch/**'
      - '.github/workflows/build-hf45-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF45 patcher
        run: dotnet publish Tools/HF45Patch/HF45Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf45
      - name: Smoke test
        run: |
          chmod +x out/hf45/GodsPVZ.HF45Patch
          set +e
          out/hf45/GodsPVZ.HF45Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf45/GodsPVZ.HF45Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF45Patch-linux-x64
          path: out/hf45
          if-no-files-found: error
