name: Stage9.1 8905 Dialogue Start recovery pipeline
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-8905-dialogue-start-recovery-pipeline.yml'
      - 'Tools/Stage9DialogueStartPatch/**'
      - 'Tools/Stage9RuntimeGateFast/**'
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download runtime-qualified 8905 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34845237000
          name: Stage9.1-D65C-GRID-COPY-V2-STATIC
          path: ${{ runner.temp }}/input
      - name: Build patch and run static isolation gates
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/dialogue-start"; E="$O/evidence"; mkdir -p "$E"
          IN=$(find "$RUNNER_TEMP/input" -type f -name 'GodsPVZRuntime1-grid-copy-v2.dll' -print -quit)
          test -n "$IN"
          test "$(sha256sum "$IN"|awk '{print $1}')" = '8905a8866d0d148f4c681e9128417fd927a968521a5afb35c78b4bfa8d4f5e4b'
          OUT="$O/GodsPVZRuntime1-dialogue-start.dll"
          dotnet build Tools/Stage9DialogueStartPatch/Stage9DialogueStartPatch.csproj -c Release --nologo
          dotnet run --project Tools/Stage9DialogueStartPatch/Stage9DialogueStartPatch.csproj -c Release --no-build -- "$IN" "$OUT" | tee "$E/patch.log"
          grep -q '^NATIVE_AUTHORITY target_token=0x06000193 rid=403 method_pointer_entry=0x181B839F0 va=0x180314620 end=0x18031478F native_slice_sha256=600d505be96241a0c336dd07725df87fdfc5e32184162e16aad70234a261a8d5$' "$E/patch.log"
          grep -q '^CLR_FAILURE_ADAPTATION direct_deref=1 direct_array_index=1 explicit_framework_exception_ctor=0 system_private_corelib_refs=0$' "$E/patch.log"
          grep -q '^REOPEN_DIALOGUE_START_PASS token=0x06000193 .*locals=2 ceq=0 object_locals=0 framework_exception_ctors=0 ldelem_i4=2 GameContinue_calls=1 SetActive_calls=1 rescue_gate=1 hardstar_gate=1 dialogue_assign=1$' "$E/patch.log"
          grep -q '^FRAMEWORK_REFERENCE_GATE_PASS system_private_corelib_refs=0$' "$E/patch.log"
          grep -q '^SEMANTIC_ISOLATION_PASS untouched_methods=2316 changed_methods=1 target=0x06000193$' "$E/patch.log"
          grep -q '^FIELD_METADATA_ISOLATION_PASS unchanged_fields=2802 changed_fields=0$' "$E/patch.log"
          grep -q '^PRESERVATION_PASS batch1=4 plant_ctor=1 projectile_ctor=1 projectile_hf21=2 managers=2 plant_detail_initialize=1 load_skill_logo=1 load_data=1 create_map=1 grid_copy=1$' "$E/patch.log"
          sha256sum "$OUT" | tee "$E/output-candidate.sha256"
          cp "$OUT" "$E/"
          cp Tools/Stage9NativeProbe/DialogueManager_OnBoard.Start.native-evidence.md "$E/"
      - name: Download fixed ILSpy
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34173085137
          pattern: GodsPVZ-ILSpyCmd-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/ilspy
      - name: Download compact exact Unity refs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34804463514
          name: Stage9.1-UNITY-MANAGED-REFS-2022.3.44f1c1
          path: ${{ runner.temp }}/refs
      - name: Exact-reference readback gate
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/dialogue-start"; E="$O/evidence"
          DLL="$O/GodsPVZRuntime1-dialogue-start.dll"
          ILSPY=$(find "$RUNNER_TEMP/ilspy" -type f -name ilspycmd -print -quit)
          DOTNET_BIN=$(find "$RUNNER_TEMP/ilspy" -type f -path '*/ilspy-runtime/dotnet' -print -quit)
          chmod +x "$ILSPY" "$DOTNET_BIN"
          export DOTNET_ROOT="$(dirname "$DOTNET_BIN")"; export PATH="$DOTNET_ROOT:$PATH"
          RDIR=$(find "$RUNNER_TEMP/refs" -type f -name UnityEngine.CoreModule.dll -printf '%h\n' | head -1)
          test -n "$RDIR"
          "$ILSPY" -r "$RDIR" -t DialogueManager_OnBoard "$DLL" > "$E/DialogueManager_OnBoard.cs" 2> "$E/DialogueManager_OnBoard.cs.stderr"
          "$ILSPY" -r "$RDIR" -il -t DialogueManager_OnBoard "$DLL" > "$E/DialogueManager_OnBoard.il" 2> "$E/DialogueManager_OnBoard.il.stderr"
          test ! -s "$E/DialogueManager_OnBoard.cs.stderr"
          test ! -s "$E/DialogueManager_OnBoard.il.stderr"
          python3 - "$E/DialogueManager_OnBoard.cs" "$E/DialogueManager_OnBoard.il" <<'PY' | tee "$E/exact-ref-gate.txt"
          from pathlib import Path
          import re,sys
          cs=Path(sys.argv[1]).read_text(errors='replace'); il=Path(sys.argv[2]).read_text(errors='replace')
          m=re.search(r'(?:private|public|protected|internal)\s+void\s+Start\s*\(\s*\)',cs); assert m,'Start C# not found'
          o=cs.index('{',m.end()); d=0; end=None
          for i in range(o,len(cs)):
              d+=(cs[i]=='{')-(cs[i]=='}')
              if d==0: end=i+1; break
          assert end is not None
          body=cs[m.start():end]; Path(sys.argv[1]+'.Start.txt').write_text(body)
          for bad in ['Unknown result type','Unmanaged memory load','Expected I','Expected O','Expected I4','Method not found @','Warning: Method ends','NullReferenceException','IndexOutOfRangeException','System.Private.CoreLib']:
              assert bad not in body,(bad,body)
          for good in ['GameContinue','rescuePassNum','adventureHardMaxStarNum','boardDialogues','dialogueList']:
              assert good in body,(good,body)
          e=il.find('} // end of method DialogueManager_OnBoard::Start'); assert e>=0
          b=il.rfind('.method ',0,e); ib=il[b:e]; Path(sys.argv[2]+'.Start.txt').write_text(ib)
          for bad in ['ceq','System.Object','NullReferenceException','IndexOutOfRangeException','System.Private.CoreLib','Method not found @','Warning: Method ends']:
              assert bad not in ib,(bad,ib)
          assert ib.count('Board::GameContinue()')==1,ib
          assert ib.count('Save::rescuePassNum')==1,ib
          assert ib.count('Save::adventureHardMaxStarNum')==1,ib
          assert ib.count('ldelem.i4')==2,ib
          assert ib.count('BoardConfig::boardDialogues')==1,ib
          print('DIALOGUE_START_EXACT_REF_PASS target_token=0x06000193 invalid_diagnostics=0 object_integer_corruption=0 direct_failure_semantics=1 corelib_pollution=0')
          print('=== TARGET_CSHARP ==='); print(body)
          PY
      - name: Upload qualified candidate
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-8905-DIALOGUE-START-QUALIFIED
          path: ${{ runner.temp }}/dialogue-start/evidence/
          retention-days: 90
  runtime:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
      - name: Download qualified candidate from this run
        uses: actions/download-artifact@v4
        with:
          name: Stage9.1-8905-DIALOGUE-START-QUALIFIED
          path: ${{ runner.temp }}/stage9-dialogue/candidate
      - name: Download exact cached R3 archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34747460206
          pattern: Stage9.1-r3-exact-archive
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-dialogue/r3-cache
      - name: Download exact Unity editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-dialogue/editor-parts
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-dialogue/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-dialogue-start.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          EXPECTED=$(awk '{print $1}' "$SUM")
          test "${#EXPECTED}" = 64
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$EXPECTED"
          echo "DIALOGUE_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "DIALOGUE_SHA=$EXPECTED" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $EXPECTED"
      - name: Run single-launch exact R3 strict Board gate
        shell: bash
        run: |
          set -euo pipefail
          bash Tools/Stage9RuntimeGateFast/run-strict-board-fast.sh "$RUNNER_TEMP/stage9-dialogue" "$DIALOGUE_CANDIDATE" "$DIALOGUE_SHA"
      - name: Audit recovered blocker and promote next causal error
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-dialogue/evidence"; mkdir -p "$E"; LOG="$E/playmode.log"
          if [ ! -f "$LOG" ]; then echo 'RUNTIME_AUDIT no_playmode_log=1' | tee "$E/dialogue-start-runtime-audit.txt"; exit 1; fi
          python3 - "$LOG" > "$E/dialogue-start-runtime-audit.txt" <<'PY'
          from pathlib import Path
          import re,sys
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines(); text='\n'.join(lines)
          counts={
            'DIALOGUE_START_INVALID_IL_COUNT':len(re.findall(r'InvalidProgramException: Invalid IL code in DialogueManager_OnBoard:Start',text)),
            'GRID_COPY_INVALID_IL_COUNT':len(re.findall(r'InvalidProgramException: Invalid IL code in Grid:Copy',text)),
            'CORELIB_TEXT_COUNT':text.count('System.Private.CoreLib'),
            'BOARDCONFIG_CREATEMAP_INVALID_IL_COUNT':len(re.findall(r'InvalidProgramException: Invalid IL code in BoardConfig:CreateMap',text)),
            'LOAD_DATA_INVALID_IL_COUNT':len(re.findall(r'InvalidProgramException: Invalid IL code in Board_PlantDetail_PlantData:LoadData',text)),
            'LOAD_SKILL_LOGO_INVALID_IL_COUNT':len(re.findall(r'InvalidProgramException: Invalid IL code in Plant_DetaiPage:LoadSkillLogo',text)),
            'PROJECTILE_CTOR_INVALID_IL_COUNT':len(re.findall(r'InvalidProgramException: Invalid IL code in Projectile:\.ctor',text)),
          }
          counts['PLANT_DETAIL_INITIALIZE_FIELDACCESS_COUNT']=sum('FieldAccessException' in x and 'Plant:isOnField' in x and 'Plant_DetaiPage:Initialize' in x for x in lines)
          counts['PLANT_CTOR_RUNTIME_ERROR_COUNT']=len(re.findall(r'(?:InvalidProgramException|FieldAccessException).*Plant:\.ctor',text))
          counts['ZEROVECTOR_TEXT_COUNT']=text.count('zeroVector')
          for k,v in counts.items(): print(k,v)
          markers=[x for x in lines if x.startswith('STAGE9_STRICT_')]
          print('STRICT_MARKER_COUNT',len(markers)); [print(x) for x in markers]
          pre_idx=next((i for i,x in enumerate(lines) if x.startswith('STAGE9_STRICT_BOARD_PRESTART ')),None)
          recovered=['DialogueManager_OnBoard:Start','Grid:Copy','BoardConfig:CreateMap','Board_PlantDetail_PlantData:LoadData','Plant_DetaiPage:LoadSkillLogo','Projectile:.ctor']
          first=None
          if pre_idx is not None:
            for i in range(pre_idx+1,len(lines)):
              x=lines[i]
              if 'Exception:' not in x or x.startswith('UnityEngine.'): continue
              if any(s in x for s in recovered): continue
              if 'FieldAccessException' in x and 'Plant:isOnField' in x: continue
              first=i; break
          if first is None: print('FIRST_POST_PRESTART_NONRECOVERED_EXCEPTION none')
          else:
            print('=== FIRST_POST_PRESTART_NONRECOVERED_EXCEPTION ===')
            for j in range(max(pre_idx or 0,first-4),min(len(lines),first+36)): print(f'{j+1}: {lines[j]}')
          assert all(v==0 for v in counts.values()),counts
          assert any(x.startswith('STAGE9_STRICT_MAINMENU ') for x in markers)
          assert 'STAGE9_STRICT_CREATE_INVOKE ok=1' in markers
          assert any(x.startswith('STAGE9_STRICT_SAVE_READY ') for x in markers)
          pre=[x for x in markers if x.startswith('STAGE9_STRICT_BOARD_PRESTART ')]
          assert pre and all(s in pre[-1] for s in ['boardStart=0','board=0','boardManager=1','prepare=1','seedChooser=1']),pre
          assert 'STAGE9_STRICT_GAMESTART_INVOKE ok=1' in markers
          board=[x for x in markers if x.startswith('STAGE9_STRICT_BOARD ')]
          assert board and 'board=1' in board[-1] and 'activeBoard=1' in board[-1],board
          print('DIALOGUE_START_RUNTIME_GATE_PASS blocker_removed=1 previous_recoveries_preserved=1 corelib_pollution=0 corrected_board_lifecycle=1')
          PY
          cat "$E/dialogue-start-runtime-audit.txt"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-DIALOGUE-START-MAINMENU-SAVE-BOARD-RUNTIME
          path: ${{ runner.temp }}/stage9-dialogue/evidence/
          if-no-files-found: warn
          retention-days: 90
