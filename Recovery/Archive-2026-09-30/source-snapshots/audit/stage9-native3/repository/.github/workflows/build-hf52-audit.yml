name: Build HF52 cumulative recovery audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF52Audit/**'
      - '.github/workflows/build-hf52-audit.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish historical RecoveryAudit
        run: dotnet publish Tools/RecoveryAudit/RecoveryAudit.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o out/historical
      - name: Publish cumulative HF52 auditor
        run: dotnet publish Tools/HF52Audit/HF52Audit.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o out/hf52
      - name: Smoke tests
        run: |
          chmod +x out/historical/GodsPVZ.RecoveryAudit out/hf52/GodsPVZ.HF52Audit
          set +e
          out/historical/GodsPVZ.RecoveryAudit; a=$?
          out/hf52/GodsPVZ.HF52Audit; b=$?
          set -e
          test "$a" = "2"
          test "$b" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF52-CompositeAudit-linux-x64
          path: |
            out/historical/GodsPVZ.RecoveryAudit
            out/hf52/GodsPVZ.HF52Audit
          if-no-files-found: error
