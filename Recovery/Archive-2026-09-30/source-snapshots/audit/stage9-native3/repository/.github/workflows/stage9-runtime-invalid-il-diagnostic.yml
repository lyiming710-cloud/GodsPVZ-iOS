name: Stage9.1 runtime invalid IL diagnostic

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-runtime-invalid-il-diagnostic.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reconstruct formal R3 HF55
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-invalid-il"; E="$OUT/evidence"
          mkdir -p "$OUT/parts" "$OUT/r3" "$E"
          python3 -m pip install --disable-pip-version-check -q gdown==5.2.0
          cat > "$OUT/parts.tsv" <<'EOF'
          00	111hFaHbkXIkSyRoAEdushS_qZ5sPFqUI	e024b6d534a6eace43694a506ce8636c56ed17e8c21bde3bba61caab3d3bdf7a
          01	1nYIm3Bk9yxckfbwVlk6ijSUcaid6aorm	1c10d0d87be6b65c3dfd0424e38515b53a8dd1158c5734b4397f2072e5004bb2
          02	1Y9pMN1FvEpXTFzoKWAx3frra-1-O4s-y	4943615fc153ff8539ab44818dde6981a16758a2c53184a858867d4932edd9c2
          03	1I3yfH8qb4nrAvEErO-KaZLX4Ds77x_5C	f8573c2ef3db3d65de3cb3b98f0892e633cdf89d499bde2d509b36f88306331f
          04	1QUYoGuNGP83hTo6_hoeKlosAonRJCJ-n	3dc6a03ebb4a7bbd48f652b0c468911d6985f76f48c6ded991d40d1c9b7593bc
          05	1Dp8BsTeRmJ9K2yni834KMrxN_Zp18Pe2	13284c2cd74583ccdd63cf6b736dcca443acbf6bda4c25d4b65193fc08c09263
          06	1pfqVCotdu3GMYp8Vl1Bbxp7ls8SPGLsW	d35ba0e632125749f581ad57cf950d8c6b264f9f4882a08adb9ca227f6b6e23c
          07	1fgUDh-crdy3oNjYAwGr50kdAY7BTwF2J	0c9443797e24ddca500a54a21955e27fd2cb995ec7924147e7f5c244859c07ec
          08	1mhL4lliMszPy7ITjfAlSkKQEh19UjhAu	30c9a5330cdece142938150311e8acb87d00d48ab057aa39a2128a3fffdcece8
          09	12sojmPtnZPiWmnyfW-c5MhQjvR2DZMJg	46bca3df6cbfc11f155038470a39b705bb028fa7a0e9f9eb3ba4810c06d5058a
          10	1P-vcBUiPmSH3gR3l_zkgjA63J8UnsVpG	3c8e312e65a72ac3072233f558b4d43970b3a4e521139d03328e9c27ec41d994
          11	1EGPUP5nBjKqvIMft0TAQXvgqpxSVpsyI	dc3d7aa732a19f237e5e72aa6f1e768c10bd360bc6fc832d29b9afc7489da325
          EOF
          while IFS=$'\t' read -r idx fid sha; do
            f="$OUT/parts/r3.$idx.part"
            python3 -m gdown --id "$fid" --output "$f" --quiet
            [ "$(sha256sum "$f" | awk '{print $1}')" = "$sha" ] || exit 61
          done < "$OUT/parts.tsv"
          cat "$OUT/parts"/*.part > "$OUT/r3.tar.zst"
          [ "$(stat -c%s "$OUT/r3.tar.zst")" = 786765618 ] || exit 62
          [ "$(sha256sum "$OUT/r3.tar.zst" | awk '{print $1}')" = 'd4264f12a00e86b6149d20ecf04caa9761af510aece6107bcceb155ea4ab0bbc' ] || exit 63
          zstd -dc "$OUT/r3.tar.zst" | tar -xf - -C "$OUT/r3"
          rm -rf "$OUT/parts" "$OUT/r3.tar.zst"
          DLL="$OUT/r3/UnityProject-AssetRipper-2.0.0/ExportedProject/Assets/Plugins/Assembly-CSharp.dll"
          [ "$(sha256sum "$DLL" | awk '{print $1}')" = 'dc205a40dc2478b3aacbb3a7d6bb1ca96ffb0a964648d34062b4ddc75f3b3655' ] || exit 64
          echo "$DLL" > "$OUT/base.txt"

      - name: Download HF56 patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34689491315
          pattern: GodsPVZ-HF56Patch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-invalid-il/p56

      - name: Download HF57 patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34690940527
          pattern: GodsPVZ-HF57Patch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-invalid-il/p57

      - name: Download Board mechanical patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34699623218
          pattern: GodsPVZ-Stage9BoardMechanicalPatch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-invalid-il/pb

      - name: Download final managed cleanup patcher
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34705278743
          pattern: GodsPVZ-Stage9ManagedCleanupPatch-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-invalid-il/pc

      - name: Construct exact post-mechanical and managed-cleanup DLLs
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-invalid-il"; E="$OUT/evidence"; BASE="$(cat "$OUT/base.txt")"
          P56="$(find "$OUT/p56" -name GodsPVZ.HF56Patch -type f | head -1)"
          P57="$(find "$OUT/p57" -name GodsPVZ.HF57Patch -type f | head -1)"
          PB="$(find "$OUT/pb" -name GodsPVZ.Stage9BoardMechanicalPatch -type f | head -1)"
          PC="$(find "$OUT/pc" -name GodsPVZ.Stage9ManagedCleanupPatch -type f | head -1)"
          chmod +x "$P56" "$P57" "$PB" "$PC"
          "$P56" "$BASE" "$OUT/hf56.dll" > "$E/hf56.log"
          [ "$(sha256sum "$OUT/hf56.dll" | awk '{print $1}')" = '2308c08296cfb83a72321325fd28362d59c25d6bb1a9cc6635a7b4624af202b0' ]
          "$P57" "$OUT/hf56.dll" "$OUT/hf57.dll" > "$E/hf57.log"
          [ "$(sha256sum "$OUT/hf57.dll" | awk '{print $1}')" = 'a699e0f3e812ae1dcd7e1f7d60b7757f958e498626c6a39e43f9984ebe55e38b' ]
          cp "$OUT/hf57.dll" "$OUT/integrated.dll"
          python3 - "$OUT/integrated.dll" <<'PY'
          import hashlib,sys
          from pathlib import Path
          p=Path(sys.argv[1]); b=bytearray(p.read_bytes()); assert hashlib.sha256(b).hexdigest()=='a699e0f3e812ae1dcd7e1f7d60b7757f958e498626c6a39e43f9984ebe55e38b'
          for o in [0x9f3d6,0x9f3e3,0x9f3f1,0x9f3ff,0x9f412,0x9f41c,0x9f446]: assert bytes(b[o:o+4])==bytes.fromhex('fe0c0000'); b[o+1]=0x0d
          for o,old,new in [(0xde448,b'Assembly-CSharp.dll',b'GodsPVZRuntime1.dll'),(0xe0137,b'Assembly-CSharp',b'GodsPVZRuntime1')]: assert bytes(b[o:o+len(old)])==old; b[o:o+len(old)]=new
          p.write_bytes(b); assert hashlib.sha256(b).hexdigest()=='e49557eeb620c2d3be38aaf9c399a10978740e0a26dd8d0b0f8a190b12b8b568'
          PY
          "$PB" "$OUT/integrated.dll" "$OUT/postmechanical.dll" > "$E/board-mechanical.log"
          [ "$(sha256sum "$OUT/postmechanical.dll" | awk '{print $1}')" = '00ba34c43e08c73c3cc8a39e0bf7f0d35fd280e360dd8a2907e9304d93343980' ]
          "$PC" "$OUT/postmechanical.dll" "$OUT/managed-cleanup.dll" > "$E/managed-cleanup.log"
          [ "$(sha256sum "$OUT/managed-cleanup.dll" | awk '{print $1}')" = 'd9e3da6a7ce72daf505aaa806c0c6a6a5b38ecac2308e70135f5245db4144c03' ]
          printf 'postmechanical=%s\nmanaged_cleanup=%s\n' \
            "$(sha256sum "$OUT/postmechanical.dll" | awk '{print $1}')" \
            "$(sha256sum "$OUT/managed-cleanup.dll" | awk '{print $1}')" > "$E/input-sha256.txt"

      - name: Compare exact failing methods with Cecil
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-invalid-il"; E="$OUT/evidence"; D="$OUT/diag"; mkdir -p "$D"
          cat > "$D/Diag.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup><ItemGroup><PackageReference Include="Mono.Cecil" Version="0.11.6" /></ItemGroup></Project>
          EOF
          cat > "$D/Program.cs" <<'EOF'
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          using System.Text;

          static class Diag {
            static IEnumerable<TypeDefinition> All(IEnumerable<TypeDefinition> roots){foreach(var t in roots){yield return t;foreach(var n in All(t.NestedTypes))yield return n;}}
            static string Op(object? o)=>o switch {
              null=>"",
              Instruction i=>$"IL_{i.Offset:X4}",
              Instruction[] a=>"["+string.Join(",",a.Select(x=>$"IL_{x.Offset:X4}"))+"]",
              MethodReference m=>$"{m.FullName} [0x{m.MetadataToken.ToUInt32():X8}]",
              FieldReference f=>$"{f.FullName} [0x{f.MetadataToken.ToUInt32():X8}]",
              TypeReference t=>$"{t.FullName} [0x{t.MetadataToken.ToUInt32():X8}]",
              VariableDefinition v=>$"V_{v.Index}:{v.VariableType.FullName}",
              ParameterDefinition p=>$"P_{p.Index}:{p.ParameterType.FullName}",
              _=>o.ToString()??""
            };
            static HashSet<Instruction> Targets(MethodDefinition m){var s=new HashSet<Instruction>();foreach(var i in m.Body.Instructions){if(i.Operand is Instruction q)s.Add(q);else if(i.Operand is Instruction[] a)foreach(var q2 in a)s.Add(q2);}foreach(var h in m.Body.ExceptionHandlers)foreach(var q in new[]{h.TryStart,h.TryEnd,h.HandlerStart,h.HandlerEnd,h.FilterStart})if(q!=null)s.Add(q);return s;}
            static MethodDefinition BoardCtor(ModuleDefinition md)=>All(md.Types).Single(t=>t.FullName=="Board").Methods.Single(m=>m.Name==".ctor"&&m.Parameters.Count==0&&m.HasBody);
            static MethodDefinition PlantAwake(ModuleDefinition md)=>All(md.Types).Single(t=>t.FullName=="SeedChooserScreen/PlantDetail").Methods.Single(m=>m.Name=="Awake"&&m.Parameters.Count==1&&m.Parameters[0].ParameterType.FullName=="Card_Choose"&&m.HasBody);
            static void DumpField(StreamWriter w,ModuleDefinition md,uint raw){var p=md.LookupToken(new MetadataToken(TokenType.Field,(int)(raw&0x00ffffff)));w.WriteLine($"FIELD 0x{raw:X8} kind={p?.GetType().Name} value={p}");if(p is FieldDefinition f){w.WriteLine($" FIELD_DECL={f.DeclaringType.FullName} NAME={f.Name} TYPE={f.FieldType.FullName} ATTRS={f.Attributes} STATIC={f.IsStatic} INITONLY={f.IsInitOnly} CONST={(f.HasConstant?f.Constant:"<none>")}");var fs=f.DeclaringType.Fields.ToList();var ix=fs.IndexOf(f);for(int i=Math.Max(0,ix-4);i<=Math.Min(fs.Count-1,ix+4);i++){var q=fs[i];w.WriteLine($" FIELD_NEAR 0x{q.MetadataToken.ToUInt32():X8} {q.FieldType.FullName} {q.Name}");}}}
            static void DumpMethod(StreamWriter w,string stage,MethodDefinition m){var tg=Targets(m);w.WriteLine($"=== {stage} METHOD 0x{m.MetadataToken.ToUInt32():X8} {m.FullName} ===");w.WriteLine($"MAX={m.Body.MaxStackSize} SIZE={m.Body.CodeSize} INITLOCALS={m.Body.InitLocals} LOCALS={m.Body.Variables.Count} EH={m.Body.ExceptionHandlers.Count}");foreach(var v in m.Body.Variables)w.WriteLine($" LOCAL V_{v.Index} {v.VariableType.FullName}");foreach(var h in m.Body.ExceptionHandlers)w.WriteLine($" EH {h.HandlerType} TRY={h.TryStart?.Offset:X4}-{h.TryEnd?.Offset:X4} HANDLER={h.HandlerStart?.Offset:X4}-{h.HandlerEnd?.Offset:X4} FILTER={h.FilterStart?.Offset:X4} CATCH={h.CatchType?.FullName}");foreach(var i in m.Body.Instructions)w.WriteLine($" IL_{i.Offset:X4}: {(tg.Contains(i)?"[TARGET]":"        ")} {i.OpCode,-12} {Op(i.Operand)}");w.WriteLine();}
            static string Sem(Instruction i)=>i.OpCode.Code+"|"+Op(i.Operand);
            static void Diff(StreamWriter w,string label,MethodDefinition a,MethodDefinition b){w.WriteLine($"=== DIFF {label} ===");var aa=a.Body.Instructions;var bb=b.Body.Instructions;int n=Math.Max(aa.Count,bb.Count),d=0;for(int i=0;i<n;i++){var x=i<aa.Count?Sem(aa[i]):"<none>";var y=i<bb.Count?Sem(bb[i]):"<none>";if(x==y)continue;d++;w.WriteLine($" IDX={i} POST={(i<aa.Count?$"IL_{aa[i].Offset:X4} {x}":"<none>")} CLEAN={(i<bb.Count?$"IL_{bb[i].Offset:X4} {y}":"<none>")}");}w.WriteLine($"DIFF_COUNT={d}");}
            static int HelperCalls(MethodDefinition m)=>m.Body.Instructions.Count(i=>i.Operand is MethodReference mr&&mr.DeclaringType.FullName=="Cpp2ILInjected.Cpp2ILHelpers");
            public static int Main(string[] a){using var post=ModuleDefinition.ReadModule(a[0],new ReaderParameters{InMemory=true,ReadingMode=ReadingMode.Immediate});using var clean=ModuleDefinition.ReadModule(a[1],new ReaderParameters{InMemory=true,ReadingMode=ReadingMode.Immediate});using var w=new StreamWriter(a[2],false,Encoding.UTF8);
              w.WriteLine($"POST_MVID={post.Mvid} CLEAN_MVID={clean.Mvid}");w.WriteLine($"POST_METHODS={All(post.Types).Sum(t=>t.Methods.Count)} CLEAN_METHODS={All(clean.Types).Sum(t=>t.Methods.Count)}");
              w.WriteLine("=== FIELD TOKEN 0x040003B2 POST ===");DumpField(w,post,0x040003B2);w.WriteLine("=== FIELD TOKEN 0x040003B2 CLEAN ===");DumpField(w,clean,0x040003B2);
              var bp=BoardCtor(post);var bc=BoardCtor(clean);var pp=PlantAwake(post);var pc=PlantAwake(clean);
              w.WriteLine($"TARGET_SUMMARY BoardCtor token=0x{bp.MetadataToken.ToUInt32():X8} post_helpers={HelperCalls(bp)} clean_helpers={HelperCalls(bc)}");
              w.WriteLine($"TARGET_SUMMARY PlantAwake token=0x{pp.MetadataToken.ToUInt32():X8} post_helpers={HelperCalls(pp)} clean_helpers={HelperCalls(pc)}");
              DumpMethod(w,"POST",bp);DumpMethod(w,"CLEAN",bc);Diff(w,"Board::.ctor",bp,bc);
              DumpMethod(w,"POST",pp);DumpMethod(w,"CLEAN",pc);Diff(w,"SeedChooserScreen/PlantDetail::Awake(Card_Choose)",pp,pc);
              return 0;
            }
          }
          EOF
          dotnet run --project "$D/Diag.csproj" -c Release -- "$OUT/postmechanical.dll" "$OUT/managed-cleanup.dll" "$E/runtime-invalid-il-diagnostic.txt"
          cat "$E/runtime-invalid-il-diagnostic.txt"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-runtime-invalid-il-diagnostic
          path: ${{ runner.temp }}/stage9-invalid-il/evidence/
          if-no-files-found: error
          retention-days: 90
