name: Build HF22 damage dispatch patcher

on:
  push:
    branches: [ high-fidelity ]
    paths:
      - 'Tools/HF22Patch/**'
      - '.github/workflows/build-hf22-patcher.yml'
  workflow_dispatch:

# Rebuild after generic reference mapping repair.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF22 patcher
        run: dotnet publish Tools/HF22Patch/HF22Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out
      - name: Smoke test usage
        run: |
          set +e
          ./out/GodsPVZ.HF22Patch >/tmp/hf22.out 2>/tmp/hf22.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'Usage: GodsPVZ.HF22Patch' /tmp/hf22.err
          test -f out/GodsPVZ.HF22Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF22Patch-linux-x64
          path: out
          if-no-files-found: error
