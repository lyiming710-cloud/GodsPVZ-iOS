name: Stage9.1 bcb6 PathDataEditor ctor natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-bcb6-pathdataeditor-ctor-natural-runtime.yml','Tools/Stage9PathDataEditorRuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34966664347, name: Stage9.1-70AB-PATHDATAEDITOR-CTOR-QUALIFIED, path: '${{ runner.temp }}/stage9-pathdataeditor/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-pathdataeditor/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-pathdataeditor/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-pathdataeditor/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-pathdataeditor-ctor.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = 'bcb601b890ca773ba8e7821e1abe6e0614a82264f123307efed91aecb1c6e22c'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "PATHDATAEDITOR_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "PATHDATAEDITOR_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-pathdataeditor" "$PATHDATAEDITOR_CANDIDATE" "$PATHDATAEDITOR_SHA"
      - name: Audit PathDataEditor natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-pathdataeditor/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9PathDataEditorRuntimeAudit/audit.py "$LOG" "$PATHDATAEDITOR_SHA" | tee "$E/pathdataeditor-ctor-natural-runtime-audit.txt"
          python3 Tools/Stage9RuntimeTriage/first-invalid.py "$LOG" | tee "$E/first-invalid-triage.txt"
      - name: Upload PathDataEditor natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-BCB6-PATHDATAEDITOR-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-pathdataeditor/evidence/', retention-days: 90}
