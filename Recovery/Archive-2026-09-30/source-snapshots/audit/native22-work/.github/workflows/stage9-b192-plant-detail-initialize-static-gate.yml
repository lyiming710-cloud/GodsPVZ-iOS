name: Stage9.1 b192 Plant detail Initialize static gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-b192-plant-detail-initialize-static-gate.yml'
      - 'Tools/Stage9PlantDetailInitializePatch/**'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download b192 Projectile candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34804560890
          name: Stage9.1-DC39-PROJECTILE-CTOR-STATIC
          path: ${{ runner.temp }}/input
      - name: Build and recover Plant detail Initialize
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/plant-detail"; E="$O/evidence"; mkdir -p "$E"
          IN=$(find "$RUNNER_TEMP/input" -type f -name 'GodsPVZRuntime1-projectile-ctor.dll' -print -quit)
          test -n "$IN"
          test "$(sha256sum "$IN"|awk '{print $1}')" = 'b192a02950c52778008b612c5afb2795f5124edb25e7744c68e1293be8dc34c0'
          OUT="$O/GodsPVZRuntime1-plant-detail-initialize.dll"
          dotnet build Tools/Stage9PlantDetailInitializePatch/Stage9PlantDetailInitializePatch.csproj -c Release --nologo
          dotnet run --project Tools/Stage9PlantDetailInitializePatch/Stage9PlantDetailInitializePatch.csproj -c Release --no-build -- "$IN" "$OUT" | tee "$E/patch.log"
          grep -q '^NATIVE_AUTHORITY target_token=0x06000667 rid=1639 method_pointer_entry=0x181B86090 va=0x1803A3E30 end=0x1803A41C3 native_slice_sha256=80527520200166f1c38e6e3c64f952e5e99d439b59cff56b888295d9a5640fdc$' "$E/patch.log"
          grep -q '^NATIVE_SEMANTICS assign_plant=1 null_branch_skill_off=1 live_branch_name_skill_isOnField=1 position_xyz_preserved_y_plus_30=1 loadSkillLogo=1 manual_skill_ui=1 maxCharge_gt1_only_enables=1 data_refresh=1 skillRange_false=1 rangeColor_rgba_1=1$' "$E/patch.log"
          grep -q '^CLR_ACCESS_ADAPTATION native_private_read=Plant.isOnField managed_call=Plant.IsOnField field_metadata_changed=0$' "$E/patch.log"
          grep -q '^PATCH_PLANT_DETAIL_INITIALIZE method_body_changes=1 private_field_access_removed=1 vector_lowering=typed_xyz_preserving color_lowering=typed_rgba charge_semantics=gt1_enable_only$' "$E/patch.log"
          grep -q '^REOPEN_PLANT_DETAIL_INITIALIZE_PASS token=0x06000667 .*private_isOnField_refs=0 IsOnField_calls=1 vector_ctor=1 color_ctor=1$' "$E/patch.log"
          grep -q '^SEMANTIC_ISOLATION_PASS untouched_methods=2316 changed_methods=1 target_token=0x06000667$' "$E/patch.log"
          grep -q '^FIELD_METADATA_ISOLATION_PASS unchanged_fields=2802 changed_fields=0$' "$E/patch.log"
          grep -q '^PRESERVATION_PASS batch1=4 plant_ctor=1 projectile_ctor=1 projectile_hf21=2 managers=2$' "$E/patch.log"
          sha256sum "$OUT" | tee "$E/output-candidate.sha256"
          cp "$OUT" "$E/"
          cp Tools/Stage9NativeProbe/Plant_DetaiPage.Initialize.native-evidence.md "$E/"
      - name: Upload static candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-B192-PLANT-DETAIL-INITIALIZE-STATIC
          path: ${{ runner.temp }}/plant-detail/evidence/
          if-no-files-found: warn
          retention-days: 90
