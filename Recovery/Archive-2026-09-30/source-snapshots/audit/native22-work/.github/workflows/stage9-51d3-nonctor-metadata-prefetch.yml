name: Stage9.1 51d3 non-ctor metadata prefetch
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-51d3-nonctor-metadata-prefetch.yml','Tools/Stage9MethodPrefetchProbe/**']
permissions: {contents: read, actions: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34961830646, name: Stage9.1-9524-WINDOW-T-CTOR-QUALIFIED, path: '${{ runner.temp }}/input'}
      - name: Probe remaining non-ctor identities
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/nonctor-prefetch"; mkdir -p "$E"
          IN=$(find "$RUNNER_TEMP/input" -type f -name 'GodsPVZRuntime1-window-t-ctor.dll' -print -quit); test -n "$IN"
          test "$(sha256sum "$IN"|awk '{print $1}')" = '51d3a4ac4132fe8933f034287591ee80a6c884877b3ae4f23e799f8217e40b63'
          dotnet run --project Tools/Stage9MethodPrefetchProbe/Stage9MethodPrefetchProbe.csproj -c Release -- "$IN" \
            'TextLink::Update:0' 'Administrator::Start:0' 'Administrator::Update:0' 'GlobalStaticVars::BGMVolume:0' | tee "$E/nonctor-methods.txt"
          grep -q '^READONLY_METHOD_PREFETCH_PASS mutation=0$' "$E/nonctor-methods.txt"
      - uses: actions/upload-artifact@v4
        with: {name: Stage9.1-51D3-NONCTOR-METADATA-PREFETCH, path: '${{ runner.temp }}/nonctor-prefetch/', retention-days: 90}
