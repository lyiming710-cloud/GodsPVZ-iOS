name: Stage9.1 5789 next causal managed bundle

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-5789-next-causal-managed-bundle.yml'
      - 'Tools/Stage9MethodProbe/**'

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download qualified 5789 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34876561856
          name: Stage9.1-A005-BGMUNPAUSE-QUALIFIED
          path: ${{ runner.temp }}/candidate
      - name: Probe next causal family
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/evidence"; mkdir -p "$O"
          DLL=$(find "$RUNNER_TEMP/candidate" -type f -name 'GodsPVZRuntime1-bgm-unpause.dll' -print -quit)
          test -n "$DLL"
          test "$(sha256sum "$DLL"|awk '{print $1}')" = '5789676a1577d288165452e444ac1a50d0b087835e7bbf38e8ae27054144d3f6'
          dotnet build Tools/Stage9MethodProbe/Stage9MethodProbe.csproj -c Release --nologo
          dotnet Tools/Stage9MethodProbe/bin/Release/net10.0/Stage9MethodProbe.dll "$DLL" \
            'DialogueManager_OnBoard::Update' \
            'Plant_DetaiPage::Update' \
            'Board_PlantDetail_PlantData::Update' \
            'ZombieManager::BGMUnPasue' \
            'Zombie::BGMUnPasue' \
            > "$O/managed-fingerprint.txt"
          cat "$O/managed-fingerprint.txt"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-5789-NEXT-CAUSAL-MANAGED
          path: ${{ runner.temp }}/evidence/
          retention-days: 90
