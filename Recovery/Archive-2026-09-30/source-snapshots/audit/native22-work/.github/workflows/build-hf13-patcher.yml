name: Build HF13 Buff lifecycle patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF13Patch/**'
      - '.github/workflows/build-hf13-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF13 patcher
        run: dotnet publish Tools/HF13Patch/HF13Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o out/hf13
      - name: Smoke test usage
        shell: bash
        run: |
          chmod +x out/hf13/GodsPVZ.HF13Patch
          set +e
          out/hf13/GodsPVZ.HF13Patch
          code=$?
          set -e
          test "$code" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF13Patch-linux-x64
          path: out/hf13/GodsPVZ.HF13Patch
          if-no-files-found: error
