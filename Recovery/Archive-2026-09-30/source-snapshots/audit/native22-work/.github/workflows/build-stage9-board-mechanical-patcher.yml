name: Build Stage9 Board mechanical IL patcher

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - 'Tools/Stage9BoardMechanicalPatch/**'
      - '.github/workflows/build-stage9-board-mechanical-patcher.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Stage9 Board mechanical patcher
        run: dotnet publish Tools/Stage9BoardMechanicalPatch/Stage9BoardMechanicalPatch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out
      - name: Smoke test
        run: |
          chmod +x out/GodsPVZ.Stage9BoardMechanicalPatch
          set +e
          out/GodsPVZ.Stage9BoardMechanicalPatch
          code=$?
          set -e
          test "$code" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-Stage9BoardMechanicalPatch-linux-x64
          path: out/**
          if-no-files-found: error
          retention-days: 90
