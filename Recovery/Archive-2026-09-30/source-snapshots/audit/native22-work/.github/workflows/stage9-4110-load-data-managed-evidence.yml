name: Stage9.1 4110 LoadData managed evidence
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-4110-load-data-managed-evidence.yml'
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download runtime-qualified 4110 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34834962528
          name: Stage9.1-273D-PLANT-DETAIL-LOAD-SKILL-LOGO-STATIC
          path: ${{ runner.temp }}/candidate
      - name: Build MethodDef probe
        run: dotnet build Tools/Stage9MethodProbe/Stage9MethodProbe.csproj -c Release --nologo
      - name: Fingerprint promoted LoadData blocker
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/evidence"; mkdir -p "$O"
          DLL=$(find "$RUNNER_TEMP/candidate" -type f -name 'GodsPVZRuntime1-plant-detail-load-skill-logo.dll' -print -quit)
          test -n "$DLL"
          SHA=$(sha256sum "$DLL" | awk '{print $1}')
          echo "CANDIDATE_SHA256 $SHA" | tee "$O/candidate.txt"
          test "$SHA" = '4110588321372dd0c388f69485bcbdca6f908136c377d65d8903fe657c1e5035'
          dotnet Tools/Stage9MethodProbe/bin/Release/net10.0/Stage9MethodProbe.dll \
            "$DLL" \
            'Board_PlantDetail_PlantData::LoadData' \
            'Board_PlantDetail_PlantData::CheckText' \
            'Board_PlantDetail_PlantData::Update' \
            > "$O/managed-fingerprint.txt"
          cat "$O/managed-fingerprint.txt"
          printf '%s\n' \
            'PROMOTED_BY_RUNTIME run=34835132367 method=Board_PlantDetail_PlantData::LoadData(Plant_DetaiPage) error=InvalidProgramException IL_0054:add' \
            'RULE target LoadData only; CheckText/Update are read-only adjacency evidence.' \
            > "$O/triage.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-4110-LOAD-DATA-MANAGED-EVIDENCE
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 90
