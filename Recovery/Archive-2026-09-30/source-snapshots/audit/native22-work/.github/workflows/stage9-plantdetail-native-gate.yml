name: Stage9.1 PlantDetail original PC native gate

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-plantdetail-native-gate.yml'
      - 'Tools/MethodIndexDump/native_map.py'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate original PC package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/plantdetail-native"; E="$OUT/evidence"; mkdir -p "$OUT" "$E"
          python3 -m pip install --disable-pip-version-check -q gdown==5.2.0 capstone==5.0.6
          python3 -m gdown --id '1_5kVGTFmsvwcdRLQ2ah_rtyC6DqvLnf0' --output "$OUT/GodsPVZ_1.0.2.zip" --quiet
          [ "$(sha256sum "$OUT/GodsPVZ_1.0.2.zip" | awk '{print $1}')" = '2f08b4e2243e2bd296f3db694b4a2c9656252d76202c80167bdf3340b9f65b48' ] || exit 61
          unzip -Z1 "$OUT/GodsPVZ_1.0.2.zip" > "$E/pc-zip-list.txt"
          GA="$(grep -E '(^|/)GameAssembly\.dll$' "$E/pc-zip-list.txt" | head -1)"
          MD="$(grep -E '(^|/)global-metadata\.dat$' "$E/pc-zip-list.txt" | head -1)"
          [ -n "$GA" ] && [ -n "$MD" ] || exit 62
          [ "$(grep -E '(^|/)GameAssembly\.dll$' "$E/pc-zip-list.txt" | wc -l)" = 1 ] || exit 63
          [ "$(grep -E '(^|/)global-metadata\.dat$' "$E/pc-zip-list.txt" | wc -l)" = 1 ] || exit 64
          unzip -p "$OUT/GodsPVZ_1.0.2.zip" "$GA" > "$OUT/GameAssembly.dll"
          unzip -p "$OUT/GodsPVZ_1.0.2.zip" "$MD" > "$OUT/global-metadata.dat"
          [ "$(sha256sum "$OUT/GameAssembly.dll" | awk '{print $1}')" = '9ebd7ca996a5b03fb4a766f7a2502b660d581ddbbb36af4d7bf2f06a211da39d' ] || exit 65
          [ "$(sha256sum "$OUT/global-metadata.dat" | awk '{print $1}')" = 'ad992341add498bd1018ac980f42171e0737b0793bf945c8714ad70a445b36b9' ] || exit 66
          printf 'zip=%s\ngameassembly=%s\nmetadata=%s\nzip_gameassembly_path=%s\nzip_metadata_path=%s\n' \
            "$(sha256sum "$OUT/GodsPVZ_1.0.2.zip"|awk '{print $1}')" \
            "$(sha256sum "$OUT/GameAssembly.dll"|awk '{print $1}')" \
            "$(sha256sum "$OUT/global-metadata.dat"|awk '{print $1}')" "$GA" "$MD" > "$E/source-provenance.txt"
          rm "$OUT/GodsPVZ_1.0.2.zip"

      - name: Map original MethodDefs to PC native pointers
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/plantdetail-native"; E="$OUT/evidence"
          python3 Tools/MethodIndexDump/native_map.py "$OUT/GameAssembly.dll" "$OUT/global-metadata.dat" > "$E/original-method-map.tsv" 2> "$E/native-map.stderr"
          cat "$E/native-map.stderr"
          grep -i 'PlantDetail' "$E/original-method-map.tsv" > "$E/plantdetail-methods.tsv"
          cat "$E/plantdetail-methods.tsv"
          python3 - "$E/original-method-map.tsv" "$E/plantdetail-target.txt" <<'PY'
          import sys
          from pathlib import Path
          rows=[]
          for line in Path(sys.argv[1]).read_text().splitlines()[1:]:
              p=line.split('\t')
              if len(p)!=7: continue
              rows.append(dict(idx=int(p[0]),rid=int(p[1]),token=p[2],addr=int(p[3],16),typ=p[4],name=p[5],pc=int(p[6])))
          c=[r for r in rows if 'PlantDetail' in r['typ'] and r['name']=='Awake' and r['pc']==1]
          if len(c)!=1:
              raise SystemExit(f'expected one PlantDetail Awake/1 original method, got {len(c)}: {c}')
          t=c[0]
          higher=sorted({r['addr'] for r in rows if r['addr']>t['addr']})
          stop=higher[0] if higher else t['addr']+0x8000
          if stop-t['addr']>0x8000: stop=t['addr']+0x8000
          Path(sys.argv[2]).write_text('\n'.join([
              f"native_index={t['idx']}",f"rid={t['rid']}",f"token={t['token']}",f"address=0x{t['addr']:X}",
              f"declaring_type={t['typ']}",f"method={t['name']}",f"param_count={t['pc']}",f"stop=0x{stop:X}",f"span=0x{stop-t['addr']:X}"])+'\n')
          print(Path(sys.argv[2]).read_text(),end='')
          PY

      - name: Disassemble exact PlantDetail Awake native range
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/plantdetail-native"; E="$OUT/evidence"
          python3 - "$OUT/GameAssembly.dll" "$E/plantdetail-target.txt" "$E/plantdetail-awake-pc-native.txt" <<'PY'
          import re,struct,sys
          from pathlib import Path
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          b=Path(sys.argv[1]).read_bytes(); info=Path(sys.argv[2]).read_text()
          start=int(re.search(r'^address=(0x[0-9A-Fa-f]+)$',info,re.M).group(1),16)
          stop=int(re.search(r'^stop=(0x[0-9A-Fa-f]+)$',info,re.M).group(1),16)
          u16=lambda o:struct.unpack_from('<H',b,o)[0];u32=lambda o:struct.unpack_from('<I',b,o)[0];u64=lambda o:struct.unpack_from('<Q',b,o)[0]
          pe=u32(0x3c); n=u16(pe+6); osz=u16(pe+20); opt=pe+24; base=u64(opt+24); secs=[]; st=opt+osz
          for i in range(n):
              o=st+i*40; vs,va,rs,rp=struct.unpack_from('<IIII',b,o+8); secs.append((va,vs,rp,rs))
          def vaoff(a):
              r=a-base
              for va,vs,rp,rs in secs:
                  if va<=r<va+max(vs,rs):
                      d=r-va
                      if d<rs:return rp+d
              raise ValueError(hex(a))
          off=vaoff(start); code=b[off:off+(stop-start)]
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=False
          lines=[f'# start=0x{start:X} stop=0x{stop:X} span=0x{stop-start:X} file_off=0x{off:X}']
          for ins in md.disasm(code,start):
              lines.append(f'0x{ins.address:016X}: {ins.bytes.hex():<24} {ins.mnemonic:<9} {ins.op_str}')
          Path(sys.argv[3]).write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines[:120]))
          PY
          grep -E ' call | j[a-z]+ | ret$' "$E/plantdetail-awake-pc-native.txt" > "$E/plantdetail-controlflow-calls.txt" || true

      - name: Upload native evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-PlantDetail-original-PC-native-evidence
          path: ${{ runner.temp }}/plantdetail-native/evidence/
          if-no-files-found: error
          retention-days: 90
