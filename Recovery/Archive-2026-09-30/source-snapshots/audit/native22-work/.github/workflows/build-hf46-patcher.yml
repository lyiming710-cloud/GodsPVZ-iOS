name: Build HF46 EnemyManager dependency core patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF46Patch/**'
      - '.github/workflows/build-hf46-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF46 patcher
        run: dotnet publish Tools/HF46Patch/HF46Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf46
      - name: Smoke test
        run: |
          chmod +x out/hf46/GodsPVZ.HF46Patch
          set +e
          out/hf46/GodsPVZ.HF46Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf46/GodsPVZ.HF46Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF46Patch-linux-x64
          path: out/hf46
          if-no-files-found: error
