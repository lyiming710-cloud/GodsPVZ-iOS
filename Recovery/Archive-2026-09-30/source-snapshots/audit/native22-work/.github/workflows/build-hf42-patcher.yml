name: Build HF42 Dithering motion core patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF42Patch/**'
      - '.github/workflows/build-hf42-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF42 patcher
        run: dotnet publish Tools/HF42Patch/HF42Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf42
      - name: Smoke test
        run: |
          chmod +x out/hf42/GodsPVZ.HF42Patch
          set +e
          out/hf42/GodsPVZ.HF42Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf42/GodsPVZ.HF42Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF42Patch-linux-x64
          path: out/hf42
          if-no-files-found: error
