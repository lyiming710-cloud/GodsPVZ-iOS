name: Stage9.1 ec06 FlagMeter ctor natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-ec06-flagmeter-ctor-natural-runtime.yml','Tools/Stage9FlagMeterRuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34963062311, name: Stage9.1-51D3-FLAGMETER-CTOR-QUALIFIED, path: '${{ runner.temp }}/stage9-flagmeter/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-flagmeter/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-flagmeter/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-flagmeter/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-flagmeter-ctor.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = 'ec066dca389fd4e05674412a1fd328aec7fb3d0e59c33f4675cd216823a3a8c6'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "FLAGMETER_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "FLAGMETER_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-flagmeter" "$FLAGMETER_CANDIDATE" "$FLAGMETER_SHA"
      - name: Audit FlagMeter natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-flagmeter/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9FlagMeterRuntimeAudit/audit.py "$LOG" "$FLAGMETER_SHA" | tee "$E/flagmeter-ctor-natural-runtime-audit.txt"
          python3 Tools/Stage9RuntimeTriage/first-invalid.py "$LOG" | tee "$E/first-invalid-triage.txt"
      - name: Upload FlagMeter natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-EC06-FLAGMETER-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-flagmeter/evidence/', retention-days: 90}
