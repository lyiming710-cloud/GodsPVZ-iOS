name: Stage9.1 76c1 LevelItem ctor qualify
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-76c1-levelitem-ctor-qualify.yml','Tools/Stage9LevelItemCtorQualify/**','Tools/Stage9LevelItemCtorPatch/**','Tools/Stage9NativeProbe/LevelItem.ctor.native-evidence.md']
permissions: {contents: read, actions: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34984933840, name: Stage9.1-76C1-TEXTLINK-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/promotion'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34984733215, name: Stage9.1-342C-TEXTLINK-CTOR-QUALIFIED, path: '${{ runner.temp }}/input'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34804463514, name: Stage9.1-UNITY-MANAGED-REFS-2022.3.44f1c1, path: '${{ runner.temp }}/refs'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34173085137, pattern: GodsPVZ-ILSpyCmd-linux-x64, merge-multiple: true, path: '${{ runner.temp }}/ilspy'}
      - name: Qualify LevelItem ctor
        shell: bash
        run: bash Tools/Stage9LevelItemCtorQualify/run.sh "$RUNNER_TEMP/promotion" "$RUNNER_TEMP/input" "$RUNNER_TEMP/refs" "$RUNNER_TEMP/ilspy" "$RUNNER_TEMP/levelitem-recovery"
      - uses: actions/upload-artifact@v4
        with: {name: Stage9.1-76C1-LEVELITEM-CTOR-QUALIFIED, path: '${{ runner.temp }}/levelitem-recovery/evidence/', retention-days: 90}
