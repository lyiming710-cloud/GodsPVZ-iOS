name: Stage9.1 D65C Grid Copy static gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-d65c-grid-copy-static-gate.yml'
      - 'Tools/Stage9GridCopyPatch/**'
      - 'Tools/Stage9NativeProbe/Grid.Copy.native-evidence.md'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download runtime-qualified D65C candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34839186752
          name: Stage9.1-5695-BOARDCONFIG-CREATEMAP-STATIC
          path: ${{ runner.temp }}/input
      - name: Build and recover Grid Copy
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/grid-copy"; E="$O/evidence"; mkdir -p "$E"
          IN=$(find "$RUNNER_TEMP/input" -type f -name 'GodsPVZRuntime1-boardconfig-createmap.dll' -print -quit)
          test -n "$IN"
          test "$(sha256sum "$IN"|awk '{print $1}')" = 'd65c0dc71b1f47d590e96d617c5d0d3aaa693a478ef433f0d9d572dd933fe132'
          OUT="$O/GodsPVZRuntime1-grid-copy.dll"
          dotnet build Tools/Stage9GridCopyPatch/Stage9GridCopyPatch.csproj -c Release --nologo
          dotnet run --project Tools/Stage9GridCopyPatch/Stage9GridCopyPatch.csproj -c Release --no-build -- "$IN" "$OUT" | tee "$E/patch.log"
          grep -q '^NATIVE_AUTHORITY target_token=0x06000294 rid=660 method_pointer_entry=0x181B841F8 va=0x18032A010 end=0x18032A09E native_slice_sha256=26d0e35128665a985e660cd922b345fc01fc5857e2e78e9421a167a949d21617$' "$E/patch.log"
          grep -q '^NATIVE_SEMANTICS new_Grid_gridX_gridY=1 copy_gridState=1 copy_isHome=1 copy_passablePoint=1 allocation_null_failure=1$' "$E/patch.log"
          grep -q '^REOPEN_GRID_COPY_PASS token=0x06000294 .*locals=1 ceq=0 Grid_ctor_calls=1 null_failure_throw=1 gridState_copy=1 isHome_copy=1 passablePoint_copy=1$' "$E/patch.log"
          grep -q '^SEMANTIC_ISOLATION_PASS untouched_methods=2316 changed_methods=1 target=0x06000294$' "$E/patch.log"
          grep -q '^FIELD_METADATA_ISOLATION_PASS unchanged_fields=2802 changed_fields=0$' "$E/patch.log"
          grep -q '^PRESERVATION_PASS batch1=4 plant_ctor=1 projectile_ctor=1 projectile_hf21=2 managers=2 plant_detail_initialize=1 load_skill_logo=1 load_data=1 create_map=1$' "$E/patch.log"
          grep -q '^PATCH_GRID_COPY method_body_changes=1 pc_native_semantics=1 object_integer_ceq_removed=1 metadata_visibility_changes=0$' "$E/patch.log"
          sha256sum "$OUT" | tee "$E/output-candidate.sha256"
          cp "$OUT" "$E/"
          cp Tools/Stage9NativeProbe/Grid.Copy.native-evidence.md "$E/"
      - name: Upload static candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-D65C-GRID-COPY-STATIC
          path: ${{ runner.temp }}/grid-copy/evidence/
          if-no-files-found: warn
          retention-days: 90
