name: Stage9.1 4110 Plant detail LoadSkillLogo exact-reference gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-4110-load-skill-logo-exact-ref.yml'
permissions:
  contents: read
  actions: read
jobs:
  exact-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download static LoadSkillLogo candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34834962528
          name: Stage9.1-273D-PLANT-DETAIL-LOAD-SKILL-LOGO-STATIC
          path: ${{ runner.temp }}/candidate
      - name: Download fixed ILSpy
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34173085137
          pattern: GodsPVZ-ILSpyCmd-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/ilspy
      - name: Download compact exact Unity managed refs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34804463514
          name: Stage9.1-UNITY-MANAGED-REFS-2022.3.44f1c1
          path: ${{ runner.temp }}/refs
      - name: Exact-reference decompile and gate LoadSkillLogo only
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/load-skill-logo-ref"; mkdir -p "$O"
          DLL=$(find "$RUNNER_TEMP/candidate" -type f -name 'GodsPVZRuntime1-plant-detail-load-skill-logo.dll' -print -quit)
          test -n "$DLL"
          SHA=$(sha256sum "$DLL"|awk '{print $1}')
          echo "CANDIDATE_SHA256 $SHA" | tee "$O/reference-gate.txt"
          test "$SHA" = '4110588321372dd0c388f69485bcbdca6f908136c377d65d8903fe657c1e5035'
          ILSPY=$(find "$RUNNER_TEMP/ilspy" -type f -name ilspycmd -print -quit)
          DOTNET_BIN=$(find "$RUNNER_TEMP/ilspy" -type f -path '*/ilspy-runtime/dotnet' -print -quit)
          chmod +x "$ILSPY" "$DOTNET_BIN"
          export DOTNET_ROOT="$(dirname "$DOTNET_BIN")"; export PATH="$DOTNET_ROOT:$PATH"
          RDIR=$(find "$RUNNER_TEMP/refs" -type f -name UnityEngine.CoreModule.dll -printf '%h\n' | head -1)
          test -n "$RDIR"
          echo "REFERENCE_DIR $RDIR" | tee -a "$O/reference-gate.txt"
          "$ILSPY" -r "$RDIR" -t Plant_DetaiPage "$DLL" > "$O/Plant_DetaiPage.cs" 2> "$O/Plant_DetaiPage.cs.stderr"
          "$ILSPY" -r "$RDIR" -il -t Plant_DetaiPage "$DLL" > "$O/Plant_DetaiPage.il" 2> "$O/Plant_DetaiPage.il.stderr"
          test ! -s "$O/Plant_DetaiPage.cs.stderr"
          test ! -s "$O/Plant_DetaiPage.il.stderr"
          python3 - "$O/Plant_DetaiPage.cs" "$O/Plant_DetaiPage.il" <<'PY' | tee -a "$O/reference-gate.txt"
          from pathlib import Path
          import re,sys
          cs=Path(sys.argv[1]).read_text(errors='replace')
          il=Path(sys.argv[2]).read_text(errors='replace')
          m=re.search(r'(?:private|public|protected|internal)\s+void\s+LoadSkillLogo\s*\(\s*\)',cs)
          assert m, 'LoadSkillLogo() C# method not found'
          o=cs.index('{',m.end()); depth=0; end=None
          for i in range(o,len(cs)):
              depth+=(cs[i]=='{')-(cs[i]=='}')
              if depth==0:
                  end=i+1; break
          assert end is not None
          body=cs[m.start():end]
          Path(sys.argv[1]+'.LoadSkillLogo.txt').write_text(body)
          for bad in ['Unknown result type','Unmanaged memory load','Expected I','Expected O','Expected I4','Method not found @','Warning: Method ends','List<object>.Enumerator']:
              assert bad not in body,(bad,body)
          assert 'ResourceManager.LoadSkillLogo' in body, body
          assert '.skillLogo' in body or 'skillLogo' in body, body
          assert body.count('.sprite =') == 2, body
          assert re.search(r'\.sprite\s*=\s*null\s*;',body), body
          assert re.search(r'\.ID\s*\*\s*3|3\s*\*\s*[^;,+]*\.ID',body), body
          # Exact id expression contains both skill.ID and plant.ID and one +.
          callpos=body.find('ResourceManager.LoadSkillLogo')
          assert callpos>=0
          callfrag=body[callpos:body.find(';',callpos)+1]
          assert callfrag.count('.ID') >= 2 and '+' in callfrag and '.name' in callfrag, callfrag

          target_end=il.find('} // end of method Plant_DetaiPage::LoadSkillLogo')
          assert target_end>=0, 'LoadSkillLogo IL end marker missing'
          target_begin=il.rfind('.method ',0,target_end)
          ib=il[target_begin:target_end]
          Path(sys.argv[2]+'.LoadSkillLogo.txt').write_text(ib)
          for bad in ['Method not found @1808197F0','Warning: Method ends','Enumerator<object>','System.Object']:
              assert bad not in ib,(bad,ib)
          assert ib.count('ResourceManager::LoadSkillLogo(int32, string)') == 1, ib
          assert ib.count('List`1<class [UnityEngine.UI]UnityEngine.UI.Image>::get_Item(int32)') == 2, ib
          assert ib.count('List`1<class [UnityEngine.UI]UnityEngine.UI.Image>::get_Count()') == 2, ib
          assert ib.count('UnityEngine.UI.Image::set_sprite') == 2, ib
          assert 'ldc.i4.3' in ib and 'mul' in ib and 'add' in ib, ib
          print('LOAD_SKILL_LOGO_EXACT_REF_PASS target_token=0x06000668 invalid_diagnostics=0 object_locals=0 bad_enumerator=0 native_id_formula=1 live_sprite_loop=1 dead_null_loop=1')
          print('=== TARGET_CSHARP ===')
          print(body)
          PY
      - name: Upload exact-reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-4110-PLANT-DETAIL-LOAD-SKILL-LOGO-EXACT-REF
          path: ${{ runner.temp }}/load-skill-logo-ref/
          if-no-files-found: warn
          retention-days: 90
