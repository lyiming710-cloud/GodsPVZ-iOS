name: Build HF41 Zombie fixed visual core patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF41Patch/**'
      - '.github/workflows/build-hf41-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF41 patcher
        run: dotnet publish Tools/HF41Patch/HF41Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf41
      - name: Smoke test
        run: |
          chmod +x out/hf41/GodsPVZ.HF41Patch
          set +e
          out/hf41/GodsPVZ.HF41Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf41/GodsPVZ.HF41Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF41Patch-linux-x64
          path: out/hf41
          if-no-files-found: error
