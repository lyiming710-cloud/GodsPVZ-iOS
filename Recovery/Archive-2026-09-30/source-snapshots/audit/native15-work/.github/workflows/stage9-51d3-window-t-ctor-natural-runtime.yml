name: Stage9.1 51d3 Window_T ctor natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-51d3-window-t-ctor-natural-runtime.yml','Tools/Stage9WindowTRuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34961830646, name: Stage9.1-9524-WINDOW-T-CTOR-QUALIFIED, path: '${{ runner.temp }}/stage9-window-t/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-window-t/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-window-t/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-window-t/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-window-t-ctor.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = '51d3a4ac4132fe8933f034287591ee80a6c884877b3ae4f23e799f8217e40b63'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "WINDOW_T_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "WINDOW_T_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-window-t" "$WINDOW_T_CANDIDATE" "$WINDOW_T_SHA"
      - name: Audit Window_T natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-window-t/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9WindowTRuntimeAudit/audit.py "$LOG" "$WINDOW_T_SHA" | tee "$E/window-t-ctor-natural-runtime-audit.txt"
          python3 Tools/Stage9RuntimeTriage/first-invalid.py "$LOG" | tee "$E/first-invalid-triage.txt"
      - name: Upload Window_T natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-51D3-WINDOW-T-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-window-t/evidence/', retention-days: 90}
