name: Stage9.1 Damage.AddElement metadata audit

on:
  push:
    branches: [stage9-admin-start-static]
    paths:
      - .github/workflows/stage9-damage-addelement-audit.yml

permissions:
  actions: read
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage9-admin-start-static

      - name: Download runtime-qualified DLL
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: '35236211080'
          name: Stage9.1-BGMVOLUME-STATIC-QUALIFIED
          path: dll

      - name: Scan get_Current candidates and orphan generic references
        shell: bash
        run: |
          set -euo pipefail
          DLL=dll/GodsPVZRuntime1-bgmvolume.dll
          test -f "$DLL"
          test "$(sha256sum "$DLL" | awk '{print $1}')" = '047054e0db594b6e3385fe4d2555c5932dcd4c28e4b2cb6fb39acbc4336d43ee'
          TMP=$(mktemp -d)
          cd "$TMP"
          dotnet new console --framework net8.0 --force >/dev/null
          dotnet add package Mono.Cecil --version 0.11.5 >/dev/null
          cat > Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using Mono.Cecil;
          using Mono.Cecil.Cil;

          class P {
            static IEnumerable<TypeDefinition> AllTypes(TypeDefinition t) {
              yield return t;
              foreach (var n in t.NestedTypes) foreach (var x in AllTypes(n)) yield return x;
            }
            static IEnumerable<TypeDefinition> AllTypes(ModuleDefinition m) => m.Types.SelectMany(AllTypes);
            static bool HasOrphan(TypeReference t) {
              if (t == null) return true;
              if (t is GenericParameter gp && gp.Owner == null) return true;
              if (t is GenericInstanceType gi && gi.GenericArguments.Any(HasOrphan)) return true;
              if (t is TypeSpecification ts && !(t is GenericInstanceType) && HasOrphan(ts.ElementType)) return true;
              return false;
            }
            static string GArgs(TypeReference t) {
              if (t is GenericInstanceType gi)
                return string.Join(",", gi.GenericArguments.Select(a => a is GenericParameter gp ? $"GP({gp.Name},owner={(gp.Owner==null?"null":gp.Owner.ToString())},scope={(gp.Scope==null?"null":gp.Scope.ToString())})" : a.FullName));
              return "";
            }
            static string Resolve(MethodReference mr) {
              try { var r=mr.Resolve(); return r==null?"<null>":r.FullName; }
              catch(Exception ex){ return "EX:"+ex.GetType().Name+":"+ex.Message; }
            }
            static void Main(string[] args) {
              using var a=AssemblyDefinition.ReadAssembly(Path.GetFullPath(args[0]),new ReaderParameters{ReadSymbols=false,InMemory=true});
              var m=a.MainModule;
              var uses=new List<(MethodDefinition owner,Instruction ins,MethodReference mr)>();
              foreach(var t in AllTypes(m)) foreach(var md in t.Methods) if(md.HasBody)
                foreach(var ins in md.Body.Instructions) if(ins.Operand is MethodReference mr) uses.Add((md,ins,mr));

              Console.WriteLine("assembly="+a.Name.FullName);
              Console.WriteLine("methodref_uses="+uses.Count);
              Console.WriteLine("=== get_Current returning Element ===");
              foreach(var u in uses.Where(x=>x.mr.Name=="get_Current" && x.mr.ReturnType.FullName=="Element")) {
                var dt=u.mr.DeclaringType;
                Console.WriteLine($"owner={u.owner.FullName} il=IL_{u.ins.Offset:x4} token={u.mr.MetadataToken} declToken={dt.MetadataToken} decl={dt.FullName} gargs=[{GArgs(dt)}] orphan={HasOrphan(dt)} resolve={Resolve(u.mr)}");
              }
              Console.WriteLine("=== all methodref uses with orphan generic type ===");
              var bad=uses.Where(x=>HasOrphan(x.mr.DeclaringType)||HasOrphan(x.mr.ReturnType)||x.mr.Parameters.Any(p=>HasOrphan(p.ParameterType))).ToList();
              Console.WriteLine("bad_uses="+bad.Count);
              foreach(var u in bad) {
                Console.WriteLine($"owner={u.owner.FullName} il=IL_{u.ins.Offset:x4} token={u.mr.MetadataToken} name={u.mr.Name} declToken={u.mr.DeclaringType.MetadataToken} decl={u.mr.DeclaringType.FullName} gargs=[{GArgs(u.mr.DeclaringType)}] ret={u.mr.ReturnType.FullName} resolve={Resolve(u.mr)}");
              }
              Console.WriteLine("=== locals with orphan generic type ===");
              int n=0;
              foreach(var t in AllTypes(m)) foreach(var md in t.Methods) if(md.HasBody) for(int i=0;i<md.Body.Variables.Count;i++) {
                var vt=md.Body.Variables[i].VariableType;
                if(HasOrphan(vt)) { n++; Console.WriteLine($"owner={md.FullName} local={i} token={vt.MetadataToken} type={vt.FullName} gargs=[{GArgs(vt)}]"); }
              }
              Console.WriteLine("bad_locals="+n);
            }
          }
          CS
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          dotnet run --no-restore -- "$GITHUB_WORKSPACE/$DLL" > "$GITHUB_WORKSPACE/diagnostics/damage-addelement-reference-candidates.txt"
          cd "$GITHUB_WORKSPACE"
          cat diagnostics/damage-addelement-reference-candidates.txt

      - name: Commit candidate audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/damage-addelement-reference-candidates.txt
          git commit -m 'diagnostics: scan Element enumerator references' || exit 0
          git push origin HEAD:stage9-admin-start-static
