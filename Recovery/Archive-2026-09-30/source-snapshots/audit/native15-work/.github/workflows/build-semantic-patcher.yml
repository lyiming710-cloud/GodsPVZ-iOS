name: Build semantic patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/SemanticPatch/**'
      - '.github/workflows/build-semantic-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish semantic patcher
        run: >-
          dotnet publish Tools/SemanticPatch/SemanticPatch.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -o publish/semantic-patch
      - name: Smoke test executable
        run: |
          chmod +x publish/semantic-patch/GodsPVZ.SemanticPatch
          publish/semantic-patch/GodsPVZ.SemanticPatch || test $? -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-SemanticPatch-linux-x64
          path: publish/semantic-patch/GodsPVZ.SemanticPatch
          if-no-files-found: error
          retention-days: 7
