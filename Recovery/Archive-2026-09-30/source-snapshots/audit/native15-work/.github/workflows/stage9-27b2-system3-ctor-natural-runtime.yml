name: Stage9.1 27b2 System3 ctor natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-27b2-system3-ctor-natural-runtime.yml','Tools/Stage9System3RuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34976037423, name: Stage9.1-EF0E-SYSTEM3-CTOR-QUALIFIED, path: '${{ runner.temp }}/stage9-system3/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-system3/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-system3/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-system3/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-system3-ctor.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = '27b27746df674dd7ddb967f3822dca77a102738e65ba58463d72f1dc6b537057'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "SYSTEM3_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "SYSTEM3_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-system3" "$SYSTEM3_CANDIDATE" "$SYSTEM3_SHA"
      - name: Audit System3 natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-system3/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9System3RuntimeAudit/audit.py "$LOG" "$SYSTEM3_SHA" | tee "$E/system3-ctor-natural-runtime-audit.txt"
          python3 Tools/Stage9RuntimeTriage/first-invalid.py "$LOG" | tee "$E/first-invalid-triage.txt"
      - name: Upload System3 natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-27B2-SYSTEM3-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-system3/evidence/', retention-days: 90}
