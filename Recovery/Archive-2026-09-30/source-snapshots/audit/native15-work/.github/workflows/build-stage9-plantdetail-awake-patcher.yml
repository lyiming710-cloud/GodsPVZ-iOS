name: Build Stage9 PlantDetail Awake patcher

on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - 'Tools/Stage9PlantDetailAwakePatch/**'
      - '.github/workflows/build-stage9-plantdetail-awake-patcher.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish patcher
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish Tools/Stage9PlantDetailAwakePatch/Stage9PlantDetailAwakePatch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o "$RUNNER_TEMP/plantdetail-patcher"
          test -x "$RUNNER_TEMP/plantdetail-patcher/GodsPVZ.Stage9PlantDetailAwakePatch"
      - name: Smoke test
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/plantdetail-patcher/GodsPVZ.Stage9PlantDetailAwakePatch" >"$RUNNER_TEMP/smoke.out" 2>"$RUNNER_TEMP/smoke.err"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/smoke.err"
          test "$rc" -eq 2
          grep -q '^Usage: GodsPVZ.Stage9PlantDetailAwakePatch <input.dll> <output.dll>$' "$RUNNER_TEMP/smoke.err"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-Stage9PlantDetailAwakePatch-linux-x64
          path: ${{ runner.temp }}/plantdetail-patcher/
          if-no-files-found: error
          retention-days: 90
