name: Build HF19 Zombie predicate patcher

on:
  push:
    branches: [ high-fidelity ]
    paths:
      - 'Tools/HF19Patch/**'
      - '.github/workflows/build-hf19-patcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF19 patcher
        run: dotnet publish Tools/HF19Patch/HF19Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - name: Smoke test usage
        run: |
          set +e
          ./out/GodsPVZ.HF19Patch >/tmp/hf19.out 2>/tmp/hf19.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'Usage: GodsPVZ.HF19Patch' /tmp/hf19.err
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF19Patch-linux-x64
          path: out/GodsPVZ.HF19Patch
