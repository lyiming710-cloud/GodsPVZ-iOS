name: Build HF15 Bleed patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF15Patch/**'
      - '.github/workflows/build-hf15-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF15 patcher
        run: dotnet publish Tools/HF15Patch/HF15Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o out/hf15
      - name: Smoke test usage
        shell: bash
        run: |
          chmod +x out/hf15/GodsPVZ.HF15Patch
          set +e
          out/hf15/GodsPVZ.HF15Patch
          code=$?
          set -e
          test "$code" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF15Patch-linux-x64
          path: out/hf15/GodsPVZ.HF15Patch
          if-no-files-found: error
