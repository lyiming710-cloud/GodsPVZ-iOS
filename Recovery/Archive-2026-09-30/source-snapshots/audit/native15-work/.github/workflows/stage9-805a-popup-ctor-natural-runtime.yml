name: Stage9.1 805a Popup ctor natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-805a-popup-ctor-natural-runtime.yml','Tools/Stage9PopupRuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34957957518, name: Stage9.1-2AD9-POPUP-CTOR-QUALIFIED, path: '${{ runner.temp }}/stage9-popup/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-popup/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-popup/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-popup/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-popup-ctor.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = '805a177be099c923daf93a93d98d461312c76711f112c8f778800a69f5874253'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "POPUP_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "POPUP_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-popup" "$POPUP_CANDIDATE" "$POPUP_SHA"
      - name: Audit Popup natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-popup/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9PopupRuntimeAudit/audit.py "$LOG" "$POPUP_SHA" | tee "$E/popup-ctor-natural-runtime-audit.txt"
      - name: Upload Popup natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-805A-POPUP-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-popup/evidence/', retention-days: 90}
