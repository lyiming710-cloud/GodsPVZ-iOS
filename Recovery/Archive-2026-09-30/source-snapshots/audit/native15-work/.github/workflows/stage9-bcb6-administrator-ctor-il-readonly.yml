name: Stage9.1 bcb6 Administrator ctor IL readonly
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-bcb6-administrator-ctor-il-readonly.yml']
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34966664347, name: Stage9.1-70AB-PATHDATAEDITOR-CTOR-QUALIFIED, path: '${{ runner.temp }}/input'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34804463514, name: Stage9.1-UNITY-MANAGED-REFS-2022.3.44f1c1, path: '${{ runner.temp }}/refs'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34173085137, pattern: GodsPVZ-ILSpyCmd-linux-x64, merge-multiple: true, path: '${{ runner.temp }}/ilspy'}
      - name: Export Administrator ctor IL read-only
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/administrator-il"; mkdir -p "$O"
          IN=$(find "$RUNNER_TEMP/input" -type f -name 'GodsPVZRuntime1-pathdataeditor-ctor.dll' -print -quit); test -n "$IN"
          test "$(sha256sum "$IN"|awk '{print $1}')" = 'bcb601b890ca773ba8e7821e1abe6e0614a82264f123307efed91aecb1c6e22c'
          ILSPY=$(find "$RUNNER_TEMP/ilspy" -type f -name ilspycmd -print -quit)
          DOTNET_BIN=$(find "$RUNNER_TEMP/ilspy" -type f -path '*/ilspy-runtime/dotnet' -print -quit)
          chmod +x "$ILSPY" "$DOTNET_BIN"; export DOTNET_ROOT="$(dirname "$DOTNET_BIN")"; export PATH="$DOTNET_ROOT:$PATH"
          RDIR=$(find "$RUNNER_TEMP/refs" -type f -name UnityEngine.CoreModule.dll -printf '%h\n' | head -1); test -n "$RDIR"
          "$ILSPY" -r "$RDIR" -il -t Administrator "$IN" > "$O/Administrator.il" 2> "$O/Administrator.il.stderr"; test ! -s "$O/Administrator.il.stderr"
          python3 - "$O/Administrator.il" <<'PY' | tee "$O/Administrator.ctor-summary.txt"
          from pathlib import Path
          import sys
          il=Path(sys.argv[1]).read_text(errors='replace')
          e=il.find('} // end of method Administrator::.ctor'); assert e>=0
          b=il.rfind('.method ',0,e); assert b>=0
          ctor=il[b:e]; Path(sys.argv[1]+'.ctor.txt').write_text(ctor)
          print('ADMINISTRATOR_CTOR_READONLY_PASS mutation=0')
          print('LDC_I8_COUNT',ctor.count('ldc.i8'))
          print('MODE_STFLD_COUNT',ctor.count('stfld int32 Administrator::mode'))
          print('SYSTEM3_SUPPLIESID_STFLD_COUNT',ctor.count('stfld int32 System3::suppliesID'))
          print('MONOBEHAVIOUR_CTOR_COUNT',ctor.count('UnityEngine.MonoBehaviour::.ctor()'))
          print('CORELIB_TEXT_COUNT',ctor.count('System.Private.CoreLib'))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: Stage9.1-BCB6-ADMINISTRATOR-CTOR-IL-READONLY, path: '${{ runner.temp }}/administrator-il/', retention-days: 90}
