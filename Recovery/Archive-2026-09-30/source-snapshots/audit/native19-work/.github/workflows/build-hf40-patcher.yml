name: Build HF40 Element UI Start patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF40Patch/**'
      - '.github/workflows/build-hf40-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF40 patcher
        run: dotnet publish Tools/HF40Patch/HF40Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf40
      - name: Smoke test
        run: |
          chmod +x out/hf40/GodsPVZ.HF40Patch
          set +e
          out/hf40/GodsPVZ.HF40Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf40/GodsPVZ.HF40Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF40Patch-linux-x64
          path: out/hf40
          if-no-files-found: error
