name: Stage9.1 E8FE Grid Copy strict runtime gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-e8fe-grid-copy-runtime-gate.yml'
permissions:
  contents: read
  actions: read
jobs:
  strict-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
      - name: Download exact cached R3 archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34747460206
          pattern: Stage9.1-r3-exact-archive
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-e8fe/r3-cache
      - name: Download exact-ref-qualified Grid Copy candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34840686963
          name: Stage9.1-D65C-GRID-COPY-STATIC
          path: ${{ runner.temp }}/stage9-e8fe/candidate
      - name: Download exact Unity editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-e8fe/editor-parts
      - name: Resolve candidate DLL
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find "$RUNNER_TEMP/stage9-e8fe/candidate" -type f -name 'GodsPVZRuntime1-grid-copy.dll' -print -quit)
          test -n "$DLL"
          test "$(sha256sum "$DLL" | awk '{print $1}')" = 'e8fec1d52306f69389a38a97bb8e49fef3f1925e3c66f9f180c11d2e7999e0b4'
          echo "GRID_COPY_CANDIDATE=$DLL" >> "$GITHUB_ENV"
      - name: Run exact R3 strict Board gate
        shell: bash
        run: |
          set -euo pipefail
          bash Tools/Stage9RuntimeGate/run-strict-board.sh \
            "$RUNNER_TEMP/stage9-e8fe" \
            "$GRID_COPY_CANDIDATE" \
            "e8fec1d52306f69389a38a97bb8e49fef3f1925e3c66f9f180c11d2e7999e0b4"
      - name: Audit recovered blocker and promote next gameplay causal error
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-e8fe/evidence"; mkdir -p "$E"
          LOG="$E/playmode.log"
          if [ ! -f "$LOG" ]; then
            echo 'RUNTIME_AUDIT no_playmode_log=1' | tee "$E/grid-copy-runtime-audit.txt"
            exit 1
          fi
          python3 - "$LOG" > "$E/grid-copy-runtime-audit.txt" <<'PY'
          from pathlib import Path
          import re,sys
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines(); text='\n'.join(lines)
          counts={
            'GRID_COPY_INVALID_IL_COUNT':len(re.findall(r'InvalidProgramException: Invalid IL code in Grid:Copy',text)),
            'BOARDCONFIG_CREATEMAP_INVALID_IL_COUNT':len(re.findall(r'InvalidProgramException: Invalid IL code in BoardConfig:CreateMap',text)),
            'LOAD_DATA_INVALID_IL_COUNT':len(re.findall(r'InvalidProgramException: Invalid IL code in Board_PlantDetail_PlantData:LoadData',text)),
            'LOAD_SKILL_LOGO_INVALID_IL_COUNT':len(re.findall(r'InvalidProgramException: Invalid IL code in Plant_DetaiPage:LoadSkillLogo',text)),
            'PROJECTILE_CTOR_INVALID_IL_COUNT':len(re.findall(r'InvalidProgramException: Invalid IL code in Projectile:\.ctor',text)),
          }
          counts['PLANT_DETAIL_INITIALIZE_FIELDACCESS_COUNT']=sum('FieldAccessException' in x and 'Plant:isOnField' in x and 'Plant_DetaiPage:Initialize' in x for x in lines)
          counts['PLANT_CTOR_RUNTIME_ERROR_COUNT']=len(re.findall(r'(?:InvalidProgramException|FieldAccessException).*Plant:\.ctor',text))
          counts['ZEROVECTOR_TEXT_COUNT']=text.count('zeroVector')
          for k,v in counts.items(): print(k,v)
          markers=[x for x in lines if x.startswith('STAGE9_STRICT_')]
          print('STRICT_MARKER_COUNT',len(markers)); [print(x) for x in markers]
          pre_idx=next((i for i,x in enumerate(lines) if x.startswith('STAGE9_STRICT_BOARD_PRESTART ')),None)
          first=None
          recovered=['InvalidProgramException: Invalid IL code in Grid:Copy','InvalidProgramException: Invalid IL code in BoardConfig:CreateMap','InvalidProgramException: Invalid IL code in Board_PlantDetail_PlantData:LoadData','InvalidProgramException: Invalid IL code in Plant_DetaiPage:LoadSkillLogo','InvalidProgramException: Invalid IL code in Projectile:.ctor']
          if pre_idx is not None:
            for i in range(pre_idx+1,len(lines)):
              line=lines[i]
              if any(s in line for s in recovered): continue
              if 'FieldAccessException' in line and 'Plant:isOnField' in line and 'Plant_DetaiPage:Initialize' in line: continue
              if 'Exception:' in line and not line.startswith('UnityEngine.'):
                first=i; break
          if first is None: print('FIRST_POST_PRESTART_NONRECOVERED_EXCEPTION none')
          else:
            print('=== FIRST_POST_PRESTART_NONRECOVERED_EXCEPTION ===')
            for j in range(max(pre_idx or 0,first-4),min(len(lines),first+40)): print(f'{j+1}: {lines[j]}')
          assert all(v==0 for v in counts.values()), counts
          assert any(x.startswith('STAGE9_STRICT_MAINMENU ') for x in markers)
          assert 'STAGE9_STRICT_CREATE_INVOKE ok=1' in markers
          assert any(x.startswith('STAGE9_STRICT_SAVE_READY ') for x in markers)
          pre=[x for x in markers if x.startswith('STAGE9_STRICT_BOARD_PRESTART ')]
          assert pre and all(s in pre[-1] for s in ['boardStart=0','board=0','boardManager=1','prepare=1','seedChooser=1']), pre
          assert 'STAGE9_STRICT_GAMESTART_INVOKE ok=1' in markers
          board=[x for x in markers if x.startswith('STAGE9_STRICT_BOARD ')]
          assert board and 'board=1' in board[-1] and 'activeBoard=1' in board[-1], board
          print('GRID_COPY_RUNTIME_GATE_PASS blocker_removed=1 previous_recoveries_preserved=1 corrected_board_lifecycle=1')
          PY
          cat "$E/grid-copy-runtime-audit.txt"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-E8FE-GRID-COPY-MAINMENU-SAVE-BOARD-RUNTIME
          path: ${{ runner.temp }}/stage9-e8fe/evidence/
          if-no-files-found: warn
          retention-days: 90
