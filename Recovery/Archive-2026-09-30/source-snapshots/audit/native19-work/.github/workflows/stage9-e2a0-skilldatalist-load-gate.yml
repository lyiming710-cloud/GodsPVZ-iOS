name: Stage9.1 e2a0 SkillDataList Load repair gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-e2a0-skilldatalist-load-gate.yml'
      - 'Tools/Stage9SkillDataListLoadPatch/**'
permissions:
  contents: read
  actions: read
jobs:
  skilldatalist-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download exact e2a0 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34736468369
          pattern: Stage9.1-fdf4-SKILL-COPY
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-skilldatalist-load/input
      - name: Download fixed ILSpy
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34173085137
          pattern: GodsPVZ-ILSpyCmd-linux-x64
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-skilldatalist-load/ilspy
      - name: Apply exact repair
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-skilldatalist-load"; E="$OUT/evidence"; mkdir -p "$E"
          IN="$OUT/input/GodsPVZRuntime1-skill-copy.dll"; DLL="$OUT/GodsPVZRuntime1-skilldatalist-load.dll"
          [ "$(sha256sum "$IN"|awk '{print $1}')" = 'e2a0ef87b213da46aff086be8b47bce2080a871600bbac2a20fa5977ea5b5904' ] || exit 61
          dotnet build Tools/Stage9SkillDataListLoadPatch/Stage9SkillDataListLoadPatch.csproj -c Release --nologo
          dotnet run --project Tools/Stage9SkillDataListLoadPatch/Stage9SkillDataListLoadPatch.csproj -c Release --no-build -- "$IN" "$DLL" | tee "$E/patch.log"
          grep -q '^TARGET_METHOD token=0x0600051F name=SkillDataList SkillDataList::LoadSkillDataList()$' "$E/patch.log"
          grep -q '^PATCH_SKILLDATALIST_NULL_CHECKS sites=3 opcode=ldnull$' "$E/patch.log"
          grep -q '^PATCH_SKILLDATALIST_NULL_FAILURE action=throw exception=System.NullReferenceException$' "$E/patch.log"
          grep -q '^REOPEN_SKILLDATALIST_PASS null_checks=3 null_failure=throw token=0x0600051F$' "$E/patch.log"
          grep -q '^SEMANTIC_ISOLATION_PASS untouched_methods=2316 changed_methods=1$' "$E/patch.log"
          sha256sum "$DLL" | tee "$E/output-candidate.sha256"; cp "$DLL" "$E/"
      - name: Independent ILSpy validation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stage9-skilldatalist-load"; E="$OUT/evidence"; DLL="$OUT/GodsPVZRuntime1-skilldatalist-load.dll"
          ILSPY="$(find "$OUT/ilspy" -type f -name ilspycmd | head -1)"; DOTNET_BIN="$(find "$OUT/ilspy" -type f -path '*/ilspy-runtime/dotnet' | head -1)"; chmod +x "$ILSPY" "$DOTNET_BIN"; export DOTNET_ROOT="$(dirname "$DOTNET_BIN")"; export PATH="$DOTNET_ROOT:$PATH"
          "$ILSPY" -t SkillDataList "$DLL" > "$E/SkillDataList.cs" 2> "$E/SkillDataList.stderr"; test ! -s "$E/SkillDataList.stderr"
          python3 - "$E/SkillDataList.cs" "$E/SkillDataList.LoadSkillDataList.cs" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          start=s.index('public static SkillDataList LoadSkillDataList()')
          end=s.index('public SkillDataList()', start)
          m=s[start:end]
          Path(sys.argv[2]).write_text(m)
          assert 'Invalid IL' not in m
          assert 'Expected O, but got I4' not in m
          assert 'Unknown result type' not in m
          assert '(SkillDataList)(object)new NullReferenceException()' not in m
          assert 'NullReferenceException' in m and 'throw ' in m
          assert 'skillData != null' in m or 'skillData == null' in m
          print('ILSPY_SKILLDATALIST_PASS method=LoadSkillDataList')
          PY
      - name: Upload evidence and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-e2a0-SKILLDATALIST-LOAD
          path: ${{ runner.temp }}/stage9-skilldatalist-load/evidence/
          if-no-files-found: error
          retention-days: 90
