name: Build HF53 GameFail dependency patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF53Patch/**'
      - '.github/workflows/build-hf53-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF53 patcher
        run: dotnet publish Tools/HF53Patch/HF53Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out
      - name: Smoke test
        run: |
          chmod +x out/GodsPVZ.HF53Patch
          set +e
          out/GodsPVZ.HF53Patch
          code=$?
          set -e
          test "$code" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF53Patch-linux-x64
          path: out/**
          if-no-files-found: error
