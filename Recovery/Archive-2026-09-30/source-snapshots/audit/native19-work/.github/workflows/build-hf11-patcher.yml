name: Build HF11 BuffManager Update generic patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF11Patch/**'
      - '.github/workflows/build-hf11-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF11 patcher
        run: dotnet publish Tools/HF11Patch/HF11Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o out/hf11
      - name: Smoke test usage
        shell: bash
        run: |
          chmod +x out/hf11/GodsPVZ.HF11Patch
          set +e
          out/hf11/GodsPVZ.HF11Patch
          code=$?
          set -e
          test "$code" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF11Patch-linux-x64
          path: out/hf11/GodsPVZ.HF11Patch
          if-no-files-found: error
