name: Build HF44 Zombie movement position core patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/HF44Patch/**'
      - '.github/workflows/build-hf44-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish HF44 patcher
        run: dotnet publish Tools/HF44Patch/HF44Patch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/hf44
      - name: Smoke test
        run: |
          chmod +x out/hf44/GodsPVZ.HF44Patch
          set +e
          out/hf44/GodsPVZ.HF44Patch
          code=$?
          set -e
          test "$code" = "2"
          test -f out/hf44/GodsPVZ.HF44Patch.dll
      - uses: actions/upload-artifact@v4
        with:
          name: GodsPVZ-HF44Patch-linux-x64
          path: out/hf44
          if-no-files-found: error
