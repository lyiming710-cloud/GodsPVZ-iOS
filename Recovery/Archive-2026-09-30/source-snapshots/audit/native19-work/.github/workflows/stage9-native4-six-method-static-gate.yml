name: Stage9.1 native4 six-method static gate
on:
  push:
    branches: [stage9-native3-codex-recovery]
    paths:
      - 'Tools/Stage9Native4Recovery/**'
      - '.github/workflows/stage9-native4-six-method-static-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  static:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned baseline and reference assemblies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python Tools/Stage9Native4Recovery/prepare_ci_inputs.py
          if ($LASTEXITCODE -ne 0) { throw 'input preparation failed' }
      - name: Rebuild and verify all six methods
        run: |
          $env:NATIVE4_PYTHON = (Get-Command python).Source
          ./Tools/Stage9Native4Recovery/build-and-verify.ps1 -Baseline ./Tools/Stage9Native4Recovery/inputs/baseline-18e44.dll
      - name: Upload qualified candidate and complete static evidence
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-native4-six-method-qualified
          path: |
            Tools/Stage9Native4Recovery/candidate/Assembly-CSharp-native4-six-method.dll
            Tools/Stage9Native4Recovery/evidence/
            Tools/Stage9Native4Recovery/specification/
            Tools/Stage9Native4Recovery/reopened/
            Tools/Stage9Native4Recovery/input-locks.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload diagnostic evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-native4-six-method-static-failure
          path: Tools/Stage9Native4Recovery/evidence/
          if-no-files-found: warn
