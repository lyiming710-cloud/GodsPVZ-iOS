name: Stage9.1 license gate using preserved exact editor

on:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-unity-license-gate-preserved.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  license-gate-preserved:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Verify required secrets are present without exposing them
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "$name repository secret is missing or empty." >&2
              missing=1
            else
              echo "$name secret is present."
            fi
          done
          [ "$missing" = 0 ] || exit 51

      - name: Download preserved editor parts from formal preservation run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-preserved-editor-parts

      - name: Verify all 15 preserved parts and reconstruct exact editor
        shell: bash
        run: |
          set -euo pipefail
          PARTS="$RUNNER_TEMP/stage9-preserved-editor-parts"
          OUT="$RUNNER_TEMP/stage9-license-gate-preserved"
          EVIDENCE="$OUT/evidence"
          EDITOR="$OUT/editor"
          mkdir -p "$EVIDENCE" "$EDITOR"

          cat > "$OUT/expected-parts.sha256" <<'EOF'
          c2cb7252b28c99581fd1ebfa7bd0d63b82fbdfd66ed9323327560eab9f9c5b12  Unity-China-2022.3.44f1c1.tar.xz.part-00
          6f9af6d8bfae2d0dcb5482778fdb2ffee9bf8a4eb32b3030601d2d817eff5380  Unity-China-2022.3.44f1c1.tar.xz.part-01
          daf4e501efa59d388cec09fb1bb69fb71b074933c20389748fc1aaab5b4f1b6e  Unity-China-2022.3.44f1c1.tar.xz.part-02
          e8870b1b8ac3354302b3d4c7fa80a74249d3f2ca1d442a0fb978448ad2b7a586  Unity-China-2022.3.44f1c1.tar.xz.part-03
          115be82c7f103fd0888e28ee316c6cd1e877d4d14939388e3be40d877e8591d4  Unity-China-2022.3.44f1c1.tar.xz.part-04
          2efe6703f8a4b871275bde3c742c61d5b4a3322bb56fcbaf417cb9a80e90a97e  Unity-China-2022.3.44f1c1.tar.xz.part-05
          e7b300ff6e5639c0e5d6cbc065ec6918e4dc4d36ae8abab8f97c896af8b595f1  Unity-China-2022.3.44f1c1.tar.xz.part-06
          00f364a9e6619acd9ed466ae46055a9480d7c62a76914f713e69c3fa94abf151  Unity-China-2022.3.44f1c1.tar.xz.part-07
          0f7b8225b57960ba08b104f20869ce42707c17df290c143d4e3bd9dc3a26c0e2  Unity-China-2022.3.44f1c1.tar.xz.part-08
          6930abaf854320d200b069d135800fc310abcb0cb9a910e88ce68693e69a6d0a  Unity-China-2022.3.44f1c1.tar.xz.part-09
          47b0bb1451d33932ee9f56fea9f10d7ffbffd578b8105c212401119182c3d0f0  Unity-China-2022.3.44f1c1.tar.xz.part-10
          b5377382ceb94492a1c5288aee7c598f0495cfd108666ba2857059f6ecd92b7f  Unity-China-2022.3.44f1c1.tar.xz.part-11
          9d6c3a3e5c94104c783620c13095460638604f9ca92fb5017d1142970710e116  Unity-China-2022.3.44f1c1.tar.xz.part-12
          7541e40151f60c3882a82650595a4d9a97f2fdc2fe49469f440aef8f7996cc0a  Unity-China-2022.3.44f1c1.tar.xz.part-13
          c364240981c3a762bc3be6b61db0170bd7d168b3e7c3d14d48770e72e897e830  Unity-China-2022.3.44f1c1.tar.xz.part-14
          EOF

          PART_COUNT="$(find "$PARTS" -maxdepth 1 -type f -name 'Unity-China-2022.3.44f1c1.tar.xz.part-*' | wc -l)"
          printf '%s\n' "$PART_COUNT" > "$EVIDENCE/part-count.txt"
          [ "$PART_COUNT" = '15' ] || { echo "Expected 15 preserved parts, found $PART_COUNT" >&2; exit 52; }

          (cd "$PARTS" && sha256sum -c "$OUT/expected-parts.sha256") | tee "$EVIDENCE/part-sha256-check.txt"

          FULL_SHA="$(cat "$PARTS"/Unity-China-2022.3.44f1c1.tar.xz.part-* | sha256sum | awk '{print $1}')"
          FULL_SIZE="$(cat "$PARTS"/Unity-China-2022.3.44f1c1.tar.xz.part-* | wc -c)"
          printf '%s\n' "$FULL_SHA" > "$EVIDENCE/editor-rejoined-sha256.txt"
          printf '%s\n' "$FULL_SIZE" > "$EVIDENCE/editor-rejoined-size.txt"
          [ "$FULL_SHA" = '0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14' ] || exit 53
          [ "$FULL_SIZE" = '3906640940' ] || exit 54

          cat "$PARTS"/Unity-China-2022.3.44f1c1.tar.xz.part-* | xz -t
          df -h . > "$EVIDENCE/disk-before-extract.txt"

          (
            for p in "$PARTS"/Unity-China-2022.3.44f1c1.tar.xz.part-*; do
              cat "$p"
              rm -f "$p"
            done
          ) | xz -dc | tar -xf - -C "$EDITOR"

          UNITY="$EDITOR/Editor/Unity"
          [ -f "$UNITY" ] || { echo 'Unity executable missing after reconstruction' >&2; exit 55; }
          chmod +x "$UNITY"
          VERSION_OUT="$("$UNITY" -version 2>&1)"
          printf '%s\n' "$VERSION_OUT" > "$EVIDENCE/unity-version-raw.txt"
          VERSION="$(printf '%s\n' "$VERSION_OUT" | grep -Eo '2022\.3\.44f1c[0-9]+|2022\.3\.44f1' | head -n1 || true)"
          [ "$VERSION" = '2022.3.44f1c1' ] || { echo "Exact editor version gate failed: $VERSION" >&2; exit 56; }
          printf '%s\n' "$UNITY" > "$OUT/unity-path.txt"
          printf '%s\n' "$EDITOR" > "$OUT/editor-root.txt"
          df -h . > "$EVIDENCE/disk-after-extract.txt"
          echo 'Preserved exact editor reconstruction PASS.'

      - name: Import Personal license with machine-binding fallback and probe
        id: license
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/stage9-license-gate-preserved"
          EVIDENCE="$OUT/evidence"
          UNITY="$(cat "$OUT/unity-path.txt")"
          EDITOR_ROOT="$(cat "$OUT/editor-root.txt")"
          LICENSE_FILE="$RUNNER_TEMP/Unity_lic.ulf"
          RAW_FILE="$OUT/license-file-import-raw.log"
          RAW_ACCOUNT="$OUT/license-account-activation-raw.log"
          RAW_PROBE="$OUT/license-probe-raw.log"
          RAW_EDITOR_FALLBACK="$OUT/license-editor-account-fallback-raw.log"
          CLIENT="$EDITOR_ROOT/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          ACCOUNT_ACTIVATED=0
          METHOD='none'
          FILE_EXIT=99
          ACCOUNT_EXIT=99
          EDITOR_FALLBACK_EXIT=99
          PROBE_EXIT=99

          sanitize() {
            python3 - "$1" "$2" <<'PY'
          import re,sys
          src,dst=sys.argv[1:3]
          try:
              lines=open(src,'r',encoding='utf-8',errors='replace').read().splitlines()
          except FileNotFoundError:
              lines=['<raw log missing>']
          # Keep diagnostic wording while suppressing values on credential/token/key lines.
          sensitive=re.compile(r'(access.?token|refresh.?token|password|e-?mail|username|user name|license key|serial number|serial:)',re.I)
          out=[]
          for line in lines:
              out.append('[REDACTED POTENTIALLY SENSITIVE LICENSE LINE]' if sensitive.search(line) else line)
          open(dst,'w',encoding='utf-8').write('\n'.join(out)+'\n')
          PY
          }

          cleanup() {
            if [ "$ACCOUNT_ACTIVATED" = 1 ] && [ -x "$CLIENT" ]; then
              "$CLIENT" --return-ulf >/dev/null 2>&1 || true
            fi
            rm -f "$LICENSE_FILE" "$RAW_FILE" "$RAW_ACCOUNT" "$RAW_PROBE" "$RAW_EDITOR_FALLBACK"
          }
          trap cleanup EXIT

          umask 077
          printf '%s' "$UNITY_LICENSE" > "$LICENSE_FILE"
          [ -s "$LICENSE_FILE" ] || { echo 'Temporary ULF file is empty.' >&2; exit 57; }
          printf '%s\n' "$(stat -c %s "$LICENSE_FILE")" > "$EVIDENCE/license-secret-byte-count.txt"

          # First preserve the exact failure/success semantics of the provided ULF.
          set +e
          "$UNITY" -batchmode -nographics -quit -manualLicenseFile "$LICENSE_FILE" -logFile "$RAW_FILE"
          FILE_EXIT=$?
          set -e
          sanitize "$RAW_FILE" "$EVIDENCE/license-file-import-sanitized.log"
          printf '%s\n' "$FILE_EXIT" > "$EVIDENCE/license-file-import-exit.txt"

          # If the Windows-generated Personal ULF is machine-bound, activate the
          # current ephemeral runner through this exact Editor's Licensing Client.
          if grep -qi "Machine bindings don't match" "$RAW_FILE"; then
            METHOD='account-client'
            if [ ! -x "$CLIENT" ]; then
              echo "Exact Editor Licensing Client not found/executable: $CLIENT" >&2
              exit 59
            fi

            "$CLIENT" --help > "$OUT/client-help-raw.txt" 2>&1 || true
            head -n 20 "$OUT/client-help-raw.txt" > "$EVIDENCE/licensing-client-help-head.txt"

            PERSONAL_FLAGS=(--activate-all)
            if grep -q -- '--include-personal' "$OUT/client-help-raw.txt"; then
              PERSONAL_FLAGS+=(--include-personal)
              echo 'Licensing Client supports --include-personal.' > "$EVIDENCE/personal-activation-capability.txt"
            else
              echo 'Licensing Client does not advertise --include-personal; using --activate-all first.' > "$EVIDENCE/personal-activation-capability.txt"
            fi

            set +e
            "$CLIENT" "${PERSONAL_FLAGS[@]}" --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > "$RAW_ACCOUNT" 2>&1
            ACCOUNT_EXIT=$?
            set -e
            sanitize "$RAW_ACCOUNT" "$EVIDENCE/license-account-activation-sanitized.log"
            printf '%s\n' "$ACCOUNT_EXIT" > "$EVIDENCE/license-account-activation-exit.txt"

            if [ "$ACCOUNT_EXIT" -eq 0 ] && ! grep -qiE 'No seat available|No license activation found for this computer' "$RAW_ACCOUNT"; then
              ACCOUNT_ACTIVATED=1
            else
              # Historical fallback used by GameCI for clients that cannot acquire
              # Personal seats directly: invoke Editor with account only, no serial.
              METHOD='account-editor-fallback'
              set +e
              "$UNITY" -batchmode -nographics -quit -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -logFile "$RAW_EDITOR_FALLBACK"
              EDITOR_FALLBACK_EXIT=$?
              set -e
              sanitize "$RAW_EDITOR_FALLBACK" "$EVIDENCE/license-editor-account-fallback-sanitized.log"
              printf '%s\n' "$EDITOR_FALLBACK_EXIT" > "$EVIDENCE/license-editor-account-fallback-exit.txt"
              if ! grep -qiE 'No valid Unity Editor license found|License is not active|No seat available' "$RAW_EDITOR_FALLBACK"; then
                ACCOUNT_ACTIVATED=1
              fi
            fi
          else
            METHOD='license-file'
          fi

          # Decisive no-project probe using the exact Editor after whichever
          # activation path ran. This must pass before R2 is ever touched.
          set +e
          "$UNITY" -batchmode -nographics -quit -logFile "$RAW_PROBE"
          PROBE_EXIT=$?
          set -e
          sanitize "$RAW_PROBE" "$EVIDENCE/license-probe-sanitized.log"
          printf '%s\n' "$PROBE_EXIT" > "$EVIDENCE/license-probe-exit.txt"
          printf '%s\n' "$METHOD" > "$EVIDENCE/license-method.txt"

          INVALID=0
          if grep -qiE 'No valid Unity Editor license found|License is not active|No ULF license found' "$RAW_PROBE"; then
            INVALID=1
          fi

          python3 - "$EVIDENCE/RESULT.json" "$FILE_EXIT" "$ACCOUNT_EXIT" "$EDITOR_FALLBACK_EXIT" "$PROBE_EXIT" "$INVALID" "$METHOD" <<'PY'
          import json,sys
          p=sys.argv[1]
          file_exit,account_exit,editor_fallback_exit,probe_exit,invalid=map(int,sys.argv[2:7])
          method=sys.argv[7]
          passed=(probe_exit==0 and invalid==0)
          d={
            'gate':'STAGE9_1_UNITY_LICENSE_GATE_PRESERVED_EDITOR_V2',
            'editor':'Unity China 2022.3.44f1c1',
            'editor_sha256':'0008115c785784baddb19e2b13b384ac845438239f293efb0c2e8b1379a1fe14',
            'editor_source':'GitHub Actions formal preservation run 34668863583',
            'all_required_secrets_present':True,
            'license_file_import_exit':file_exit,
            'account_client_activation_exit':account_exit,
            'editor_account_fallback_exit':editor_fallback_exit,
            'persisted_license_probe_exit':probe_exit,
            'probe_invalid_license_signature':bool(invalid),
            'effective_activation_method':method,
            'license_gate_pass':passed,
            'project_import_attempted':False,
            'r2_touched':False,
            'hf56_authorized':False,
          }
          open(p,'w',encoding='utf-8').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps(d,indent=2,sort_keys=True))
          if not passed:
              raise SystemExit(58)
          PY

          echo 'Exact-editor Personal license gate PASS.'

      - name: Upload sanitized license-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-unity-license-gate-preserved-evidence-v2
          path: |
            ${{ runner.temp }}/stage9-license-gate-preserved/evidence/
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
          compression-level: 6
