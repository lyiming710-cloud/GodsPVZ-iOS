name: Stage9.1 5a1b MainMenu save Board runtime gate
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/stage9-5a1b-mainmenu-save-board-runtime-gate.yml'
permissions:
  contents: read
  actions: read
jobs:
  mainmenu-save-board:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
      - name: Download exact cached R3 archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34747460206
          pattern: Stage9.1-r3-exact-archive
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-5a1b/r3-cache
      - name: Download exact 5a1b candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34749244928
          pattern: Stage9.1-0112-PLANTDETAIL-SERIALIZEFIELD
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-5a1b/candidate
      - name: Download exact Unity editor parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lyiming710-cloud/GodsPVZ-iOS
          run-id: 34668863583
          pattern: Stage9.1-unity-china-editor-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/stage9-5a1b/editor-parts
      - name: Run exact R3 strict Board gate
        shell: bash
        run: |
          set -euo pipefail
          bash Tools/Stage9RuntimeGate/run-strict-board.sh \
            "$RUNNER_TEMP/stage9-5a1b" \
            "$RUNNER_TEMP/stage9-5a1b/candidate/GodsPVZRuntime1-plantdetail-serializefield.dll" \
            "5a1b4e0554fa0163283a477efb606685588012397c39d877ea2179a4de07fcca"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-5A1B-MAINMENU-SAVE-BOARD-RUNTIME
          path: ${{ runner.temp }}/stage9-5a1b/evidence/
          if-no-files-found: warn
          retention-days: 90
