name: Stage9 All24 Resolve Gate

on:
  push:
    branches:
      - stage9-local-audit-tools
    paths:
      - '.github/workflows/stage9-all24-resolve-gate.yml'
      - 'Tools/Stage9MemberRefAudit/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  resolve24:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN8_ARTIFACT_ID: '10574264630'
      RUN8_ARTIFACT_SHA256: '68469c45adb5470fd9c23e7a4dde536ae56f08d2a99d4a22c5092a06bec2ac7b'
      RUN8_DLL_SHA256: 'f47b1b37f1d4d3a1ddeb44bb6dbe399c58dc6dee3d4602618b2790f839d3e321'
      RESOLVER_EVIDENCE_ARTIFACT_ID: '10853191869'
      RESOLVER_EVIDENCE_SHA256: 'efb8ef74f996f2faac0e72d7cf4530dcd98783b1ac16c74cfeb3459b11184271'
      EXPECTED_MSCORLIB_SHA256: '4d1725f1ae54a22f69b79c2b1569181ed6653dd484c35005e29c40300c6673be'
      EXPECTED_ALL24: 'b07254d5c4077e013bbc934734f7b0949c0942a4e667d6d2b23d2af6c830f720'
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4

      - name: Set up and pin .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin active SDK to installed .NET 8
        shell: bash
        run: |
          set -euo pipefail
          SDK8="$(dotnet --list-sdks | awk '$1 ~ /^8\./ {v=$1} END{print v}')"
          test -n "$SDK8" || { echo 'No .NET 8 SDK installed' >&2; exit 10; }
          printf '{"sdk":{"version":"%s","rollForward":"latestPatch","allowPrerelease":false}}\n' "$SDK8" > global.json
          echo "Pinned SDK: $SDK8"
          dotnet --version | grep -E '^8\.'

      - name: Download locked run8 input and prior exact resolver evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _stage9/run8 _stage9/prior-evidence _stage9/resolver _stage9/evidence _stage9/gate

          download_artifact() {
            local id="$1" expected="$2" out="$3"
            curl -fL --retry 4 --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "$out"
            local actual
            actual="$(sha256sum "$out" | awk '{print $1}')"
            test "$actual" = "$expected" || {
              echo "artifact $id digest mismatch: $actual != $expected" >&2
              exit 11
            }
          }

          download_artifact "$RUN8_ARTIFACT_ID" "$RUN8_ARTIFACT_SHA256" _stage9/run8-artifact.zip
          unzip -qq _stage9/run8-artifact.zip -d _stage9/run8

          download_artifact "$RESOLVER_EVIDENCE_ARTIFACT_ID" "$RESOLVER_EVIDENCE_SHA256" _stage9/resolver-evidence.zip
          unzip -qq _stage9/resolver-evidence.zip -d _stage9/prior-evidence

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil

          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024), b''):
                      h.update(b)
              return h.hexdigest()

          expected_run8='f47b1b37f1d4d3a1ddeb44bb6dbe399c58dc6dee3d4602618b2790f839d3e321'
          run8=[p for p in Path('_stage9/run8').rglob('*') if p.is_file() and sha(p)==expected_run8]
          if len(run8)!=1:
              raise SystemExit(f'expected exactly one run8 DLL, got {len(run8)}: {run8}')
          Path('_stage9/RUN8_DLL_PATH.txt').write_text(str(run8[0].resolve())+'\n')

          suffixes={
              'mscorlib.dll':'Editor/Data/MonoBleedingEdge/lib/mono/unityjit-linux/mscorlib.dll',
              'UnityEngine.CoreModule.dll':'Editor/Data/Managed/UnityEngine/UnityEngine.CoreModule.dll',
          }
          complete=[]
          for report in Path('_stage9/prior-evidence').rglob('extraction-report.json'):
              data=json.loads(report.read_text())
              if not data.get('complete_targets'):
                  continue
              sel=data.get('selected',{})
              ok=True
              for name,suffix in suffixes.items():
                  rec=sel.get(name,{})
                  if rec.get('archive_path') != suffix or rec.get('expected_path_suffix') != suffix:
                      ok=False
              if ok:
                  complete.append((report,data))
          if len(complete)!=1:
              raise SystemExit(f'expected exactly one complete exact resolver report, got {len(complete)}')
          report,data=complete[0]
          srcdir=report.parent
          out=Path('_stage9/resolver')
          for name in suffixes:
              src=srcdir/name
              if not src.is_file():
                  raise SystemExit(f'missing resolver payload {src}')
              actual=sha(src)
              recorded=data['selected'][name]['sha256']
              if actual != recorded:
                  raise SystemExit(f'{name} hash mismatch against extraction report')
              shutil.copy2(src,out/name)
              print(f'RESOLVER {name} sha256={actual}')
          m=sha(out/'mscorlib.dll')
          if m != '4d1725f1ae54a22f69b79c2b1569181ed6653dd484c35005e29c40300c6673be':
              raise SystemExit(f'wrong exact mscorlib: {m}')
          shutil.copy2(report, Path('_stage9/evidence/resolver-extraction-report.json'))
          PY

      - name: Build locked all24 candidate and run strict Resolve 24/24
        shell: bash
        run: |
          set -euo pipefail
          INPUT_DLL="$(cat _stage9/RUN8_DLL_PATH.txt)"
          CANDIDATE="$PWD/_stage9/gate/Assembly-CSharp-all24-candidate.dll"
          MANIFEST="$PWD/_stage9/evidence/all24-builder-manifest.json"
          AUDIT_LOG="$PWD/_stage9/evidence/memberref-strict-resolve.log"
          RESTORE_LOG="$PWD/_stage9/evidence/dotnet-restore.log"
          SUMMARY="$PWD/_stage9/evidence/GATE-SUMMARY.txt"

          python3 Tools/Stage9MemberRefAudit/build_all24_candidate.py \
            "$INPUT_DLL" "$CANDIDATE" --manifest "$MANIFEST" \
            > _stage9/evidence/all24-builder.stdout.json

          ACTUAL="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED_ALL24" || {
            echo "all24 candidate hash mismatch: $ACTUAL" >&2
            exit 31
          }

          printf 'candidate_sha256=%s\ndotnet_version=%s\n' "$ACTUAL" "$(dotnet --version)" > "$SUMMARY"
          sha256sum _stage9/resolver/*.dll >> "$SUMMARY"

          export NUGET_PACKAGES="$PWD/_stage9/gate/nuget-packages"
          dotnet restore Tools/Stage9MemberRefAudit/Stage9MemberRefAudit.csproj \
            --packages "$NUGET_PACKAGES" > "$RESTORE_LOG"

          set +e
          dotnet run --project Tools/Stage9MemberRefAudit/Stage9MemberRefAudit.csproj --no-restore -- \
            "$CANDIDATE" --require-resolve "$PWD/_stage9/resolver" \
            | tee "$AUDIT_LOG"
          rc=${PIPESTATUS[0]}
          set -e
          echo "audit_exit_code=$rc" >> "$SUMMARY"
          test "$rc" -eq 0 || exit "$rc"

          grep -q '^STAGE9_MEMBERREF_AUDIT_OK$' "$AUDIT_LOG"
          grep -q '^ORPHAN_GENERIC_HITS=0$' "$AUDIT_LOG"
          grep -q '^RESOLVE_SUMMARY ok=24 dependency_missing=0 hard_fail=0 require_resolve=True$' "$AUDIT_LOG"
          cat >> "$SUMMARY" <<'EOF'
          methoddef_expected=2317
          orphan_generic_expected=0
          resolve_expected=24/24
          audit_status=PASS
          production_promotion=NOT_AUTOMATIC_REAL_UNITY_IL2CPP_GATE_STILL_REQUIRED
          EOF
          cp "$CANDIDATE" _stage9/evidence/Assembly-CSharp-all24-candidate.dll
          echo 'STAGE9_ACTIONS_ALL24_RESOLVE_GATE_PASS'

      - name: Upload compact gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage9.1-all24-strict-resolve-evidence-v3
          path: _stage9/evidence
          if-no-files-found: warn
          retention-days: 30
