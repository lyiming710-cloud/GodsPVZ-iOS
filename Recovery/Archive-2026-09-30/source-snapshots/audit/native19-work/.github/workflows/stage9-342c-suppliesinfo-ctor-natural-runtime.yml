name: Stage9.1 342c SuppliesInfo ctor natural runtime
on:
  workflow_dispatch:
  push:
    branches: [high-fidelity]
    paths: ['.github/workflows/stage9-342c-suppliesinfo-ctor-natural-runtime.yml','Tools/Stage9SuppliesInfoRuntimeAudit/**']
permissions: {contents: read, actions: read}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
      UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
      STAGE9_SKILLPROGRESS_TIMEOUT_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runner disk space conditionally
        shell: bash
        run: bash Tools/Stage9CI/conditional-free-space.sh 24
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34982349828, name: Stage9.1-27B2-SUPPLIESINFO-CTOR-QUALIFIED, path: '${{ runner.temp }}/stage9-suppliesinfo/candidate'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34747460206, pattern: Stage9.1-r3-exact-archive, merge-multiple: true, path: '${{ runner.temp }}/stage9-suppliesinfo/r3-cache'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: lyiming710-cloud/GodsPVZ-iOS, run-id: 34668863583, pattern: 'Stage9.1-unity-china-editor-part-*', merge-multiple: true, path: '${{ runner.temp }}/stage9-suppliesinfo/editor-parts'}
      - name: Resolve qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/stage9-suppliesinfo/candidate"
          DLL=$(find "$D" -type f -name 'GodsPVZRuntime1-suppliesinfo-ctor.dll' -print -quit)
          SUM=$(find "$D" -type f -name 'output-candidate.sha256' -print -quit)
          test -n "$DLL"; test -n "$SUM"
          SHA=$(awk '{print $1}' "$SUM")
          test "$SHA" = '342c0a94f90371415c7f782604d9976bb91befec20500894dfd8af607b8ac5c4'
          test "$(sha256sum "$DLL"|awk '{print $1}')" = "$SHA"
          echo "SUPPLIESINFO_CANDIDATE=$DLL" >> "$GITHUB_ENV"
          echo "SUPPLIESINFO_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUNTIME_CANDIDATE_SHA256 $SHA"
      - name: Run one-launch exact-R3 natural SkillProgress path
        shell: bash
        run: bash Tools/Stage9SkillProgressRuntime/run-skillprogress-coverage.sh "$RUNNER_TEMP/stage9-suppliesinfo" "$SUPPLIESINFO_CANDIDATE" "$SUPPLIESINFO_SHA"
      - name: Audit SuppliesInfo natural runtime and next blockers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/stage9-suppliesinfo/evidence"; LOG="$E/playmode.log"; test -f "$LOG"
          python3 Tools/Stage9SuppliesInfoRuntimeAudit/audit.py "$LOG" "$SUPPLIESINFO_SHA" | tee "$E/suppliesinfo-ctor-natural-runtime-audit.txt"
          python3 Tools/Stage9RuntimeTriage/first-invalid.py "$LOG" | tee "$E/first-invalid-triage.txt"
      - name: Upload SuppliesInfo natural runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Stage9.1-342C-SUPPLIESINFO-CTOR-NATURAL-RUNTIME, path: '${{ runner.temp }}/stage9-suppliesinfo/evidence/', retention-days: 90}
