name: Package reference evidence

on:
  push:
    branches: [high-fidelity]
    paths:
      - '.github/workflows/package-reference-evidence.yml'
      - 'Recovery/package-script-map-editor.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-guid-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned exact package versions and MonoScript GUIDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, subprocess, tempfile
          from pathlib import Path

          MAP = Path('Recovery/package-script-map-editor.json')
          OUT = Path('package-reference-evidence')
          OUT.mkdir(parents=True, exist_ok=True)

          package_for_dll = {
              'UnityEngine.UI.dll': ('com.unity.ugui', '1.0.0'),
              'Unity.TextMeshPro.dll': ('com.unity.textmeshpro', '3.0.6'),
              'Unity.RenderPipelines.Core.Runtime.dll': ('com.unity.render-pipelines.core', '14.0.11'),
              'Unity.RenderPipelines.Universal.Runtime.dll': ('com.unity.render-pipelines.universal', '14.0.11'),
              'Unity.2D.Animation.Runtime.dll': ('com.unity.2d.animation', '9.1.1'),
          }
          expected_counts = {
              'UnityEngine.UI.dll': 19,
              'Unity.TextMeshPro.dll': 9,
              'Unity.RenderPipelines.Core.Runtime.dll': 32,
              'Unity.RenderPipelines.Universal.Runtime.dll': 5,
              'Unity.2D.Animation.Runtime.dll': 2,
          }
          sources = {
              ('com.unity.ugui','1.0.0'): {
                  'repo':'https://github.com/zapabob/liltoon-pcss-extension.git',
                  'commit':'10c495f6cd465747c2d03f1cc337df93b7d00662',
                  'subdir':'Library/PackageCache/com.unity.ugui@1.0.0',
                  'tree':'9952f30a9272f339505eb9eb5d63d44aac133630',
                  'kind':'pinned-github-packagecache-history',
              },
              ('com.unity.textmeshpro','3.0.6'): {
                  'repo':'https://github.com/needle-mirror/com.unity.textmeshpro.git',
                  'commit':'5671be34032f3ead7e4f94de2bfa6f7a24513cdb',
                  'subdir':'.',
                  'tree':'0052ebfabf56c4332f5c9985077a29b3b737952f',
                  'kind':'pinned-github-package-mirror',
              },
              ('com.unity.2d.animation','9.1.1'): {
                  'repo':'https://git-okt.sed.inf.szte.hu/h269729/HotlineBekescsaba.git',
                  'commit':'9104e9a40be711441d25848120cc83604c21d0b7',
                  'subdir':'Library/PackageCache/com.unity.2d.animation@9.1.1',
                  'tree':'0aae322aa413895341a9213218719ec423ed7dac',
                  'kind':'pinned-gitlab-packagecache-history',
              },
              ('com.unity.render-pipelines.core','14.0.11'): {
                  'repo':'https://github.com/SL0ANE/SloanePixelartURP.git',
                  'commit':'1738732ad202a4d79d575005d9b85c2f12876d8f',
                  'subdir':'Packages/com.unity.render-pipelines.core@14.0.11',
                  'tree':'597b0cd638fdfa9eddd8baee8f4ec4ac8c35a9a0',
                  'kind':'pinned-github-embedded-package',
              },
              ('com.unity.render-pipelines.universal','14.0.11'): {
                  'repo':'https://github.com/SL0ANE/SloanePixelartURP.git',
                  'commit':'1738732ad202a4d79d575005d9b85c2f12876d8f',
                  'subdir':'Packages/com.unity.render-pipelines.universal@14.0.11',
                  'tree':'3d4859c17939f08c69be7a7ce605b265735cd456',
                  'kind':'pinned-github-embedded-package',
              },
          }

          root = json.loads(MAP.read_text(encoding='utf-8'))
          packages = root.get('packages') or []
          assert sum(len(p.get('mapping') or []) for p in packages) == 67
          assert {p['dll']: len(p.get('mapping') or []) for p in packages} == expected_counts

          def clone_commit(repo_url, commit, dest):
              subprocess.run(['git','init',str(dest)],check=True,stdout=subprocess.DEVNULL)
              subprocess.run(['git','-C',str(dest),'remote','add','origin',repo_url],check=True)
              subprocess.run(['git','-C',str(dest),'fetch','--depth=1','origin',commit],check=True)
              resolved=subprocess.check_output(['git','-C',str(dest),'rev-parse','FETCH_HEAD'],text=True).strip()
              if resolved != commit:
                  raise RuntimeError(f'commit mismatch for {repo_url}: {resolved} != {commit}')
              subprocess.run(['git','-C',str(dest),'checkout','--detach','FETCH_HEAD'],check=True,stdout=subprocess.DEVNULL)

          def validate_package(root_path, package_name, version):
              pj = root_path / 'package.json'
              if not pj.exists(): raise RuntimeError(f'{package_name}@{version}: package.json missing')
              actual = json.loads(pj.read_text(encoding='utf-8'))
              if actual.get('name') != package_name or actual.get('version') != version:
                  raise RuntimeError(f'{package_name}@{version}: identity mismatch {actual.get("name")}@{actual.get("version")}')

          work = Path(tempfile.mkdtemp(prefix='godspvz-package-evidence-'))
          clones = {}
          package_roots = {}
          provenance = []
          for (package_name,version), spec in sources.items():
              key=(spec['repo'],spec['commit'])
              if key not in clones:
                  dest=work/f'repo-{len(clones)}'
                  clone_commit(spec['repo'],spec['commit'],dest)
                  clones[key]=dest
              repo=clones[key]
              package_root=repo if spec['subdir']=='.' else repo/spec['subdir']
              validate_package(package_root,package_name,version)
              if spec['subdir']=='.':
                  actual_tree=subprocess.check_output(['git','-C',str(repo),'rev-parse','HEAD^{tree}'],text=True).strip()
              else:
                  actual_tree=subprocess.check_output(['git','-C',str(repo),'rev-parse',f"HEAD:{spec['subdir']}"],text=True).strip()
              if actual_tree != spec['tree']:
                  raise RuntimeError(f'{package_name}@{version}: tree mismatch {actual_tree} != {spec["tree"]}')
              package_roots[(package_name,version)]=package_root
              provenance.append({
                  'name':package_name,'version':version,'source_kind':spec['kind'],
                  'repository':spec['repo'],'commit':spec['commit'],'package_tree_sha':actual_tree,
              })

          rows=[]; bad=[]
          for pkg in packages:
              dll=pkg['dll']
              package_name,version=package_for_dll[dll]
              package_root=package_roots[(package_name,version)]
              for m in pkg.get('mapping') or []:
                  full_name=m['fullName']; short=full_name.rsplit('.',1)[-1]
                  candidates=[]
                  for cs in package_root.rglob(short+'.cs'):
                      rel='/' + cs.relative_to(package_root).as_posix() + '/'
                      if any(part in rel for part in ('/Editor/','/Tests/','/Samples~/','/Documentation~/','/TestProjects/')): continue
                      if cs.with_suffix(cs.suffix+'.meta').exists(): candidates.append(cs)
                  if len(candidates)!=1:
                      bad.append({'dll':dll,'fullName':full_name,'candidate_paths':[c.relative_to(package_root).as_posix() for c in candidates]})
                      continue
                  cs=candidates[0]; meta=cs.with_suffix(cs.suffix+'.meta')
                  mm=re.search(r'(?m)^guid:\s*([0-9a-fA-F]{32})\s*$',meta.read_text(encoding='utf-8',errors='replace'))
                  if not mm:
                      bad.append({'dll':dll,'fullName':full_name,'candidate_paths':[cs.relative_to(package_root).as_posix()],'error':'guid missing from .meta'})
                      continue
                  rows.append({
                      'dll':dll,'package':package_name,'version':version,
                      'old_dll_guid':pkg['guid'],'old_fileID':m['fileID'],'fullName':full_name,
                      'source_path':cs.relative_to(package_root).as_posix(),
                      'meta_path':meta.relative_to(package_root).as_posix(),
                      'monoscript_guid':mm.group(1).lower(),'new_fileID':11500000,
                  })

          evidence={'schema':3,'source_map':str(MAP),'resolved':len(rows),'expected':67,
                    'packages':sorted(provenance,key=lambda p:p['name']),
                    'mapping':sorted(rows,key=lambda r:(r['dll'],r['fullName'])),'failures':bad}
          (OUT/'package-guid-map.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          report=['GodsPVZ exact package GUID evidence',f'resolved={len(rows)}/67',f'failures={len(bad)}',
                  'source_policy=pinned exact public git trees; no historical Unity Registry dependency','']
          for p in sorted(provenance,key=lambda p:p['name']):
              report.append(f"PACKAGE\t{p['name']}@{p['version']}\t{p['source_kind']}\tcommit={p['commit']}\ttree={p['package_tree_sha']}\t{p['repository']}")
          report.append('')
          for r in sorted(rows,key=lambda r:(r['dll'],r['fullName'])):
              report.append(f"MAP\t{r['dll']}\t{r['fullName']}\toldFileID={r['old_fileID']}\tguid={r['monoscript_guid']}\t{r['source_path']}")
          if bad:
              report.append('')
              for x in bad: report.append('FAIL\t'+json.dumps(x,sort_keys=True))
          (OUT/'package-guid-map.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          sha_lines=[]
          for name in ('package-guid-map.json','package-guid-map.txt'):
              p=OUT/name; sha_lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {name}")
          (OUT/'SHA256SUMS.txt').write_text('\n'.join(sha_lines)+'\n',encoding='utf-8')
          print('\n'.join(report))
          if bad or len(rows)!=67: raise SystemExit(23)
          PY

      - name: Upload exact package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HF46-package-reference-evidence
          path: package-reference-evidence/
          if-no-files-found: error
          retention-days: 90
